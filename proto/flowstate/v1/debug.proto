syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "flowstate/v1/diagnostics.proto";
import "flowstate/v1/identity.proto";
import "flowstate/v1/run.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "flowstatev1";

// The step debugger's boundary-crossing shapes: where a run is held, what it
// can name, which steps it may reach, and the commands that move it.
//
// These are schema types because they cross a wire, and Position.Step is
// reconciled with RunProgress.step_id. Nothing here is an RPC, and no service
// carries these messages yet: the shapes are defined before the transport.
//
// # What is here and what deliberately is not
//
// A debug session has two halves, and only one of them is a value. The half
// that answers questions — where the run stopped, what is in scope, what the
// step list holds — is described here. The half that *is* the session is a
// live resource: an open reader and writer, a console, a registry, and a run's
// own goroutine parked at a step boundary. None of that can be serialized, so
// per CLAUDE.md's proto-first exception none of it is a schema type, and
// `pkg/flowstate/v1/flowdebug`'s package doc says the same thing from the
// other side.
//
// Three members of that half are worth naming, because each is a thing
// somebody would reasonably try to "fix" into this file:
//
//   - The redactors a session holds. They are closures over secret material,
//     held that way precisely because reflection cannot reach a captured
//     variable (CLAUDE.md, "Secrets never enter workflow history"). A schema
//     type for one would be a field holding the thing it exists to withhold.
//   - The paused [Scope]. It is already a schema type, and it is not what a
//     debugger hands out: it reaches resolved values. What crosses is the
//     *rendering* of an inspection, after the redacting door — see
//     [DebugBinding].
//   - The structured value an inspection produces. `Session.Evaluate` returns
//     one so a pane can decide whether a variable expands; a wire message
//     carrying it would open on a new surface the hole that redaction seam
//     closes. [DebugBinding] carries text, and only text.
//
// # Redaction is structural here, not a rule somebody remembers
//
// The single field that could ever carry run data is `DebugBinding.rendered`,
// and its type is `string` for that reason: it holds what `Session.Evaluate`
// already redacted, which is the same door a person at a prompt goes through.
// There is no [Value] field anywhere in this file, and adding one would be the
// mistake [SecretRef]'s own comment refuses in the same words — a value
// resolved for display that is then durable and broadly readable.
//
// # Bounds
//
// Two of these messages are things a *caller* sends ([DebugCommand]) and the
// rest are things a producer answers with, and they are bounded differently on
// purpose. A command's argument is untrusted input on the way in, so the bound
// is written here where the boundary can refuse it: [MaxCommandBytes], the same
// bound a console reader enforces on a typed line, because the two are one
// resource reached two ways. An answer's size is not bounded by a repeated
// field's `max_items`, because a hostile *producer* is bounded below the RPC
// library rather than by a validation rule the library only applies on paths it
// treats as successful — see `plugin/transport.go` and CLAUDE.md's note on
// `connect.WithReadMaxBytes`. What the answers carry instead is a total beside
// every window, so a short answer says how short it is.
//
// # Invocation identity: what the engine can say, and where the rest will go
//
// A callee's step ids belong to the callee (`eval.go:1804-1812`), so one
// inventory flattening a caller and a callee holds rows nothing can tell apart
// by name. The static half is answered: the walk numbers each descent into a
// `call:` into `DebugStep.declaration`, and that numbering *is* the engine's
// structure rather than a proxy for it, because `runNodes` descends into a
// callee exactly once per `call:` node (`eval.go:1734`).
//
// The dynamic half is not available and is not invented here. At a boundary the
// engine reports the callee's *name* (`ExecutingWorkflowFromContext`) and
// nothing about which invocation is running; the call-site identity it does
// build, `waitReporting.ancestry`, is unexported, wait-scoped, and blanked by
// `enterConcurrentWait`. So with one callee invoked from two `call:` steps this
// schema says **not attributable** — exactly what the local pane draws, and for
// the same reason — through two absences that mean different things:
//
//   - `DebugPosition.declaration` absent: the producer could not resolve the
//     position to one declaration. This is `positionIn`'s -1, on the wire.
//   - `DebugStepWindow.held` absent with that declaration *present*: the held
//     row is real and simply outside this window.
//
// When the engine learns to report which invocation is running, the field that
// carries it exists already and is the one the rows carry, asked of the
// position — so tomorrow's answer arrives as a field being set more often
// rather than as a fifth spelling of step identity. The cost of that choice,
// stated: if the eventual dynamic identity turns out to be richer than "which
// declaration" — a loop iteration, say — this field is a narrowing of it and
// the richer one goes beside it rather than replacing it.

// DebugPosition is where a paused debug session is holding a run.
//
// # Its relationship to RunProgress
//
// [RunProgress] is the neighbouring spelling and it answers a different
// question, which is why this is not that message. RunProgress is *the run's*
// answer to "where have you got to", served by a Temporal query against a live
// workflow: its `step_id` is deliberately the outermost step and its `path`
// walks inward, because a run inside a `parallel:` block is on several steps at
// once and has no single position. This is *a debugger's* answer to "where are
// you holding", and a debugger holds exactly one step boundary — the boundary
// `runNodes` visits before a step, the same one `StepsBudget` is checked at. So
// `step_id` here names that step exactly, at whatever depth it sits, and there
// is no `path`: a position that needed one would be a run held in two places,
// which is not a state this seam can be in.
//
// The two therefore share a field name and not a meaning, and the name is
// shared on purpose: `step_id` is what this schema calls a step's id in
// [RunProgress], in [PendingWait], and here.
message DebugPosition {
  // StepId is the id of the step the run is stopped before.
  //
  // Empty at an autopsy, where the run is over and there is no step to be at —
  // which is why [autopsy] is a separate field rather than something a reader
  // infers from this one being empty.
  string step_id = 1;

  // Workflow names the workflow whose steps are running here, which is what
  // tells a caller's `build` from a called workflow's `build`.
  //
  // The engine's own answer, stamped at the run's start and moved across every
  // `call:` boundary (`ExecutingWorkflowFromContext`), so it is present on
  // every driver and every configuration rather than only where secrets or
  // workload identity happen to be configured.
  //
  // Empty means *not said*, never "a workflow named empty string": a
  // [Debugger] an embedder drives itself is handed no such stamp, and two steps
  // that answer to no workflow are not thereby the same step. A consumer that
  // reads an empty name as a name will confuse exactly the ids this field
  // exists to separate.
  string workflow = 2;

  // Kind is what that step is, in the same words `flow`'s `info` command
  // prints — `task`, `wait`, `for_each`, and the rest of what `NodeKind`
  // computes.
  //
  // A rendering rather than an enum, and that is a decision with a cost. An
  // enum would be checkable on the wire; what it would also be is a second
  // vocabulary for node kinds beside the one [Node]'s own `kind` oneof already
  // is, kept in step by hand. This field is derived from that oneof, so it
  // cannot describe a node kind the schema does not have.
  string kind = 3;

  // Autopsy reports which of the two prompts is holding: false for a
  // breakpoint before a step, true for the account of a case that has already
  // failed.
  //
  // A distinct fact from [step_id] being empty, and both are needed: an
  // autopsy is a real pause with no step to name, so "there is a position" and
  // "the position has a step" have to stay separable.
  bool autopsy = 4;

  // Declaration says which invocation of a workflow this position is in, when
  // the producer can tell, keyed to `DebugStep.declaration` on the rows.
  //
  // Present exactly when the producer resolved the position to one row of its
  // own inventory. Absent when it could not — one callee invoked from two
  // `call:` steps gives two rows a boundary's (workflow, step id) pair cannot
  // choose between, and the producer says so rather than naming the first. See
  // this file's comment on invocation identity for why the dynamic half is not
  // available and what will fill this when it is.
  //
  // Absent is *not said*, never declaration zero — zero is the root workflow
  // and a real answer. That is why this carries explicit presence: a consumer
  // reading an unset int as the root would place every unattributable position
  // in the outermost workflow, which is the one thing a debugger must never do.
  //
  // Meaningful only against the inventory the same producer answers
  // [DebugStepWindow] from. It numbers a walk's descents, so it is an identity
  // *within one step list*, not a durable id — two producers holding different
  // specifications may number differently, and comparing across them is
  // meaningless.
  optional int32 declaration = 5 [(buf.validate.field).int32 = {gte: 0}];
}

// DebugStackFrame is one level of a paused run's call chain.
//
// Frames are ordered innermost first, as DAP and conventional backtraces
// present them. The first frame is the step about to run; every later frame is
// the caller's `call:` step. A workflow can nest calls only to MaxCallDepth, so
// the engine bounds this list where it is built rather than relying on each
// front to impose a different limit.
//
// Only the first frame is paused and therefore has a readable DebugScope.
// Caller frames identify how execution arrived; retaining their live scopes
// would keep values reachable after the engine left those scopes and would
// turn this value message into a serialization of live interpreter state.
message DebugStackFrame {
  // Workflow is the workflow that owns [step_id]. Empty means the producer did
  // not know, with the same meaning as `DebugPosition.workflow`.
  string workflow = 1;

  // StepId is the current step for the first frame and the `call:` step for a
  // caller frame.
  string step_id = 2;

  // Kind is the shared NodeKind spelling, including the call description on a
  // caller frame rather than an adapter-specific label.
  string kind = 3;
}

// DebugBacktrace is the bounded call chain for one paused position.
message DebugBacktrace {
  repeated DebugStackFrame frames = 1;
}

// DebugStepState is what a session last watched one step do.
//
// The vocabulary is [RunObserver]'s, read once: a step is entered, and then it
// finishes, is absorbed, fails, or is skipped by its `if:`.
enum DebugStepState {
  // The producer did not say. An inventory a caller built by hand carries no
  // outcomes, and a peer older than this enum has no value to send.
  //
  // Distinct from `DEBUG_STEP_STATE_PENDING`, which is a session saying it
  // watched nothing happen here — an answer, rather than the absence of one.
  // The Go vocabulary this is derived from has no member for "not said",
  // because in-process there is always a session to have watched; the wire
  // needs one because there is not always a producer that did.
  DEBUG_STEP_STATE_UNSPECIFIED = 0;

  // A step the session has not watched do anything: not reached yet, or
  // reached by work this session could not attribute.
  DEBUG_STEP_STATE_PENDING = 1;

  // A step the run entered and whose outcome has not arrived. The step a
  // session is paused at is one of these; so is a step still in flight on
  // another branch.
  DEBUG_STEP_STATE_RUNNING = 2;

  // A step that finished without an error.
  DEBUG_STEP_STATE_DONE = 3;

  // A step that failed and whose failure the run absorbed
  // (`continue_on_error`).
  //
  // Distinct from `DEBUG_STEP_STATE_DONE` because a run that carried on is not
  // a step that worked, and that is usually the thing somebody opened a
  // debugger to find.
  DEBUG_STEP_STATE_TOLERATED = 4;

  // A step that failed and whose failure the run did not absorb.
  DEBUG_STEP_STATE_FAILED = 5;

  // A step whose `if:` was false. It never reaches a boundary — there is no
  // work to hold — so it is only ever reported by the observer seam.
  DEBUG_STEP_STATE_SKIPPED = 6;
}

// DebugStep is one row of a run's step list.
message DebugStep {
  // Workflow is the workflow that declares this step. It is what a reader
  // sees, and it is not on its own an identity — see [declaration].
  //
  // Empty where the producer did not say: an inventory that is merely the ids
  // a session has watched go past carries no workflow, because nothing that
  // reaches the observer seam knows one.
  string workflow = 1;

  // Declaration identifies the workflow *instance* this row belongs to.
  //
  // A name is not a declaration. One callee invoked from two `call:` steps
  // appears twice under one name, and so do two genuinely different embedded
  // workflows that happen to share a `name:`; in both cases the rows are
  // separate declarations whose outcomes belong to separate invocations, and
  // grouping them by name claims an attribution the producer does not have.
  //
  // Numbered rather than named because the only question ever asked of it is
  // whether two rows are the same declaration. Zero is the root workflow and
  // the value a producer that numbers nothing leaves, which is why a consumer
  // separating rows must key on this *and* [workflow]: an inventory built by
  // hand distinguishes its workflows by name, one built by a walk distinguishes
  // them here, and neither has to know about the other.
  //
  // Not `RunProgress.path` and not [Frame], though all three describe position
  // in a nesting. Those two say where inside one workflow's control flow a run
  // stands; this says which invocation of a workflow a row belongs to, which is
  // a different question and one neither of them can answer.
  int32 declaration = 2 [(buf.validate.field).int32 = {gte: 0}];

  // Via is the id of the `call:` step that reaches this declaration, empty at
  // the root.
  //
  // For the reader rather than for the grouping: where two rows share a name
  // *and* an id, the name cannot tell them apart on screen, and the `call:`
  // step an author wrote is the thing that can.
  string via = 3;

  // StepId is the step's id, which is the only name the *run* has for it: both
  // the debugger seam and the observer seam are handed bare ids.
  string step_id = 4;

  // State is what the producing session last watched this step do.
  DebugStepState state = 5 [(buf.validate.field).enum.defined_only = true];
}

// DebugStepWindow is a window onto a run's step list, with the facts about the
// whole that a window cannot carry.
//
// A window rather than the list, and the reason is the same one it is a window
// in process: the list is the author's file, a workflow may declare thousands
// of nodes, a pane draws a dozen, and answering with all of them at every stop
// is O(N) per stop and O(N^2) across a walk of the run. Offset-and-total is the
// shape `Session.Steps` already answers in, so a network-attached session
// answers the same question the same way.
message DebugStepWindow {
  // Steps is the window, in the order an author wrote them.
  repeated DebugStep steps = 1;

  // Offset is where the window starts in the whole list, after clamping.
  int32 offset = 2 [(buf.validate.field).int32 = {gte: 0}];

  // Total is how long the whole list is, so an elision can say how much it
  // elided rather than that it elided some.
  int32 total = 3 [(buf.validate.field).int32 = {gte: 0}];

  // Unattributed counts the rows *of the whole list* whose outcome the
  // producer cannot attribute, because another workflow in the same inventory
  // declares the same id and an outcome naming that id names neither.
  //
  // Of the whole list and not of this window, deliberately: it is a property of
  // the inventory, so a consumer paging through the list would otherwise see it
  // rise and fall for reasons that are about its own paging.
  //
  // Those rows report `DEBUG_STEP_STATE_PENDING` rather than one workflow's
  // outcome painted onto another's row. Fail closed: under-claiming is a gap a
  // reader can see, and mis-claiming is a debugger pointing at the wrong step.
  int32 unattributed = 4 [(buf.validate.field).int32 = {gte: 0}];

  // Truncated reports that the producing session stopped recording what it
  // watched, so a `DebugStep.state` above may understate what a step did.
  //
  // Not about this window's own cut, which [offset] and [total] already
  // describe. It is about the session's record of outcomes running out.
  bool truncated = 5;

  // Held is the index *within* [steps] of the row the run is held at.
  //
  // The producer's answer rather than the inputs to it, and that is the point:
  // resolving a position against rows is one function on the producing side
  // (`positionIn`), and two resolvers is exactly how the local surface came to
  // mark both rows of a twice-invoked callee. A consumer re-deriving this from
  // ids would be that second resolver.
  //
  // Absent means the run's held row is not at an index of this window, and
  // `DebugPosition.declaration` is what separates the two ways that happens: a
  // position carrying a declaration is a real row the window simply does not
  // reach, and a position carrying none could not be attributed at all. Absent
  // also for an autopsy, where the run is over and no row is held.
  optional int32 held = 6 [(buf.validate.field).int32 = {gte: 0}];
}

// DebugBinding is one name a paused run can reach, with the rendering of what
// it holds.
//
// # Why the value is text
//
// This is the one message in this file that can carry anything derived from a
// run's data, and it carries it as an already-redacted rendering because that
// is the only form that has been through the door. `Session.Evaluate` redacts
// both halves of its answer — the text through a substring backstop and the
// structured value by equality — and hands out the redacted value precisely so
// that a debugger's structured answer cannot become a way around a `sensitive:`
// declaration. A [Value] field here would put the structured half back on a new
// surface, so there is not one, and there must never be one.
message DebugBinding {
  // Name is the binding as the scope lists it.
  string name = 1;

  // Expression is what would be typed to ask for this value again — the
  // group's root and the name, or the bare name where the group has no root
  // (a loop's `as:`, a step's own `vars:`, an autopsy's bindings).
  //
  // Carried rather than left for a consumer to join, because the join is the
  // producer's own answer: two renderers kept a private switch over group names
  // to rebuild it, and one of them said in its comment that it was "the same
  // fact read for a different renderer", which is the parallel declaration that
  // always eventually drifts.
  string expression = 2;

  // The answer, or the reason there is not one, or neither.
  //
  // A oneof rather than two strings and a flag, because the three states are
  // exclusive and one of them is "the producer did not resolve this" — a scope
  // answered for its names alone. With two plain fields, a value that renders
  // as the empty string and a name nobody resolved are the same bytes.
  oneof answer {
    // Rendered is the redacted rendering of the value, cut by the producer at
    // `flowdebug.MaxInspectRunes` runes of *content* plus a marker saying how
    // much it cut.
    //
    // `max_len` and not `max_bytes`, and the unit is the whole reason to say
    // so: protovalidate's `max_len` counts Unicode code points, which is what
    // a rune bound counts, while `max_bytes` counts what Go's `len` counts.
    // The two disagree on any non-ASCII rendering, and a limit written down
    // twice in two units is a boundary that refuses values its producer
    // considers legal. Same unit, both layers — the rule
    // `WorkloadIdentity.claims` states at length.
    //
    // 4160 rather than the content bound of 4096, because the marker is part
    // of what travels and a bound that forgot it would refuse a value
    // *precisely when it was cut* — the one case this field exists to
    // describe honestly. The 64 runes of headroom are provable
    // rather than generous: the marker is `… (%d more)` and the number it
    // carries is a count of runes held in memory, so at most 19 digits, so at
    // most 28 runes.
    string rendered = 3 [(buf.validate.field).string = {max_len: 4160}];

    // Error is the redacted reason this name has no value: an expression that
    // did not compile, a key that is not there, an evaluation that failed.
    //
    // Redacted for a reason that is easy to miss: a CEL runtime error
    // interpolates the value that caused it, so an error is a way for a value
    // to leave. It is rebuilt rather than wrapped on the producing side, so
    // nothing reachable through an unwrap chain survives into it — the same
    // leak Temporal's default failure converter causes by walking that chain.
    //
    // Bounded on the same terms as [rendered], and by the producer rather than
    // by whatever failed: an error is the one string here whose length a peer's
    // failure chooses. See the note there on the unit and on the headroom.
    string error = 4 [(buf.validate.field).string = {max_len: 4160}];
  }
}

// DebugScopeGroup is one group of names a paused run can reach, as `scope`
// groups them.
//
// Grouped rather than flattened because the grouping is part of the answer: a
// debug adapter renders one pane per group, and a person reading `scope` is
// looking for which *kind* of name they can reach.
message DebugScopeGroup {
  // Group is the root the names hang from as a reader sees it — `steps`,
  // `vars`, the workflow's declared vars, and the bare bindings an autopsy
  // adds.
  string group = 1;

  // Root is the expression prefix these names hang from — `steps`, `inputs`,
  // `vars`, `run`, `trigger` — or empty where they are bound bare and resolve
  // under no root at all.
  //
  // Distinct from [group], which is a label. This is the part a consumer
  // computes with, and `DebugBinding.expression` is already that computation
  // done once by the producer.
  string root = 2;

  // Bindings are this group's names, and may be a prefix of them: resolving a
  // value is an evaluation, so how many to resolve is the caller's budget.
  repeated DebugBinding bindings = 3;

  // Total is how many names this group holds, so an elision can say how many
  // it left out rather than that it left some out.
  //
  // A group whose names were all past the budget appears with no bindings and
  // a total, rather than vanishing: that the group exists is part of the answer
  // to "what kind of name can I reach here".
  int32 total = 4 [(buf.validate.field).int32 = {gte: 0}];
}

// DebugScope is what a paused run can name, and what those names hold.
message DebugScope {
  // Groups are the scope's groups, in the order the session lists them.
  repeated DebugScopeGroup groups = 1;

  // Total is how many names the run can reach across every group.
  //
  // There is deliberately no `truncated` flag beside this, unlike
  // `EntityState.truncated` and `RunProgress.pending_waits_truncated`. Those
  // answers omit data without saying how much; this one carries the total, so
  // "fewer bindings arrived than names exist" is derivable and a flag would be
  // a second spelling of a fact already here.
  int32 total = 2 [(buf.validate.field).int32 = {gte: 0}];
}

// DebugCommandVerb is the closed vocabulary of what a debug session can be
// told to do.
//
// Derived from the session's own command table, which is the one place a verb
// is written down — `dispatch` resolves through it, `help` prints it, and the
// completer offers it. A test walks that table against this enum in both
// directions, so a verb cannot come to be understood by the prompt and unknown
// on the wire, or the reverse.
//
// Closed on purpose, and that is a property rather than a style: a caller that
// could name a verb this enum does not have would be naming a capability the
// deployment never granted, which is the reasoning `PendingActivity.phase`
// states for its own vocabulary. Aliases are deliberately not here — `s`, `c`,
// `p` and the rest are a convenience for somebody typing, and a wire client
// spells the verb.
enum DebugCommandVerb {
  // No verb. Not a command; a boundary refuses it rather than guessing, for
  // the reason the prompt names an unknown verb rather than ignoring it —
  // silently doing nothing gives the caller no reason to doubt what they sent.
  DEBUG_COMMAND_VERB_UNSPECIFIED = 0;

  // Run this step and stop at the next.
  DEBUG_COMMAND_VERB_STEP = 1;

  // Run until the next breakpoint, or to the end.
  DEBUG_COMMAND_VERB_CONTINUE = 2;

  // Run until the step whose id the argument names, unconditionally or only
  // where an expression holds there. The argument is `<step-id> [if <expr>]`,
  // the same conditional grammar `BREAK` takes — one-shot, where a
  // breakpoint's condition persists.
  DEBUG_COMMAND_VERB_UNTIL = 3;

  // Stop at a step, always or when an expression holds. The argument is
  // `<step-id> [if <expr>]`.
  DEBUG_COMMAND_VERB_BREAK = 4;

  // Remove the breakpoint at the step the argument names.
  DEBUG_COMMAND_VERB_DELETE = 5;

  // List the breakpoints this session holds.
  DEBUG_COMMAND_VERB_BREAKPOINTS = 6;

  // Evaluate the argument as a CEL expression against the paused run's scope,
  // bounded by the run's own cost limit.
  DEBUG_COMMAND_VERB_INSPECT = 7;

  // List what the run can name right now.
  DEBUG_COMMAND_VERB_SCOPE = 8;

  // List what could be written at the end of the argument's text.
  DEBUG_COMMAND_VERB_COMPLETE = 9;

  // Describe the step the run is stopped at.
  DEBUG_COMMAND_VERB_INFO = 10;

  // End the run here.
  DEBUG_COMMAND_VERB_QUIT = 11;

  // List the commands.
  DEBUG_COMMAND_VERB_HELP = 12;

  // List the current step and the `call:` chain that reached it.
  DEBUG_COMMAND_VERB_BACKTRACE = 13;

  // Next is `next`: run this step, including anything inside it, and stop at
  // the next step at this nesting or shallower.
  DEBUG_COMMAND_VERB_NEXT = 14;

  // Finish is `finish`: run until the enclosing iteration, branch, switch
  // arm, or call is left.
  DEBUG_COMMAND_VERB_FINISH = 15;

  // Log is `log <step-id> <message>`: a logpoint.
  DEBUG_COMMAND_VERB_LOG = 16;

  // Catch is `catch none|uncaught|all`: which step failures stop the run.
  DEBUG_COMMAND_VERB_CATCH = 17;

  // Detach is `detach`: clear every breakpoint and let the run finish
  // unattended.
  DEBUG_COMMAND_VERB_DETACH = 18;
}

// DebugCommand is one thing a debug session is told to do.
//
// A verb and one argument string, which is the grammar the session already has
// rather than a second one: a command line is split into its first word and the
// rest, and the rest is parsed by whoever owns the verb — `break`'s
// `<step-id> [if <expr>]` by the breakpoint code, `inspect`'s by the evaluator.
// A structured argument here would be a second parser for a grammar that
// already has one, and the two would drift; this repository has paid for that
// shape.
//
// It also keeps a recorded session replayable across the boundary. The session
// records the canonical command lines it accepted and replays a run from them,
// so a wire command that renders back to exactly such a line is the same
// artifact a person can paste into an issue.
message DebugCommand {
  // Verb is what to do.
  DebugCommandVerb verb = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Argument is the text after the verb, empty for the verbs that take none.
  //
  // Bounded by `flowdebug.MaxCommandBytes`, the bound a console reader already
  // enforces on a typed line: the two are one resource reached two ways, and a
  // caller arriving here arrives on no surface that has already bounded it.
  //
  // This bounds the *field*, which is all a field rule can bound, and it is
  // deliberately not the whole story. The session refuses two further things
  // about a **line** — a total past that same bound once the verb and its
  // separator are added, and any line break at all, since one command is one
  // line — and neither is expressible here, because neither is a property of
  // this field alone. `flowdebug.CommandLine` makes both refusals where the
  // line is built, so a message that satisfies this rule and still cannot be
  // delivered is refused before it is rendered rather than after.
  //
  // `max_bytes` and not `max_len` here, the opposite unit from
  // `DebugBinding.rendered` and for the same reason — the resource being
  // bounded is memory in a scanner, which is bytes, where a rendering's bound
  // is about how much text a reader is handed.
  string argument = 2 [(buf.validate.field).string = {max_bytes: 65536}];
}

// DebugSession is who is debugging which run, and until when.
//
// Separate from [DebugPosition] because these facts do not change as the run
// moves: a position is answered again at every stop, and this is answered once
// at attach and again when a lease is extended. Stage 2's lease mechanics —
// pause, expiry, auto-resume, all attributable — read this message; the
// mechanics themselves are not here.
//
// # Why there is no second sender shape
//
// "Who acted on this run, as the server attested rather than as they claimed"
// is a question this schema already answers, and the answer is
// [WorkloadIdentity] — established by authenticating the request, never taken
// from it, because a caller who could name their own identity could name
// anyone else's. [SignalSender] is the neighbouring use of it, and this message
// deliberately reuses the identity rather than that wrapper: a wrapper here
// would mean a second `{identity, timestamp, local}` triple whose timestamp
// field is named for signals, so the timestamp and the local marker sit on this
// message directly and there is one shape for who, not two.
message DebugSession {
  // SessionId addresses this debug session.
  //
  // Empty for a local session, which is not addressed by anything: it is the
  // author's own process, reached by typing at it. A durable session is
  // addressed because something has to be able to name the lease it holds.
  //
  // Bounded at the length this schema already gives a run id.
  string session_id = 1 [(buf.validate.field).string = {max_len: 256}];

  // Run is the run being debugged.
  //
  // Unset for a local session: [RunAddress] names a durable execution, and a
  // run interpreted in the author's own process is not one. A consumer must not
  // read an unset run as a missing value — [local] is what says which case this
  // is.
  RunAddress run = 2;

  // AttachedBy is the authenticated caller the server established when this
  // session attached, by the same path a run's own identity is established.
  //
  // Never taken from the request. Unset where nothing was attested, which is
  // every local session and is what [local] marks.
  WorkloadIdentity attached_by = 3;

  // AttachedAt is when the server accepted the attach, from the server's own
  // clock, never the caller's. A self-reported time is exactly the kind of
  // claim an attested field replaces.
  google.protobuf.Timestamp attached_at = 4;

  // Local marks a session debugging a local run — `flow run local --debug`,
  // `flow test --debug`, the MCP and DAP fronts over either — which has no
  // authenticated caller at all, because there is no server in front of it to
  // attest anything.
  //
  // The same marker `SignalSender.local` is, for the same reason and with the
  // same warning: it means "the local driver", and a consumer must not read it
  // as the general "nothing was attested", which is also what an unset
  // [attached_by] means on a session this schema has no other explanation for.
  bool local = 5;

  // LeaseExpiresAt is when this session's hold on the run lapses of its own
  // accord, after which the run resumes.
  //
  // Unset means no lease, which is a real answer rather than a missing one: a
  // local run is the author's own process and holds itself for as long as they
  // want it held, so local debugging is always on. A durable session is
  // leased because a run held paused by a
  // vanished debugger is an availability incident, and expiry resuming the run
  // is that decision's other half.
  optional google.protobuf.Timestamp lease_expires_at = 6;
}

// # The shared debugger contract
//
// Everything below is the one semantic model every debugger surface speaks:
// the local session in `flowdebug`, the durable RPCs on [WorkflowService], the
// editor adapter in `flowdap`, the retained MCP sessions, and the embedding API.
// A surface translates its own protocol's conventions onto these messages; it
// does not invent execution semantics of its own, so "supported by the console"
// and "supported by the editor" are the same claim, stated by
// [DebugCapabilities].
//
// Three identities are kept apart, and a display label is never one of them:
//
//   - A [DebugSite] is a static place in the compiled program: which workflow
//     declares the step and the chain of step ids from that workflow's top
//     level down to it. It exists whether or not the run ever reaches it, and
//     whether or not any source text produced it.
//   - A [DebugOccurrence] is one dynamic arrival at a site: the same site
//     reached in the third iteration of a loop, in the second parallel branch,
//     or through a second `call:` is a different occurrence.
//   - A [DebugSourceLocation] is where a site came from, when anything says so.
//     It is optional by construction: a program built directly as IR, or by a
//     frontend that publishes no map, is still fully debuggable by site.

// DebugSite is a static execution site in the compiled program.
message DebugSite {
  // Workflow is the name of the workflow that declares the step: the root
  // workflow, or the callee a `call:` reached.
  string workflow = 1 [(buf.validate.field).string = {max_len: 256}];

  // Path is the chain of step ids from that workflow's top level down to and
  // including the step: `["pages", "page"]` for a step `page` in the body of a
  // loop `pages`. Ids are unique within a visibility domain rather than within a
  // file, so the chain, not the last id, is what names one site. It holds at
  // most one id more than an occurrence's 128 segments: the step itself.
  repeated string path = 2 [(buf.validate.field).repeated = {
    max_items: 129
    items: {
      string: {max_len: 256}
    }
  }];

  // Kind is the step's kind as [DebugPosition.kind] spells it.
  string kind = 3 [(buf.validate.field).string = {max_len: 64}];
}

// DebugSegmentKind is how execution entered a nested part of the program.
enum DebugSegmentKind {
  // Unspecified is never written.
  DEBUG_SEGMENT_KIND_UNSPECIFIED = 0;
  // Call is a `call:` step running its callee.
  DEBUG_SEGMENT_KIND_CALL = 1;
  // Iteration is one pass through a `for_each:` or `loop:` body.
  DEBUG_SEGMENT_KIND_ITERATION = 2;
  // Branch is one branch of a `parallel:` step.
  DEBUG_SEGMENT_KIND_BRANCH = 3;
  // Case is the arm a `switch:` step took.
  DEBUG_SEGMENT_KIND_CASE = 4;
}

// DebugSegment is one level of dynamic nesting between the run's top level and
// an occurrence.
message DebugSegment {
  // Kind says how this level was entered.
  DebugSegmentKind kind = 1 [(buf.validate.field).enum.defined_only = true];

  // StepId is the container step: the loop, the parallel, the switch, or the
  // call step.
  string step_id = 2 [(buf.validate.field).string = {max_len: 256}];

  // Workflow is the workflow that declares the container step.
  string workflow = 3 [(buf.validate.field).string = {max_len: 256}];

  // Index is the iteration, branch, or case index, counting from zero. Zero for
  // a call.
  int32 index = 4 [(buf.validate.field).int32 = {gte: 0}];

  // Callee is the workflow a call entered. Empty for every other kind.
  string callee = 5 [(buf.validate.field).string = {max_len: 256}];
}

// DebugOccurrence is one dynamic arrival at a site.
message DebugOccurrence {
  // Site is the static site reached.
  DebugSite site = 1;

  // Segments are the dynamic levels enclosing the arrival, outermost first.
  repeated DebugSegment segments = 2 [(buf.validate.field).repeated = {max_items: 128}];

  // Address is the canonical text form of this occurrence: segments joined by
  // `/`, an iteration written `id[3]`, a branch `id#1`, a case `id?0`, a call
  // `id(callee)`, then the step id. It is what a person types and what a
  // breakpoint may name; the structured fields above are what a program reads.
  string address = 3 [(buf.validate.field).string = {max_len: 4096}];

  // Arrival counts the boundaries this session has seen, starting at one, so
  // two stops at the same address in a `loop:` that revisits it are ordered.
  uint64 arrival = 4;

  // Continuation counts the Continue-As-New segments before the one this
  // occurrence ran in. Always zero for a local run.
  int32 continuation = 5 [(buf.validate.field).int32 = {gte: 0}];
}

// DebugSourceDocument is one source document a program was produced from.
message DebugSourceDocument {
  // Uri names the document as its producer knows it: a file path or URI for
  // text, an opaque identifier for a visual canvas.
  string uri = 1 [(buf.validate.field).string = {max_len: 4096}];

  // Digest is the content digest (`sha256:…`) of the exact bytes the map was
  // computed from. A consumer holding different bytes must treat every
  // location in this document as unverified rather than guess a line.
  string digest = 2 [(buf.validate.field).string = {max_len: 128}];

  // Language names the frontend: `flowfile` for YAML+CEL, or any other token a
  // generator or visual editor chooses.
  string language = 3 [(buf.validate.field).string = {max_len: 64}];

  // GeneratedFrom is the index into [DebugSourceMap.documents] of the document
  // this one was generated from, plus one; zero when it is an original.
  int32 generated_from = 4 [(buf.validate.field).int32 = {gte: 0}];
}

// DebugSourceLocation is where one site came from.
message DebugSourceLocation {
  // Document indexes [DebugSourceMap.documents].
  int32 document = 1 [(buf.validate.field).int32 = {gte: 0}];

  // Range is the text span, for a text document. Unset for a location that is
  // not text.
  SourceRange range = 2;

  // NodeId is an opaque locator for a non-text frontend, such as a node on a
  // visual canvas. Empty for text.
  string node_id = 3 [(buf.validate.field).string = {max_len: 1024}];
}

// DebugSourceEntry maps one site to where it came from.
message DebugSourceEntry {
  DebugSite site = 1;
  DebugSourceLocation location = 2;
}

// DebugSourceMap is a bounded sidecar relating a compiled program's sites to
// its sources.
//
// It is never part of the program: it does not enter the executable
// specification, a digest of it, workflow history, or replay. It is bound to
// the program it describes by [ir_digest] and to each source by that
// document's own digest, and a map whose program binding does not hold is
// refused rather than applied. A program past the bounds below is mapped as
// far as they reach; its remaining sites are debugged by address alone.
message DebugSourceMap {
  // IrDigest is the content digest of the deterministic encoding of the
  // compiled workflow this map describes, as the producing build encodes it.
  string ir_digest = 1 [(buf.validate.field).string = {max_len: 128}];

  repeated DebugSourceDocument documents = 2 [(buf.validate.field).repeated = {max_items: 256}];

  repeated DebugSourceEntry entries = 3 [(buf.validate.field).repeated = {max_items: 65536}];
}

// DebugFrame is one level of a stopped run's dynamic nesting, innermost first.
//
// A frame is the step the run is stopped before, or a container enclosing it:
// a loop iteration, a parallel branch, a switch arm, or a call. It is not a
// language stack frame, and a parallel run is described as the branch the stop
// is in rather than as several threads.
message DebugFrame {
  // Id identifies the frame within one snapshot revision, from 1.
  int32 id = 1 [(buf.validate.field).int32 = {gte: 1}];

  // Label is the frame's display text. Never an identity.
  string label = 2 [(buf.validate.field).string = {max_len: 1024}];

  // Occurrence is the occurrence this frame stands for. For a container frame
  // its site is the container step.
  DebugOccurrence occurrence = 3;

  // Source is where the frame's site came from, when a verified source map
  // says so; unset otherwise.
  DebugSourceLocation source = 4;

  // Scoped marks the frame whose bindings [DebugInspectRequest] reads. Only
  // the innermost frame is scoped: a container's own bindings are the ones in
  // force at the stop.
  bool scoped = 5;
}

// DebugRunState is where a debugged run stands.
enum DebugRunState {
  // Unspecified is never written.
  DEBUG_RUN_STATE_UNSPECIFIED = 0;
  // Running is executing between boundaries.
  DEBUG_RUN_STATE_RUNNING = 1;
  // PauseRequested is running with a pause asked for, which takes effect at
  // the next boundary the run reaches. It may never take effect: a run that
  // finishes first completes.
  DEBUG_RUN_STATE_PAUSE_REQUESTED = 2;
  // Held is stopped at a boundary.
  DEBUG_RUN_STATE_HELD = 3;
  // Completed is finished successfully.
  DEBUG_RUN_STATE_COMPLETED = 4;
  // Failed is finished with a failure, or ended by the session.
  DEBUG_RUN_STATE_FAILED = 5;
  // Expired is a durable session whose lease or absolute deadline lapsed; the
  // run resumed on its own.
  DEBUG_RUN_STATE_EXPIRED = 6;
  // Detached is a session its controller ended; the run continues unobserved.
  DEBUG_RUN_STATE_DETACHED = 7;
}

// DebugStopReason is why a run is held.
enum DebugStopReason {
  // Unspecified is written only when the run is not held.
  DEBUG_STOP_REASON_UNSPECIFIED = 0;
  // Entry is the first boundary of a session that stops on entry.
  DEBUG_STOP_REASON_ENTRY = 1;
  // Step is the boundary a step command ran to.
  DEBUG_STOP_REASON_STEP = 2;
  // Breakpoint is a breakpoint whose condition and hit condition held.
  DEBUG_STOP_REASON_BREAKPOINT = 3;
  // Pause is the first boundary after a pause request.
  DEBUG_STOP_REASON_PAUSE = 4;
  // Failure is a step that failed, stopped after its failure was recorded and
  // before it propagated.
  DEBUG_STOP_REASON_FAILURE = 5;
  // Until is the target of a run-until command.
  DEBUG_STOP_REASON_UNTIL = 6;
  // Autopsy is a finished test case held open for questions.
  DEBUG_STOP_REASON_AUTOPSY = 7;
}

// DebugCapabilities is what one backend actually does. A surface advertises
// only what is set here, and refuses the rest explicitly.
message DebugCapabilities {
  bool step_in = 1;
  bool step_over = 2;
  bool step_out = 3;
  // Pause stops at the next boundary. It never freezes work already
  // dispatched: an activity, an HTTP call, or a timer keeps going.
  bool pause = 4;
  bool run_until = 5;
  bool conditional_breakpoints = 6;
  bool hit_conditions = 7;
  bool logpoints = 8;
  bool failure_breakpoints = 9;
  bool source_breakpoints = 10;
  // Inspect is read-only CEL evaluation against the held scope.
  bool inspect = 11;
  // ValueExpansion is paged child listing of maps and lists.
  bool value_expansion = 12;
  bool observations = 13;
  // Terminate ends the run. Detaching never does. Only whoever owns the run
  // can offer it: a session observing a run it did not start reports false,
  // and the surface that started the run advertises termination itself.
  bool terminate = 14;
  // Reverse is backwards navigation. No backend offers it: a rerun is not
  // history, and nothing here reconstructs one.
  bool reverse = 15;
}

// DebugObservationKind is what a run reported between stops.
enum DebugObservationKind {
  DEBUG_OBSERVATION_KIND_UNSPECIFIED = 0;
  // Finished is a step that produced its outputs.
  DEBUG_OBSERVATION_KIND_FINISHED = 1;
  // Skipped is a step whose `if:` evaluated false.
  DEBUG_OBSERVATION_KIND_SKIPPED = 2;
  // Failed is a step whose failure propagates.
  DEBUG_OBSERVATION_KIND_FAILED = 3;
  // Tolerated is a failure `continue_on_error:` absorbed.
  DEBUG_OBSERVATION_KIND_TOLERATED = 4;
  // Waiting is a step that began waiting for a signal or a timer.
  DEBUG_OBSERVATION_KIND_WAITING = 5;
  // Log is a logpoint's message. It never stopped the run.
  DEBUG_OBSERVATION_KIND_LOG = 6;
  // Notice is the session saying something about itself, such as a
  // breakpoint condition that could not be evaluated.
  DEBUG_OBSERVATION_KIND_NOTICE = 7;
  // Task is a task's own account of its work, reported through
  // `NoteTask` while a debugger is watching. Local runs only.
  DEBUG_OBSERVATION_KIND_TASK = 8;
}

// DebugObservation is one thing the run did, recorded when it happened from
// the runtime's own account. Nothing is re-evaluated to produce it.
message DebugObservation {
  // Sequence orders observations within a session, from 1.
  uint64 sequence = 1;
  DebugObservationKind kind = 2 [(buf.validate.field).enum.defined_only = true];
  string step_id = 3 [(buf.validate.field).string = {max_len: 256}];
  // Text is the rendered account, after the session's redaction.
  string text = 4 [(buf.validate.field).string = {max_len: 16384}];
  // Address is the occurrence address, when the backend knows it.
  string address = 5 [(buf.validate.field).string = {max_len: 4096}];
}

// DebugSnapshot is one immutable view of a debug session.
//
// A snapshot is identified by its session and [revision]; a revision is never
// reused, so a handle, frame id, or value read under one revision is refused
// under another rather than silently answering about a different stop.
message DebugSnapshot {
  DebugSession session = 1;

  // Revision increases on every change of state or position.
  uint64 revision = 2;

  DebugRunState state = 3 [(buf.validate.field).enum.defined_only = true];

  // Reason is why the run is held. Unspecified unless [state] is held.
  DebugStopReason reason = 4 [(buf.validate.field).enum.defined_only = true];

  // Occurrence is where the run is held, or where it last was.
  DebugOccurrence occurrence = 5;

  // Frames are the stopped occurrence and its enclosing containers, innermost
  // first. Empty unless held.
  repeated DebugFrame frames = 6 [(buf.validate.field).repeated = {max_items: 256}];

  // BreakpointIds names the breakpoints that caused a breakpoint stop.
  repeated string breakpoint_ids = 7 [(buf.validate.field).repeated = {max_items: 1024}];

  // Failure is the rendered failure for a failure stop, after redaction.
  string failure = 8 [(buf.validate.field).string = {max_len: 16384}];

  DebugCapabilities capabilities = 9;

  // Message explains the state in a sentence where the state alone does not:
  // why a session expired, what a run is waiting on.
  string message = 10 [(buf.validate.field).string = {max_len: 4096}];

  // Observations are the most recent observations, oldest first, bounded.
  repeated DebugObservation observations = 11 [(buf.validate.field).repeated = {max_items: 1024}];

  // ObservationsDropped counts observations evicted before this snapshot could
  // carry them.
  uint64 observations_dropped = 12;

  // Protocol is the durable debug protocol version the run's interpreter
  // speaks. Zero for a local session.
  int32 protocol = 13 [(buf.validate.field).int32 = {gte: 0}];

  // Breakpoints are the session's breakpoints as they stand, with their hit
  // counts.
  repeated DebugBreakpointState breakpoints = 14 [(buf.validate.field).repeated = {max_items: 1024}];

  // Receipt is the outcome of the command a read named by request id, when it
  // named one.
  DebugReceipt receipt = 15;
  // IrDigest is the content digest of the program the run executes, as its
  // interpreter encodes it: what a client's source map must be bound to
  // before its lines are trusted to describe this run.
  string ir_digest = 16 [(buf.validate.field).string = {max_len: 128}];
}

// DebugResumeAction is what a resume asks the run to do next.
enum DebugResumeAction {
  DEBUG_RESUME_ACTION_UNSPECIFIED = 0;
  // Continue runs to the next breakpoint, failure stop, or the end.
  DEBUG_RESUME_ACTION_CONTINUE = 1;
  // StepIn stops at the next boundary anywhere, including inside the body of
  // the step being left.
  DEBUG_RESUME_ACTION_STEP_IN = 2;
  // StepOver stops at the next boundary at the same nesting or shallower: a
  // loop, parallel, switch, or call step runs its whole body first.
  DEBUG_RESUME_ACTION_STEP_OVER = 3;
  // StepOut stops at the next boundary shallower than the current one.
  DEBUG_RESUME_ACTION_STEP_OUT = 4;
  // RunUntil runs to the boundary the request's `until` names.
  DEBUG_RESUME_ACTION_RUN_UNTIL = 5;
  // Detach ends the session: breakpoints are cleared and the run continues.
  // It never ends the run.
  DEBUG_RESUME_ACTION_DETACH = 6;
}

// DebugCommandStatus is what became of one command.
enum DebugCommandStatus {
  DEBUG_COMMAND_STATUS_UNSPECIFIED = 0;
  // Applied means the run acted on the command; the receipt's revision is the
  // first one that reflects it.
  DEBUG_COMMAND_STATUS_APPLIED = 1;
  // Pending means the command was delivered and not yet applied. Delivery is
  // not application: poll `DebugGet` or retry with the same
  // request id.
  DEBUG_COMMAND_STATUS_PENDING = 2;
  // Duplicate means this request id was already applied; nothing advanced
  // twice, and the receipt repeats the original revision.
  DEBUG_COMMAND_STATUS_DUPLICATE = 3;
  // Stale means the command named a revision the session has moved past.
  DEBUG_COMMAND_STATUS_STALE = 4;
  // Conflict means another controller holds the session, or the session id
  // does not match the one the run holds.
  DEBUG_COMMAND_STATUS_CONFLICT = 5;
  // Refused means the command is invalid in the current state, such as
  // stepping a run that is not held.
  DEBUG_COMMAND_STATUS_REFUSED = 6;
  // Unsupported means this backend does not implement the command.
  DEBUG_COMMAND_STATUS_UNSUPPORTED = 7;
  // Incompatible means the run's interpreter predates the protocol the
  // command needs; nothing was sent that it would misread.
  DEBUG_COMMAND_STATUS_INCOMPATIBLE = 8;
  // Ended means the session or the run is over.
  DEBUG_COMMAND_STATUS_ENDED = 9;
}

// DebugReceipt is the outcome of one command.
message DebugReceipt {
  string request_id = 1 [(buf.validate.field).string = {max_len: 128}];
  DebugCommandStatus status = 2 [(buf.validate.field).enum.defined_only = true];
  uint64 revision = 3;
  string message = 4 [(buf.validate.field).string = {max_len: 4096}];
}

// DebugBreakpoint is one breakpoint as a client asks for it.
message DebugBreakpoint {
  // Id is a client-chosen identifier, echoed in states and stop snapshots.
  // Empty asks the backend to assign one.
  string id = 1 [(buf.validate.field).string = {max_len: 128}];

  // Step names where to stop: a bare step id, which arms every site with that
  // id, or a site path `a/b/c`, which arms exactly one. Exactly one of [step]
  // and [line] is set.
  string step = 2 [(buf.validate.field).string = {max_len: 4096}];

  // Line names a source line, resolved through the session's source map to the
  // innermost site whose span contains it.
  DebugSourceLine line = 3;

  // Condition is a CEL boolean, evaluated at each arrival in the step's own
  // scope, exactly as an `if:` would be.
  string condition = 4 [(buf.validate.field).string = {max_bytes: 65536}];

  // HitCondition filters arrivals whose condition held, by their count: `5`
  // or `>= 5` (from the fifth on), `== 5`, `> 5`, `< 5`, `<= 5`, or `% 5`
  // (every fifth).
  string hit_condition = 5 [(buf.validate.field).string = {max_len: 64}];

  // LogMessage makes this a logpoint: it never stops, and records the message
  // as an observation instead, with each `{expr}` replaced by that CEL
  // expression's rendered value.
  string log_message = 6 [(buf.validate.field).string = {max_bytes: 16384}];
}

// DebugSourceLine is one line of one source document.
message DebugSourceLine {
  string uri = 1 [(buf.validate.field).string = {max_len: 4096}];
  uint32 line = 2 [(buf.validate.field).uint32 = {gte: 1}];
}

// DebugBreakpointState is what became of one requested breakpoint.
message DebugBreakpointState {
  string id = 1 [(buf.validate.field).string = {max_len: 128}];

  // Verified means the breakpoint is armed. An unverified breakpoint is not
  // armed, and [message] says why.
  bool verified = 2;

  string message = 3 [(buf.validate.field).string = {max_len: 4096}];

  // Hits counts arrivals whose condition held, before the hit condition.
  uint64 hits = 4;

  // Sites are the sites the breakpoint resolved to.
  repeated DebugSite sites = 5 [(buf.validate.field).repeated = {max_items: 1024}];

  // LastError is the most recent condition or log evaluation error, after
  // redaction. Such an arrival does not stop the run.
  string last_error = 6 [(buf.validate.field).string = {max_len: 4096}];

  // Source is where the resolved site came from, when a source map says so.
  DebugSourceLocation source = 7;
}

// DebugFailureMode selects which step failures stop the run.
enum DebugFailureMode {
  // Unspecified leaves the mode unchanged; a new session starts with none.
  DEBUG_FAILURE_MODE_UNSPECIFIED = 0;
  // None never stops on a failure.
  DEBUG_FAILURE_MODE_NONE = 1;
  // Uncaught stops on a failure its own step does not tolerate with
  // `continue_on_error:`. A container that tolerates the failure further out
  // is not consulted, so such a stop may precede a run that goes on.
  DEBUG_FAILURE_MODE_UNCAUGHT = 2;
  // All stops on every failure, including those `continue_on_error:`
  // tolerates.
  DEBUG_FAILURE_MODE_ALL = 3;
}

// DebugValue is one evaluated value, as presented.
//
// The evaluated value itself stays in the backend; this carries its type, its
// rendering after redaction, and how to read its children. Redaction controls
// what is printed. It is not a confidentiality boundary against whoever may
// evaluate expressions: a predicate over a withheld value answers truthfully.
message DebugValue {
  // Type is the value's CEL type as a person reads it: `int`, `string`,
  // `list`, `map`, `null_type`, a message name.
  string type = 1 [(buf.validate.field).string = {max_len: 256}];

  string rendered = 2 [(buf.validate.field).string = {max_len: 65536}];

  // Truncated means [rendered] was cut to its bound.
  bool truncated = 3;

  // Children counts the value's direct children, for a map or list; zero for a
  // leaf.
  int32 children = 4 [(buf.validate.field).int32 = {gte: 0}];

  // Expression re-reads this value, and is what a child listing is asked for.
  string expression = 5 [(buf.validate.field).string = {max_bytes: 65536}];
}

// DebugVariable is one named child of a scope or a value.
message DebugVariable {
  string name = 1 [(buf.validate.field).string = {max_len: 4096}];
  DebugValue value = 2;
}

// DebugAttachRequest asks to hold a durable run at its next boundary under a
// lease, or renews or re-pauses a session the caller already holds.
message DebugAttachRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
    }
  ];

  string run_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string.uuid = true
  ];

  // SessionId renews or re-pauses an existing session. Empty mints a new one.
  string session_id = 3 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^([A-Za-z0-9._:-]+)?$"
  }];

  // Lease is how long to hold, bounded by the engine's ceiling.
  google.protobuf.Duration lease = 4;

  // RequestId makes the ask retry-safe: a retry with the same id returns the
  // original receipt and never pauses twice.
  string request_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];

  // Wait bounds how long the server waits for the run to apply the ask before
  // answering pending. At most 30s.
  google.protobuf.Duration wait = 6;

  // Renew extends the session's lease without asking for a hold: the
  // heartbeat a client sends while the run executes with breakpoints armed.
  // Requires [session_id].
  bool renew = 7;
}

// DebugAttachResponse is the attach receipt and the session as it stands.
message DebugAttachResponse {
  DebugReceipt receipt = 1;
  DebugSnapshot snapshot = 2;

  // SessionId is the session the attach is for: the one the request named,
  // or the one the server minted. Returned even while the attach is pending,
  // so the caller can follow it before the run has reached a boundary.
  string session_id = 3 [(buf.validate.field).string = {max_len: 128}];
}

// DebugGetRequest reads a durable run's debug state.
message DebugGetRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
    }
  ];

  string run_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string.uuid = true
  ];

  // AfterRevision waits, up to [wait], for a revision greater than this one.
  uint64 after_revision = 3;

  // Wait bounds the wait. At most 30s; unset answers at once.
  google.protobuf.Duration wait = 4;
}

// DebugGetResponse is the session as it stands.
message DebugGetResponse {
  DebugSnapshot snapshot = 1;
}

// DebugResumeRequest releases a hold: continue, step, run until, or detach.
message DebugResumeRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
    }
  ];

  string run_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string.uuid = true
  ];

  // SessionId must be the session the run holds.
  string session_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];

  string request_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];

  // ExpectedRevision refuses the command as stale unless the session is still
  // at this revision. Zero skips the check.
  uint64 expected_revision = 5;

  DebugResumeAction action = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Until is the step id or site path a run-until command runs to.
  string until = 7 [(buf.validate.field).string = {max_len: 4096}];

  google.protobuf.Duration wait = 8;
}

// DebugResumeResponse is the resume receipt and the session as it stands.
message DebugResumeResponse {
  DebugReceipt receipt = 1;
  DebugSnapshot snapshot = 2;
}

// DebugSetBreakpointsRequest replaces a session's breakpoints.
message DebugSetBreakpointsRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
    }
  ];

  string run_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string.uuid = true
  ];

  string session_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];

  string request_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];

  // Breakpoints is the whole set. The update is atomic: an invalid request
  // leaves the previous set in force, and an individually unverifiable entry
  // is reported unverified without disarming the others.
  repeated DebugBreakpoint breakpoints = 5 [(buf.validate.field).repeated = {max_items: 1024}];

  DebugFailureMode failure_mode = 6 [(buf.validate.field).enum.defined_only = true];

  google.protobuf.Duration wait = 7;
}

// DebugSetBreakpointsResponse reports each breakpoint's state, in request
// order.
message DebugSetBreakpointsResponse {
  DebugReceipt receipt = 1;
  repeated DebugBreakpointState breakpoints = 2;
  DebugSnapshot snapshot = 3;
}

// DebugInspectRequest evaluates a read-only CEL expression against a held run.
message DebugInspectRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
    }
  ];

  string run_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string.uuid = true
  ];

  string session_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];

  // Revision is the snapshot the question is about. A question about a
  // revision the session has left is refused as stale.
  uint64 revision = 4;

  // Expression is evaluated by the run's own evaluator under its cost bound.
  // Empty lists the scope's roots instead.
  string expression = 5 [(buf.validate.field).string = {max_bytes: 65536}];

  // Children asks for the value's children, paged by [offset] and [limit].
  bool children = 6;

  int32 offset = 7 [(buf.validate.field).int32 = {gte: 0}];

  // Limit bounds the page. Zero means the backend's default; at most 500.
  int32 limit = 8 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
}

// DebugInspectResponse is one evaluation's answer.
message DebugInspectResponse {
  uint64 revision = 1;

  // Value is the evaluated value. Unset when [error] is set, and when the
  // request listed scope roots.
  DebugValue value = 2;

  repeated DebugVariable children = 3;

  // Total is how many children exist, of which [children] is one page.
  int32 total = 4 [(buf.validate.field).int32 = {gte: 0}];

  // Error is the evaluation failure, rendered after redaction.
  string error = 5 [(buf.validate.field).string = {max_len: 16384}];
}

// DebugCarry is a durable debug session's state as the run itself holds it,
// carried across Continue-As-New in `RunState.debug` so a session survives a
// new segment. Everything here was decided by workflow code from recorded
// signals, so a replay rebuilds it exactly; nothing here holds a value from the
// run's scope.
message DebugCarry {
  // SessionId is the session attached, or empty after it ended.
  string session_id = 1 [(buf.validate.field).string = {max_len: 256}];

  // Holder is the attested caller who attached it.
  WorkloadIdentity holder = 2;

  google.protobuf.Timestamp attached_at = 3;

  // Deadline is the absolute end of the session, however often it is renewed.
  google.protobuf.Timestamp deadline = 4;

  // LeaseExpiresAt is when the session lapses unless renewed.
  google.protobuf.Timestamp lease_expires_at = 5;

  // Lease is the duration each renewal buys.
  google.protobuf.Duration lease = 6;

  uint64 revision = 7;

  // Next is what the next boundary does with the session attached.
  DebugResumeAction next = 8 [(buf.validate.field).enum.defined_only = true];

  // StepDepth is the call depth a step over or out left from.
  int32 step_depth = 9;

  string until = 10 [(buf.validate.field).string = {max_len: 4096}];

  repeated DebugBreakpoint breakpoints = 11 [(buf.validate.field).repeated = {max_items: 1024}];

  // Hits counts each breakpoint's arrivals, parallel to [breakpoints].
  repeated uint64 hits = 12;

  bool pause_requested = 13;

  // Receipts are the most recent commands' outcomes, oldest first, so a retry
  // after a lost response is answered from the run rather than applied twice.
  repeated DebugReceipt receipts = 14 [(buf.validate.field).repeated = {max_items: 64}];

  // Ended is how the last session ended, when none is attached.
  DebugRunState ended = 15 [(buf.validate.field).enum.defined_only = true];

  string message = 16 [(buf.validate.field).string = {max_len: 4096}];
}
