syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "flowstate/v1/authorization.proto";
import "flowstate/v1/identity.proto";
import "google/protobuf/timestamp.proto";

option go_package = "flowstatev1";

// The audit record: what an authorization decision was, written where an
// authorization decision is made.
//
// This is picatz/flowstate#1018's ratified answer, and each of its four parts
// is a decision that would have to be undone rather than extended if it were
// wrong. They are recorded here because the schema is the only place a reader
// of the record can reach.
//
// # What is audited
//
// Authorization decisions, allow and deny alike, keyed by AuthorizationAction
// — the vocabulary this deployment already has (authorization.proto), rather
// than a second list of verbs. The recordable vocabulary is therefore
// *derived*: it is every action that authorization.go's bindings attach to an
// RPC or MCP tool. TestEveryRPCHasExactlyOneAuthorizationAction and
// TestEveryRegisteredMCPToolHasExactlyOneAuthorizationAction walk those
// mappings in both directions. The authenticated MCP server's reduced tool
// list is separately invoked end to end in its conformance test, so a tool on
// that surface cannot become unaudited silently. Local stdio makes no bearer
// authorization decision and emits no MCP authorization record.
//
// # When it is written
//
// Write-ahead, synchronously, at the decision — before the mutation the
// decision permits. The subject of the record is the *decision*, not the
// effect: "this attested caller was authorized for workload.signal on run X
// at server time T" is complete and permanently true the instant the check
// returns, whether or not the signal then fails to deliver. #993 recorded the
// effect ("accepted") before the effect existed, which is how an audit log
// comes to hold a sentence that is false.
//
// The cost, stated: this record cannot answer "did the signal actually
// deliver". It was never the artifact for that — the run's own timeline and
// Temporal's history are — and conflating the two is what produced the wrong
// record. A crash between the record and the mutation leaves a true record of
// an authorization that was granted, which is the safe direction; the unsafe
// direction, a mutation with no record, is the one write-ahead closes.
//
// # What redacts it
//
// Nothing, because there is nothing here to redact. The redaction is
// structural rather than scrubbed: every field below is either chosen by the
// server (the action, operation, decision, clock, deny code, and policy
// provenance) or is an identity this deployment itself attested. There is no
// field a payload, an error message, an MCP argument or result, a prompt, a
// signal body or a workflow specification could be placed in, so the two leak
// classes CLAUDE.md names — reflection through unexported fields, and
// unwrapping into persisted failures — have nothing to reach.
//
// The grounds for preferring that to a scrubber are in the tree. A
// secrets.Scrubber is "best effort by construction and not a substitute for
// keeping a revealed value close to its use" (secrets/scrub.go), and
// SensitiveValues explicitly disclaims the job: "It is not containment"
// (sensitivevalues.go). A scrubber on the way into a durable audit sink is a
// last line of defense being used as a first one. metricschema made this same
// call for metrics — it records the policy surface "and not the *reason*: a
// reason can quote what was refused, and a refusal's own words are
// peer-influenced text" (metricschema/metricschema.go) — and this makes it
// again rather than re-litigating it per field: a denial carries a code from
// a closed set, and the prose stays on the error the caller receives, which
// is not durable.
//
// # Why this is in the schema at all
//
// CLAUDE.md's proto-first exception is for "a type defined by a boundary it
// refuses to cross", and #993 claimed it: audit data must never enter a
// workflow payload or history. That rule is about where a value may be *put*,
// not about whether it may be *described*. An audit record's whole purpose is
// to travel — to a sink somebody else reads — and a hand-written Go struct
// with JSON tags is a wire format either way, one that would additionally be
// a third spelling of AuthorizationAction and WorkloadIdentity. So it is
// described here, and the boundary is enforced where it lives: nothing writes
// an AuditRecord into a memo, a search attribute, a signal payload or a
// workflow argument. If you are about to be the first, that is the bug.

// # The worker's half
//
// Everything above describes a decision about a *caller*, made by the control
// plane, keyed by AuthorizationAction. picatz/flowstate#1379 records the other
// half: the decisions a worker makes about the workload it is already running
// — whether this task may dispatch, whether this secret may be read, whether
// this request may leave, whether this credential may be assumed.
//
// They are the same kind of record and share every field that means the same
// thing (the decision, the attested identity, the server clock, the deny
// code), which is why they are one message and one trail rather than two. What
// they cannot share is the operation vocabulary. AuthorizationAction is the
// deployment's OAuth-scope list, and authorization.proto states in its own
// words that internal enforcement points "are deliberately not named here": a
// scope a client could request for `secret.read` would be a spelling nothing
// grants. So an enforcement decision names its seam through
// AuditEnforcementPoint instead, and leaves action UNSPECIFIED — the one case
// where that is not "a decision about no action", because the enforcement
// point *is* the action.
//
// The four seams and nothing else. Each is the single place its policy is
// consulted, so a record written there is written where the decision is made
// rather than where its consequence is noticed. Egress is the one exception,
// and it is exact: the verdict is reached inside the policy's own transport,
// so the http task records what the transport answered. That means an egress
// allow is written after the request left, not before. The alternative was a
// second evaluation of the same policy to move the record earlier, which is a
// second evaluator for one concept and the thing the architecture refuses; the
// cost is stated here rather than hidden, and the deny direction — the one
// that must not be missing — is unaffected, since a denied request never left.

// AuditRecord is one authorization or enforcement decision, as this deployment
// made it.
//
// Every field is set by the server or the worker. The only value here a caller
// influences at all is resource_key, which is the identifier they addressed —
// bounded below, and an identifier is not a payload: without it the record
// cannot say which run was reached, which is the question an audit trail
// exists to answer. RPC and MCP tool names are accepted only after resolving
// them against the server's registered, authorization-bound operation table;
// the caller's raw tools/call name is never copied here.
message AuditRecord {
  option (buf.validate.message).cel = {
    id: "audit_record.operation"
    message: "exactly one of rpc, mcp_tool or enforcement_point must identify the audited operation"
    expression: "[this.rpc != '', this.mcp_tool != '', this.enforcement_point != 0].filter(set, set).size() == 1"
  };
  option (buf.validate.message).cel = {
    id: "audit_record.action"
    message: "action names the authorization vocabulary and is set for an rpc or mcp_tool decision, never for an enforcement point"
    expression: "(this.action != 0) == (this.rpc != '' || this.mcp_tool != '')"
  };

  // The action authorized, from the deployment's one closed vocabulary.
  //
  // Set for a control-plane decision and never UNSPECIFIED there: a decision
  // about no action is not a decision. UNSPECIFIED exactly when
  // enforcement_point names the decision instead — see "The worker's half"
  // above — which the message rule above holds to, so the two vocabularies
  // cannot both be absent and cannot both be present.
  AuthorizationAction action = 1 [(buf.validate.field).enum = {defined_only: true}];

  // Allow or deny. Never UNSPECIFIED, for the same reason.
  AuditDecision decision = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The WorkflowService method the decision was made for, by its schema name.
  //
  // Recorded alongside the action rather than derived from it because the
  // mapping runs the other way: one action covers several RPCs (workload.read
  // is Get, GetTimeline and List), so the action cannot say which operation
  // was asked for. The bound is AuthorizationActionBinding.rpcs's own, so a
  // reader comparing a record against the bindings is comparing like with
  // like.
  string rpc = 3 [(buf.validate.field).cel = {
    id: "audit_record.rpc"
    message: "rpc must be empty or a bounded WorkflowService method name"
    expression: "this == '' || (size(this) <= 64 && this.matches('^[A-Z][A-Za-z0-9]*$'))"
  }];

  // Who asked, as this deployment attested them — not as they described
  // themselves.
  //
  // The identity coordinates come from the same attested WorkloadIdentity a
  // run is started with, but claims are always removed before emission. Claims
  // may be relevant to workload policy; their values are not needed to say who
  // made which authorization decision and never belong in this trail.
  //
  // Absent for a decision made about an unauthenticated caller, which a
  // deployment started with --insecure-no-auth can have.
  WorkloadIdentity identity = 4;

  // What kind of thing was addressed, so a reader can tell an empty
  // resource_key that means "no resource" from one that means "the empty
  // namespace".
  AuditResourceKind resource_kind = 5 [(buf.validate.field).enum.defined_only = true];

  // The resource addressed: a workflow id, a schedule name, or a namespace.
  //
  // Caller-chosen, and therefore bounded here rather than trusted — a
  // decision is audited before the request has necessarily been validated,
  // because whether the caller may act does not depend on whether their
  // arguments parse. The emitter truncates on a rune boundary rather than
  // mid-sequence, so a bounded record is still a readable one.
  string resource_key = 6 [(buf.validate.field).string.max_len = 256];

  // When the decision was made, by the server's clock and never a caller's —
  // the rule SignalSender.accepted_at already states.
  google.protobuf.Timestamp decided_at = 7 [(buf.validate.field).required = true];

  // Why a denial was a denial, from a closed set. UNSPECIFIED on an allow.
  //
  // A code and not a message: see the redaction note on this file. The
  // caller's own error keeps the prose, and that error is not durable.
  AuditDenyCode deny_code = 8 [(buf.validate.field).enum.defined_only = true];

  // The registered MCP tool the decision was made for, by its full registered
  // name (for example, flowstate_validate). Exactly one of rpc and mcp_tool is
  // set.
  //
  // Additive rather than moving rpc into a oneof: rpc predates this field and
  // keeping field 3's cardinality and generated API unchanged preserves old
  // records and readers under both Buf FILE and WIRE compatibility. The
  // message-level rule gives new writers the same exclusivity a oneof would
  // have without changing the old field's contract.
  //
  // This is the registered name after authorization-action lookup, never the
  // untrusted tools/call string before lookup. Arguments, prompts and results
  // are deliberately absent from this record.
  string mcp_tool = 9 [(buf.validate.field).cel = {
    id: "audit_record.mcp_tool"
    message: "mcp_tool must be empty or a bounded registered tool name"
    expression: "this == '' || (size(this) <= 64 && this.matches('^[a-z][a-z0-9_]*$'))"
  }];

  // The worker-side seam that made the decision, for an enforcement record.
  // UNSPECIFIED on a control-plane record, where action names the operation
  // instead. See "The worker's half" above.
  AuditEnforcementPoint enforcement_point = 12 [(buf.validate.field).enum.defined_only = true];

  // The operator's own policy rule that decided, verbatim.
  //
  // This is the provenance half of picatz/flowstate#353's principle 2 — a
  // record that says a dispatch was refused and cannot say by *what* leaves
  // the operator reading it exactly where they started — and it is the one
  // string in this message whose bytes were neither chosen by this deployment
  // at compile time nor bounded by another schema. It is admitted for the
  // same reason issuer_name and role are, and under the same rule: it is
  // operator-authored configuration, never a caller's, a peer's, or a
  // workload's text.
  //
  // What that rule excludes is more important than what it admits. A denial's
  // Detail field is not this: for a rule that failed to *evaluate*, that text
  // quotes the CEL evaluation error, which can quote the data the rule was
  // reading. So a rule-error denial carries the deny code and nothing else,
  // and only a rule that matched — whose source text is configuration and
  // nothing more — is copied here. The rest of the denial's prose stays on the
  // error the caller receives, which is not durable.
  //
  // Empty when no single rule decided: a policy with nothing configured, an
  // allowlist nothing matched, a destination refused by the policy's own
  // scheme, port or address bounds, or an allow at a seam whose evaluator does
  // not report which rule permitted it. The evaluated facts are then still in
  // the record — the attested identity, and the resource the rule read — which
  // is what makes an allow legible without one.
  string rule = 13 [(buf.validate.field).string.max_bytes = 256];

  // The operator-chosen trusted-issuer entry that admitted the caller.
  // Unlike identity.issuer, which names who signed the credential, this names
  // the exact policy row that accepted it. It is bounded before emission; it
  // never comes from a token claim.
  string issuer_name = 10 [(buf.validate.field).string.max_bytes = 128];

  // The role the same trusted-issuer entry assigned to the caller. Empty when
  // the policy assigned none. It is bounded before emission and never copied
  // from a token claim.
  string role = 11 [(buf.validate.field).string.max_bytes = 128];

  // There is deliberately no MCP session id or JSON-RPC request id. The
  // session id is a process-local bearer-like routing capability, and the
  // request id is caller-chosen, variably typed, and not exposed at the SDK's
  // authoritative tool-handler seam. Persisting either would add sensitive or
  // unbounded peer text. One AuditRecord is the request correlation unit: one
  // resolved tool authorization decision, emitted exactly once. Tool errors
  // and cancellations after an allow do not rewrite that true decision into a
  // deny or add a second outcome record.
}

// AuditDecision is the answer itself.
enum AuditDecision {
  AUDIT_DECISION_UNSPECIFIED = 0;

  // The caller was authorized. The mutation this permits has not happened yet
  // when the record is written — see the write-ahead note on this file.
  AUDIT_DECISION_ALLOW = 1;

  // The caller was refused, and nothing was done.
  AUDIT_DECISION_DENY = 2;
}

// AuditEnforcementPoint is the closed list of worker-side seams that decide
// something about a workload already running.
//
// Closed and small, for the reason AuditDenyCode is: a value here that no seam
// emits is a spelling nobody reads. Each of these is one function, and the
// engine reaches every one of them through both drivers — see
// pkg/flowstate/v1/enforcementaudit.go, which names the seam beside each
// value.
enum AuditEnforcementPoint {
  AUDIT_ENFORCEMENT_POINT_UNSPECIFIED = 0;

  // Whether this identity may dispatch this task, from the deployment's
  // task-shape policy. CheckTaskPolicy, the one check both drivers make once
  // per dispatch.
  AUDIT_ENFORCEMENT_POINT_TASK_DISPATCH = 1;

  // Whether this workload may read this secret reference, from the secret
  // access policy. ResolveSecret, before the store is consulted, so a cache
  // cannot turn a denied read into an allowed one.
  AUDIT_ENFORCEMENT_POINT_SECRET_ACCESS = 2;

  // Whether this request may leave the worker, from the egress policy. The
  // built-in http task, at the verdict its policy's transport returns.
  AUDIT_ENFORCEMENT_POINT_EGRESS = 3;

  // Whether this workload may assume a credential for a federation target,
  // from the assumption policy. AuthorizeCredential, which refuses before any
  // assertion is minted.
  AUDIT_ENFORCEMENT_POINT_CREDENTIAL_ASSUMPTION = 4;
}

// AuditResourceKind names what resource_key addresses.
enum AuditResourceKind {
  // No resource was reached at all. Validate, Compile and GetCatalog are the
  // whole of this case: they touch no run and no tenant, which is what
  // AUTHORIZATION_ACTION_WORKLOAD_VALIDATE's own comment says.
  AUDIT_RESOURCE_KIND_UNSPECIFIED = 0;

  // A run, addressed by its workflow id.
  AUDIT_RESOURCE_KIND_RUN = 1;

  // A schedule, addressed by the name its author gave it.
  AUDIT_RESOURCE_KIND_SCHEDULE = 2;

  // A whole tenant, which is what a listing addresses.
  AUDIT_RESOURCE_KIND_NAMESPACE = 3;

  // A task, addressed by the qualified name a step dispatches, such as
  // "http" or "codex.exec". Registry names, not author prose.
  AUDIT_RESOURCE_KIND_TASK = 4;

  // A secret, addressed by the reference that names it — "scheme:name", the
  // reference a workflow author wrote and never the value it resolves to.
  // Nothing resolved reaches this record: the seam records the decision
  // before the store is consulted, so on a denial no value exists yet, and on
  // an allow the value is returned to the task and not to the trail.
  AUDIT_RESOURCE_KIND_SECRET = 5;

  // A network destination, addressed as scheme://host:port.
  //
  // Only that much of the URL. The path, query, fragment and userinfo are
  // request content — a webhook URL carries its credential in the path, a
  // query string carries tokens — and netpolicy's own tracing comment already
  // refuses them for a span. This trail is narrower than a span's audience
  // (an operator reading their own deployment's decisions, not a shared
  // collector) and an egress record that cannot say where the request was
  // going would not answer the question it exists for, so the destination
  // stays and its content does not.
  AUDIT_RESOURCE_KIND_ENDPOINT = 6;

  // A credential target, addressed by the operator-configured target name a
  // workload asked to assume. Never the credential.
  AUDIT_RESOURCE_KIND_CREDENTIAL_TARGET = 7;
}

// AuditDenyCode is the closed set of reasons a decision was a denial.
//
// Closed, and deliberately small: every value here is emitted by a named seam
// in the server today. A code nothing sets is a spelling nobody reads, which
// is the thing authorization.proto's own comment refuses to accumulate.
//
// These are finer than what the caller is told. A run in another tenant and a
// run that does not exist both answer "no such run", because confirming that
// a run exists elsewhere is the fact a caller in the wrong tenant must not
// learn — but the audit sink is not the caller, and an operator reading their
// own deployment's records is exactly who should be able to tell a
// cross-tenant probe from a typo.
enum AuditDenyCode {
  AUDIT_DENY_CODE_UNSPECIFIED = 0;

  // The caller's namespace maps to no Temporal namespace this server can
  // reach, so nothing could be authorized in it. FlowstateServer.clientFor's
  // refusal.
  AUDIT_DENY_CODE_NAMESPACE_UNROUTABLE = 1;

  // The addressed run or schedule could not be read at all.
  AUDIT_DENY_CODE_RESOURCE_NOT_FOUND = 2;

  // The resource exists and belongs to another tenant, or records no tenant
  // that this caller could be. FlowstateServer.ownedBy answering false.
  AUDIT_DENY_CODE_TENANT_MISMATCH = 3;

  // The caller may address the resource, but a policy governing the requested
  // operation refused it. FlowstateServer.authorizeSignal's name-level policy
  // check is the first emitter.
  AUDIT_DENY_CODE_POLICY_DENIED = 4;

  // A deny rule matched. The rule field carries which one.
  //
  // The four codes below are the worker's, and they are finer than
  // POLICY_DENIED for the reason this enum's own comment gives: these four
  // situations look identical to a caller and are completely different to the
  // operator who has to act on them.
  AUDIT_DENY_CODE_DENY_RULE = 5;

  // Nothing permitted it: allow rules are configured and none matched, or the
  // policy is an allowlist and holds none. No rule decided, so rule is empty.
  AUDIT_DENY_CODE_NO_ALLOW_RULE = 6;

  // A rule could not be evaluated, and rules fail closed. The one code an
  // operator should page on: it means the policy is refusing work because the
  // policy itself is broken, not because it decided anything. The rule's own
  // evaluation error is deliberately absent — see the rule field.
  AUDIT_DENY_CODE_RULE_ERROR = 7;

  // The deployment configured nothing that could have permitted this: no
  // secret rules at all (where absence means nothing may be read), no such
  // credential target, or a worker with no secret or federation authority
  // installed.
  AUDIT_DENY_CODE_NOT_CONFIGURED = 8;

  // The destination itself is outside what the egress policy permits — its
  // scheme, its port, the address it resolved to, a redirect it attempted, or
  // the control plane it addressed. One code for the six netpolicy reasons
  // that are not rule decisions, because what an operator does about them is
  // the same: the record names the destination, and the policy's own bounds
  // are configuration they already hold.
  AUDIT_DENY_CODE_DESTINATION_NOT_PERMITTED = 9;
}
