syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "flowstate/v1/identity.proto";
import "flowstate/v1/value.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "flowstatev1";

// SignalPolicy constrains who may deliver one named signal to a run.
//
// A sender is authorized when the one CEL predicate in [allow] is true. The
// same message carries the `debug:` stanza's policy, and `manual:` has the same
// shape in `ManualTrigger.allow`.
//
// Field 1 (the `allow` rule list of `SignalPolicyRule` messages), field 2
// (`distinct_from_starter`) and the rule message itself were retired in favor
// of the predicate: every rule list is a disjunction of conjunctions over the
// sender, and `flow fix` rewrites each one into the predicate that says the
// same. Their numbers are reserved so a policy frozen in an older run's memo
// decodes as a policy with no predicate, which authorizes nobody, never as one
// that reads a stale field as something else.
message SignalPolicy {
  reserved 1, 2;
  reserved "distinct_from_starter";

  // Allow is one CEL predicate that decides the whole policy, written in a
  // Flowfile as `allow: ${...}`. A policy with none authorizes nobody, which
  // is indistinguishable from a typo and is refused by the compiler
  // (`CheckPolicyShape`) rather than accepted as (probably unintended)
  // lockout.
  //
  // The source is stored without the `${` `}` fence. It is evaluated
  // server-side, against the server's own attestation, over a closed scope:
  // `sender.identity.{principal,subject,issuer,namespace,claims}`,
  // `run.identity` (the starter, with the same shape; unbound when the run
  // has no recorded starter, so a predicate that reads it errors), and
  // `inputs` (the run's bound arguments). Nothing else is in scope.
  //
  // Fail closed: a result that is not a bool, an evaluation error, an unbound
  // starter that is read, an exceeded cost bound, or an expression that does
  // not compile all refuse the sender; none ever allows. The refusal names no
  // input or claim value.
  //
  // A predicate that reads `inputs` must also read `sender.identity.claims` or
  // `run.identity`: whoever started the run chose the inputs, so a predicate
  // over them alone would let the starter name their own approver. This is a
  // syntactic rule, so authors should write the narrowing as a conjunction.
  //
  // This field was `allow_expr` at the same number before the rule list was
  // retired; the wire encoding is unchanged and only the JSON name differs.
  string allow = 3 [(buf.validate.field).string.max_len = 2048];

  // AllowSource is `allow` as the author wrote it, set only when it differs: an
  // `allow` that calls a declared function (`FunctionDeclaration`) is stored
  // expanded in `allow`, so the server evaluates plain CEL, and written here in
  // the call form, without the `${` `}` fence, so `flow fmt` and Marshal write
  // the file back as it was authored. Never evaluated, compiled or checked; a
  // specification that carries one without a matching expansion is read by
  // `allow` alone.
  optional string allow_source = 4 [(buf.validate.field).string.max_len = 2048];
}

// Signal names something a workload waits to be told.
//
// The payload a signal carries becomes the waiting step's outputs, which is what
// makes a gate compose with everything else: `${steps.approval.payload.approved}`
// resolves the way any other step reference does, so it works in an `if:`, in a
// task input, and in a later expression, with no special form for signals.
message Signal {
  // Name is what a sender addresses. It is part of the workload's contract with
  // whatever approves it, so it is written by the author rather than generated.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];

  // Outputs shapes what the waiting step produces, the way the http task's own
  // `outputs:` shapes what a request produces.
  //
  // Each value is evaluated once, at the moment the wait resolves, against the
  // wait's own result: `payload`, `sender` and `timed_out` are bound bare, and
  // so is `now`: every expression a wait holds sees the driver's clock (see
  // [NowIdentifier]). The enclosing scope is underneath, so `steps.*`,
  // `inputs.*` and `vars.*` read here exactly as they do in an `if:`.
  //
  //     wait_for_signal:
  //       name: deploy-approved
  //       timeout: 1h
  //       outputs:
  //         approved: ${has(payload.approved) && payload.approved}
  //         timed_out: ${timed_out}
  //
  // # Replace, not extend
  //
  // The shaped names become the step's outputs, and the defaults are gone:
  // one key with one meaning, matching `Task.HTTP.Inputs.outputs` exactly. An
  // author who still needs `payload` or `timed_out` re-exposes it in a line,
  // and reading one that was dropped is an ordinary "step has no output"
  // diagnostic rather than an empty value that branches the wrong way.
  //
  // # Why this exists
  //
  // A condition derived from a step's own result had nowhere to be named, so
  // real workflows wrote it once per reader: in an `if:`, negated in the
  // sibling's `if:`, and re-derived in the workflow's `outputs:`. Nothing kept
  // the copies in agreement, and the report could disagree with the branch that
  // ran. Shaped here, the gate is stated once on the step that produced the data
  // and every later reader reads the same recorded output.
  //
  // # Why it is on Signal rather than on Wait
  //
  // Two of the three names these expressions see (`payload` and `sender`) do
  // not exist on the other arms, and the third, `timed_out`, is a constant
  // `false` for a `sleep:` and a `wait_until:`. Shaping a constant is what
  // `vars:` is for. Putting the field here rather than on [Wait] makes the
  // refusal structural instead of reported: `timeout` sits on [Wait] and is
  // meaningless on two of its arms, which is exactly why [ValidateWait] has to
  // exist. The placement also matches the precedent it copies: http's
  // `outputs:` sits on that task's own inputs, not on a generic step wrapper.
  //
  // Carriage across Continue-As-New is unaffected either way, which is what
  // frees the decision to be made on meaning: the whole node travels inside the
  // spec, and a shaped value is recorded in `Workflow_StepOutputs` like any
  // other step output. What compaction *does* need is that the references these
  // expressions make are collected. See `CollectNodeRefs`.
  map<string, Value> outputs = 2;

  // Prompt is what this gate is asking for, in the author's own words, carried
  // to whoever is being asked.
  //
  // A gate could say which signal releases it and could not say what agreeing
  // to it means. `deploy-approved` is a routing key, not a question: an
  // operator holding a run id learned the name to send and nothing about what
  // they would be approving. This is the sentence that was missing, and it
  // travels on `PendingWait.prompt` so every surface that reports a parked gate
  // reports it.
  //
  // An expression rather than a literal string, because the interesting part of
  // an approval is the particulars: `${"deploy %s to %s?".format([inputs.version,
  // inputs.environment])}` says which build and which environment, and a fixed
  // string cannot. A plain unfenced string is still a plain string, exactly as
  // it is in every other input position.
  //
  // # When it is evaluated, and what it sees
  //
  // Once, at the moment the wait begins parking, on both drivers - the same
  // point the wait announces itself to the reporting registry, and after both
  // ways a wait can resolve without parking at all (a signal that arrived
  // early, a bound that had already lapsed). A gate the run walks straight
  // through evaluates no prompt, because it never asks anybody anything.
  //
  // It sees the enclosing scope and [NowIdentifier], the same names
  // `timeout:` sees. It does *not* see `payload`, `sender` or `timed_out`:
  // those are the wait's result, and the result does not exist yet when the
  // question is asked. That asymmetry with `outputs:` is the honest one, and
  // it is why this is a sibling of that key rather than an entry in it.
  //
  // A prompt that fails to evaluate fails the step, exactly as a `timeout:`
  // that fails to evaluate does. Silently parking with no question is the one
  // outcome worth refusing: nobody would learn the gate had asked anything, and
  // an approver would be shown a blank where the decision was supposed to be.
  //
  // # Sensitivity, which is why this field is not simply a string
  //
  // The evaluated text is rendered into *other people's* clients - an approver
  // who is not the run's author, and who was given a run id rather than the
  // file. So the rule the `log:` lint draws at direct surfacing is drawn wider
  // here: a prompt may not *reach* an input declared `sensitive:` at all, by any
  // spelling, and may not hold a `${secret(...)}` reference. Both are refused at
  // compile where they are statically knowable, and refused again fail-closed at
  // submit by [CheckWaitPromptsAreAskable]. A prompt that still holds a secret
  // reference when it is evaluated - a specification built in process, never
  // parsed and never submitted - renders as a refusal rather than as the secret.
  //
  // # Bounded
  //
  // The evaluated text is bounded by [MaxWaitPromptBytes], read by both drivers
  // from the package both import. Text past the bound is cut and
  // `PendingWait.prompt_truncated` says so, because a question a reader cannot
  // tell was cut short is a question they may answer having read half of it.
  Value prompt = 3;
}

// SignalBatch names something a workload waits to be told *repeatedly*, and
// takes every delivery already buffered in one step.
//
// # The shape it replaces, and what batching actually saves
//
// The event-accumulator shape today is `loop:` around `wait_for_signal:`: one
// signal per iteration, appended to the loop's `results`. A burst of fifty
// orders costs fifty iterations of that loop.
//
// It is worth being exact about the saving, because the obvious reading is
// wrong. A signal costs one `WorkflowExecutionSignaled` event in history
// whether it is drained in a batch or consumed one at a time — batching does
// *not* remove those, and nothing can: the event is written when the sender's
// RPC is accepted, long before any workflow code decides how to read it. What
// the per-iteration shape pays *on top* of that is what a batch removes:
//
//   - a workflow task per iteration (Scheduled/Started/Completed, three events),
//     plus the body's own activity events, where a burst drained in one step
//     coalesces into a handful of workflow tasks — a burst arriving while a task
//     is already pending is delivered into that same task;
//   - one `Workflow.StepOutputs` entry per iteration, weighed against
//     [MaxLoopResultsBytes] by `AccumulateLoopResult`, where a batch records one.
//
// So the honest headline is "fewer workflow tasks and one results entry instead
// of N", not "fewer signal events".
//
// # A separate message from Signal, rather than a drain flag on it
//
// By exactly the argument `Signal.outputs` makes for sitting on [Signal] rather
// than on [Wait]: a drain binds `deliveries` and `count`, and does *not* bind
// `payload` or `sender`. A flag inside [Signal] would make every `outputs:`
// expression's validity depend on the value of a sibling key — the reported
// refusal that comment rejects in favour of a structural one.
//
// # Admission is unaffected, and deliberately so
//
// `SignalPolicyCheck` and `CheckSignalPayloadSize` run at the `Signal` RPC,
// before a delivery ever reaches a channel. Every delivery in a batch was
// individually admitted by the same policy, against the sender the server
// attested for it. A batch therefore cannot route around per-sender policy,
// because the policy is not at receive time — there is nothing new to enforce
// here, only something to keep true.
message SignalBatch {
  option (buf.validate.message).cel = {
    id: "signal_batch.quorum_approve_within_bound"
    message: "quorum.approve may not exceed the batch bound (max_batch, or 128 when it is zero), because a quorum counts approvals inside the deliveries one wait may take"
    expression: "!has(this.quorum) || this.quorum.approve <= (this.max_batch == 0 ? 128u : uint(this.max_batch))"
  };

  // Name is what a sender addresses, under exactly `Signal.name`'s rules — the
  // same channel, read a different way.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];

  // MaxBatch bounds how many deliveries one drain takes. Zero means
  // [MaxPendingSignals], which is also the ceiling.
  //
  // Bounded here rather than trusted, because a signal burst is peer-controlled
  // input and the batch is the multiplication: the count is what the far side
  // chooses, and bytes follow from it — each delivery is already bounded by
  // [MaxSignalPayloadBytes] at admission, so a bounded count bounds the whole.
  // A bounded `int32` in the manner of `ForEach.max_parallel`, for the same
  // reason: bound the resource the peer controls.
  //
  // Deliveries past the bound are *not* dropped and *not* re-buffered — they
  // are simply left on the channel, so the next drain takes them. That is what
  // a `loop:` around this already wants, and it means a bound being reached
  // costs an iteration rather than an approval.
  int32 max_batch = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 128
  }];

  // Outputs shapes what the waiting step produces, exactly as `Signal.outputs`
  // does — same evaluator, same single moment, same replace-not-extend rule.
  //
  // What differs is the names it binds, and that difference is why this is a
  // separate message: `deliveries` (a list of `{payload, sender}` maps, oldest
  // first), `count`, and `timed_out`, plus `now`. There is no `payload` and no
  // `sender`, because a batch has many of each.
  map<string, Value> outputs = 3;

  // Prompt is what this gate is asking for, under `Signal.prompt`'s whole
  // contract: evaluated once at the moment the wait parks, seeing the enclosing
  // scope and `now` and not the wait's result, bounded by [MaxWaitPromptBytes],
  // and refused any reach to a `sensitive:` input or a `${secret(...)}` by
  // [CheckWaitPromptsAreAskable].
  Value prompt = 4;

  // Quorum turns the wait into a decision: "two of these three must approve",
  // with distinct approvers, a veto, and a record of who approved.
  //
  // Absent, the wait is the burst drain above and nothing about it changes.
  // Present, it *replaces* the drain's shape (a first delivery and then
  // whatever is already queued) with a loop that takes one delivery at a time
  // until the quorum is decided or the wait's `timeout:` lapses; see
  // [SignalQuorum] for how a delivery counts. Deliveries after the decision are
  // not taken by this wait and stay on the channel for a later one, exactly as a
  // delivery beyond `max_batch` does.
  //
  // A quorum wait's outputs are the batch's three (`deliveries`, `count`,
  // `timed_out`) plus `decision`, `approvals` and `vetoed_by`; `outputs:` shapes
  // them and sees all six. `max_batch` is the bound on `approve`.
  SignalQuorum quorum = 5;
}

// SignalQuorum says how many approvals decide a `wait_for_signals:`, who may
// count toward them, and what ends the wait early.
//
// # What counts
//
// A delivery is an *approval* when its payload's `approved` is boolean true,
// which is exactly what the browser gate page sends. It is a *veto* when
// [veto] is true for it (by default, when its payload's `approved` is boolean
// false). A delivery that is neither is ignored: it is consumed by the wait and
// reported in `deliveries`, but it moves nothing.
//
// A veto is checked first and ends the wait at once, whatever the count, so a
// delivery that is both a veto and an approval vetoes. Admission is not
// repeated here: the `signals:` policy refuses a sender before a delivery ever
// reaches a wait, on both drivers, so a refused sender can neither approve nor
// veto, and everything this message decides is about deliveries the policy
// already let through.
//
// # Evaluated the same on both drivers
//
// The decision is one pure tally in `pkg/flowstate/v1` that both drivers call
// as each delivery is taken, with [exclude] and [veto] evaluated by the same
// evaluator that evaluates the batch's own `prompt:` and `outputs:`. Each sees
// the enclosing scope (`run`, `inputs`, `steps`, ...), `now`, and the delivery
// bound bare as `payload` and `sender`, as `outputs:` binds a single wait's.
message SignalQuorum {
  // Approve is how many counted approvals complete the wait. At least one, and
  // no more than the batch's bound (a quorum is counted among at most that many
  // deliveries), which the enclosing [SignalBatch]'s own constraint checks.
  uint32 approve = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 128
    }
  ];

  // Distinct requires each counted approval to come from a different sender.
  // Unset means true: a quorum that one person could meet by approving twice is
  // almost never what was meant, so the safe reading is the default and
  // `distinct: false` is the spelling that opts out.
  //
  // A sender is the verified identity's subject qualified by its issuer (see
  // `QualifiedSubject`), the same comparison the `signals:` policy uses. A
  // delivery with no identity subject (a local or unattested one) has nothing
  // to be distinct by, so under a distinct quorum it never counts as an approval
  // and is ignored: it fails closed rather than being counted as an anonymous
  // somebody. A repeat approval from an already-counted sender is ignored too,
  // and a later delivery from that sender is still considered for a veto.
  optional bool distinct = 2;

  // Exclude lists expressions naming subjects whose approvals do not count, the
  // way four-eyes is spelled: `${run.identity.subject}` ignores the run
  // starter's own approval. Each is evaluated for every delivery and must
  // produce a string or a list of strings; a delivery whose identity subject
  // equals any of them is not counted as an approval. It still can veto.
  //
  // An expression that does not evaluate, or produces anything else, fails the
  // step: silently counting an approval an author asked to exclude is the
  // direction this must not fail in. A delivery with an empty subject matches an
  // empty excluded subject, so an unattested sender never slips past a run whose
  // own starter is anonymous.
  repeated Value exclude = 3 [(buf.validate.field).repeated = {max_items: 16}];

  // Veto is one boolean expression over the delivery that ends the wait with
  // decision `vetoed` when it is true. Omitted, a delivery whose payload
  // `approved` is boolean false vetoes. A delivery is checked for a veto before
  // it is considered an approval, whatever its subject.
  Value veto = 4;
}

// SignalSender is who the server attests sent a signal, never what the
// sender's own payload claims.
//
// Two separate things travel with every signal, and they must never merge into
// one map: `payload` is what the sender chose to send, unchanged and untrusted;
// `sender` is what the server itself established about the caller before it
// ever looked at the payload. A workflow author writes conditions against
// `sender` (`sender.identity.subject != inputs.requested_by` for separation of
// duties) and treats `payload` as evidence rather than identity.
//
// Identity reuses [WorkloadIdentity] rather than a parallel type: a signal's
// sender and a run's own caller are the same kind of fact (someone acting,
// established by authentication rather than self-report), and a run's identity
// is already this message. Two messages for one shape is exactly the drift
// ARCHITECTURE.md invariant 1 (proto-first) exists to prevent.
//
// Absent entirely on a signal that predates this field (identity unset,
// accepted_at unset, local false), which reads as unattested. That is correct,
// because no signal recorded before this field existed could have carried one.
// There is no compatibility arm: an old signal simply has nothing here.
message SignalSender {
  // Identity is the authenticated caller the server established for this
  // signal, by the same path a run's own identity is established
  // (`FlowstateServer.identityFor`, via `authorizeRun`). Never taken from the
  // request: a caller who could name their own identity could name anyone
  // else's, which is the exact defect this message exists to close.
  WorkloadIdentity identity = 1;

  // AcceptedAt is when the server accepted the signal, from the server's own
  // clock, never the sender's. A self-reported time is exactly the kind of
  // claim this field replaces with something attested.
  google.protobuf.Timestamp accepted_at = 2;

  // Local marks a signal delivered to a local run (`flow run local --signal`
  // or `flow test`'s scripted signals), which has no authenticated caller at
  // all: there is no server in front of it to attest anything. Set only by
  // [LocalSignalSender]; the durable driver never sets it true.
  //
  // A wait's rendered `sender.local` output (see wait.go's signalSenderValue)
  // is `true` for this case *and* for every other case where nothing was
  // attested at all: this message absent entirely, which covers a signal
  // that predates this field, a timed-out wait with nothing pending, and the
  // engine's own compatibility fallback for a signal that arrived in the
  // older wire shape (engine/signal_compat.go). All of those are the same
  // fact from a workflow author's point of view (nobody attested this), and
  // must read the same way, distinct from an attested-but-anonymous caller
  // (this message present, Local false, Identity.Subject merely empty because
  // no identity provider is configured). This field's own wire value only
  // ever means "the local driver," never "nothing was attested"; the broader
  // reading exists solely in the rendered output, precisely so a workflow
  // author can trust `!sender.local` as "the server accepted this."
  bool local = 3;

  // DeliveryID names the webhook delivery this signal came from, empty for
  // every sender that is not one.
  //
  // The digest `WebhookDeliveryID` computes over the trigger's evaluated
  // `idempotency_key:`, never the key itself: the usual key is a signature
  // header, and this value is written into durable run state, where
  // credential-shaped material may not go (ARCHITECTURE.md invariant 7). A digest is fixed-length,
  // alphabet-safe, and says nothing about the key it names.
  //
  // It is here rather than in `Principal.claims` because it is not a
  // claim about a principal — every delivery from one trigger attests the same
  // principal and carries a different one of these. What it is for is the
  // engine's own dedupe: a run records the ids it has consumed
  // (`RunState.consumed_delivery_ids`) so that a redelivery after the gate has
  // already been answered is dropped rather than taken by the next
  // `wait_for_signal:` a `loop:` comes back around to.
  string delivery_id = 4 [(buf.validate.field).string = {max_len: 64}];
}
