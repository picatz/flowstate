syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "flowstate/v1/value.proto";
import "google/api/expr/v1alpha1/value.proto";
import "google/api/field_behavior.proto";

option go_package = "flowstatev1";

// Task is the unit of work a step dispatches: a name saying which task, and the
// inputs that task takes.
//
// The inputs are a map of [Value] rather than a per-task message, because the
// set of tasks is open. A plugin adds one at run time, and a wire shape holding
// a closed union of every task's arguments could not carry a task this build has
// never heard of. What keeps that from being untyped is [TaskCatalog]: each task
// declares its fields and their constraints there, the registry checks a step's
// inputs against that declaration before anything runs, and the nested Inputs
// and Outputs messages below give the built-in tasks the same shapes in Go that
// a plugin's manifest gives its own.
message Task {
  // Log is a task that emits a message for a person to read.
  //
  // It exists because `echo` was doing this job under a name that describes the
  // wrong thing: echo *returns* a value, and the two uses that survived `vars:`
  // (hello-world scaffolding and "this branch ran" markers) were never about the
  // return. They were about someone seeing it. Naming the capability after what it
  // is for is what lets the surfaces that show it (a `flow run` transcript, the
  // watch view, the run record) treat it as a message rather than as a value that
  // happens to be printed.
  //
  // # It has no outputs, deliberately
  //
  // A log line is an effect on a reader, not a value for a later step. Offering
  // `result` would make `${steps.announce.result}` legal, which is the `vars:` use
  // case sneaking back in through the one task that has no business carrying data,
  // and it would give a step two reasons to exist, so the file could no longer say
  // which one was meant. A capability that emits nothing is how this language says
  // "this produces nothing you can read".
  message Log {
    message Inputs {
      // Message is the line a person reads. It is the whole point, so it is the
      // only required input.
      string message = 1 [
        (buf.validate.field).required = true,
        (google.api.field_behavior) = REQUIRED
      ];

      // Level says how much it matters, and defaults to LEVEL_INFO.
      //
      // An enum rather than a free string, because a sink has to map it onto
      // something (a terminal colour, a severity field, a filter), and a set that
      // an author can extend by typo is a set nothing downstream can switch on.
      Level level = 2 [(buf.validate.field).enum = {defined_only: true}];

      // Fields carry structure for a sink that has somewhere to put it, and are
      // ignored by one that does not.
      //
      // String-valued rather than Value-valued, and that is a real limit rather
      // than an oversight: every sink this can reach (a terminal line, a logging
      // backend's attributes, a run record) renders to text in the end, and a
      // nested value would render differently at each of them. Compose the string
      // in the expression, where the author can see what it will say.
      //
      // Bounded because a workflow chooses both the count and the size, and a log
      // line is written to durable history.
      map<string, string> fields = 3 [(buf.validate.field).map = {
        max_pairs: 32
        keys: {
          string: {
            min_len: 1
            max_len: 64
          }
        }
        values: {
          string: {max_len: 1024}
        }
      }];
    }

    // Level is how much a message matters.
    //
    // Three, and no more without a reason: `debug` is a *deployment* concern rather
    // than an authoring one (a workflow author cannot know what a given operator
    // wants filtered), and `fatal` is a claim about control flow that a task has no
    // way to honour, since emitting a line does not stop the run.
    enum Level {
      // Unspecified reads as LEVEL_INFO, so a `log:` that says nothing about level
      // is the ordinary case rather than an error.
      LEVEL_UNSPECIFIED = 0;
      LEVEL_INFO = 1;
      LEVEL_WARN = 2;
      LEVEL_ERROR = 3;
    }

    // Outputs is empty and stays empty.
    //
    // Present rather than absent because every task's shape is described from a
    // descriptor (`flow tasks` and the language server both read one), and a task
    // with no message at all would have to be a special case in each of them. An
    // empty message says "nothing" in the same vocabulary everything else uses.
    message Outputs {}
  }

  // Echo, Printf and CEL were tasks here, and are retired at edition v2026.2.
  //
  // Each of them existed to produce a *value*, from a time when a step was the
  // only thing that could hold one. `vars:` is that thing now, at the workflow, at
  // the step and inside a loop body, so all three had become a step whose only job
  // was to name an expression, with a run record entry, a retry policy and a
  // history event to pay for it. `echo` additionally meant two unrelated things
  // depending on whether anyone read its `result`; the half that was about being
  // seen is `Log`, above.
  //
  // Deleted rather than left registered-but-refused, because a build executes one
  // grammar. A spec still carrying one of these names is refused by the registry
  // at validation, which is a diagnostic naming the file, rather than by a
  // descriptor that exists and dispatches to nothing.
  //
  // The names are not reserved, because these were nested messages rather than
  // fields: nothing addresses them by number, and a future `Task.CEL` would be a
  // new type under a reused name in a schema no worker replays a retired task
  // from. What is reserved is the meaning of a *number*, which is why the fields
  // inside them are gone with them.
  //
  // `flow fix` rewrites all three. See flowfile/fixretire.go, which moves a read
  // value into `vars:` and refuses where the choice is the author's.

  // HTTP is a task that performs an HTTP request to a specified URL with optional method, headers, and body.
  // It returns the HTTP response status code, headers, and body as outputs.
  //
  // This is obviously useful, but also dangerous since it's just SSRF (Server-Side Request Forgery) in disguise.
  message HTTP {
    message Inputs {
      // Url is where the request goes, written as an absolute URI.
      //
      // Absolute because there is nothing for a relative one to be relative to:
      // a workflow runs on a worker, not in a browser holding the page it came
      // from. The scheme and host are also what a deployment's egress policy is
      // written against, so a request that does not name them is a request
      // nobody can decide about.
      string url = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uri = true,
        (google.api.field_behavior) = REQUIRED
      ];

      // Method is the HTTP method, and is GET where a step does not write one.
      //
      // GET, POST, PUT, PATCH or DELETE, in any case. The set is closed rather
      // than free text because retry behaviour hangs off it: a request whose
      // outcome is unknown is retried by what its method promises (see
      // `retry_on_unknown_outcome`), so a method nothing knows the idempotency
      // of is a request nothing can safely repeat.
      optional string method = 2 [(buf.validate.field).string = {
        min_len: 3
        max_len: 6
        pattern: '^(?i)(GET|POST|PUT|PATCH|DELETE)$'
      }];
      // Request headers.
      //
      // Strings, because a header is text on the wire, and a secret reference is
      // not a string, so a `headers:` mapping carrying one never reaches this
      // field at all. It arrives as a [Value.Structure] among the task's inputs
      // and is applied entry by entry, each reference resolved as its header is
      // set. Both paths end on the same [http.Header]; only one of them can hold
      // a reference, and it holds it as a reference right up to the last moment.
      //
      // Resolving into this field instead would be the mistake worth naming: a
      // proto struct field is exactly what `fmt` reflects into, so a header
      // resolved here would print under `%+v` of the inputs, of the task, and of
      // anything holding either.
      map<string, string> headers = 3;

      // A raw request body, sent as written.
      //
      // A string, and so unable to carry a secret reference: there is nothing
      // between the field and the wire that could resolve one. A body that needs
      // a credential in it is a `json` or a `form` body, both of which the task
      // encodes itself and can therefore resolve into.
      optional string body = 4;

      // Bearer is the credential for an Authorization header, and it is the
      // first task input built to take a secret reference.
      //
      // A `Value` rather than a string, deliberately: a field declared as Value
      // receives the author's value whole (reference included) where a string
      // field can only hold what the workflow already evaluated, and evaluating
      // a secret is what would put it in history.
      //
      // A reference can also sit inside `headers` now, as one entry of a
      // [Value.Structure], which is what makes `Authorization` writable by hand.
      // This field stays, and stays the recommended spelling: it says what the
      // credential *is*, so the worker renders the header and an author cannot
      // get the scheme wrong, and it leaves the rest of `headers` free to hold
      // expressions, which a structure carrying a reference deliberately cannot.
      //
      // The worker resolves it inside the activity and sends
      // `Authorization: Bearer <value>`. The name says the scheme so the field
      // cannot quietly become a junk drawer: a future credential shape gets its
      // own field, named for what it is.
      Value bearer = 12;

      // Credential names an outbound federation target configured by the
      // deployment, such as "aws-prod" or "partner-api". The worker authorizes
      // the exact workload and step, mints a short-lived assertion, exchanges it,
      // and applies the resulting bearer credential inside the activity. No
      // credential material crosses workflow history.
      //
      // AWS session targets are deliberately refused by the generic HTTP task:
      // they require SigV4 request signing and belong in an AWS-aware task.
      optional string credential = 13 [(buf.validate.field).string = {
        min_len: 1
        max_len: 128
        pattern: "^[a-z][a-z0-9-]*$"
      }];
      // Optional outputs shaping: when provided, the HTTP task will return only
      // the named outputs defined by this map instead of the default outputs.
      // Values are evaluated as CEL expressions (or used as literals) with the
      // following variables available:
      //   - status_code (int)
      //   - body (string)
      //   - headers (map<string,string>)
      //   - json (the parsed body, when `parse_json` asked for it)
      // This enables payload minimization by selecting just the fields needed.
      map<string, Value> outputs = 5;

      // Query parameters, escaped and appended to the URL.
      //
      // Building a query string by hand is where escaping bugs live, and they are
      // the kind that work until a value contains an ampersand.
      //
      // A secret reference here is refused rather than resolved, and it is the one
      // input of this task where that is a decision about the *destination* rather
      // than about the mechanism: query strings are written to access logs, kept in
      // browser history, and forwarded in Referer headers by anything that follows
      // a redirect. `form` is the same kind of map, encoded by the same function a
      // few lines away, and accepts one, so the refusal is stated twice on
      // purpose, once in the compiler where an author can see it and once in
      // `valueToQueryString` for a specification that never met the compiler.
      map<string, Value> query = 6;

      // A structured request body, serialized as JSON with a matching Content-Type.
      //
      // The common case, and until now the most laborious: sending an object meant
      // building the JSON by hand in a CEL expression and remembering the header.
      // Mutually exclusive with `body` and `form`: three ways to say what to send
      // is a request whose meaning depends on field order.
      //
      // A field of the body may be a secret reference, at any depth: the task
      // serializes the body itself, inside the activity, so the reference is read
      // as the bytes are written and nowhere earlier.
      Value json = 7;

      // A form body, url-encoded with a matching Content-Type. Mutually exclusive
      // with `body` and `json`.
      //
      // An entry may be a secret reference (an OAuth `client_secret` is the case),
      // and it is resolved as the body is encoded, inside the activity. The
      // difference from `query`, which is the same kind of map encoded by the same
      // function, is entirely the destination: a form body is sent in the request,
      // where a query string is written down by everything it passes.
      map<string, Value> form = 8;

      // Which responses count as success, as a CEL expression over the same
      // variables `outputs` sees.
      //
      // The default is unchanged and needs no expression: 2xx succeeds, 4xx fails
      // permanently, 5xx is retried. This is for the cases that default cannot
      // express: a 404 that means "not there yet, and that is fine", or an API
      // that answers 200 with an error in the body:
      //
      //   expect: ${status_code == 200 || status_code == 404}
      //   expect: ${status_code == 200 && !json.error}
      //
      // One expression rather than a status list plus a predicate, because a list
      // is the expression `status_code in [200, 404]` and two spellings of one idea
      // is two things to keep in agreement.
      Value expect = 9;

      // Parse the response body as JSON into the `json` output.
      //
      // Off by default, and deliberately not inferred from Content-Type: parsing an
      // untrusted body is work an attacker chooses, so it happens when an author
      // asked for it. A body that is not JSON is an error naming the offset, not a
      // silently empty value.
      optional bool parse_json = 10;

      // Retry a non-idempotent request whose outcome is unknown.
      //
      // A POST that reached the server and then failed before answering may have
      // taken effect, so by default it is not retried: doing the operation twice is
      // worse than surfacing a failure that might have resolved on its own. Set
      // this when the endpoint is idempotency-keyed and a retry is therefore safe.
      //
      // It does not affect a request that never connected, which is retried for any
      // method because it cannot have taken effect.
      optional bool retry_on_unknown_outcome = 11;
    }
    message Outputs {
      // StatusCode is the status the response carried.
      //
      // Reported rather than judged here, but not unjudged: a status outside
      // 2xx fails the step by default, and `expect:` is where a workflow widens
      // what it accepts. So a file that means to branch on a 404 says so in
      // `expect:` and reads the number here; without that the step never
      // produces outputs to read.
      int32 status_code = 1 [(buf.validate.field).int32 = {
        gte: 100
        lte: 599
      }];

      // Headers are the response's headers, one value per name, read as
      // `${steps.<id>.headers['Content-Type']}`.
      //
      // A header sent more than once keeps its first value, because this is a
      // mapping of strings and there is no second value to put anywhere. Every
      // value of a repeated header is reachable through the `outputs` input,
      // where the response's headers are exposed as lists.
      map<string, string> headers = 2;
      // Response body, returned by default so a step can be referenced as
      // ${steps.<id>.body}. Large responses are better trimmed with the `outputs`
      // input above, which keeps workflow payloads small.
      string body = 3;

      // The response body parsed as JSON, present when `parse_json` asked for it,
      // so ${steps.<id>.json.items[0].id} works without a second step to parse it.
      //
      // Deliberately a single value rather than a repeated one, and it should stay
      // that way. A streaming response is not a unary response with more elements:
      // it is a different interaction shape with a different execution model, since
      // a long-lived stream cannot live inside one activity at all. When streaming
      // arrives it gets its own field, which costs nothing because adding a field is
      // additive. Widening this one to repeated would break every workflow that
      // reads it, and would make every author write [0] forever to accommodate a
      // shape their request does not have.
      //
      // Carried as a CEL value rather than google.protobuf.Value because that is
      // already how this schema represents a literal, so the conversions an
      // expression needs to read it exist rather than being a third value type to
      // translate between.
      //
      // A JSON number arrives as a double, so `{"id":7}` reads as 7.0 rather than
      // 7. That is what encoding/json produces for an untyped number and what the
      // `json_parse` CEL function already does, and one rule that surprises is
      // better than two that disagree. It matters when comparing: write
      // `${call.json.id == 7}` and CEL will compare numerically, but do not expect
      // `string(call.json.id)` to read as "7".
      google.api.expr.v1alpha1.Value json = 4;
    }
  }

  // Tasks have specific names that identify the type of task being performed,
  // such as "log" or "http". The name is used to determine which task
  // implementation to execute when the workflow is run.
  //
  // # A dot means a plugin, and its absence means the engine
  //
  // A built-in task is one bare word. A plugin's task is two, joined by a dot
  // (`slack.post` is the `post` task of the plugin discovered as
  // `flowstate-plugin-slack`), and the dot is provenance rather than decoration:
  // it tells a reviewer that this line leaves the engine's code and enters code
  // somebody installed, at the step, where that fact is needed. It also makes
  // collision unrepresentable in both directions. A plugin task cannot shadow a
  // built-in because a plugin's tasks all carry a dot and no built-in does; two
  // plugins cannot fight over one name because each one's tasks are prefixed
  // with a name discovery established from the binary, not self-reported.
  //
  // At most one dot, by the pattern below. The first segment is a plugin name
  // (`^[a-z0-9][a-z0-9-]*$`, from the executable's own name) and the second a
  // task name (`^[a-z][a-z0-9_]*$`, from its manifest); the pattern here is the
  // permissive union rather than that concatenation, because this field also
  // spells built-in names with their historical uppercase-and-dash latitude, and
  // the registry enforces the sharper per-segment rules at registration.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+(\\.[A-Za-z0-9-_]+)?$"
    }
  ];

  // Field 2 held a description of the task. Prose about a step belongs to the
  // step (`Node.description`) because a step names its task directly now, so the
  // value under `echo:` is that task's inputs and a `description` written there
  // would be an input of that name. A `for_each` or a `sleep` is as worth
  // explaining as a task is, and only the step can carry that.
  //
  // Reserved rather than reused: a number that meant something else in a spec some
  // worker may still be replaying must never come back with a new meaning.
  reserved 2;
  reserved "description";

  // Inputs are the parameters that the task requires to perform its operation.
  map<string, Value> inputs = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
    }
  ];
}
