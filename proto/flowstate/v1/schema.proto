syntax = "proto3";

package flowstate.v1;

import "google/protobuf/descriptor.proto";

option go_package = "flowstatev1";

// The options a task's own schema may set on its declarations, read by the
// host wherever it renders or checks that schema: `flow tasks`, the editor's
// hover and completion, the MCP catalog, the reference documentation, and
// `flow validate`. A plugin's .proto imports this file and sets them on the
// declarations they describe; nothing about the plugin's build has to be
// repeated on the host's side, because the descriptor the plugin already ships
// carries the option with the declaration it annotates.
//
// This file imports only descriptor.proto so that a plugin's schema can import
// it without pulling the rest of the engine's schema into the descriptor set
// it sends; the engine provides this file itself, so the import travels as a
// name rather than as bytes.

extend google.protobuf.EnumValueOptions {
  // test_only marks an enum value the declaring program compiles into its
  // test builds only, and whose released builds refuse at the point of use.
  //
  // A closed enum is supposed to name exactly the choices a build carries, but
  // a build can carry a value for its own hermetic tests that it will not run
  // for a user: an embedded database an SQL plugin's tests exercise the
  // dialect logic against, which a released binary refuses because opening one
  // grants the worker's filesystem to the workflow. Without this option the
  // catalog would advertise that value on every surface and `flow validate`
  // would accept it, leaving the refusal to dispatch.
  //
  // The host does not advertise a value marked here and does not accept it: it
  // is left out of the choices every surface lists, and a Flowfile naming it
  // is refused where it is written, saying the value is test-only, rather than
  // at dispatch. The declaring program still refuses it at the point of use,
  // as it did before; this option moves the refusal earlier, it does not
  // replace it.
  bool test_only = 50000;
}

// Secret says how a task input accepts a host secret reference: the claim a
// task makes about one input, written on the field it describes rather than in
// a parallel list of field names that can drift from the schema.
//
// Reading it fails closed: an input that sets no claim is no claim, and the
// host refuses a secret reference there.
enum Secret {
  // SECRET_UNSPECIFIED is no claim. The input does not accept a secret
  // reference, and the host refuses one written there.
  SECRET_UNSPECIFIED = 0;

  // SECRET_WHOLE_VALUE says the input accepts a secret reference as its entire
  // value, which the host resolves where the task uses it. The field is a
  // `flowstate.v1.Value`, which holds a reference unresolved, or a string, which
  // a plugin task receives the resolved value in.
  SECRET_WHOLE_VALUE = 1;

  // SECRET_REQUIRED says the input must be supplied as a whole secret
  // reference, never a literal or an expression. It implies
  // SECRET_WHOLE_VALUE and is declared instead of it, not alongside it.
  SECRET_REQUIRED = 2;

  // SECRET_NESTED says a secret reference may sit inside a value the task
  // itself encodes, such as an entry of a list or a map, and is resolved at
  // exactly the moment the task writes that value out. The field is a
  // `flowstate.v1.Value`, or a map whose values are.
  SECRET_NESTED = 3;
}

// InputOptions are the options a task's input message sets on one of its
// fields with the `input` extension.
message InputOptions {
  // Secret is how the input accepts a secret reference. Unset is no claim.
  Secret secret = 1;
}

extend google.protobuf.FieldOptions {
  // input sets the [InputOptions] of a task input field. The host reads it from
  // the descriptor of a task's input message, so the descriptor a plugin
  // already ships carries the claims with the fields they describe.
  InputOptions input = 50001;
}
