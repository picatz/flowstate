syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "flowstatev1";

// AuthenticationAssuranceLevel is the issuer-independent strength of an
// authentication ceremony. Values are ordered from least to most restrictive;
// policy compares the enum value only after an issuer projection has assigned
// it (never directly from an untrusted acr string).
enum AuthenticationAssuranceLevel {
  AUTHENTICATION_ASSURANCE_LEVEL_UNSPECIFIED = 0;
  AUTHENTICATION_ASSURANCE_LEVEL_BASELINE = 1;
  AUTHENTICATION_ASSURANCE_LEVEL_MULTI_FACTOR = 2;
  AUTHENTICATION_ASSURANCE_LEVEL_PHISHING_RESISTANT = 3;
  AUTHENTICATION_ASSURANCE_LEVEL_HARDWARE_BACKED = 4;
}

// AuthenticationMethod is a normalized AMR value. An issuer projection maps
// the issuer's vocabulary onto this closed set.
enum AuthenticationMethod {
  AUTHENTICATION_METHOD_UNSPECIFIED = 0;
  AUTHENTICATION_METHOD_PASSWORD = 1;
  AUTHENTICATION_METHOD_ONE_TIME_PASSWORD = 2;
  AUTHENTICATION_METHOD_BIOMETRIC = 3;
  AUTHENTICATION_METHOD_SECURITY_KEY = 4;
  AUTHENTICATION_METHOD_HARDWARE_KEY = 5;
  AUTHENTICATION_METHOD_MUTUAL_TLS = 6;
  AUTHENTICATION_METHOD_SENDER_CONSTRAINED_CREDENTIAL = 7;
}

// CallerKind distinguishes a human, an autonomous workload, and an agent
// acting on behalf of a human. The last kind has two assurance boundaries.
enum CallerKind {
  CALLER_KIND_UNSPECIFIED = 0;
  CALLER_KIND_HUMAN = 1;
  CALLER_KIND_WORKLOAD = 2;
  CALLER_KIND_AGENT_FOR_HUMAN = 3;
}

message AuthenticationTime {
  google.protobuf.Timestamp value = 1;
}
message MaximumAuthenticationAge {
  google.protobuf.Duration value = 1;
}
message RequiredAcrValues {
  repeated string values = 1;
}
message RequiredAuthenticationContextReferences {
  repeated AuthenticationAssuranceLevel assurance_levels = 1;
  repeated AuthenticationMethod authentication_methods = 2;
}

enum StepUpReasonCode {
  STEP_UP_REASON_CODE_UNSPECIFIED = 0;
  STEP_UP_REASON_CODE_ASSURANCE_LEVEL = 1;
  STEP_UP_REASON_CODE_AUTHENTICATION_METHOD = 2;
  STEP_UP_REASON_CODE_AUTHENTICATION_TOO_OLD = 3;
  STEP_UP_REASON_CODE_AGENT_ASSURANCE = 4;
  STEP_UP_REASON_CODE_HUMAN_ASSURANCE = 5;
  STEP_UP_REASON_CODE_INTERACTION_UNAVAILABLE = 6;
}

message StepUpTransactionReference {
  string value = 1;
}

message CallerAuthenticationContext {
  CallerKind caller_kind = 1;
  bool user_interaction_possible = 2;
  AuthenticationAssuranceLevel assurance_level = 3;
  repeated AuthenticationMethod authentication_methods = 4;
  AuthenticationTime authentication_time = 5;
  string acr = 6;
}

// RunState is the durable workflow state used by the Temporal Run entrypoint.
// It allows the workflow to continue-as-new while carrying only the minimal
// required subset of previously produced outputs for the remaining steps.
// WorkloadIdentity describes who a run acts as.
//
// A running workload has two identities at once, and both matter. It is a
// specific workload (this workflow, this run, this step) and it is acting on
// behalf of whoever asked for the work. Downstream systems need both to make an
// authorization decision: "the nightly-reconcile workflow" and "started by the
// deploy pipeline" answer different questions, and a system granting access
// usually cares about the pair.
//
// This is carried through the run so that every step knows what it is acting as,
// and so an assertion presented to an external system states something true
// rather than something assumed. It holds identity, never credentials: it is
// persisted in workflow history, which is durable and broadly readable, so
// nothing secret may appear here.
message WorkloadIdentity {
  // Subject identifies the caller that requested the run, as established by
  // authenticating their request. Empty when the run was started without
  // authentication, which is only possible in development.
  string subject = 1;

  // Issuer is the identity provider that vouched for the subject.
  string issuer = 2;

  // Claims carries additional non-secret claims from the caller's token that
  // authorization decisions may key on, such as a repository, environment, or
  // team. Only claims an operator has configured as relevant are copied here,
  // so this does not become a dumping ground for whole tokens.
  //
  // The bounds say the same thing the sentence above says, in a form the
  // machine enforces. They are the schema half of `auth.MaxCarriedClaims` and
  // its neighbours, which refuse the same sizes at mint: a claim set is a wire
  // format that gets signed and cached by relying parties, so an oversized one
  // has to be refused rather than truncated — a truncated claim set is a token
  // that says something other than what was authorized.
  //
  // 32 pairs is ten times the largest set anything in this repository carries
  // and twice `SignalPolicyRule.claims`'s bound; the key length is that rule's
  // own 128, since both name claims out of the same tokens. Values get 1024
  // rather than that rule's 256 because a carried value is data and not a
  // match pattern — the longest real one measured here is a 63-byte GitHub
  // Actions `job_workflow_ref`.
  //
  // `max_bytes` and not `max_len`, deliberately, and this is the whole reason
  // the unit is named in these field names. protovalidate's `max_len` is
  // `this.size()`, which counts Unicode *code points*; `max_bytes` is
  // `bytes(this).size()`, which is what Go's `len` on a string counts and what
  // `auth.validateCarriedClaims` therefore enforces. Under `max_len` a value of
  // 700 two-byte runes passes the schema at 700 and is refused at the mint at
  // 1400 bytes — one limit written down twice in two units, so the schema and
  // the mint disagree about which identities are valid, and the identity that
  // falls in the gap validates and then cannot obtain a credential. Same
  // number, same unit, both layers.
  map<string, string> claims = 3 [(buf.validate.field).map = {
    max_pairs: 32
    keys: {
      string: {
        min_bytes: 1
        max_bytes: 128
      }
    }
    values: {
      string: {max_bytes: 1024}
    }
  }];

  // Namespace is the tenant, and it is the boundary every authorization decision
  // about a run turns on: the caller's namespace is compared against the one
  // recorded on the run, and a mismatch is answered "no such run".
  //
  // Worth stating outright, because this field used to be described alongside
  // `deployment` as identifying "which Flowstate installation is running the
  // workload". That is what `deployment` is for. Reading the two as a pair
  // suggests both are labels for telling environments apart, and one of them
  // decides who may act on what.
  string namespace = 4;

  // Deployment identifies which Flowstate installation is running the workload,
  // so an assertion from a staging deployment is distinguishable from a
  // production one.
  //
  // Not the tenant, and not what run access turns on: that is `namespace`
  // above. But not decorative either: an outbound authorization policy sees it as
  // `workload.deployment` and may key on it, which is how a rule like
  // `target == "internal" && workload.deployment == "prod"` keeps a staging
  // installation from assuming a production role.
  //
  // So the two are load-bearing for different decisions. `namespace` decides who
  // may act on a run; `deployment` is one of the attributes a policy may use to
  // decide what a run may reach.
  string deployment = 5;
}
