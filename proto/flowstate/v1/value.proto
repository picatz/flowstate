syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "google/api/expr/v1alpha1/syntax.proto";
import "google/api/expr/v1alpha1/value.proto";
import "google/api/field_behavior.proto";

option go_package = "flowstatev1";

// SecretRef names a secret without containing it.
//
// A workflow specification is persisted, replayed, and readable by anyone who can
// read workflow history, so it must never carry a credential. It carries this
// instead: enough to find the value at the moment it is needed, and nothing more.
//
// The scheme and name are separate fields rather than one joined string so that
// the schema itself rejects a malformed reference at the boundary, before any
// worker tries to resolve it.
//
// This message must never gain a field holding a value. Adding one would make
// every workflow that used it leak a credential into history, and the mistake
// would be invisible until someone read the history.
message SecretRef {
  // Scheme selects the provider that resolves the reference, such as "env",
  // "file", "vault", or "keychain".
  //
  // A scheme is how a secrets backend plugs in: a deployment registers providers
  // for the schemes it permits, and a reference to an unregistered scheme is
  // refused rather than guessed at. A deployment that permits no secrets at all
  // registers none, and every reference fails.
  string scheme = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
      pattern: "^[a-z0-9-]+$"
    }
  ];

  // Name locates the secret within that provider: an environment variable
  // suffix, a path under a mounted directory, a vault path. Its meaning belongs
  // to the provider, including how it expresses versions.
  //
  // The pattern here cannot express everything that matters: control characters
  // are also rejected, in code, because a reference reaching a log or history
  // must not be able to forge lines in it.
  string name = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
}

// CredentialRef names a federated credential without containing it.
//
// It is [SecretRef]'s sibling for a credential Flowstate mints rather than
// stores: the target is the name of an outbound federation target in the
// deployment's trust policy (`federation.targets[].name`), and the worker
// running the task exchanges its own workload identity for a short-lived
// credential at the moment the task needs it. The specification therefore
// carries a name and nothing else, for the same reason a SecretRef carries
// no value: workflow history is durable and broadly readable.
//
// It is a separate message rather than a SecretRef with a credential scheme
// because the two are decided by different policies: a secret is authorized by
// the secret access rules, a credential by the federation assumption rules, and
// one spelling for both would let a rule for one silently govern the other.
//
// This message must never gain a field holding a minted credential.
message CredentialRef {
  // Target is the federation target's name, as the trust policy spells it.
  //
  // Whether a target is configured is a fact about the deployment, not the
  // Flowfile, so the schema constrains only its length, and code rejects a
  // control character, which could forge lines in a log that records the
  // name. The server refuses an unknown target at validate and submit time
  // rather than at run time.
  string target = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];
}

// Value is one value in a workflow: a task input, a step output, a variable or
// a run argument.
//
// Exactly one kind is set. A `literal` is a concrete CEL value; an `expr` is a
// parsed CEL expression evaluated when the value is needed; a `secret_ref`
// names a secret resolved only by the worker that uses it; a `credential_ref`
// names a federation target whose credential only that worker mints; a `structure` is a
// list or map of Values, the only shape that can hold a secret reference below
// the top level; and an `error` records a value that could not be produced.
// Values a caller submits, such as `RunRequest.inputs`, must be literals.
message Value {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_STRING = 1;
    TYPE_INT = 2;
    TYPE_FLOAT = 3;
    TYPE_BOOL = 4;
    TYPE_STRUCT = 5;
    TYPE_LIST = 6;
    TYPE_EXPR = 7;
    TYPE_ERROR = 8;
  }

  // Error is why a value could not be produced.
  message Error {
    // Code classifies the error.
    enum Code {
      CODE_UNSPECIFIED = 0;
      CODE_INVALID_ARGUMENT = 1;
      CODE_NOT_FOUND = 2;
      CODE_PERMISSION_DENIED = 3;
      CODE_UNAUTHENTICATED = 4;
      CODE_INTERNAL = 5;
      CODE_UNAVAILABLE = 6;
    }
    // Message describes the error for a person. Required.
    string message = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED
    ];

    // Code classifies the error. Required, and never CODE_UNSPECIFIED.
    Code code = 2 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }
    ];
  }

  // Structure is a list or a mapping whose entries are Values in their own
  // right, rather than one value some expression produces.
  //
  // It exists for exactly one reason: so a secret reference can sit inside a
  // header map, a form or a JSON body. A structure containing an expression
  // compiles into a single CEL expression, and the *workflow* evaluates that,
  // which is what evaluating a reference must never mean, because everything
  // workflow code produces is written to durable, broadly readable history.
  // Keeping every entry a Value keeps the reference a reference for the whole
  // path, and the worker resolves it at the moment it applies the header or
  // encodes the body.
  //
  // Its entries are literals and references, never expressions. That is a
  // deliberate restriction rather than an omission: the walkers that decide
  // which step outputs a resumed run has to carry look for a whole-value
  // expression and cannot see one nested in here, and an output they miss is
  // pruned from a run that then fails after Continue-As-New. The compiler
  // refuses the mixture and says so, which is the fail-closed half of the same
  // fact.
  message Structure {
    // List is a sequence, in the order it was written.
    message List {
      repeated Value values = 1;
    }

    // Map is a mapping. Entry order is not carried, because nothing that
    // consumes one depends on it: headers are a set, a form and a query are
    // encoded in sorted key order, and a JSON object is unordered by
    // definition.
    message Map {
      map<string, Value> entries = 1;
    }

    oneof kind {
      option (buf.validate.oneof).required = true;
      List list = 1;
      Map map = 2;
    }
  }

  oneof kind {
    option (buf.validate.oneof).required = true;

    // Expr is a CEL expression, parsed when the Flowfile was compiled and
    // evaluated when the value is needed, against the scope at that point.
    google.api.expr.v1alpha1.ParsedExpr expr = 1;

    // Literal is a concrete value in CEL's value representation: a string,
    // number, bool, bytes, null, list or map.
    google.api.expr.v1alpha1.Value literal = 2;

    // Error records a value that could not be produced, with a message and a
    // code saying why.
    Error error = 3;

    // A reference to a secret, resolved only where the value is needed.
    //
    // This kind is inert everywhere except the activity that uses it. The
    // compiler produces it, the control plane transports it, and workflow-side
    // evaluation passes it through untouched: it is never resolved into a value
    // and never copied into step outputs, because workflow history is durable and
    // broadly readable. Only the worker executing the task resolves it, and the
    // value exists solely for that call.
    SecretRef secret_ref = 4;

    // A list or a mapping whose entries are values, which is the only shape
    // that can hold a [SecretRef] somewhere other than at the top.
    Structure structure = 5;

    // A reference to a federated credential, minted only where the value is
    // needed.
    //
    // Inert in exactly the way [secret_ref] is, and held to the same
    // containment: the compiler produces it, the control plane transports it,
    // workflow-side evaluation refuses to read it, and only the worker
    // executing the task exchanges for the credential. It is the whole value of
    // a task input and is never nested in a [Structure].
    CredentialRef credential_ref = 6;
  }
}

// ExpressionFailure is what a failed expression knew about itself, as fields a
// program can read without parsing the failure's words. It accompanies a failure
// of kind `Expression` whose cause was an operation with no overload for its
// operands, or a selection of a key that is not there; any other expression
// failure carries none.
//
// It quotes the failing expression's own source text (`subexpression`,
// `selected`), which is the author's and can hold literals, so it is treated
// exactly like the failure's message: a response whose message is redacted or
// withheld for a declared sensitive value carries no `expression` at all. Only
// `candidates` is restricted to the author's declared step and output names, and
// no field carries a runtime value, only type names.
message ExpressionFailure {
  // Operator is the operator or function that failed, such as `+` or
  // `size`. Empty when the failure was a selection.
  string operator = 1 [(buf.validate.field).string.max_bytes = 256];

  // OperandTypes names the type of each operand the operator saw, in order,
  // such as `int` and `string`. A `?` stands for an operand that could not be
  // evaluated again to find out.
  repeated string operand_types = 2 [(buf.validate.field).repeated.max_items = 16];

  // Subexpression is the failing part of the expression, as source text cut to
  // a bounded length.
  string subexpression = 3 [(buf.validate.field).string.max_bytes = 512];

  // Selected is the key a failed selection asked for. Empty for an operator.
  string selected = 4 [(buf.validate.field).string.max_bytes = 256];

  // Candidates are the names that do exist where `selected` was asked for, when
  // that is a step or a step's output: the author's own names, bounded and
  // sorted. Empty when there is nothing to offer.
  repeated string candidates = 5 [(buf.validate.field).repeated.max_items = 16];

  // Offset is where the failing operation sits in the expression's own text, as
  // a character offset from its start, so a consumer can point at it when
  // `subexpression` repeats elsewhere in the expression. Unset when the
  // expression carries no position for the node.
  optional int32 offset = 6 [(buf.validate.field).int32.gte = 0];

  // Caret is the character index within `subexpression` of the operator or the
  // selected name, so `subexpression` with a `^` under that column shows the
  // failure the way a compiler does. Unset when the subexpression was cut or its
  // text does not place the operator exactly, because a caret under the wrong
  // character is worse than none.
  optional int32 caret = 7 [(buf.validate.field).int32.gte = 0];
}
