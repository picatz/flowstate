syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "google/api/expr/v1alpha1/syntax.proto";
import "google/api/expr/v1alpha1/value.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "flowstatev1";

// Workflows in Flowstate is a collection of steps that can be executed in a
// specific order. Each step within a workflow can have inputs and outputs,
// and can be a task that performs some action. The workflow can be run and the
// outputs of each step are collected in a structured way that allows for subsequent
// steps to access the outputs of previous steps.
message Workflow {
  // StepOutputs is a map of step IDs to their outputs. Each step's outputs are
  // represented as a map of named values, allowing for structured outputs that
  // can be referenced by subsequent steps in the workflow.
  //
  // This is used to collect the outputs of each step in the workflow, which can
  // then be used as inputs to other steps or returned as the final result of the
  // workflow run.
  message StepOutputs {
    map<string, Node.Outputs> step_values = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).map = {
        keys: {string: {min_len: 1}}
      }
    ];

    // RunOutputs are the values [Workflow.declared_outputs] promised, once this
    // run has computed them. Unset for a workflow that declares none, and unset
    // for a run that has not finished.
    //
    // # Why the answer travels beside the transcript
    //
    // This message *is* what a finished run hands back — the local driver returns
    // it and the durable workflow completes with it — so it is the one value both
    // drivers already carry out of a run. A field here is therefore how the answer
    // reaches a caller without either driver changing shape, which is what keeps
    // `flow run local` and a durable run reporting one thing (invariant 3).
    //
    // The alternative was a new result message wrapping both. That is a *different
    // type* on the workflow's completion payload, and a run that completed before
    // the change is read back by decoding its stored payload into whatever type the
    // reader names — so an old result would be decoded as a new message and mean
    // something else, or fail. Adding a field is free and reads back as absent
    // (invariant 10); replacing the type is not, and this is a payload nobody can
    // rewrite after the fact.
    //
    // It stays a distinct message rather than more entries in `step_values` for the
    // reason [RunOutputs] gives: the transcript is keyed by the step that produced
    // each value, and these are the few values the *workflow* said it would report.
    // A reader never has to ask which of the two it is holding, because they are
    // different fields of different types.
    //
    // Meaningless on the copies of this message that are not a run's result — a
    // scope's visible outputs, one loop iteration's results, the outputs carried
    // across a Continue-As-New — where it is simply never set. The run's own end is
    // the only place anything writes it.
    RunOutputs run_outputs = 2;
  }

  // Workflow is identified by a unique name.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$" // Alphanumeric, dashes, and underscores.
    }
  ];

  // Workflows can have an optional description that provides additional context or
  // information about the workflow itself that may be useful for users or developers.
  optional string description = 2 [(buf.validate.field).string = {max_len: 256}];

  // Steps are the individual tasks or operations that make up the workflow.
  // Each step is represented by a Node, which can be a task or another type of
  // operation. The steps are executed in the order they are defined in the workflow.
  // Each step can have its own inputs and outputs, allowing for complex workflows
  // that can perform a variety of operations.
  repeated Node steps = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];

  // Field 4 was `map<string, Value> inputs`, meant as initial data for a workflow.
  //
  // Nothing ever wrote it and nothing ever read it. No Flowfile key compiled to it,
  // no RPC carried a value for it, and no evaluation bound a name from it — the
  // parser answers `inputs:` at this level with "unknown key", listing the keys that
  // do exist. It was a shape held open for a feature, and the feature it is now
  // wanted for is not this one: Phase 2's parameters are typed and declared, not a
  // bare map, and they belong in a message that can say so.
  //
  // Reserved by *name* as well as by number, which is the part that matters here.
  // There is no custom data converter, so Temporal's default composite converter
  // reaches ProtoJSON before Proto and every specification in a workflow's history
  // is stored with field *names*. A future `inputs` of a different shape would
  // therefore be read out of an old history by name and silently mean something
  // else — which the number alone does not prevent.
  //
  // The same fact has a cost, and it is worth stating once here because it applies
  // to every deletion in this file rather than to this one. Temporal's ProtoJSON
  // converter is built with `protojson.UnmarshalOptions{}` — `DiscardUnknown` is
  // false — so a history whose stored specification carries a deleted field does
  // not decode at all:
  //
  //   unable to decode: proto: (line 1:68): unknown field "inputs"
  //
  // Measured, not assumed. A run in flight when the field goes away therefore fails
  // rather than ignoring it, and the failure is at the worker rather than at
  // submission.
  //
  // Accepted here on the same terms as the two deletions already in this file —
  // `Task.description` below, and the three retired tasks. Nothing in this
  // repository ever set `inputs`, no release has ever been tagged, and a schema
  // change that a run cannot survive is what an *edition* boundary is for. What
  // would not be acceptable is doing it quietly: a deletion that costs an in-flight
  // run has to be a decision somebody made, which is why it is written down.
  reserved 4;
  reserved "inputs";

  // Labels are key-value pairs that can be used to organize and categorize workflows.
  map<string, string> labels = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
    }
  ];

  // Profile names the vocabulary every expression in this workflow was compiled
  // against — which CEL extension libraries are in scope.
  //
  // Set by the compiler, not written by an author. There is deliberately no
  // `profile:` key: an author choosing a vocabulary per file is how a file came to
  // have two of them, which is what one profile removes.
  //
  // Recorded rather than resolved at execution because a run has to keep meaning
  // what it meant. A future build that adds a library must not change how an
  // expression already stored in `RunState` evaluates — invariant 10 — and
  // "whatever this worker has" is a set that changes underfoot. A profile name has
  // frozen membership, so a worker resolves the name rather than asking what it
  // ships with, and refuses a name it does not know.
  //
  // A different axis from `edition:`, and the distinction is load-bearing. An
  // edition is a property of a *file*: read when it compiles, gone afterwards, and
  // retiring one affects nothing already executing. A profile is a property of a
  // *run*, and travels.
  //
  // Empty means a spec compiled before this field existed, which resolves to the
  // first profile — a compatibility arm rather than a guess, since nothing has been
  // released and such a spec can only have come from a build whose one vocabulary
  // was that profile's.
  string profile = 6 [(google.api.field_behavior) = OPTIONAL];

  // Vars are named expressions evaluated once at the start of the run, visible to
  // every step as `vars.<name>`.
  //
  // They exist because the alternative is repetition: a value derived once and used
  // in six places is written six times today, and the six copies drift. A `cel` step
  // can compute one, but then it is a step — it occupies the step budget, appears in
  // the run's outputs, and has to be ordered before everything that reads it.
  //
  // # Rooted, not bare
  //
  // `vars.<name>` rather than `<name>`, which is the same decision `steps.<id>` made
  // and for the same reason: rooting makes a collision between a var and a step id
  // *unrepresentable* rather than something a validation rule has to forbid. What
  // stays bare is only what is bound where the expression is written — a `for_each`
  // iterator, `now` inside `wait_until:`, the names a task resolves against its own
  // scope. Those are bare bindings; see [Scope.vars].
  //
  // # Two sites, and only this one is rooted
  //
  // `vars:` is also accepted on a step, where it means something deliberately
  // different: a step's vars are *bare* within that step (`${modified}`), because
  // they are author-chosen and lexically local — the same standing as a loop
  // binding. Only the workflow-level ones are ambient, so only these are rooted.
  // See [Scope.vars] for where a step's land.
  //
  // # Shadowing is refused, not resolved
  //
  // A bare name must be unique against every bare name in scope: a step var may not
  // collide with an enclosing loop binding, a loop binding may not collide with an
  // enclosing step var, and neither may be `now`. `flow validate` reports the
  // collision at the inner declaration. Silent shadowing is how `${body}` comes to
  // mean two things eleven lines apart.
  //
  // Nothing needs to be refused *here*, at the workflow level, because these are
  // rooted: `vars.region` cannot collide with anything, which is the whole reason
  // the ambient half of the namespace is rooted at all.
  map<string, Value> vars = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
      max_pairs: 64
    }
  ];

  // DeclaredInputs are the parameters a run may be started with, each declared
  // with a name and a type.
  //
  // A workflow that cannot be parameterized has to be *edited* to be reused: the
  // same file with one URL changed becomes a second file, and the second one
  // drifts from the first. These are what let one file serve both runs, which is
  // also what makes a workflow something an agent or a schedule can invoke rather
  // than something a person forks.
  //
  // # Declarations, not a map
  //
  // Field 4 was `map<string, Value> inputs` and is reserved above, which is most
  // of the argument already: a bare map is a shape held open, and every consumer
  // of it has to invent the same missing half for itself. The consumers that want
  // this want *different* halves — the language server type-checks an expression
  // against the environment a run will actually have, `flow run --input k=v` has
  // to turn a command line's strings into typed values, a schedule binds its
  // arguments once and statically, and a Nexus operation has a signature — and
  // not one of them can be built over a map whose values are whatever arrived.
  // Declaring the shape once, here, is what lets all four read the same answer
  // instead of drifting apart holding four guesses.
  //
  // # Named for what it holds
  //
  // Not `inputs`. That name is reserved above by *name* as well as by number, for
  // a reason that has not expired: there is no custom data converter, so a
  // specification is stored in history through ProtoJSON, by field name, and an
  // `inputs` of a new shape would be read out of an old history as the old one.
  //
  // The name is honest anyway, because these are not the values. What a caller
  // passes is [RunRequest.inputs]; what the specification carries is the
  // declaration of what may be passed. A run carries both, they are different
  // things, and they are wanted at different moments — the declaration when the
  // file is written and type-checked, the values when a run is submitted.
  //
  // # Size (invariant 9)
  //
  // These ride in the specification, so `CheckSpecSize` weighs them at submit and
  // `CheckRunStateSize` weighs them again through [RunState.workflow] at every
  // Continue-As-New. Both call `proto.Size` on the whole message rather than
  // summing the fields they know about, so a field added here is bounded on the
  // day it is added and nobody has to remember to count it.
  repeated InputDeclaration declared_inputs = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated = {max_items: 64}
  ];

  // DeclaredOutputs are the values a finished run reports: named expressions,
  // evaluated once the steps are done.
  //
  // Nothing carries a value out of a run today. `vars:` names a value inside the
  // file, and the retirement edition took away `cel:`, which was the one step
  // whose purpose was to shape a final answer — so a run's result is now the
  // union of whatever its steps happened to produce. That is a transcript, not a
  // result: whoever reads the run has to already know which step's which output
  // was the point, which is exactly the knowledge a caller on the other side of
  // an RPC does not have.
  //
  // # Why the computed values are a different message
  //
  // These are declarations and travel with the specification; what a particular
  // run computed is [RunOutputs] and belongs to that run. Widening one message to
  // carry both would make every reader check which half it was holding, and would
  // put an expression and its result in the same field — the shape that makes it
  // possible to confuse "what this workflow promises" with "what this run
  // returned". Two messages also keep the addition additive on both sides: a
  // field added to either is free, where widening either would be breaking.
  //
  // The expression is evaluated by the run, at the end, in the run's own scope —
  // it is not a value a caller supplies, which is the mirror image of the rule on
  // [RunRequest.inputs] and worth reading beside it. Which names that scope holds
  // (`steps`, `vars`, `inputs`) is the compiler's business, not the schema's.
  repeated OutputDeclaration declared_outputs = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated = {max_items: 64}
  ];

  // Triggers are the ways this workload is *meant* to start other than somebody
  // asking for it, declared by the file and acted on by nobody until a person
  // says so.
  //
  // # Why a declaration lives in the specification at all
  //
  // A schedule is arguably a property of a deployment rather than of a file: two
  // environments running the same workflow will want different cadences, and the
  // artifact that records "this exists and fires at 09:00" is a Temporal
  // Schedule, which lives in a cluster and not in a repository. All of that is
  // true, and none of it makes the *intent* a deployment's. "This report is a
  // daily report" is a fact about the workload, written by whoever wrote the
  // steps, and reviewed with them.
  //
  // So the file declares and the operator creates, and the two are different
  // acts. Nothing here starts anything: `Run` ignores this field entirely, and
  // `flow run` does not create a schedule, because a file that begins running on
  // its own the moment it merges is a surprise — and a surprise with a cost, since
  // the first firing is indistinguishable from somebody having deliberately
  // started it. Creating one is `CreateSchedule`, where a human is present to be
  // refused.
  //
  // # Why it travels with the workflow rather than sitting in the request
  //
  // The alternative was a schedule spec on [CreateScheduleRequest] alone, keeping
  // the specification free of anything that does not execute. It was rejected for
  // costing more than it saves: the Flowfile compiles to this message and nothing
  // else, so a `triggers:` block with no field would either be dropped on the
  // floor — the shape `flow fix`'s history says never to build — or would need a
  // second compilation output that only one command reads, and `flow compile`
  // would then answer with less than the file says.
  //
  // Carried into a run's history as part of the specification, which costs a few
  // bytes per run and is weighed by the same `CheckSpecSize` as everything else
  // (invariant 9). That is the price of one compiled artifact, and it is small.
  Triggers triggers = 10 [(google.api.field_behavior) = OPTIONAL];

  // Signals declares, per signal name, who may deliver it — see
  // [SignalPolicy]. Absent for a name means today's behavior: any
  // authenticated caller who can address the run in its tenant may deliver
  // that signal, exactly as before this field existed. Authorization is
  // therefore opt-in per signal name, deliberately: failing closed on every
  // existing workflow the day this field appears would turn every signal
  // user's next `flow signal` into a denial for a policy nobody wrote.
  //
  // # Enforced where the signal is accepted, not where it is read
  //
  // A workflow can already gate its own logic on `steps.<wait>.sender`, and
  // that is real — but it is a check the workflow performs, so it is a check
  // the workflow's own author can skip: delete the `if:`, and the gate is
  // gone. This field is read by `FlowstateServer.Signal`, before Temporal
  // ever sees the signal, against the caller's authenticated identity — a
  // rejected sender never reaches the workflow at all, and gets
  // `PermissionDenied` synchronously rather than a signal that was silently
  // dropped or a wait that quietly never resolves. See lifecycle.go's
  // `Signal` handler.
  //
  // # Frozen at submit, like the rest of the specification
  //
  // The whole specification is frozen once a run starts (invariant 10) so
  // that a run means the same thing on its last segment as its first; this
  // field is no exception; it is extracted into the run's tenancy memo
  // alongside the namespace at submit and never re-read from the
  // specification afterward, which is also what makes it cheap to enforce —
  // the same `DescribeWorkflowExecution` that already establishes tenancy
  // for every verb in lifecycle.go answers this too, at no extra Temporal
  // round trip.
  //
  // # Per name, not per wait
  //
  // A signal may legitimately arrive before the wait that will consume it is
  // reached — that is what `PendingSignal` carry exists for — so the server
  // knows the signal's *name* when it must decide, never which wait (if any)
  // is currently parked on it. The policy is keyed by name for exactly that
  // reason: it is the only unit the accepting boundary can actually ask
  // about. A `wait_for_signal:`-local spelling would only be a projection of
  // this map back onto one call site, and two waits on the same name with
  // different local policies would be an ambiguity the compiler would have
  // to refuse — better not to have the ambiguity at all.
  //
  // # Bounded (invariant: bound anything that consumes untrusted input)
  //
  // A hand-built specification can reach `Run` directly, so this is
  // untrusted input like the rest of the spec: at most 64 signal names, each
  // with at most 32 alternative rules ([SignalPolicy.allow]), each rule with
  // at most 16 claim entries. `CheckSpecSize`/`CheckRunStateSize` also weigh
  // the whole message via `proto.Size`, so this is bounded twice over — by
  // shape here, and by total bytes there.
  map<string, SignalPolicy> signals = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {
        string: {
          min_len: 1
          max_len: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
        }
      }
      max_pairs: 64
    }
  ];

  // PluginRequirements are the minimum compatible plugin versions written in
  // the Flowfile. ResolvedPlugins is the immutable selection made by the
  // control plane before a durable run is accepted.
  repeated PluginRequirement plugin_requirements = 12 [(buf.validate.field).repeated = {max_items: 64}];
  repeated ResolvedPlugin resolved_plugins = 13 [(buf.validate.field).repeated = {max_items: 64}];
}

// PluginRequirement is what a Flowfile's plugins: block declares: a plugin
// this workflow needs, by name, at or above a minimum version with the same
// major. It is the author's half of the pinning contract; submission resolves
// each requirement against the deployment's catalog into a [ResolvedPlugin],
// and a requirement no installed plugin satisfies refuses the run before
// anything durable is created.
message PluginRequirement {
  string name = 1 [(buf.validate.field).string = {pattern: "^[a-z][a-z0-9_-]*$"}];
  string minimum_version = 2 [(buf.validate.field).string = {pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"}];
}

// ResolvedPlugin is part of the replay contract, not merely inventory. All
// fields identify the behavior selected for this run and must match a worker
// before it executes plugin work.
message ResolvedPlugin {
  string name = 1;
  string version = 2;
  uint32 protocol_version = 3;
  string task_schema_digest = 4;
  string distribution_digest = 5;
}

// SignalPolicy constrains who may deliver one named signal to a run.
//
// A sender is authorized if it satisfies *any* rule in [allow] — the rules
// are alternatives, not requirements every one of them must meet. See
// [SignalPolicyRule] for what one rule may require.
message SignalPolicy {
  // Allow lists the alternative rules that may authorize a sender. At least
  // one, or the policy authorizes nobody, which is indistinguishable from a
  // typo and is refused by the compiler rather than accepted as (probably
  // unintended) lockout.
  repeated SignalPolicyRule allow = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 32
    }
  ];

  // DistinctFromStarter requires, in addition to whichever rule in [allow]
  // an otherwise-authorized sender satisfies, that the sender not be this
  // run's own starter — the same issuer and the same subject as the
  // identity that submitted the run, compared the way [SignalPolicyRule.subject]
  // already is (see `QualifiedSubject`). Set at the policy level, not on a
  // rule, so it cannot be bypassed by adding a wide-open rule to `allow:`:
  // separation of duties is ANDed onto every rule this policy has, present
  // or future, rather than expressed as one more alternative a caller could
  // satisfy around it.
  //
  // Enforced against the `flowstate.starter` value recorded on the run's
  // memo at submit. A run whose memo predates that key — started before
  // this field existed — has nothing to compare against, and is refused
  // whenever this flag demands the comparison: a run that cannot prove
  // separation does not get it, the same fail-closed rule
  // [SignalPolicyAllows]'s own doc comment states for every other case once
  // a policy exists.
  bool distinct_from_starter = 2;
}

// SignalPolicyRule is one admissible sender, checked against the
// [SignalSender] the server itself attested — never against anything the
// signal's payload claims.
//
// Every field set on a rule must match (an AND); a rule with nothing set
// matches every sender, which defeats the point of writing one, so the
// compiler refuses it. Combine subject *and* claims in one rule to express
// "this identity, and it must also carry this claim" — that is one list
// entry, not two policies an author has to keep in sync by hand.
message SignalPolicyRule {
  // Subject is an issuer-qualified identity, written as
  // "<issuer>#<subject>", matched exactly against the attested sender's
  // `issuer` and `subject` together.
  //
  // Issuer-qualified rather than subject alone, on purpose: a subject is
  // only unique within its issuer (`auth/principal.go`'s own rule, restated
  // by `examples/approval-gate/workflow.yaml`'s self-approval check for the
  // identical reason), so two identity providers can each mint a "runner"
  // subject that must not be treated as the same caller. A rule keyed on
  // subject alone would authorize the wrong runner's signal under the right
  // name — the exact multi-IdP ambiguity #215 found in `run.identity`
  // comparisons, reproduced here if this field accepted a bare subject. Only
  // the qualified spelling is accepted; there is no subject-only form to be
  // ambiguous about.
  string subject = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_UNPOPULATED
    string: {
      max_len: 320
      pattern: "^[^#]+#.+$"
    }
  }];

  // Namespace restricts to one tenant, matched exactly against the attested
  // sender's `namespace`.
  //
  // Rarely useful alone — every signal is already confined to its run's own
  // tenant by `authorizeRun`, before this policy is even consulted — but
  // combines with `claims` to express "anyone in this tenant carrying this
  // claim" without naming individual subjects.
  string namespace = 2 [(buf.validate.field).string = {max_len: 128}];

  // Claims are exact-match requirements against the attested sender's
  // claims: every key here must be present on the sender with this value.
  // Empty places no claim requirement, so a rule naming only `subject` is
  // ordinary and common.
  map<string, string> claims = 3 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {string: {min_len: 1, max_len: 128}}
    values: {string: {max_len: 256}}
  }];

  // SubjectFrom carries `subject:` written as an expression — `subject:
  // ${...}` in a Flowfile — rather than a literal. It resolves exactly
  // once, at submit, against the run's bound inputs (after
  // `BindRunInputs`, before anything else runs), and the result is written
  // into [subject] and this field is cleared before the policy is frozen
  // into the run's memo.
  //
  // That resolve-then-clear is why the enforcement path never evaluates an
  // expression: by the time a signal can arrive, `subject` already holds a
  // literal or is empty, and [subject_from] is always unset on whatever
  // `SignalPolicyAllows` is asked to check. A decoded policy that still
  // carries a populated `subject_from` is refused by
  // `CheckSignalPolicyShape` — an unresolved expression must never survive
  // to the path that authorizes a signal, because that path runs on every
  // delivery and evaluating a caller-influenced expression there is
  // exactly what `BindRunInputs`'s own input-value rule already refuses
  // for an ordinary input.
  //
  // The narrowing rule: a rule that sets this field must also set
  // [namespace] or [claims] — see the Flowfile compiler's narrowing check.
  // An interpolated subject alone would let a caller pick their own
  // authorization by choosing what input value to submit; requiring a
  // co-resident literal constraint means an input can only narrow a static
  // grant the workflow's author already wrote, never invent one.
  Value subject_from = 4;
}

// InputDeclaration is one parameter a run may be started with: what it is
// called, what a value for it must be, whether it may be left out, and what it
// is for.
//
// # What the schema checks, and what the compiler checks
//
// The schema checks what a single declaration can be wrong about on its own: the
// name is a CEL identifier of bounded length, the type is a defined value other
// than unspecified, the description fits. Everything that is a fact about a *set*
// of declarations, or about a name CEL's lexer will not accept, is the
// compiler's — protovalidate rules are per-field and RE2 has no negative
// lookahead, so a rule spelled here that cannot hold is worse than no rule, per
// this file's own history with nineteen of them.
//
// Deferred to the compiler, deliberately and in one list so nobody has to
// rediscover it:
//
//   - Two declarations may not share a name. A repeated field cannot say so.
//   - The names `true`, `false`, `null` and `in` are refused. They are CEL lexer
//     tokens, so `inputs.in` is a syntax error in the grammar itself rather than
//     an unknown field — the same four that are refused as step ids, and for the
//     same reason. The other seventeen CEL reserved words are fine here (see
//     `name` below).
//   - A `default` must be a literal, not an expression and not a secret
//     reference. [Value] is a oneof and protovalidate rules attach to fields, so
//     "which arm" is not something this file can require.
//   - A required input with a default is a contradiction, and one of the two is
//     a mistake worth naming rather than resolving by precedence.
//   - Whether a submitted value matches the declared type, which is the check
//     at submit — see [RunRequest.inputs].
message InputDeclaration {
  // Type is the shape a value must have to be accepted.
  //
  // An enum rather than a type *expression* like [TaskField.type], and the
  // difference between those two fields is the difference between what they are
  // for. A TaskField is documentation: it is rendered for a person or an agent
  // reading the catalog, and `list[string]` is the right answer there because it
  // is what an author would say. This one is *enforced*, at submit, against a
  // value some caller chose — so it has to be a closed set the schema can
  // constrain and every consumer can switch on. Spelling it as a string would put
  // a parser for the same small type language into the CLI, the server, the
  // language server and the compiler, which is the "one value written down four
  // times" failure this repository keeps finding in other clothes.
  //
  // These are the six of [Value.Type] that describe *data*, with the same names
  // and the same numbers. The two left out are TYPE_EXPR and TYPE_ERROR, and they
  // are precisely the two that are not data: an expression is something a run
  // evaluates, and a caller does not get to send one. Sharing numbers does not
  // make the enums interchangeable — the sets differ, so a conversion between
  // them is a switch somebody wrote and somebody reviewed, never a cast.
  //
  // A parameterized type — a list *of* what — is not expressible here yet, on
  // purpose. An element type that nothing checks is decoration, which is the rule
  // that put this whole surface in Phase 2 with its checker; and an added enum
  // value or an added field is free later, where a wrong one is not.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_STRING = 1;
    TYPE_INT = 2;
    TYPE_FLOAT = 3;
    TYPE_BOOL = 4;
    TYPE_STRUCT = 5;
    TYPE_LIST = 6;
  }

  // Name is what the input is called, and how an expression reaches it:
  // `${inputs.<name>}`.
  //
  // Stricter than a step id's pattern, which takes dashes for historical latitude
  // and then has the compiler refuse the ones CEL cannot read. There is no
  // history here, so the boundary refuses them outright: this pattern *is* a CEL
  // identifier.
  //
  // Rooting under `inputs` is what keeps the rest of the question small, the same
  // way `steps.<id>` did (invariant 2). A name here is a field selection rather
  // than an identifier, so seventeen of CEL's twenty-one reserved words are legal
  // — `namespace`, `loop`, `if` and the rest — and only the four lexer tokens are
  // not. Nothing needs refusing against `steps`, `vars` or `now` either: an input
  // called `steps` is `inputs.steps`, which cannot collide with anything, which is
  // the entire reason ambient namespaces get a root.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$" // A CEL identifier, so `inputs.<name>` parses.
    }
  ];

  // Type is what a submitted value must be, checked at submit rather than where
  // the value is first read. A run that is going to be refused for a bad argument
  // should be refused while the caller is still there to be told, not three steps
  // in with two requests already sent.
  Type type = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Required reports that a run cannot start without this input.
  //
  // The default is false, which means optional, which is the safe direction for a
  // field being added to a schema: a declaration written before anyone thought
  // about optionality does not silently start refusing runs. Fail-closed lives at
  // the other end of this surface — an *undeclared* input is refused, and a value
  // of the wrong type is refused — where the thing being denied is something a
  // caller sent rather than something an author forgot.
  bool required = 3;

  // Default is the value used when the caller passes nothing.
  //
  // A [Value] rather than a string, so that a default for an int input is an int
  // and nobody writes a second coercion path for defaults alongside the one for
  // submitted values. It must be a literal: an expression here would be evaluated
  // somewhere, and the only place with a scope to evaluate it in is the run,
  // which would make a default a different kind of thing from the value it stands
  // in for. The compiler enforces that, per the list on the message above.
  Value default = 4;

  // Description is prose for whoever is supplying the value — a person reading
  // `flow run --help`, an agent choosing arguments, an editor's hover. It is the
  // only part of a declaration written *for the caller* rather than for the
  // machine, which is why it is worth carrying rather than leaving in a comment
  // the compiler throws away.
  optional string description = 5 [(buf.validate.field).string = {max_len: 256}];

  // Example is an illustrative value for this input, never applied at runtime.
  //
  // `default` and `example` used to be one field, because `default` was the only
  // way to make a workflow runnable unattended — so a required-feeling input like
  // "who is asking" ended up with a specific person as its default, which is
  // incoherent: there is no sensible absent value for who is asking, only a
  // plausible one to paste. The two are different things. A default is applied
  // when a caller supplies nothing, and is legitimate only when absence itself
  // has a meaning (`region: us-east-1`). An example is what a caller unsure what
  // to send would copy, is legal on a required input precisely because a required
  // input cannot have a default, and is checked against this declaration's own
  // type and constraints when the specification compiles — a stale example that
  // no longer satisfies its own `must:` is a diagnostic, not a value nobody
  // notices went wrong. It is never bound to a run; it exists for an editor's
  // hover, a generated doc, and a machine caller's schema.
  Value example = 6;

  // Sensitive marks a value as private but not secret: a salary in an approval, a
  // customer's email — something a run legitimately computes on and that
  // legitimately rides in history, but that should not be casually pasted into a
  // terminal, a log, or an agent's answer.
  //
  // This is display etiquette and nothing more. It is not containment: the value
  // is an ordinary part of the run's history exactly like any other input, and
  // anyone with access to that history reads it in the clear, the same way they
  // read any other input. A secret reference is different: it keeps the value
  // *out* of history entirely, resolving it only inside the activity that needs
  // it — that is containment, and this is not it. Marking sensitive a value that
  // must never reach an operator's screen at all is a mistake; that value is a
  // secret reference, not this.
  //
  // # What this does on an *input*, precisely
  //
  // Declared *outputs* are redacted everywhere Flowstate renders them; an input
  // is rendered on exactly one surface — a schedule's bound arguments, through
  // `flow schedule describe` and `flow schedule list` — and there a
  // sensitive-declared value is redacted the same way, server-side, before it
  // crosses the wire. The redaction lives on the server rather than the client
  // because the server is the only party that holds both the schedule and the
  // spec that declared the sensitivity; a `ScheduleDescription` on the wire
  // carries the already-redacted value, not the raw one for a client to hide.
  //
  // What is not yet built is a reveal path: `flow get` has `--reveal-sensitive`,
  // and the schedule RPCs have no field to carry that request. An operator who
  // needs the value must read it from wherever it was configured, not from a
  // describe. That is a display-surface gap, not a containment one — this flag
  // was never containment (see above).
  bool sensitive = 7;

  // Field 8 was Pattern: an RE2 regular expression a `type: string` value had to
  // fully match. Removed rather than kept, because it said nothing `must:`
  // could not already say, and said it worse. `must: this.matches('<regex>')`
  // is the identical check — CEL's `matches()` compiles to the same RE2 engine
  // `regexp.Compile` gave `pattern:`, so nothing about cost or backtracking
  // changes — through the one expression surface this schema has, rather than a
  // second vocabulary that happened to duplicate one corner of it. Every
  // declaration that used it in this repository's own examples now spells it
  // that way; see docs/DSL.md.
  //
  // Reserved rather than reused, on the same terms as the two deletions already
  // in this file (`Workflow.inputs` above, `Task.description` below): a number
  // that meant something else in a spec some worker may still be replaying must
  // never come back with a new meaning. The parser also still recognizes the
  // key `pattern:` specifically — see `flowfile.declaredInput` — and refuses it
  // with a diagnostic naming the `must:` spelling to write instead, rather than
  // reporting it as an unknown key, because "unknown key" describes a typo
  // nobody made.
  reserved 8;
  reserved "pattern";

  // MinLen and MaxLen bound a `type: string` value's length, counted in runes.
  // Either may be given alone. Named after `buf.validate`'s `string.min_len` and
  // `string.max_len`, for the reason `pattern` above is.
  optional uint64 min_len = 9;
  optional uint64 max_len = 10;

  // Fields 11 and 12 were Min and Max: a `type: int` or `type: float` value's
  // bound, one field serving both declared types. Removed rather than kept,
  // for a reason sharper than the bloat argument that retired `pattern:`
  // above — on `type: int` these were *wrong*. Both fields were `double`, so
  // an int64 literal converted to float64 before every comparison, and past
  // 2^53 that conversion loses precision: `min: 9007199254740993` accepted
  // 9007199254740992, a value one below the declared minimum, because both
  // numbers round to the identical float64. `must: this >= 9007199254740993`
  // has no such conversion — CEL's `>=` on two ints compares the int64s
  // directly — and refuses that value correctly. The typed key was weaker
  // than the CEL spelling on exactly the type it most obviously served.
  //
  // `must: this >= <N>` / `must: this <= <N>` say the identical thing at
  // every magnitude either declared type allows, through the one expression
  // surface this schema has. See docs/DSL.md.
  //
  // Reserved rather than reused, on the same terms as `pattern` above: a
  // number that meant something else in a spec some worker may still be
  // replaying must never come back with a new meaning. The parser still
  // recognizes `min:`/`max:` specifically and refuses each with a diagnostic
  // naming the `must:` spelling to write instead, built from the author's own
  // number so the remedy is copy-pasteable — see `flowfile.declaredInput`.
  reserved 11, 12;
  reserved "min", "max";

  // MinItems and MaxItems bound a `type: list` value's length. Either may be
  // given alone. Named after `buf.validate`'s `repeated.min_items` and
  // `repeated.max_items`.
  optional uint64 min_items = 13;
  optional uint64 max_items = 14;

  // Field 15 was Unique: whether a `type: list` value's elements must all
  // differ from one another. Removed for the reason `pattern` was — it said
  // nothing `must:` could not already say, and said it worse, through a
  // second vocabulary that duplicated one corner of the one expression
  // surface this schema has. `must: this == this.distinct()` is the identical
  // check: CEL's `distinct()` (a `lists` extension macro, part of this
  // schema's own profile since #234's V1) returns the value's elements with
  // duplicates removed, order preserved, so equality against the original
  // holds exactly when every element was already unique. See docs/DSL.md.
  //
  // Reserved rather than reused, on the same terms as `min`/`max` above. The
  // parser still recognizes `unique:` specifically and refuses it with a
  // diagnostic naming the `must:` spelling to write instead — see
  // `flowfile.declaredInput`.
  reserved 15;
  reserved "unique";

  // Must is a CEL predicate over `this`, the value being checked, for a rule the
  // declarative keys above cannot state — the escape hatch `buf.validate` itself
  // keeps behind its own standard-rule vocabulary, and for the identical reason:
  // making an author spell `size(this) > 0 && size(this) <= 100` for every
  // bounded list is the ergonomic failure the keys above exist to prevent, so
  // this exists only for what they genuinely cannot say.
  //
  // Compiled and type-checked when the specification loads — not when a run
  // submits one — so a bad expression is a defect in the specification itself,
  // caught the same way a mistyped default is. Evaluated under this schema's
  // standard CEL cost bound at every point a value is checked against it, because
  // a specification (and the `must:` inside it) can arrive over the RPC and is
  // therefore untrusted input like any other stored expression here. It may not
  // reference `now` or call anything nondeterministic: a constraint has to answer
  // the same way on every replay and at every one of this declaration's
  // enforcement points, which an expression reading the clock cannot promise.
  optional string must = 16;
}

// OutputDeclaration is one value a finished run reports: a name, and the
// expression that produces it.
//
// The expression is evaluated by the run, in the run's own scope, after its steps
// have finished — so this is the one place in the schema where an author's
// expression is deliberately what is stored, as against [RunRequest.inputs] where
// an expression is deliberately what is refused. The two rules point the same
// way: an expression may come from the file, which is reviewed and compiled, and
// never from a caller.
//
// Deferred to the compiler for the same reasons as [InputDeclaration]: that two
// declarations do not share a name, and that the expression's references resolve
// against the scope a finished run actually has.
message OutputDeclaration {
  // Name is what the value is called in the run's result.
  //
  // Same pattern as an input's, and for a weaker reason — nothing selects an
  // output through CEL today. It is held to the same shape anyway so that the two
  // halves of one contract cannot disagree about what a name is, and so that a
  // later `${outputs.<name>}` or a cross-file signature check is not a break.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    }
  ];

  // Value is the expression evaluated to produce this output.
  Value value = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Description is prose for whoever reads the result.
  optional string description = 3 [(buf.validate.field).string = {max_len: 256}];

  // Must is a CEL predicate over `this`, the value this output's own expression
  // produced, checked once that expression has been evaluated — so a workflow
  // cannot report a value that violates its own contract, which is what makes
  // consuming a library workflow's result safe. Same rules as
  // [InputDeclaration.must]: compiled and type-checked when the specification
  // loads, evaluated under the standard CEL cost bound, and refused if it
  // references `now` or calls anything else nondeterministic.
  optional string must = 4;

  // Sensitive marks this output's value the way [InputDeclaration.sensitive]
  // marks an input's — display etiquette, never containment. See that field's
  // doc comment for the honesty this comes with; nothing about the two differs
  // beyond which side of a run they describe.
  bool sensitive = 5;
}

// RunOutputs is what one run computed for its declared outputs.
//
// Its own message rather than a widening of [Workflow.StepOutputs], which is a
// different question with a similar shape: step outputs are every value the run
// produced, keyed by the step that produced it, and these are the few values the
// *workflow* said it would report. A caller wanting the answer should not have to
// know the run's internal structure to find it, and a reader of either message
// should never have to ask which of the two it is holding.
//
// Carried in [RunState] as well as returned, because a run that suspends has to
// keep what it has computed; and weighed there by `CheckRunStateSize`, which
// measures the whole message (invariant 9).
message RunOutputs {
  // Values are the declared outputs, keyed by the name their declaration gave.
  //
  // A map rather than a repeated message: order is a property of the declaration
  // list, which is already ordered, and a result is looked up by name.
  map<string, Value> values = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
      max_pairs: 64
    }
  ];
}

// Triggers is what a workflow says about starting itself.
//
// A message with one field per kind of trigger rather than a oneof, because these
// are not alternatives: a workload that runs nightly *and* on a webhook is an
// ordinary thing to want, and a oneof would make expressing it a schema change
// rather than a second key. Adding a kind is then a new field here, which is
// additive on the wire and additive in the grammar — `triggers:` gains a key and
// every existing file still means what it meant.
//
// Its own message rather than fields on [Workflow] for the same reason the DSL
// spells it `triggers: { schedule: ... }`: a reader meets one block that answers
// "how does this start", and a second kind does not scatter a third and fourth
// top-level key across the file.
message Triggers {
  // Schedule is the cadence this workload is meant to run at.
  //
  // Optional and, when present, still inert until somebody creates it. See
  // [Workflow.triggers] for why the declaration and the act are separate.
  ScheduleTrigger schedule = 1 [(google.api.field_behavior) = OPTIONAL];
}

// ScheduleTrigger says when a workload should run.
//
// # A projection of Temporal's ScheduleSpec, not a reimplementation
//
// Temporal has first-class Schedules, with a spec covering cron expressions,
// intervals, calendars, skips, jitter, time zones, start and end bounds, and
// policy about what to do when a firing overlaps the last one. Every field here
// is passed to that spec unchanged; nothing in Flowstate computes a next firing
// time, and nothing here is a second implementation of a cron parser at run time.
// What this message is for is giving those parameters a *declarable* spelling —
// the surface, not the mechanism.
//
// # What is here, and what is deliberately not yet
//
// Cron expressions, intervals and explicit calendars are unioned. Start/end
// bounds constrain that union, catch-up limits automatic missed-fire recovery,
// and overlap and pause-on-failure define how executions interact. Backfill is
// creation-only and therefore lives on [CreateScheduleRequest], not here.
//
// # Where the arguments are not
//
// There is deliberately no `inputs:` under a schedule. What a scheduled run is
// started with is bound at creation, from the command that creates it — see
// [CreateScheduleRequest.inputs] — because arguments are a deployment's answer
// (which cluster, which account, which region) while the cadence is the
// workload's. Putting them here would also make the same values expressible in
// two places, since an input declaration already carries a default, and a
// precedence rule between a default and a schedule's override is a rule somebody
// has to learn for no benefit.
message ScheduleTrigger {
  // Calendar is an explicit calendar cadence, matched field by field the way a
  // cron expression is: a time matches when at least one range of every field
  // matches it. A field nobody writes takes Temporal's default for that field:
  // second, minute and hour default to zero, and the three date fields match
  // everything. That is why a calendar with no fields at all is refused rather
  // than compiled: it means 00:00:00 every day, and nobody writes that by
  // meaning it.
  message Calendar {
    // Range is a low-to-high span of one field, written in a Flowfile as a whole
    // number, a list of them, or `{start: 9, end: 17, step: 2}`.
    message Range {
      // Start is the first value the range matches, and the only required one.
      int32 start = 1;

      // End is the last value, inclusive. Zero means no end was written, which
      // matches the start alone. The schema cannot distinguish an unwritten end
      // from one written as zero, and Temporal reads both the same way. An end
      // below the start is refused rather than passed on, since Temporal would
      // silently narrow it to the start.
      int32 end = 2;

      // Step is how far apart the matched values are. Zero means no step was
      // written, which takes every value in the range.
      int32 step = 3;
    }
    repeated Range second = 1;
    repeated Range minute = 2;
    repeated Range hour = 3;
    repeated Range day_of_month = 4;
    repeated Range month = 5;
    repeated Range year = 6;
    repeated Range day_of_week = 7;
    string comment = 8 [(buf.validate.field).string = {max_len: 256}];
  }
  // Overlap says what happens when a firing comes due while the previous run is
  // still going.
  //
  // Mirrors Temporal's `ScheduleOverlapPolicy` value for value. Named as a
  // Flowstate enum rather than importing Temporal's because this is the schema a
  // Flowfile compiles to and a plugin compiles against, and neither should
  // acquire a dependency on the execution substrate's API to read a workflow —
  // the same reasoning that keeps [RetryPolicy] a Flowstate message.
  enum Overlap {
    // Unspecified takes Temporal's own default, which is SKIP.
    //
    // Left as a real arm rather than defaulted here so that "the author said
    // nothing" and "the author wrote skip" stay distinguishable in the
    // specification. They behave identically; only one of them changes if
    // Temporal's default ever does, and that is the correct one to move.
    OVERLAP_UNSPECIFIED = 0;

    // Skip drops the new firing entirely. The safe default: a nightly job that
    // takes longer than a day does not pile up.
    OVERLAP_SKIP = 1;

    // BufferOne runs the new firing after the current one finishes, keeping at
    // most one waiting.
    OVERLAP_BUFFER_ONE = 2;

    // BufferAll queues every firing, running them one after another. A backlog
    // is bounded only by how long the runs take, so this is the arm to think
    // twice about.
    OVERLAP_BUFFER_ALL = 3;

    // CancelOther cancels the running one and starts the new one once it has
    // stopped, letting the old run clean up on the way out.
    OVERLAP_CANCEL_OTHER = 4;

    // TerminateOther stops the running one immediately and starts the new one.
    // Nothing the old run would have done on its way out is done.
    OVERLAP_TERMINATE_OTHER = 5;

    // AllowAll starts the new firing regardless, so several runs of the workload
    // are in flight at once.
    OVERLAP_ALLOW_ALL = 6;
  }

  // Cron holds cron expressions, each naming a set of firing times.
  //
  // Repeated because a cadence like "every weekday at 09:00, and at noon on
  // Sunday" is two expressions and cannot be one — the union is what Temporal
  // takes. The DSL accepts a single string as well as a list, so the common case
  // reads as one line.
  //
  // Temporal accepts 5, 6 or 7 fields, the `@daily`-style shorthands, `@every
  // <interval>`, and an optional `CRON_TZ=`/`TZ=` prefix. `flow validate` checks
  // the shape of what is written here and reports a position; the cluster is the
  // authority on the rest, which is the standing rule for anything a deployment
  // decides.
  repeated string cron = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated = {
      max_items: 32
      items: {
        string: {
          min_len: 1
          max_len: 256
        }
      }
    }
  ];

  // Every fires on a fixed interval, measured from the epoch rather than from the
  // last firing — so `every: 1h` is every hour on the hour, not an hour after
  // whenever the previous run happened to end.
  //
  // Beside `cron:` rather than instead of it because the two answer different
  // questions. An interval is what somebody means by "every fifteen minutes"; a
  // cron expression is what they mean by "at 09:00 on weekdays", and expressing
  // either in the other's notation is where the mistakes live.
  google.protobuf.Duration every = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).duration = {
      gte: {seconds: 1}
      lte: {seconds: 31536000} // A year.
    }
  ];

  // TimeZone is the IANA zone a calendar-based expression is read in, for example
  // `America/New_York`. Empty means UTC.
  //
  // Resolved by the Temporal cluster from the zone database it runs with, not
  // here: a zone name is exactly the kind of thing a deployment answers, and a
  // validator running in an editor would be answering from the author's laptop.
  // What is checked here is that it is a plausible name; whether this cluster has
  // it is the cluster's to say.
  string time_zone = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string = {max_len: 64}
  ];

  // Jitter spreads firings over a window, so a fleet of schedules that all say
  // `0 * * * *` does not become a thundering herd on the hour.
  //
  // Each firing is delayed by a random amount between zero and this, capped by
  // the time until the next firing.
  google.protobuf.Duration jitter = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).duration = {
      gte: {seconds: 0}
      lte: {seconds: 86400}
    }
  ];

  // Overlap is what happens when a firing comes due with the last run still
  // going. Unset takes Temporal's default, which is to skip.
  Overlap overlap = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum = {defined_only: true}
  ];

  // Calendars are unioned with cron and interval cadences: a schedule fires at
  // every time any of the three matches, so a calendar beside a cron expression
  // adds firings rather than filtering them.
  repeated Calendar calendars = 6 [(buf.validate.field).repeated = {max_items: 32}];

  // StartAt and EndAt bound the window in which firings may occur, inclusively
  // at both ends. Either may be written alone. A start that is not before its
  // end is refused at creation, because such a schedule can never fire and would
  // be created successfully by Temporal all the same.
  google.protobuf.Timestamp start_at = 7 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp end_at = 8 [(google.api.field_behavior) = OPTIONAL];

  // CatchupWindow limits how late a missed firing may still be taken when the
  // Temporal service returns from an outage.
  //
  // Optional here, but never absent by the time Temporal sees it: an unset
  // window is one Temporal defaults to *one year*, so a schedule that says
  // nothing would take a year of missed firings at once. The server therefore
  // substitutes its own bounded default (`v1.DefaultScheduleCatchupWindow`) for
  // an absent value, and this field is how an operator asks for a different one,
  // up to thirty days.
  google.protobuf.Duration catchup_window = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).duration = {gte: {seconds: 60}, lte: {seconds: 2592000}}
  ];

  // PauseOnFailure pauses the whole schedule after an action exhausts its
  // retries or times out, so a workload failing every hour stops at the first
  // failure rather than at the hundredth. A firing already started is not
  // recalled.
  bool pause_on_failure = 10 [(google.api.field_behavior) = OPTIONAL];
}

// ScheduleBackfill asks creation to evaluate the declared cadence over a
// historical interval, taking the actions it would have taken then, now.
//
// The interval is half-open: Temporal evaluates times *after* start_at and up
// to and including end_at, so a start written at exactly the first firing time
// wanted excludes it. Write the start a moment earlier.
//
// The server bounds both how many intervals are accepted and their total span,
// because a backfill is the one place where a single request decides how many
// executions a cluster starts at once.
message ScheduleBackfill {
  google.protobuf.Timestamp start_at = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end_at = 2 [(buf.validate.field).required = true];
  ScheduleTrigger.Overlap overlap = 3 [(buf.validate.field).enum = {defined_only: true}];
}

// Node represents a step in the workflow. Each node can be a task or another type of operation.
// Nodes can have outputs that are structured as named values, allowing for complex workflows
// where the outputs of one node can be used as inputs to another node.
message Node {
  // Outputs are the results produced by the node. Each output is a named value that can be
  // referenced by subsequent nodes in the workflow. This allows for structured outputs that
  // can be used to pass data between nodes.
  message Outputs {
    map<string, Value> named_values = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).map = {
        keys: {string: {min_len: 1}}
      }
    ];
  }

  // Each node has a unique identifier within the workflow. This ID is used to reference the
  // node in the workflow's step outputs and can be used to access the outputs of the
  // node after the workflow has been executed.
  string id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$" // Alphanumeric, dashes, and underscores.
    }
  ];

  // A node must be a specific kind of operation.
  oneof kind {
    option (buf.validate.oneof).required = true;
    Task task = 2;
    ForEach for_each = 5;
    Parallel parallel = 6;
    Wait wait = 7;
    Call call = 11;
    Loop loop = 12;
  }

  // Condition determines whether the step runs.
  //
  // It is evaluated before the step is scheduled and must produce a boolean. A
  // step whose condition is false is skipped and produces no outputs, so a later
  // step referencing it will not resolve — which is the honest outcome, since
  // the value genuinely does not exist.
  //
  // Unset means the step always runs.
  Value condition = 3;

  // Policy controls how the step is executed: how long it may take, whether and
  // how it is retried, and whether its failure ends the run.
  //
  // Unset means the engine's defaults apply.
  StepPolicy policy = 4;

  // Description is optional prose about what this step is for.
  //
  // It belongs to the step rather than to the task the step runs, which is where
  // it used to live. Once a step names its task directly, the value under `echo:`
  // is that task's inputs, so a `description` written there would be an input of
  // that name; and a `for_each` or a `sleep` is just as worth explaining as a
  // task is. The step is the thing an author is describing either way.
  optional string description = 8 [(buf.validate.field).string = {max_len: 256}];

  // Vars are names this step binds for itself, read *bare* inside it: `${modified}`.
  //
  // Bare rather than rooted, which is the opposite of [Workflow.vars] and deliberate.
  // The rule is not about which block a name came from but about where it is bound:
  // an author-chosen name bound lexically, close enough to read the binding and the
  // use together, stays bare — the same standing a `for_each` binding has. A name
  // that is simply in the air everywhere gets a root, because that is the only thing
  // that keeps it from colliding with what an author chose.
  //
  // Evaluated after the step's condition and before its inputs, in the step's own
  // scope: it may read `vars.<name>`, the outputs of steps already run, and any
  // binding it sits inside. So unlike a workflow var it *can* see the run.
  //
  // # Collisions are refused, not resolved
  //
  // Every name here is bare and so can collide with another bare name — an enclosing
  // loop's binding, a step var further out, `now`. That is refused at validation, at
  // the inner declaration, rather than resolved by a precedence rule. Silent
  // shadowing is how `${body}` comes to mean two things eleven lines apart, and a
  // precedence rule is a thing every reader has to know before they can read the
  // second one correctly.
  //
  // By the time a spec reaches the engine there is therefore nothing to decide, which
  // is why [Scope.vars] holds these and a loop's binding in one map.
  map<string, Value> vars = 9 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
    max_pairs: 64
  }];

  // Undo is how this step is taken back when a *later* step fails and the run
  // cannot continue — the saga compensation for whatever this step did.
  //
  // It hangs off the step rather than being a handler list at the workflow level
  // because the undo and the do are one decision. The thing to be deleted is named
  // by the outputs of the step that created it, so a list somewhere else would have
  // to reach back across the file for every value it needs, and a reviewer would
  // have to read two places to answer "does this get cleaned up". One place, and
  // one fewer control-flow construct (DSL.md's rule 10).
  //
  // Field 10 rather than an arm of the `kind` oneof, because a compensation is not
  // a kind of work a step does. It is a property of a step that does some other
  // kind, exactly as `policy` and `condition` are.
  Compensation undo = 10;
}

// Compensation is what undoes one step.
//
// # A task, not a node
//
// The field is a [Task] and not a [Node], and that is the load-bearing choice in
// this message rather than an economy. Three things follow from it, each of which
// would otherwise be a rule somebody has to enforce:
//
//   - A compensation cannot itself be compensated. There is nowhere to write a
//     nested `undo`, so an infinite compensation loop is not something a
//     specification can express — better than a bound on one.
//   - A compensation cannot loop, branch, or wait. Those are the node kinds, and
//     each of them is a position a run could suspend at; compensation runs in the
//     segment that failed and does not suspend (see [RunState.pending_undo]), so a
//     kind that needs a resume position could not honour that.
//   - A compensation has no `id`, so it can never appear in `steps.<id>` and no
//     expression can depend on one having run.
//
// # No policy field, deliberately
//
// A compensation is retried and bounded exactly as a step with no `retry:` and no
// `timeout:` is — the engine's defaults, from the same constants both drivers read
// (`retrydefaults.go`). A `policy` field here would be a bound nothing reaches
// until an author writes one, and CLAUDE.md's rule about those is that they are
// bounds nothing tests. Adding the field later is additive; guessing its semantics
// now is not.
message Compensation {
  // Task is the work that undoes the step.
  //
  // Its inputs are resolved at the moment the step *succeeds*, not at the moment
  // compensation runs — see [PendingUndo.task] for why that is the whole design.
  Task task = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// PendingUndo is one compensation a run has registered and not yet run.
//
// # Resolved on registration, not on failure
//
// The task here carries *values*, not expressions over a scope that may no longer
// exist. A step's `undo:` is resolved the instant that step succeeds, in that
// step's own scope with its own outputs added, and what is stored is the result.
//
// Three problems disappear at once, and each of them is real:
//
//   - Compaction. A run that continues as new carries only the step outputs its
//     *remaining* steps can still reference (`compactOutputsForRemainingSteps`).
//     A deferred compensation expression would be a fifth reference site that walk
//     does not know about, and the failure mode is the one that walk has already
//     had twice: an output pruned, and a run that fails after a handover on a
//     specification that never changed. A resolved value references nothing.
//   - Determinism. Running a compensation schedules an activity and evaluates
//     nothing, so nothing about compensating is new workflow-side work
//     (ARCHITECTURE.md invariant 4).
//   - Meaning. `${steps.provision.id}` inside an undo means the id that step
//     produced, at the moment it produced it. Resolving later would let it mean
//     whatever the scope held after some other step overwrote things.
//
// The cost is stated rather than hidden: what a compensation would have computed
// from the *failure* — which step failed, what it said — is not available to it,
// because at registration time the failure has not happened. That is a deliberate
// narrowing and DSL.md argues it as one.
//
// # Size (ARCHITECTURE.md invariant 9)
//
// These ride in [RunState], so `CheckRunStateSize` weighs them at every
// Continue-As-New along with everything else — it calls `proto.Size` on the whole
// message rather than summing the fields it knows about, so this field was bounded
// on the day it was added and nobody has to remember to count it. A run with an
// undo on every step carries one resolved task per succeeded step, and
// `Workflow.steps` is capped at 100.
message PendingUndo {
  // StepId is the step this undoes, for the sentence a failed run reports and for
  // nothing else — nothing dispatches on it.
  string step_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];

  // Task is the compensation with its inputs already resolved.
  Task task = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// SecretRef names a secret without containing it.
//
// A workflow specification is persisted, replayed, and readable by anyone who can
// read workflow history, so it must never carry a credential. It carries this
// instead: enough to find the value at the moment it is needed, and nothing more.
//
// The scheme and name are separate fields rather than one joined string so that
// the schema itself rejects a malformed reference at the boundary, before any
// worker tries to resolve it.
//
// This message must never gain a field holding a value. Adding one would make
// every workflow that used it leak a credential into history, and the mistake
// would be invisible until someone read the history.
message SecretRef {
  // Scheme selects the provider that resolves the reference, such as "env",
  // "file", "vault", or "keychain".
  //
  // A scheme is how a secrets backend plugs in: a deployment registers providers
  // for the schemes it permits, and a reference to an unregistered scheme is
  // refused rather than guessed at. A deployment that permits no secrets at all
  // registers none, and every reference fails.
  string scheme = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
      pattern: "^[a-z0-9-]+$"
    }
  ];

  // Name locates the secret within that provider: an environment variable
  // suffix, a path under a mounted directory, a vault path. Its meaning belongs
  // to the provider, including how it expresses versions.
  //
  // The pattern here cannot express everything that matters — control characters
  // are also rejected, in code, because a reference reaching a log or history
  // must not be able to forge lines in it.
  string name = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
}

// Wait suspends a workload until time passes, a condition holds, or a signal
// arrives.
//
// This is the primitive a CI system fundamentally cannot copy. A run that waits
// a week for a human approval and survives every worker restart in between is
// not a long-running process — the process may not exist for most of that week.
// The wait is durable state on the execution substrate, so a worker that is
// redeployed, crashes, or moves machines resumes exactly where it was.
//
// It is a node kind rather than a task, because waiting schedules no activity
// and touches nothing outside the workflow: no worker executes it, no
// credentials are needed, and nothing can fail except the wait itself. Making it
// a task would put an evaluator and an activity round trip behind something that
// is a timer.
message Wait {
  // What is being waited for.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // Duration waits for time to pass, as `sleep: 30s`.
    //
    // It is a durable timer, so the workload is not holding a worker or a thread
    // while it elapses. A week is as reasonable as a second.
    google.protobuf.Duration duration = 1;

    // Until waits for a *moment*, as `wait_until: <expr>`.
    //
    // The expression is evaluated once, against the outputs of steps that have
    // already run, and must produce a time; a boolean is refused rather than
    // polled. Inside it `now` names the moment the wait is evaluated — taken from
    // the driver's clock, so it replays to the same instant — and the duration
    // units make a relative deadline readable: `${now + days(3)}`.
    //
    // It is a moment and not a condition because a condition here could only ever
    // spell "wait forever". A blocked workload runs no step, so nothing it can
    // see changes while it waits: a condition over step outputs is either already
    // true or never going to be. Waiting on something outside the workload is
    // what a signal is for.
    //
    // A moment already past releases the wait immediately, which is what lets a
    // workload resumed after an outage reach an open window and catch up instead
    // of failing for being late.
    Value until = 2;

    // Signal waits for something outside the workload to say it may proceed,
    // which is what makes a human approval gate expressible.
    Signal signal = 3;

    // DurationExpr is a `sleep:` whose length is computed: `sleep: ${inputs.grace}`.
    //
    // A separate field from `duration` rather than a widening of it, because
    // `duration` is a published field carried in every running spec and in every
    // `RunState` crossing a Continue-As-New — changing its type would break the
    // wire contract invariant 10 exists to protect. So a literal `sleep: 30s`
    // still compiles to `duration` and is byte-identical through a round trip,
    // and only a `${...}` reaches here.
    //
    // Two fields for one meaning is the shape CLAUDE.md warns about, so nothing
    // reads them apart: [EvalWaitDuration] is the single reader, both drivers
    // call it, and neither knows which field answered.
    //
    // The expression must produce a CEL duration — `duration('720h')`,
    // `days(30)`, `hours(2) + minutes(30)` — or a string spelled the way the
    // literal does (`30s`, `5m`, `7d`), which is what lets a plain string input
    // carry one. An int is refused rather than guessed at, because nothing says
    // whether it counts seconds or nanoseconds.
    //
    // Inside it `now` is bound, exactly as in `until`: a wait is a node kind
    // evaluated in workflow code holding the driver's own clock, on both
    // drivers, so every arm of this message has the replay-safe clock the
    // binding rule asks for. See [NowIdentifier].
    Value duration_expr = 5;
  }

  // Timeout bounds how long the wait may last, for a wait that might otherwise
  // never end.
  //
  // It is meaningful for `until` and `signal`, and meaningless for `duration`,
  // where the duration is already the bound. A wait that times out is not a
  // failure: it produces its outputs with `timed_out` true, so an author decides
  // what a lapsed approval means with an ordinary `if:` rather than having to
  // treat a normal outcome as an error.
  //
  // Unset means the wait may last as long as the run does. That is a deliberate
  // choice for an approval gate that genuinely should block until someone acts,
  // and a mistake everywhere else.
  google.protobuf.Duration timeout = 4;

  // TimeoutExpr is a `timeout:` whose length is computed: `${deadline - now}`.
  //
  // Beside `timeout` for the reason `duration_expr` is beside `duration`, and
  // read through one function for the same reason: [EvalWaitTimeout]. Setting
  // both is refused by [ValidateWait] — two answers to one question is not
  // something a spec gets to say.
  //
  // A wait whose computed timeout is negative fails the run rather than falling
  // through to the encoding that means *unbounded*. That is the one outcome
  // worth spelling out here: `timeout <= 0` is how "no timeout" is spelled on
  // the wire, so a sign error in an expression would silently convert a bounded
  // approval gate into one that blocks forever. Zero is legal and means the
  // wait times out at once.
  Value timeout_expr = 6;
}

// Signal names something a workload waits to be told.
//
// The payload a signal carries becomes the waiting step's outputs, which is what
// makes a gate compose with everything else: `${approval.approved}` resolves the
// way any other step reference does, so it works in an `if:`, in a task input,
// and in a later expression, with no special form for signals.
message Signal {
  // Name is what a sender addresses. It is part of the workload's contract with
  // whatever approves it, so it is written by the author rather than generated.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];

  // Outputs shapes what the waiting step produces, the way the http task's own
  // `outputs:` shapes what a request produces.
  //
  // Each value is evaluated once, at the moment the wait resolves, against the
  // wait's own result: `payload`, `sender` and `timed_out` are bound bare, and
  // so is `now` — every expression a wait holds sees the driver's clock (see
  // [NowIdentifier]). The enclosing scope is underneath, so `steps.*`,
  // `inputs.*` and `vars.*` read here exactly as they do in an `if:`.
  //
  //     wait_for_signal:
  //       name: deploy-approved
  //       timeout: 1h
  //       outputs:
  //         approved: ${has(payload.approved) && payload.approved}
  //         timed_out: ${timed_out}
  //
  // # Replace, not extend
  //
  // The shaped names become the step's outputs, and the defaults are gone —
  // one key with one meaning, matching `Task.HTTP.Inputs.outputs` exactly. An
  // author who still needs `payload` or `timed_out` re-exposes it in a line,
  // and reading one that was dropped is an ordinary "step has no output"
  // diagnostic rather than an empty value that branches the wrong way.
  //
  // # Why this exists
  //
  // A condition derived from a step's own result had nowhere to be named, so
  // real workflows wrote it once per reader: in an `if:`, negated in the
  // sibling's `if:`, and re-derived in the workflow's `outputs:`. Nothing kept
  // the copies in agreement, and the report could disagree with the branch that
  // ran. Shaped here, the gate is stated once on the step that produced the data
  // and every later reader reads the same recorded output.
  //
  // # Why it is on Signal rather than on Wait
  //
  // Two of the three names these expressions see — `payload` and `sender` — do
  // not exist on the other arms, and the third, `timed_out`, is a constant
  // `false` for a `sleep:` and a `wait_until:`. Shaping a constant is what
  // `vars:` is for. Putting the field here rather than on [Wait] makes the
  // refusal structural instead of reported: `timeout` sits on [Wait] and is
  // meaningless on two of its arms, which is exactly why [ValidateWait] has to
  // exist. The placement also matches the precedent it copies — http's
  // `outputs:` sits on that task's own inputs, not on a generic step wrapper.
  //
  // Carriage across Continue-As-New is unaffected either way, which is what
  // frees the decision to be made on meaning: the whole node travels inside the
  // spec, and a shaped value is recorded in `Workflow_StepOutputs` like any
  // other step output. What compaction *does* need is that the references these
  // expressions make are collected — see `CollectNodeRefs`.
  map<string, Value> outputs = 2;

  // Prompt is what this gate is asking for, in the author's own words, carried
  // to whoever is being asked.
  //
  // A gate could say which signal releases it and could not say what agreeing
  // to it means. `deploy-approved` is a routing key, not a question: an
  // operator holding a run id learned the name to send and nothing about what
  // they would be approving. This is the sentence that was missing, and it
  // travels on [PendingWait.prompt] so every surface that reports a parked gate
  // reports it.
  //
  // An expression rather than a literal string, because the interesting part of
  // an approval is the particulars: `${"deploy %s to %s?".format([inputs.version,
  // inputs.environment])}` says which build and which environment, and a fixed
  // string cannot. A plain unfenced string is still a plain string, exactly as
  // it is in every other input position.
  //
  // # When it is evaluated, and what it sees
  //
  // Once, at the moment the wait begins parking, on both drivers - the same
  // point the wait announces itself to the reporting registry, and after both
  // ways a wait can resolve without parking at all (a signal that arrived
  // early, a bound that had already lapsed). A gate the run walks straight
  // through evaluates no prompt, because it never asks anybody anything.
  //
  // It sees the enclosing scope and [NowIdentifier], the same names
  // `timeout:` sees. It does *not* see `payload`, `sender` or `timed_out`:
  // those are the wait's result, and the result does not exist yet when the
  // question is asked. That asymmetry with `outputs:` is the honest one, and
  // it is why this is a sibling of that key rather than an entry in it.
  //
  // A prompt that fails to evaluate fails the step, exactly as a `timeout:`
  // that fails to evaluate does. Silently parking with no question is the one
  // outcome worth refusing: nobody would learn the gate had asked anything, and
  // an approver would be shown a blank where the decision was supposed to be.
  //
  // # Sensitivity, which is why this field is not simply a string
  //
  // The evaluated text is rendered into *other people's* clients - an approver
  // who is not the run's author, and who was given a run id rather than the
  // file. So the rule the `log:` lint draws at direct surfacing is drawn wider
  // here: a prompt may not *reach* an input declared `sensitive:` at all, by any
  // spelling, and may not hold a `${secret(...)}` reference. Both are refused at
  // compile where they are statically knowable, and refused again fail-closed at
  // submit by [CheckWaitPromptsAreAskable]. A prompt that still holds a secret
  // reference when it is evaluated - a specification built in process, never
  // parsed and never submitted - renders as a refusal rather than as the secret.
  //
  // # Bounded
  //
  // The evaluated text is bounded by [MaxWaitPromptBytes], read by both drivers
  // from the package both import. Text past the bound is cut and
  // [PendingWait.prompt_truncated] says so, because a question a reader cannot
  // tell was cut short is a question they may answer having read half of it.
  Value prompt = 3;
}

// SignalSender is who the server attests sent a signal — never what the
// sender's own payload claims.
//
// Two separate things travel with every signal, and they must never merge into
// one map: `payload` is what the sender chose to send, unchanged and untrusted;
// `sender` is what the server itself established about the caller before it
// ever looked at the payload. A workflow author writes conditions against
// `sender` — `sender.identity.subject != inputs.requested_by` for separation of
// duties — and treats `payload` as evidence rather than identity.
//
// Identity reuses [WorkloadIdentity] rather than a parallel type: a signal's
// sender and a run's own caller are the same kind of fact — someone acting,
// established by authentication rather than self-report — and a run's identity
// is already this message. Two messages for one shape is exactly the drift
// invariant 1 (proto-first) exists to prevent.
//
// Absent entirely on a signal that predates this field (identity unset,
// accepted_at unset, local false), which reads as unattested — correct,
// because no signal recorded before this field existed could have carried one.
// There is no compatibility arm: an old signal simply has nothing here.
message SignalSender {
  // Identity is the authenticated caller the server established for this
  // signal, by the same path a run's own identity is established
  // (`FlowstateServer.identityFor`, via `authorizeRun`). Never taken from the
  // request — a caller who could name their own identity could name anyone
  // else's, which is the exact defect this message exists to close.
  WorkloadIdentity identity = 1;

  // AcceptedAt is when the server accepted the signal, from the server's own
  // clock — never the sender's. A self-reported time is exactly the kind of
  // claim this field replaces with something attested.
  google.protobuf.Timestamp accepted_at = 2;

  // Local marks a signal delivered to a local run (`flow run local --signal`
  // or `flow test`'s scripted signals), which has no authenticated caller at
  // all — there is no server in front of it to attest anything. Set only by
  // [LocalSignalSender]; the durable driver never sets it true.
  //
  // A wait's rendered `sender.local` output (see wait.go's signalSenderValue)
  // is `true` for this case *and* for every other case where nothing was
  // attested at all — this message absent entirely, which covers a signal
  // that predates this field, a timed-out wait with nothing pending, and the
  // engine's own compatibility fallback for a signal that arrived in the
  // pre-#194 wire shape (engine/signal_compat.go). All of those are the same
  // fact from a workflow author's point of view — nobody attested this — and
  // must read the same way, distinct from an attested-but-anonymous caller
  // (this message present, Local false, Identity.Subject merely empty because
  // no identity provider is configured). This field's own wire value only
  // ever means "the local driver," never "nothing was attested"; the broader
  // reading exists solely in the rendered output, precisely so a workflow
  // author can trust `!sender.local` as "the server accepted this."
  bool local = 3;
}

// PendingSignal is a signal that arrived before the step waiting for it was
// reached, carried across Continue-As-New.
//
// It exists because Temporal delivers a signal to the run that is current when it
// arrives, and a run that suspends drops anything still buffered on a channel it
// has not read. Without carrying them, approving a gate before the run reaches it
// — which is ordinary behavior, not misuse — would silently lose the approval and
// leave the run waiting forever.
message PendingSignal {
  // Name is the signal that arrived.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Payload is what it carried, which becomes the waiting step's outputs.
  Node.Outputs payload = 2;

  // Sender is who the server attested for this signal, carried alongside the
  // payload for the same reason payload is carried: a signal drained before
  // its step is reached must not lose either half when carried across
  // Continue-As-New. Absent for a pending signal carried from before this
  // field existed, which reads as unattested.
  SignalSender sender = 3;
}

// SignalDelivery is what the server hands a waiting workflow over the signal
// channel: the sender's own payload, paired with the sender the server
// attested for it. It is not persisted directly — [PendingSignal] is the form
// that survives Continue-As-New — but the two carry the same pair for the same
// reason: a signal must not lose its sender any more than it may lose its
// payload.
message SignalDelivery {
  // Payload is what the sender sent, unchanged and untrusted — see
  // [SignalSender] for why it never carries identity.
  Node.Outputs payload = 1;

  // Sender is what the server established about the caller before forwarding
  // the payload. Never absent on a signal a current server sends; absent only
  // when reading a delivery recorded before this field existed.
  SignalSender sender = 2;
}

// Scope is what an expression is evaluated against.
//
// It holds the outputs of steps that have already run, plus any variables bound
// by enclosing control flow, such as a loop's current item.
//
// This is part of the schema rather than an internal Go type because it crosses
// the wire: a task that evaluates its own expressions — the cel task's `expr`, the
// http task's `outputs` — does so on a worker, so the scope has to travel with it.
// Without that, a loop body could not use its own iterator in those inputs.
//
// Variables are Values, the same representation step outputs use, so anything a
// step can produce can also be bound as a variable.
message Scope {
  // Outputs holds the outputs of steps that have already run.
  Workflow.StepOutputs outputs = 1;

  // Profile is the workflow's language profile, carried here because this is what
  // reaches the worker that evaluates a task's own expressions.
  //
  // Without it that worker would evaluate against whatever profile its own build
  // calls current, which is the same run computing against two vocabularies — the
  // failure one profile exists to remove, reintroduced at the point where the work
  // actually happens.
  string profile = 3;

  // Vars holds the names bound *where an expression is written*, resolved bare: a
  // `for_each` binding, a step's own `vars:`, `now` inside a wait.
  //
  // The name is a historical one and is kept deliberately. This field has carried
  // bare bindings since before there was a rooted namespace, and an activity
  // scheduled before an upgrade holds that shape in history — a retry after the
  // upgrade replays the same payload. Redefining the field would make a new worker
  // read an old loop's `item` as an ambient var and leave the bare name unbound, so
  // the rooted namespace went to [Scope.ambient_vars] instead and this one did not
  // move. A field that crosses a version boundary means what it has always meant.
  //
  // Because every name here is bare they can collide, and that is refused at
  // validation rather than resolved: a step var that shadows an enclosing loop
  // binding, or either shadowing `now`, is reported at the inner declaration. By the
  // time a spec reaches the engine there is nothing left to decide.
  map<string, Value> vars = 2 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
  }];

  // AmbientVars holds the rooted `vars.<name>` namespace, which is the workflow's
  // declared vars.
  //
  // Only the workflow level declares into here. A step's `vars:` are bare and land in
  // [Scope.vars] instead, because they are author-chosen and lexically local rather
  // than ambient — so there is exactly one source for this map and no shadowing to
  // resolve within it.
  //
  // A new field rather than a new meaning for an old one: see [Scope.vars].
  map<string, Value> ambient_vars = 4 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
  }];

  // Inputs holds the rooted `inputs.<name>` namespace: the arguments this run was
  // started with, checked against [Workflow.declared_inputs] and defaulted at
  // submit.
  //
  // Carried on the scope rather than looked up from the specification where an
  // expression is evaluated, because the specification is not everywhere the scope
  // is: a task declaring `needs_prev_outputs` evaluates its own expressions inside
  // an activity, on a worker holding this message and nothing else. Without the
  // field, `${inputs.region}` would resolve in a step's `if:` and be unbound in the
  // http task's `outputs:` two lines below it — one spelling with two behaviours,
  // decided by a property of the task an author has no reason to know. That is the
  // failure `now` is placed to avoid; see [Scope.ambient_vars], which was added and
  // then omitted from the compacted copy the executor ships, with exactly that
  // result.
  //
  // Values only, never expressions: what a caller sends is data (see
  // [RunRequest.inputs]), and a default is required to be a literal by the
  // compiler.
  //
  // A new field rather than folding these into [Scope.ambient_vars]: a var and an
  // input are different things with different roots, and merging them would make
  // `${vars.region}` resolve an argument nobody declared as a var.
  map<string, Value> inputs = 5 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
    max_pairs: 64
  }];

  // Identity is the attested identity of whoever started this run, exposed to
  // expressions under the `run` root — `run.identity.subject`,
  // `run.identity.issuer`, `run.identity.namespace`, `run.identity.claims` —
  // so a rule can compare the caller who requested the run against the
  // caller who satisfies a gate later. See [RunState.identity], which this is
  // copied from and never anything else: a workflow author cannot set this,
  // and a signal's own sender (see [SignalSender]) cannot either, because
  // both are attested at a boundary the workflow does not control.
  //
  // Deliberately narrower than [WorkloadIdentity] itself: `deployment` is
  // left off, because it answers "which installation ran this" rather than
  // "who is this caller", and that is exactly the question CLAUDE.md's
  // diagnostics rule already answers for a different surface — a fact a
  // deployment decides, not a fact about the file, does not belong in a
  // workflow's own logic. An outbound authorization policy already sees it as
  // `workload.deployment` (see [WorkloadIdentity.deployment]); a workflow
  // gating on it would be asking a question that belongs one layer down.
  //
  // Absent for a run that predates this field, and for every local run — both
  // read as an identity with every field empty, and [Scope.local] is what
  // tells those two cases apart from a run the server genuinely attested with
  // an anonymous identity.
  WorkloadIdentity identity = 6;

  // Local marks a scope built by the local driver (`flow run local`, `flow
  // test`), which has no authenticated caller at all — read under
  // `run.local`. Mirrors [SignalSender.local] for the identical reason: an
  // empty `run.identity.subject` must never be silently confused with a real
  // caller who merely authenticated anonymously (no identity provider
  // configured), so the local driver states outright that nothing here was
  // attested, rather than leaving an author to infer it from an empty string.
  //
  // Never true on any scope the durable driver builds, even when
  // [Scope.identity] is empty because the run was started without
  // authentication — that is only possible in development, and it is still a
  // server attesting an anonymous caller rather than no caller at all.
  bool local = 7;

  // Address is the run's own address — what an expression reads as
  // `run.workflow_id` and `run.run_id`.
  //
  // Carried on the scope for the reason [Scope.inputs] is: a task declaring
  // `needs_prev_outputs` evaluates its own expressions inside an activity, on a
  // worker holding this message and nothing else, so without the field
  // `${run.workflow_id}` would resolve in a step's `if:` and be unbound in the
  // http task's `outputs:` two lines below it.
  //
  // Not carried in [RunState]: each driver derives it where it is, from a source
  // that is stable for the whole run (see [RunAddress]), so there is no value
  // crossing the Continue-As-New seam and nothing for invariant 10 to protect.
  RunAddress address = 8;
}

// RunAddress is a run's own address: the pair that identifies it to anything
// outside it, including this engine's own control plane.
//
// This exists because a workload that has to be *called back* — hand an external
// system a token, wait for that system to answer — cannot say where the answer
// should be sent without it. That is Temporal's `expense` sample, and it is also
// every shape where one run tells a peer how to reach it.
//
// # Why exactly these two fields
//
// [workflow_id] is the address: it is what `flow signal <workflow-id> <name>`
// takes, what `flow get` takes, and what the Signal RPC resolves. [run_id]
// disambiguates which execution of that id — the same workflow id may be
// reused once an earlier run has finished.
//
// What is deliberately absent is a start time and an attempt count, and the
// absence is load-bearing rather than an oversight. A start time is a clock read
// by another name: `now` is bound *only* inside a wait, and docs/ARCHITECTURE.md
// argues that placement at length — a name resolvable only where a replay-safe
// clock exists in every case. Putting a timestamp on the run root would make a
// clock readable from every expression in the language, through a field nobody
// would think of as a clock. An attempt count is the same mistake one layer
// down: it is a fact about the substrate's scheduling, it changes underneath a
// run, and a workflow branching on it is a workflow whose meaning depends on
// how many times a worker happened to crash. Neither belongs here; adding one
// to "complete" the message would quietly undo the reasoning behind `now`.
message RunAddress {
  // WorkflowID is the id the run is addressed by — the same id `flow signal`
  // and `flow get` take.
  //
  // Stable for the whole run, including across Continue-As-New: Temporal keeps
  // the workflow id and mints a new run id for each continued execution.
  string workflow_id = 1;

  // RunID identifies which execution of [workflow_id] this is.
  //
  // The durable driver fills this from Temporal's `FirstRunID`, not from the
  // current execution's run id, and the difference is the whole point: the
  // current run id changes at every Continue-As-New, so a workload that
  // suspended once would report a different address than it did before it
  // suspended — a value that changes halfway through a run, which is exactly
  // what [RunState.vars] exists to prevent for `vars:`. `FirstRunID` is
  // preserved along the whole chain of continued executions, so it names the
  // run an author thinks they wrote.
  string run_id = 2;
}

// ForEach runs a body of steps once per item of a list.
//
// This is how a workload expresses "do this to each of these" without the author
// unrolling it by hand, which they cannot do anyway when the list is computed at
// run time.
//
// The body sees the current item under the iterator's name, and body steps can
// reference each other within an iteration. Body step outputs do not escape the
// iteration; the loop as a whole reports every iteration's outputs through its own
// `results` output, so that what a later step sees does not depend on which
// iteration happened to run last.
message ForEach {
  // Items is an expression producing the list to iterate. An empty list runs the
  // body zero times, which is a normal outcome rather than an error.
  Value items = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Iterator names the variable bound to the current item inside the body.
  // Defaults to "item". It must not collide with a step id, since both are
  // resolved from the same namespace.
  string iterator = 2 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  }];

  // Body is the steps to run per item.
  repeated Node body = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];

  // MaxParallel bounds how many iterations run concurrently. Zero or one runs
  // them one at a time, which is the safe default: concurrency is worth
  // requesting explicitly, because it changes both the load placed on whatever
  // the body touches and the order in which side effects happen.
  int32 max_parallel = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

// Parallel runs several branches of steps concurrently and waits for all of them.
//
// Branches are for work that is independent by construction — checking three
// services, publishing to two destinations — where doing it sequentially wastes
// time for no benefit. Steps within a branch still run in order.
//
// Branches must not depend on each other's outputs. There is no ordering between
// them, so such a dependency would be a race; each branch sees the outputs that
// existed before the parallel node began, plus its own.
message Parallel {
  message Branch {
    repeated Node steps = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
      }
    ];
  }

  repeated Branch branches = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];
}

// Loop repeats a body of steps, carrying a value from one iteration to the next,
// until a condition holds or a hard iteration ceiling is reached.
//
// It is the primitive `for_each` is not. `for_each` maps a body over a list it
// already holds; nothing in it threads a value from iteration N into N+1, and its
// length is fixed before the first iteration runs. A loop is what expresses "keep
// going until you are done, and each step decides where the next one starts" — the
// shape a cursor-paged API has, where you cannot know how many pages there are
// until a page tells you it was the last one.
//
// # Do-while, deliberately
//
// The body runs, and *then* [until] is evaluated — so a loop always runs its body
// at least once, and [until] may read that body's own outputs. That is not an
// arbitrary choice between while and do-while: the whole point is that the stop
// condition is something a body step *produces* (a page reporting it was not
// truncated), which a pre-body check could not see, because on the first iteration
// no body step has run and nothing it could read exists yet.
//
// # The carried value, and why it is one
//
// [state] names a single value the body reads under that bare name — the same
// standing a `for_each` binding has, an author-chosen name bound where the body's
// expressions are written (docs/DSL.md principle 5). [initial] is what it holds on
// the first iteration; [update] computes what it holds on the next, from the
// current value and the body's outputs. All three are optional together: a bounded
// retry-until loop that carries nothing writes none of them.
//
// One carried value rather than a block of several, and that is the smaller
// language on purpose. A named block of state entries would immediately need an
// answer to whether one entry may read another — the exact `vars:`-sibling
// ordering question a protobuf map cannot answer and this repo already refused
// once ([Workflow.vars]). A single value sidesteps it: when several fields are
// wanted, [initial] and [update] are CEL maps, and the ordering question never
// arises because there is one expression, evaluated once per iteration.
//
// # Bounded, because the author does not control the trip count
//
// [until] is a promise the loop cannot keep on its own — a cursor that never
// reports exhaustion, an update that never satisfies the condition, is an infinite
// loop, and the resource an author does not fully control is the iteration count.
// So a loop is bounded by [max_iterations], read through the one function both
// drivers call ([LoopMaxIterations]) so the ceiling cannot disagree with itself,
// and hitting it is a *distinct* failure — the loop reports that it exhausted its
// budget without [until] ever holding, rather than stopping silently as though it
// had finished. See [LoopIterationLimitError], the one sentence both drivers
// report it with.
//
// # Results
//
// A loop reports its body's per-iteration outputs through `results`, exactly as a
// `for_each` does — `results[0]` is the first iteration's body outputs, and so on
// — which is what lets a pagination loop gather every page. When the loop carries
// state, its final value is also reported as `state`, because an accumulate-until
// loop's answer *is* that value and it is reachable nowhere else once the loop
// ends.
//
// # What is deferred
//
// This is slice 1: a *finite* loop, provable by the bound. An unbounded loop that
// runs forever compacting its carried state across Continue-As-New — the entity
// pattern — is a separate, larger slice, because it needs a byte bound on [state]
// and a suspend cadence driven from history size, neither of which a finite loop
// needs. Nested loops and a concurrent loop are deferred too; see docs/DSL.md.
message Loop {
  // Body is the steps to run each iteration.
  //
  // Spelled `steps:` in the DSL, the same key a `for_each` body and a `parallel`
  // branch use, because it is the same thing: a list of steps that runs as a unit.
  // Body step outputs do not escape one iteration into the next any more than a
  // `for_each`'s do — each iteration starts from the outputs visible before the
  // loop, plus the carried [state] — so the only value threaded between iterations
  // is the one [update] computes.
  repeated Node body = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];

  // Until is the stop condition, evaluated after the body each iteration and
  // required to produce a boolean. When it is true the loop stops, reporting normal
  // completion.
  //
  // Evaluated in the scope the body finished in — the body's own step outputs are
  // visible, and so is [state] under its bare name — which is what makes
  // `${!steps.page.truncated}` mean "stop once the last page said it was not
  // truncated". A non-boolean is an error rather than being coerced, the same rule
  // a step's `if:` follows.
  Value until = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // MaxIterations is the author's hard ceiling on how many times the body runs.
  //
  // Zero (or unset) takes [LoopMaxIterations]'s default, which both drivers read
  // from one constant so the ceiling cannot differ between a local rehearsal and a
  // durable run. A value above the absolute cap this field allows is refused by the
  // schema, so the bound the engine enforces is never larger than the one an author
  // can see written down.
  //
  // Reaching it is not a silent stop: the loop fails with [LoopIterationLimitError],
  // because a loop that ran its whole budget without [until] holding did not do what
  // it was asked, and reporting success would hide exactly the runaway the bound
  // exists to catch.
  int32 max_iterations = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100000
  }];

  // State names the value the body carries from one iteration to the next, read
  // *bare* inside the body, [until] and [update]: `${cursor}`.
  //
  // Bare rather than rooted, the same standing as a `for_each` binding and for the
  // same reason (docs/DSL.md principle 5): it is an author-chosen name bound
  // lexically where the expressions that read it are written. `flow validate`
  // refuses a name that collides with an enclosing bare binding, with `now`, or
  // with a declaration root, exactly as it refuses a colliding loop iterator or
  // step var — a bare name may mean one thing at a time.
  //
  // Optional. A loop that carries nothing — a bounded retry-until — leaves this,
  // [initial] and [update] all unset. Setting one without the others is refused by
  // the compiler: a name with no initial value, or a value that never changes, is a
  // mistake worth naming rather than a shape to run.
  //
  // The pattern is ignored when unset, because unset is the whole stateless mode: an
  // empty string is the *absence* of a name, not a malformed one, and applying an
  // identifier pattern to it would refuse the loop that carries nothing — the mode
  // examples/loop-poll-until ships.
  string state = 4 [(buf.validate.field) = {
    ignore: IGNORE_IF_UNPOPULATED
    string: {
      max_len: 128
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    }
  }];

  // Initial is the value [state] holds on the first iteration.
  //
  // Evaluated once, before the loop begins, against the scope the loop node sits in
  // — so it may read `vars.*`, `inputs.*`, and the outputs of steps that ran before
  // the loop, but not [state] itself, which does not exist yet. A literal is the
  // common case (`init: ${''}`); an expression is evaluated like any other.
  Value initial = 5;

  // Update computes the value [state] holds on the *next* iteration, from the value
  // it holds now and the body's outputs.
  //
  // Evaluated after the body each iteration, in the same scope [until] sees — the
  // body's step outputs and the current [state] — which is what lets it say
  // `${steps.page.next_cursor}` (take the next value the body produced) or
  // `${state + steps.tick.amount}` (fold the body's output into an accumulator).
  // Required when [state] is set and refused when it is not.
  Value update = 6;
}

// Call runs another workflow as a step.
//
// This is how a Flowfile stops being a single file. Before it, an organisation's
// second workflow copied its first: there was no way to factor a sequence out, no
// way to version one, and no way to test one apart from the thing that used it.
//
// # Resolved when the file is compiled, carried whole
//
// A `Call` holds the callee's *specification*, not a reference to it. The
// resolution — reading `./provision.yaml`, compiling it, checking its arguments —
// happens once, in the client, when a Flowfile becomes a Workflow.
//
// That is not an optimisation, it is invariant 10. A run's specification is frozen
// when it is submitted and carried across every Continue-As-New in its chain; a
// call resolved by name at execution time would make a durable run depend on a
// definition someone can edit while it is in flight, so a workload could mean one
// thing in its first segment and another in its last. It would also put a
// filesystem read inside a worker, which is the second reason: the server and the
// worker never resolve a path, so there is no traversal surface there to defend.
// The client that reads the author's files is the one place that can.
//
// The cost is honest and worth stating: a specification carrying its callees is
// bigger than one naming them, and it counts against [CheckSpecSize] like
// everything else. A workflow too large to submit is refused with the same
// message it would have been refused with if somebody had pasted the same steps
// in by hand — which is the right answer, because that is what this is.
//
// # A nested run, not an inlining
//
// The callee's steps are kept as a workflow rather than spliced into the caller's
// list, and each of the three reasons is something inlining loses.
//
// A position stays a path. `deploy > provision > network` is where a run is, and
// a flattened list would report `provision-network` — a name nobody wrote, in a
// file nobody can open. Diagnostics and failures name the callee the same way.
//
// The isolation below is real rather than achieved by renaming. And a call remains
// a *place* the engine can decide to execute differently: running one as a Temporal
// child workflow, with its own history and its own versioning, is additive from
// here and impossible after inlining.
//
// # What a callee can see
//
// Its `inputs:`, and nothing else. Not the caller's steps, not the caller's
// `vars:`, not a loop binding it happens to sit inside.
//
// That is the whole point rather than a restriction. A workflow that can read its
// caller's scope is not a unit — it cannot be understood, tested, or reused apart
// from the file that calls it, which is what a call was meant to make possible. It
// is also a security property once workflows are shared: a library workflow cannot
// read the values its caller resolved, including any it resolved from a secret.
//
// What comes back is what the callee `outputs:` declares, under the step's id. A
// callee that declares no outputs is a step that produces none — legal, and the
// right shape for a workflow called for its effects.
message Call {
  // Workflow is the callee, already compiled.
  //
  // Whole rather than referenced, for the reasons on the message above. It carries
  // its own `inputs:` declarations, which is what `arguments` below are checked
  // against — so a call type-checks in an editor, before anything runs.
  Workflow workflow = 1 [(buf.validate.field).required = true];

  // Arguments bind the callee's declared inputs, by name.
  //
  // Values, never expressions evaluated by the callee. They are resolved in the
  // *caller's* scope — where `${steps.build.digest}` means something — and what
  // crosses the boundary is the result. A callee evaluating an expression handed
  // to it would be reading a scope it is not allowed to see, through a string.
  //
  // Every declared input the callee requires must be bound, and binding one it
  // does not declare is refused. Both are decided when the file is compiled, with
  // a position, rather than when the run reaches the step.
  map<string, Value> arguments = 2 [(buf.validate.field).map = {
    max_pairs: 100
    keys: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];

  // Source is where the callee was read from, as written in the file.
  //
  // Carried for diagnostics and for `flow compile` output, so a reader of a
  // compiled specification can see which file a nested workflow came from. It is
  // never resolved again — nothing reads a path from here — which is why it is a
  // plain string with no validation beyond a length: it is a record of what
  // happened, not an instruction.
  string source = 3 [(buf.validate.field).string = {max_len: 1024}];

  // SourceDigest is a content digest of the callee file's bytes, taken at the
  // same moment the resolver reads them, formatted `sha256:<hex>`.
  //
  // Recorded rather than verified, exactly as `source` is: neither is
  // resolved again by anything that reads a compiled specification. What it
  // buys is provenance an operator can audit after the fact — "this run
  // called provision-tenant.yaml at sha256:…" is answerable from a run record
  // alone, without the file that produced it necessarily being reachable, or
  // unchanged, by the time anyone asks. A platform sharing modules across
  // tenants is exactly the setting where "which bytes actually ran" needs an
  // answer that outlives the file.
  string source_digest = 4 [(buf.validate.field).string = {max_len: 128}];
}

// StepPolicy controls the execution of a single step.
//
// These settings exist because one policy cannot fit every step. Reading a
// configuration file and provisioning a cluster differ by orders of magnitude in
// how long they take and how safe they are to repeat, and a workload engine that
// applies the same timeout and the same retry count to both is wrong for at least
// one of them.
message StepPolicy {
  // Timeout bounds a single attempt at the step. A step exceeding it fails that
  // attempt, which may then be retried according to Retry.
  google.protobuf.Duration timeout = 1 [(buf.validate.field).duration = {gt: {}}];

  // Retry describes how a failed attempt is retried. Only failures that could
  // plausibly succeed on another attempt are retried; a step that failed because
  // its inputs are invalid is not retried regardless of this setting.
  RetryPolicy retry = 2;

  // ContinueOnError lets the run proceed when this step fails.
  //
  // The step records its failure instead of ending the run, which is what makes
  // best-effort work expressible: a notification that could not be delivered
  // should not abandon the workload that succeeded.
  bool continue_on_error = 3;
}

// RetryPolicy describes how a failed step attempt is retried.
message RetryPolicy {
  // MaxAttempts bounds total attempts, including the first. Zero uses the
  // engine's default. One disables retrying, which is the right choice for an
  // operation that is not safe to repeat.
  int32 max_attempts = 1 [(buf.validate.field).int32 = {gte: 0}];

  // InitialInterval is the delay before the second attempt.
  google.protobuf.Duration initial_interval = 2 [(buf.validate.field).duration = {gt: {}}];

  // BackoffCoefficient multiplies the delay after each attempt. Values below one
  // are rejected, since a shrinking delay defeats the purpose of backing off.
  double backoff_coefficient = 3 [(buf.validate.field).double = {gte: 1.0}];

  // MaxInterval caps the delay between attempts, so exponential growth does not
  // produce an unbounded wait.
  google.protobuf.Duration max_interval = 4 [(buf.validate.field).duration = {gt: {}}];
}

// Value represents a value that can be used in expressions or as inputs/outputs in tasks.
// It can be a primitive type (like string, int, float, or bool), a structured type
// (like a struct or list), an expression (ParsedExpr), or an error. The Value type is used
// to encapsulate different kinds of data that can be used within the workflow.
message Value {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_STRING = 1;
    TYPE_INT = 2;
    TYPE_FLOAT = 3;
    TYPE_BOOL = 4;
    TYPE_STRUCT = 5;
    TYPE_LIST = 6;
    TYPE_EXPR = 7;
    TYPE_ERROR = 8;
  }

  message Error {
    enum Code {
      CODE_UNSPECIFIED = 0;
      CODE_INVALID_ARGUMENT = 1;
      CODE_NOT_FOUND = 2;
      CODE_PERMISSION_DENIED = 3;
      CODE_UNAUTHENTICATED = 4;
      CODE_INTERNAL = 5;
      CODE_UNAVAILABLE = 6;
    }
    string message = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED
    ];
    Code code = 2 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }
    ];
  }

  // Structure is a list or a mapping whose entries are Values in their own
  // right, rather than one value some expression produces.
  //
  // It exists for exactly one reason: so a secret reference can sit inside a
  // header map, a form or a JSON body. A structure containing an expression
  // compiles into a single CEL expression, and the *workflow* evaluates that —
  // which is what evaluating a reference must never mean, because everything
  // workflow code produces is written to durable, broadly readable history.
  // Keeping every entry a Value keeps the reference a reference for the whole
  // path, and the worker resolves it at the moment it applies the header or
  // encodes the body.
  //
  // Its entries are literals and references, never expressions. That is a
  // deliberate restriction rather than an omission: the walkers that decide
  // which step outputs a resumed run has to carry look for a whole-value
  // expression and cannot see one nested in here, and an output they miss is
  // pruned from a run that then fails after Continue-As-New. The compiler
  // refuses the mixture and says so, which is the fail-closed half of the same
  // fact.
  message Structure {
    // List is a sequence, in the order it was written.
    message List {
      repeated Value values = 1;
    }

    // Map is a mapping. Entry order is not carried, because nothing that
    // consumes one depends on it: headers are a set, a form and a query are
    // encoded in sorted key order, and a JSON object is unordered by
    // definition.
    message Map {
      map<string, Value> entries = 1;
    }

    oneof kind {
      option (buf.validate.oneof).required = true;
      List list = 1;
      Map map = 2;
    }
  }

  oneof kind {
    option (buf.validate.oneof).required = true;
    google.api.expr.v1alpha1.ParsedExpr expr = 1;
    google.api.expr.v1alpha1.Value literal = 2;
    Error error = 3;

    // A reference to a secret, resolved only where the value is needed.
    //
    // This kind is inert everywhere except the activity that uses it. The
    // compiler produces it, the control plane transports it, and workflow-side
    // evaluation passes it through untouched — it is never resolved into a value
    // and never copied into step outputs, because workflow history is durable and
    // broadly readable. Only the worker executing the task resolves it, and the
    // value exists solely for that call.
    SecretRef secret_ref = 4;

    // A list or a mapping whose entries are values, which is the only shape
    // that can hold a [SecretRef] somewhere other than at the top.
    Structure structure = 5;
    // TODO(kent): we're using "value" to represent a "literal" value, which isn't quite the same.
    // So, this is probably worth revisiting. The "value" allows for more complex types, like a
    // struct or list, while the "literal" is more of a primitive value like a string, int, or bool.
    //
    // https://github.com/googleapis/googleapis/blob/34b323e7ee72888dd9337cce8b24233ae078f23b/google/api/expr/v1beta1/expr.proto#L230-L241C9
    // https://github.com/googleapis/googleapis/blob/34b323e7ee72888dd9337cce8b24233ae078f23b/google/api/expr/v1beta1/value.proto#L29-L72
    //
    // google.api.expr.v1alpha1.Literal literal = 2;
  }
}

// Task represents a specific operation that can be performed within a workflow as a node step.
// TaskCatalog is what this build can execute, described so that something other
// than a person can read it.
//
// The task registry is the single source of truth for capability — the engine
// dispatches from it, the validator checks against it, the editor completes from
// it — and until this existed the only way out of the process was a table meant
// for a terminal. An agent driving the CLI as a tool, a generator producing
// documentation, or an editor that is not this project's language server all had
// to parse columns, which is not a contract.
//
// It is a schema type rather than a shape invented in the CLI because it
// describes the system, which is what this file is for: a field added to it
// appears in every consumer without any of them changing, and it is already
// versioned and wire-stable — which is what let GetCatalog return it unchanged
// the day that RPC arrived.
message TaskCatalog {
  // Tasks is every task this build can run, sorted by name.
  repeated TaskDescription tasks = 1;

  // CelLibraries are the CEL extension libraries every expression in a workflow
  // reaches. Not opt-in: a workflow speaks one dialect, so this is the vocabulary
  // of `if:`, `items:`, `wait_until:`, a task input and a `cel` step alike.
  repeated string cel_libraries = 2;

  // DurationUnits are the duration constructors available to *every* expression
  // — `days(3)`, `minutes(30)` — rather than only where a library is enabled.
  // Listed separately for that reason: somebody reading cel_libraries to find out
  // what an expression can say would otherwise conclude these are unavailable.
  repeated string duration_units = 3;

  // NowIdentifier is the name bound to the evaluation moment inside a
  // `wait_until` expression, and nowhere else. It is the one identifier whose
  // availability depends on position, so a reader cannot infer it.
  string now_identifier = 4;

  // ValueRoots are the names an expression reaches a value through: `vars` for a
  // value the file names, `steps` for what a step produced.
  //
  // Here for the same reason NowIdentifier is — a reader cannot infer it from the
  // task list — and the retirement edition made that sharper rather than softer. A
  // consumer reading this catalog now sees two tasks, one of which produces nothing
  // at all, and could reasonably conclude the language has almost no way to compute
  // anything. It has one: an expression, bound under `vars:` at the workflow or on a
  // step, read back through these roots.
  //
  // Roots rather than prose because this message is the machine-readable half. What
  // the roots *mean* is `flow tasks` output and docs/DSL.md; what an agent needs in
  // order to write a reference that resolves is the words themselves.
  repeated string value_roots = 5;

  // CelFunctions is every name the profile's libraries add, sorted by library and
  // then by name.
  //
  // cel_libraries above says which libraries are switched on and nothing about what
  // is in any of them, which is the difference between a fact and an answer: a
  // reader who wants to sort a list learns that `lists` is enabled and still has to
  // go and find cel-go's documentation to discover `sortBy`. That was survivable
  // while the answer was "everything cel-go has"; it stopped being survivable when a
  // profile became a *membership*, because a subset nobody can enumerate is a subset
  // nobody can write against.
  //
  // Both fields, rather than replacing one with the other. A library name is what
  // groups these and what docs/DSL.md and the profile definition talk in, so a
  // consumer that only wants to know the shape of the dialect should not have to
  // derive it from ninety names.
  repeated CELFunction cel_functions = 6;
}

// CELFunction is one name an expression may call.
message CELFunction {
  // Name is written as it is called: `math.abs`, `upperAscii`.
  //
  // With one qualification, for a macro. cel-go identifies a macro by the name after
  // the dot, so `math.greatest(1, 2)` is reported as `greatest` and
  // `[3,1,2].sortBy(v, v)` as `sortBy` — a receiver style whose receiver is a
  // namespace in the first case and a value in the second, which its API does not
  // distinguish. So for a macro this is the name and not the whole call form, and a
  // consumer must not render it as one.
  string name = 1;

  // Library is the profile library that declares it.
  //
  // One library per name even where two declare it: this build's `regex` entry pulls
  // in cel-go's optional types, so an undeduplicated listing repeats all thirteen of
  // `optional` beneath it. A profile is one membership rather than a set of
  // switches, so which library a name arrived through is a fact about wiring, and
  // printing it twice reads as two functions.
  string library = 2;

  // Macro says the parser expands this rather than the evaluator calling it.
  //
  // Visible to an author in one place, which is why it is carried rather than
  // levelled away: a macro is settled when the file compiles, so its meaning is
  // frozen into the compiled workflow, where a function is looked up by whichever
  // worker evaluates the run.
  bool macro = 3;

  // Example is a complete expression calling this, set only where `name` is not
  // enough to construct one — which is exactly the macros.
  //
  // A function's name *is* its call form: `upperAscii` is written `x.upperAscii()`
  // or `regex.replace(a, b, c)` as the name says. A macro's is not, and cel-go's
  // parser API is why: `Macro` exposes `Function`, `ArgCount`, `IsReceiverStyle`
  // and `MacroKey`, and none of them names the *receiver*. So `greatest` is
  // reported for something written `math.greatest(1, 2)` and `sortBy` for
  // something written `[3,1,2].sortBy(v, v)` — a namespace in one case and a value
  // in the other, indistinguishable from the outside.
  //
  // Which means this cannot be derived, and a consumer told "do not render `name`
  // as a call" and given nothing else has been handed a catalogue of things it
  // cannot use. It is a written table, kept honest the way this repo keeps the
  // things that cannot be derived: a test asks the environment for its macros and
  // fails on any that has no example, and every example is *evaluated* rather than
  // inspected, so an entry that stops working stops passing.
  //
  // Deriving it was tried and rejected rather than skipped. A library's macros can
  // be paired with the internal `@` names it declares — `math.@max` alongside
  // `greatest` gives `math` — and that is right for `math` and `bindings` and
  // silently wrong for `comprehensions`, which declares `cel.@mapInsert` while
  // `transformList` is written on a value. A derivation that is wrong for one
  // library in five is worse than a table somebody has to keep, because nothing
  // about it says which one.
  string example = 4;
}

// TaskDescription is one task's name and shape.
message TaskDescription {
  string name = 1;

  // Summary is a single line, the same one `flow tasks` prints.
  string summary = 2;

  repeated TaskField inputs = 3;
  repeated TaskField outputs = 4;
}

// PluginCatalog is what a deployment's plugins add to this build, described so
// that something other than a person can read it.
//
// The same argument as [TaskCatalog], applied one process boundary out. A plugin
// is code the engine does not ship, so "which tasks can this worker run" stops
// being a property of the binary and becomes a property of a deployment — and a
// question nobody can ask from outside is one every operator answers by reading
// logs.
//
// A plugin's task is described by [TaskDescription], the same message a built-in
// one is. That is not a convenience: a plugin ships protobuf descriptors for its
// inputs and outputs, so there is genuinely nothing left over to say about it,
// and giving it a parallel message would have been a second definition of the
// same thing. Where the two differ is *provenance*, which is the field this
// message adds and the reason it exists — a reviewer needs to know that a step
// leaves the engine's code.
//
// Wire-stable, on the same terms as [TaskCatalog], and for the same reason: a
// worker-introspection RPC that wants to return one should not have to invent a
// shape the CLI already prints.
message PluginCatalog {
  // Plugins is every plugin the worker brought up, sorted by name.
  repeated PluginDescription plugins = 1;

  // SearchPath is the directories the worker was configured to discover plugins
  // in, in precedence order.
  //
  // Carried because an empty plugin list has two meanings that matter to tell
  // apart — nothing installed, or nowhere to look — and only one of them is a
  // configuration mistake.
  repeated string search_path = 2;
}

// PluginDescription is one plugin's identity and what it advertises.
message PluginDescription {
  // Name is the segment after `flowstate-plugin-` in the executable's name, and
  // is how discovery establishes it. It is not self-reported.
  string name = 1;

  // Version is what the plugin says it is. Informational: compatibility is
  // decided by the protocol version, not by this.
  string version = 2;

  // Description is the plugin's own one-line summary.
  string description = 3;

  // Path is the executable this worker launched, which is the fact an operator
  // wants when two directories on the search path hold the same name.
  string path = 4;

  // SecretSchemes are the secret reference schemes this plugin resolves.
  repeated string secret_schemes = 5;

  // Tasks are the tasks this plugin provides, described exactly as a built-in
  // task is.
  repeated TaskDescription tasks = 6;
  uint32 protocol_version = 7;
  string task_schema_digest = 8;
  string distribution_digest = 9;
}

// TaskField is one input or output, described in the DSL's vocabulary.
message TaskField {
  string name = 1;

  // Type is what an author would call it — `string`, `list[string]`,
  // `map[string, string]`, or `any` where the shape is whatever an expression
  // produced. Deliberately not the Protobuf type name, which is accurate about
  // the schema and useless about the file being written.
  string type = 2;

  // Required reports whether the task cannot run without this input. Never set on
  // an output, where the question does not arise.
  bool required = 3;

  // Deferred reports that the task evaluates this input's expression itself,
  // against a scope the workflow does not have.
  //
  // It changes what may legally be written here, which is why it is a field
  // rather than prose: `http`'s `outputs` may name `status_code` because the task
  // evaluates it after the response arrives, and an ordinary input may not,
  // because the engine resolves it before the step is even scheduled.
  bool deferred = 4;
}

message Task {
  // Log is a task that emits a message for a person to read.
  //
  // It exists because `echo` was doing this job under a name that describes the
  // wrong thing: echo *returns* a value, and the two uses that survived `vars:` —
  // hello-world scaffolding and "this branch ran" markers — were never about the
  // return. They were about someone seeing it. Naming the capability after what it
  // is for is what lets the surfaces that show it (a `flow run` transcript, the
  // watch view, the run record) treat it as a message rather than as a value that
  // happens to be printed.
  //
  // # It has no outputs, deliberately
  //
  // A log line is an effect on a reader, not a value for a later step. Offering
  // `result` would make `${steps.announce.result}` legal, which is the `vars:` use
  // case sneaking back in through the one task that has no business carrying data —
  // and it would give a step two reasons to exist, so the file could no longer say
  // which one was meant. A capability that emits nothing is how this language says
  // "this produces nothing you can read".
  message Log {
    message Inputs {
      // Message is the line a person reads. It is the whole point, so it is the
      // only required input.
      string message = 1 [
        (buf.validate.field).required = true,
        (google.api.field_behavior) = REQUIRED
      ];

      // Level says how much it matters, and defaults to LEVEL_INFO.
      //
      // An enum rather than a free string, because a sink has to map it onto
      // something — a terminal colour, a severity field, a filter — and a set that
      // an author can extend by typo is a set nothing downstream can switch on.
      Level level = 2 [(buf.validate.field).enum = {defined_only: true}];

      // Fields carry structure for a sink that has somewhere to put it, and are
      // ignored by one that does not.
      //
      // String-valued rather than Value-valued, and that is a real limit rather
      // than an oversight: every sink this can reach — a terminal line, a logging
      // backend's attributes, a run record — renders to text in the end, and a
      // nested value would render differently at each of them. Compose the string
      // in the expression, where the author can see what it will say.
      //
      // Bounded because a workflow chooses both the count and the size, and a log
      // line is written to durable history.
      map<string, string> fields = 3 [(buf.validate.field).map = {
        max_pairs: 32
        keys: {
          string: {
            min_len: 1
            max_len: 64
          }
        }
        values: {
          string: {max_len: 1024}
        }
      }];
    }

    // Level is how much a message matters.
    //
    // Three, and no more without a reason: `debug` is a *deployment* concern rather
    // than an authoring one — a workflow author cannot know what a given operator
    // wants filtered — and `fatal` is a claim about control flow that a task has no
    // way to honour, since emitting a line does not stop the run.
    enum Level {
      // Unspecified reads as LEVEL_INFO, so a `log:` that says nothing about level
      // is the ordinary case rather than an error.
      LEVEL_UNSPECIFIED = 0;
      LEVEL_INFO = 1;
      LEVEL_WARN = 2;
      LEVEL_ERROR = 3;
    }

    // Outputs is empty and stays empty.
    //
    // Present rather than absent because every task's shape is described from a
    // descriptor — `flow tasks` and the language server both read one — and a task
    // with no message at all would have to be a special case in each of them. An
    // empty message says "nothing" in the same vocabulary everything else uses.
    message Outputs {}
  }

  // Echo, Printf and CEL were tasks here, and are retired at edition v2026.2.
  //
  // Each of them existed to produce a *value*, from a time when a step was the
  // only thing that could hold one. `vars:` is that thing now, at the workflow, at
  // the step and inside a loop body, so all three had become a step whose only job
  // was to name an expression — with a run record entry, a retry policy and a
  // history event to pay for it. `echo` additionally meant two unrelated things
  // depending on whether anyone read its `result`; the half that was about being
  // seen is `Log`, above.
  //
  // Deleted rather than left registered-but-refused, because a build executes one
  // grammar. A spec still carrying one of these names is refused by the registry
  // at validation, which is a diagnostic naming the file, rather than by a
  // descriptor that exists and dispatches to nothing.
  //
  // The names are not reserved, because these were nested messages rather than
  // fields: nothing addresses them by number, and a future `Task.CEL` would be a
  // new type under a reused name in a schema no worker replays a retired task
  // from. What is reserved is the meaning of a *number*, which is why the fields
  // inside them are gone with them.
  //
  // `flow fix` rewrites all three — see flowfile/fixretire.go, which moves a read
  // value into `vars:` and refuses where the choice is the author's.

  // HTTP is a task that performs an HTTP request to a specified URL with optional method, headers, and body.
  // It returns the HTTP response status code, headers, and body as outputs.
  //
  // This is obviously useful, but also dangerous since it's just SSRF (Server-Side Request Forgery) in disguise.
  message HTTP {
    message Inputs {
      string url = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uri = true,
        (google.api.field_behavior) = REQUIRED
      ];
      optional string method = 2 [(buf.validate.field).string = {
        min_len: 3
        max_len: 6
        pattern: '^(?i)(GET|POST|PUT|PATCH|DELETE)$'
      }];
      // Request headers.
      //
      // Strings, because a header is text on the wire — and a secret reference is
      // not a string, so a `headers:` mapping carrying one never reaches this
      // field at all. It arrives as a [Value.Structure] among the task's inputs
      // and is applied entry by entry, each reference resolved as its header is
      // set. Both paths end on the same [http.Header]; only one of them can hold
      // a reference, and it holds it as a reference right up to the last moment.
      //
      // Resolving into this field instead would be the mistake worth naming: a
      // proto struct field is exactly what `fmt` reflects into, so a header
      // resolved here would print under `%+v` of the inputs, of the task, and of
      // anything holding either.
      map<string, string> headers = 3;

      // A raw request body, sent as written.
      //
      // A string, and so unable to carry a secret reference: there is nothing
      // between the field and the wire that could resolve one. A body that needs
      // a credential in it is a `json` or a `form` body, both of which the task
      // encodes itself and can therefore resolve into.
      optional string body = 4;

      // Bearer is the credential for an Authorization header, and it is the
      // first task input built to take a secret reference.
      //
      // A `Value` rather than a string, deliberately: a field declared as Value
      // receives the author's value whole — reference included — where a string
      // field can only hold what the workflow already evaluated, and evaluating
      // a secret is what would put it in history.
      //
      // A reference can also sit inside `headers` now, as one entry of a
      // [Value.Structure], which is what makes `Authorization` writable by hand.
      // This field stays, and stays the recommended spelling: it says what the
      // credential *is*, so the worker renders the header and an author cannot
      // get the scheme wrong — and it leaves the rest of `headers` free to hold
      // expressions, which a structure carrying a reference deliberately cannot.
      //
      // The worker resolves it inside the activity and sends
      // `Authorization: Bearer <value>`. The name says the scheme so the field
      // cannot quietly become a junk drawer: a future credential shape gets its
      // own field, named for what it is.
      Value bearer = 12;

      // Credential names an outbound federation target configured by the
      // deployment, such as "aws-prod" or "partner-api". The worker authorizes
      // the exact workload and step, mints a short-lived assertion, exchanges it,
      // and applies the resulting bearer credential inside the activity. No
      // credential material crosses workflow history.
      //
      // AWS session targets are deliberately refused by the generic HTTP task:
      // they require SigV4 request signing and belong in an AWS-aware task.
      optional string credential = 13 [(buf.validate.field).string = {
        min_len: 1
        max_len: 128
        pattern: "^[a-z][a-z0-9-]*$"
      }];
      // Optional outputs shaping: when provided, the HTTP task will return only
      // the named outputs defined by this map instead of the default outputs.
      // Values are evaluated as CEL expressions (or used as literals) with the
      // following variables available:
      //   - status_code (int)
      //   - body (string)
      //   - headers (map<string,string>)
      //   - json (the parsed body, when `parse_json` asked for it)
      // This enables payload minimization by selecting just the fields needed.
      map<string, Value> outputs = 5;

      // Query parameters, escaped and appended to the URL.
      //
      // Building a query string by hand is where escaping bugs live, and they are
      // the kind that work until a value contains an ampersand.
      //
      // A secret reference here is refused rather than resolved, and it is the one
      // input of this task where that is a decision about the *destination* rather
      // than about the mechanism: query strings are written to access logs, kept in
      // browser history, and forwarded in Referer headers by anything that follows
      // a redirect. `form` is the same kind of map, encoded by the same function a
      // few lines away, and accepts one — so the refusal is stated twice on
      // purpose, once in the compiler where an author can see it and once in
      // `valueToQueryString` for a specification that never met the compiler.
      map<string, Value> query = 6;

      // A structured request body, serialized as JSON with a matching Content-Type.
      //
      // The common case, and until now the most laborious: sending an object meant
      // building the JSON by hand in a CEL expression and remembering the header.
      // Mutually exclusive with `body` and `form` — three ways to say what to send
      // is a request whose meaning depends on field order.
      //
      // A field of the body may be a secret reference, at any depth: the task
      // serializes the body itself, inside the activity, so the reference is read
      // as the bytes are written and nowhere earlier.
      Value json = 7;

      // A form body, url-encoded with a matching Content-Type. Mutually exclusive
      // with `body` and `json`.
      //
      // An entry may be a secret reference — an OAuth `client_secret` is the case
      // — and it is resolved as the body is encoded, inside the activity. The
      // difference from `query`, which is the same kind of map encoded by the same
      // function, is entirely the destination: a form body is sent in the request,
      // where a query string is written down by everything it passes.
      map<string, Value> form = 8;

      // Which responses count as success, as a CEL expression over the same
      // variables `outputs` sees.
      //
      // The default is unchanged and needs no expression: 2xx succeeds, 4xx fails
      // permanently, 5xx is retried. This is for the cases that default cannot
      // express — a 404 that means "not there yet, and that is fine", or an API
      // that answers 200 with an error in the body:
      //
      //   expect: ${status_code == 200 || status_code == 404}
      //   expect: ${status_code == 200 && !json.error}
      //
      // One expression rather than a status list plus a predicate, because a list
      // is the expression `status_code in [200, 404]` and two spellings of one idea
      // is two things to keep in agreement.
      Value expect = 9;

      // Parse the response body as JSON into the `json` output.
      //
      // Off by default, and deliberately not inferred from Content-Type: parsing an
      // untrusted body is work an attacker chooses, so it happens when an author
      // asked for it. A body that is not JSON is an error naming the offset, not a
      // silently empty value.
      optional bool parse_json = 10;

      // Retry a non-idempotent request whose outcome is unknown.
      //
      // A POST that reached the server and then failed before answering may have
      // taken effect, so by default it is not retried: doing the operation twice is
      // worse than surfacing a failure that might have resolved on its own. Set
      // this when the endpoint is idempotency-keyed and a retry is therefore safe.
      //
      // It does not affect a request that never connected, which is retried for any
      // method because it cannot have taken effect.
      optional bool retry_on_unknown_outcome = 11;
    }
    message Outputs {
      int32 status_code = 1 [(buf.validate.field).int32 = {
        gte: 100
        lte: 599
      }];
      map<string, string> headers = 2;
      // Response body, returned by default so a step can be referenced as
      // ${steps.<id>.body}. Large responses are better trimmed with the `outputs`
      // input above, which keeps workflow payloads small.
      string body = 3;

      // The response body parsed as JSON, present when `parse_json` asked for it,
      // so ${steps.<id>.json.items[0].id} works without a second step to parse it.
      //
      // Deliberately a single value rather than a repeated one, and it should stay
      // that way. A streaming response is not a unary response with more elements —
      // it is a different interaction shape with a different execution model, since
      // a long-lived stream cannot live inside one activity at all. When streaming
      // arrives it gets its own field, which costs nothing because adding a field is
      // additive. Widening this one to repeated would break every workflow that
      // reads it, and would make every author write [0] forever to accommodate a
      // shape their request does not have.
      //
      // Carried as a CEL value rather than google.protobuf.Value because that is
      // already how this schema represents a literal, so the conversions an
      // expression needs to read it exist rather than being a third value type to
      // translate between.
      //
      // A JSON number arrives as a double, so `{"id":7}` reads as 7.0 rather than
      // 7. That is what encoding/json produces for an untyped number and what the
      // `json_parse` CEL function already does, and one rule that surprises is
      // better than two that disagree. It matters when comparing: write
      // `${call.json.id == 7}` and CEL will compare numerically, but do not expect
      // `string(call.json.id)` to read as "7".
      google.api.expr.v1alpha1.Value json = 4;
    }
  }

  // Tasks have specific names that identify the type of task being performed,
  // such as "log" or "http". The name is used to determine which task
  // implementation to execute when the workflow is run.
  //
  // # A dot means a plugin, and its absence means the engine
  //
  // A built-in task is one bare word. A plugin's task is two, joined by a dot —
  // `slack.post` is the `post` task of the plugin discovered as
  // `flowstate-plugin-slack` — and the dot is provenance rather than decoration:
  // it tells a reviewer that this line leaves the engine's code and enters code
  // somebody installed, at the step, where that fact is needed. It also makes
  // collision unrepresentable in both directions. A plugin task cannot shadow a
  // built-in because a plugin's tasks all carry a dot and no built-in does; two
  // plugins cannot fight over one name because each one's tasks are prefixed
  // with a name discovery established from the binary, not self-reported.
  //
  // At most one dot, by the pattern below. The first segment is a plugin name
  // (`^[a-z0-9][a-z0-9-]*$`, from the executable's own name) and the second a
  // task name (`^[a-z][a-z0-9_]*$`, from its manifest); the pattern here is the
  // permissive union rather than that concatenation, because this field also
  // spells built-in names with their historical uppercase-and-dash latitude, and
  // the registry enforces the sharper per-segment rules at registration.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+(\\.[A-Za-z0-9-_]+)?$"
    }
  ];

  // Field 2 held a description of the task. Prose about a step belongs to the
  // step — `Node.description` — because a step names its task directly now, so the
  // value under `echo:` is that task's inputs and a `description` written there
  // would be an input of that name. A `for_each` or a `sleep` is as worth
  // explaining as a task is, and only the step can carry that.
  //
  // Reserved rather than reused: a number that meant something else in a spec some
  // worker may still be replaying must never come back with a new meaning.
  reserved 2;
  reserved "description";

  // Inputs are the parameters that the task requires to perform its operation.
  map<string, Value> inputs = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
    }
  ];
}

// RunRequest is the request message for running a workflow.
message RunRequest {
  Workflow workflow = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Inputs are the arguments this run is started with, keyed by the name an
  // [InputDeclaration] on the workflow gave.
  //
  // # Values, never expressions
  //
  // Every [Value] here must be a literal. Not a convention — the security posture
  // of the whole surface. These arrive from whoever can call Run, which is the
  // definition of an untrusted party, and an expression accepted from there is
  // code the server would evaluate on its own behalf, in a scope holding the
  // run's own values. An expression is something a file says, and a file is
  // reviewed and compiled; this is data a caller sends. `secret_ref` is refused
  // for the neighbouring reason: a caller naming a secret would be choosing which
  // credential the run resolves, which is a decision that belongs to the
  // specification and its policy.
  //
  // The oneof cannot say which arm is allowed — protovalidate rules attach to
  // fields — so the server enforces it at submit, together with the rest of the
  // check against the declarations: every required input present, no undeclared
  // name, every value of the declared type, defaults filled in for what was left
  // out. Fail closed on each: a run that would be wrong is refused while the
  // caller is still there to be told.
  //
  // # Size (invariant 9)
  //
  // These become part of the run's state, so they are weighed by
  // `CheckRunStateSize` at every Continue-As-New along with everything else the
  // run carries — `proto.Size` on the whole message, so nothing has to be added
  // to a tally by hand. The submit-time check is `CheckSpecSize` on the workflow;
  // a caller who could push a run past the blob limit with arguments alone would
  // have found the hang that invariant exists to convert into an answer.
  map<string, Value> inputs = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
      max_pairs: 64
    }
  ];

  // EntityKey turns a stable business key into the run's workflow id, in place of
  // today's random one, so a long-lived workload — a subscription, an order, an
  // incident — can be addressed by what it *is* rather than by an id nobody wrote
  // down. Unset is byte-identical to today: a `flowstate-workflow-<uuid>` id, same
  // as every run before this field existed (invariant 10, no compatibility arm
  // needed because the zero value already means "generate one").
  //
  // # The id is namespace-scoped, and the request never says which namespace
  //
  // The other half of the id is the caller's own tenant, taken only from
  // [FlowstateServer.identityFor] — the same rule [fairnessFor] already applies to
  // scheduling priority and invariant "a workload's namespace comes from the
  // authenticated caller, never from the workload itself" states generally. A
  // request cannot name the namespace half of its own address, or a caller could
  // address (and collide with) another tenant's entity by asserting their
  // namespace as a field value rather than authenticating as them.
  //
  // # Grammar, and why it is the same grammar a namespace already has
  //
  // Lowercase ASCII letters, digits, and a dash that is never first — identical to
  // [auth.ValidateNamespace]'s grammar, and deliberately so: the two halves are
  // joined by a single separator character neither grammar permits (see
  // `EntityWorkflowID` in `pkg/flowstate/v1/entity.go`), which is what makes the
  // join unambiguous. CLAUDE.md's env-provider incident is the exact trap this
  // avoids — `prefix + NAMESPACE + "_" + name` let `TEAM_A` + `KEY` collide with
  // `TEAM` + `A_KEY` because every character legal in the prefix was also legal in
  // the name. Here, neither half can contain the separator, so there is only ever
  // one place the string could have been split, and it is the right one.
  //
  // # The key is metadata, not a secret
  //
  // A workflow id is visibility data: the cluster indexes it, every listing
  // and every UI shows it, and no payload codec can ever cover it, because
  // encrypting the address a workload is reached at would leave nothing to
  // reach it by. On a deployment that encrypts payloads, this key is still at
  // rest in plaintext. Name the workload by what it is publicly known as, an
  // order id or a subscription id, and never by a value the codec exists to
  // protect. The same rule holds for search attributes, and for the same
  // structural reason; the guard is `runSearchAttributes` in
  // `pkg/flowstate/v1/server`.
  optional string entity_key = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z0-9][a-z0-9-]*$"
  }];
}

// RunResponse is the response message for a workflow run.
message RunResponse {
  message Error {
    string message = 1 [(buf.validate.field).required = true];

    // Kind classifies why the run failed, mirroring flowstatev1.ErrorKind — the
    // same classification retry policy is built from, so an agent (or any
    // programmatic consumer) can decide "repair the file / retry / escalate to
    // the operator" without parsing Message.
    //
    // A plain string rather than an enum: the set this names already lives as a
    // Go type in the execution-independent layer (errors.go) because it drives
    // retry semantics on both drivers before it ever needed to travel, and it
    // already crosses the durable driver's own wire — Temporal's
    // ApplicationError carries it as its Type — as this same string. Restating
    // it as a second, proto-owned enum would be two closed sets that could
    // disagree about what "PolicyDenied" means; this field is that value
    // reaching the client rather than a parallel definition of it.
    //
    // Always set alongside Message, on the same rule flowstatev1.ClassifyError
    // itself follows: a failure this driver cannot otherwise classify is
    // reported as "Internal" rather than left blank, because an unclassified
    // failure is a gap in Flowstate and not a statement that nothing is known.
    string kind = 2;
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RUNNING = 1;
    STATUS_COMPLETED = 2;
    STATUS_FAILED = 3;
    STATUS_CANCELED = 4;
    STATUS_TERMINATED = 5;
    STATUS_TIMED_OUT = 6;
  }
  // WorkflowId is `flowstate-workflow-<uuid>` for an ordinary run and
  // `flowstate-entity-<namespace>_<entity_key>` for one started with
  // [RunRequest.entity_key] — no longer a bare UUID, so the format constraint
  // is a length bound rather than [buf.validate.field.string.uuid], which the
  // generated id never actually satisfied on its own (it is a prefixed string,
  // not a bare UUID) and which an entity-addressed id cannot satisfy at all.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
  string run_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  Status status = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  oneof kind {
    option (buf.validate.oneof).required = true;
    Error error = 4;
    Workflow.StepOutputs outputs = 5;
  }
}

// GetRequest is the request message for getting a workflow run.
message GetRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  optional string run_id = 2 [(buf.validate.field).string.uuid = true];
}

// GetResponse is the response message for getting a workflow run.
message GetResponse {
  string workflow_id = 1;
  string run_id = 2;
  RunResponse.Status status = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  oneof kind {
    option (buf.validate.oneof).required = true;
    RunResponse.Error error = 4;
    Workflow.StepOutputs outputs = 5;
  }

  // StartTime is when the workload began, and CloseTime when it finished — unset
  // while it is still running, so "has not finished" and "finished at the epoch"
  // stay distinct.
  //
  // Same two fields a listing reports, with the same names and the same meaning,
  // because a listing already answered them and a Get did not: `flow list` could
  // tell you a run had been going for an hour and `flow get <id>` on the same run
  // could only tell you it was running. One verb knowing less about a run than the
  // verb that enumerates it is the wrong way round — Get is the one a person
  // reaches for when they care about a *particular* run.
  //
  // Both come off the same DescribeWorkflowExecution response the status does, so
  // this costs nothing but the field.
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp close_time = 7;

  // Progress is where a running run has got to. Unset for any other status, since a
  // finished run's position is its outputs.
  //
  // Unset does not mean "at the beginning". It also means no worker answered, or
  // that the run is on an interpreter built before this existed — facts about the
  // deployment rather than about the workload. A reader that rendered an unanswered
  // query as "step 1 of 5" would be inventing one.
  RunProgress progress = 8;

  // PendingActivities are the steps Temporal is retrying right now, with why the
  // last attempt failed and when the next one is due.
  //
  // This is the answer to "why has this been RUNNING for six hours", and until
  // it was carried here that answer was unobtainable through Flowstate at all:
  // Temporal's Describe response held it, the server read only the status beside
  // it, and an operator had to leave the tenancy boundary this service enforces
  // and ask the temporal CLI directly. Set only for a RUNNING run, on the same
  // reasoning progress is; empty for a running run means nothing is mid-retry,
  // which is itself the answer — the run is waiting or between steps, not stuck.
  repeated PendingActivity pending_activities = 9;

  // Outputs are the values the workflow declared it would report, computed by
  // this run — the answer, as against the transcript `outputs` above holds.
  //
  // A new field beside the existing oneof rather than a third arm in it: the
  // oneof answers "did it fail", which is a different question from "what did it
  // produce", and a run can perfectly well have both a status and a result. Unset
  // means the workflow declared no outputs, or the run has not finished, or the
  // run was started before this existed — all three of which are honestly
  // "nothing to report" rather than "an empty result", which is why there is no
  // empty message to distinguish them.
  RunOutputs run_outputs = 10;

  // EntityState is a bounded snapshot of a RUNNING run's carried state — its
  // top-level `vars:` and the value each active `loop:` is carrying between
  // iterations — answered by a second Temporal query beside
  // [RunProgress]'s, for the reason [RunProgress] itself exists: nothing
  // outside a running workflow knows its own state, because the state lives
  // in the interpreter's own memory rather than in anything the service
  // records, so the only way to ask is a query that reaches the worker.
  //
  // # Why this exists at all
  //
  // Outputs (both arms of the oneof above) populate only on
  // STATUS_COMPLETED. An entity — a run shaped as `loop:` +
  // `wait_for_signal:` that is never meant to finish — is by design always
  // RUNNING, so before this field existed its state was categorically
  // unreadable: not even by its own owner, and not without either signaling
  // it (mutating it to provoke a readable output — the wrong tool for a
  // read) or waiting for it to end, which it structurally never does.
  //
  // Set only for a RUNNING run, on [RunProgress]'s exact reasoning: a
  // finished run's state is its outputs, which the oneof above already
  // answers.
  EntityState entity_state = 11;

  // Starter is who submitted this run, as the qualified `issuer#subject` string
  // the server recorded on it at submit.
  //
  // # Why it was invisible, and why that mattered
  //
  // A run has always recorded its starter - `FlowstateServer.Signal` reads it
  // out of the run's memo to enforce [SignalPolicy.distinct_from_starter] - and
  // no RPC answered with it. So a workflow could declare "the approver may not
  // be whoever asked for this", the server could enforce it exactly, and nobody
  // outside the server could see the fact being compared against. An operator
  // told `PermissionDenied` on a `flow signal` had no way to learn that they
  // were being refused for being the starter, and a surface rendering an
  // approval gate could not say who was asking.
  //
  // # Why the raw qualified string, not a rendered display form
  //
  // Because `issuer#subject` is exactly what a [SignalPolicyRule.subject] names,
  // and [QualifiedSubject] is the one join that produces it. A surface holding
  // this can compare it to a policy rule, or to its own caller's identity, with
  // a string equality that is the same comparison [SignalPolicyCheck] makes.
  // Rendering it - splitting it, shortening it, dropping the issuer - would give
  // this field a second, prettier spelling of an identity that this schema is
  // otherwise careful to keep in exactly one form, and a reader who compared the
  // pretty one would have written a check that passes for a subject minted by a
  // different identity provider. A client that wants a display form can cut on
  // the separator; a client that wants to compare must not have to reassemble.
  //
  // # Absent means absent
  //
  // Empty for a run started before the starter was recorded at all, and for one
  // whose memo could not be read. There is no compatibility arm and no
  // placeholder: "this server does not know who started this run" is a true
  // answer and a different one from any subject, and a reader must not be handed
  // something that compares equal to a real identity. Authorization never reads
  // this field - it reads the same memo itself, and denies rather than proceeds
  // when the answer is missing (see the server's authorizeSignal) - so an empty
  // value here weakens nothing.
  string starter = 12;
}

// EntityState is a bounded projection of a running workload's carried state,
// answered by a Temporal query that reaches a live worker rather than
// derived from anything the service itself records.
//
// # Bounded twice, on two different resources
//
// Vars and LoopState are themselves already bounded transitively — every
// value in them travelled here inside a `RunState` that `CheckRunStateSize`
// already refused to let grow past Temporal's blob limit at the last
// Continue-As-New — but a query answer is its own resource, read by a
// caller who did not ask "how big is this," so this message additionally
// caps how many loop entries it reports (an author writing several
// concurrent loops inside a `parallel:` block is not a hazard the blob-size
// check alone would catch) and how many bytes the whole projection may
// serialize to. Either bound being reached sets [truncated] rather than
// silently dropping data or growing the response without limit: see
// `entityStateMaxLoopEntries` and `entityStateMaxBytes` in
// `pkg/flowstate/v1/engine/progress.go`.
message EntityState {
  // Vars are the workflow's own top-level `vars:`, evaluated once at the
  // start of the run — the same values every step's `${vars.*}` reads,
  // snapshotted at query time.
  map<string, Value> vars = 1;

  // LoopState is, for every `loop:` currently active in this segment, the
  // value its `state:` binding is carrying into the next iteration — keyed
  // by the loop step's own id. A loop with no `state:` (a bounded
  // retry-until carrying nothing) has no entry here, and a loop not
  // currently active — finished, or not yet reached — has none either.
  map<string, Value> loop_state = 2;

  // Truncated is true when this snapshot was cut down to stay inside this
  // message's own bound (see the message-level comment) rather than reflect
  // the full state a caller free of that bound would see. A truncated
  // answer omits vars and loop_state entirely rather than reporting a
  // partial, silently-incomplete map — a reader must not mistake "some of
  // the keys" for "all of the keys, this run just does not have more."
  bool truncated = 3;
}

// PendingActivity is one activity Temporal is retrying, projected from its
// Describe response into the vocabulary this schema speaks.
//
// Deliberately not named by step. Temporal identifies a pending activity by an
// id it generated and a function name the engine registered, and neither is a
// name an author chose; the engine cannot stamp the step's id onto the activity
// either, because a loop running iterations in parallel schedules one step id
// several times at once and activity ids must be unique. Which step a running
// run is on is the progress query's answer, one field over — the two are read
// together, and a field here that claimed the step would be guessing.
message PendingActivity {
  // Attempt is the attempt about to run or running, starting at 1. An attempt
  // count climbing on a RUNNING run is the signature of a workload that is
  // stuck rather than working.
  int32 attempt = 1;

  // LastFailure is the message of the most recent failed attempt, which is the
  // sentence that usually contains the whole diagnosis.
  string last_failure = 2;

  // NextAttemptScheduledTime is when the next attempt is due. Unset when an
  // attempt is running right now.
  google.protobuf.Timestamp next_attempt_scheduled_time = 3;

  // Phase is what the running attempt last said it was doing — `requesting`
  // while a request is out, `reading the response` once a peer has answered,
  // `calling the plugin` around a plugin's RPC.
  //
  // This is the field that separates "this step has been running for four
  // minutes" from knowing which end of it is slow, and the two phases an http
  // request moves through fail differently: stuck requesting is a peer that has
  // said nothing, stuck reading is a peer that answered and then stopped
  // talking.
  //
  // Unset in three situations that a reader must not confuse with a fourth.
  // The attempt may be between its start and its first report; it may be
  // waiting to be retried, in which case nothing is running to have a phase at
  // all; or the worker may be older than this field. None of those means "the
  // step is doing nothing", and a renderer that printed a blank phase as an
  // absence of work would be inventing one.
  //
  // The vocabulary is closed on purpose, and that is a security property rather
  // than a style. This is projected from an activity heartbeat, heartbeats are
  // written into workflow history, and history is durable and broadly readable —
  // so a phase built from a task's inputs would be invariant 7's exact failure.
  // The worker enforces it with a type that has no constructor; see
  // `v1.Phase` and the AST check beside it.
  string phase = 4;
}

// RunProgress is where a run has got to, answered by the running workflow itself.
//
// Not derivable from outside. A listing and a Describe both know a run is RUNNING and
// neither knows what it is running, because the position lives in the interpreter's
// own stack rather than in anything the service records. So it comes from a Temporal
// query, which is the one way to ask a workflow a question without changing it: a
// query runs against the live state, writes no history event, and cannot make the run
// do anything.
message RunProgress {
  // StepId is the top-level step the run is on.
  //
  // Top-level always, which is a floor rather than a limitation. A run inside a
  // parallel block or a concurrent loop is on several steps at once and has no single
  // position — the same reason the engine refuses to suspend there — so the answer
  // that is always true is the outermost one.
  string step_id = 1;

  // Path is the position from that step inward, where there is one: the loop and the
  // body step within it, or the branch. Empty where the run is on a top-level step,
  // and it stops at the boundary of concurrent work for the reason above.
  repeated string path = 2;

  // CompletedSteps is how many steps have finished in this segment of the run.
  //
  // Per segment rather than per run, and the distinction has to survive contact with
  // whoever renders it: a run that continued as new starts a new count, because the
  // budget it is measured against is per segment too. It is progress against a
  // suspend, not against the workload.
  int32 completed_steps = 3;

  // PendingWaits are the signal waits the run is parked on right now.
  //
  // Here rather than in a message of its own beside `progress` on GetResponse,
  // and rather than behind a second query: one query already reaches the worker
  // for exactly this run's live state, the answer is the same size class as a
  // step id and a short path, and it is answerable from the same moment. A
  // second query would cost a second round trip on every `flow get` of a
  // running run to learn something the first one already had in hand. The
  // separate query [EntityState] gets is the counter-example that proves the
  // rule: that answer can be as large as an author's own `vars:`, which is why
  // it carries its own bound and its own cost.
  //
  // Empty is a real answer and a different one from unset. An unset
  // [RunProgress] means no worker answered (see GetResponse.progress); an empty
  // list inside one that *is* set means this run is parked on nothing, which is
  // to say it is working rather than waiting.
  //
  // Where a position stops at the boundary of concurrent work, this does not:
  // a position is singular and a set of waits is not, so a run holding two
  // gates open in two parallel branches reports both.
  repeated PendingWait pending_waits = 4;

  // PendingWaitsTruncated is true when this answer reports fewer waits than the
  // run is actually parked on, because the run held more than the reporting
  // bound (`v1.MaxPendingWaits`, in `pkg/flowstate/v1/waits.go`, which both drivers read).
  //
  // A flag rather than silence, for [EntityState.truncated]'s reason: a reader
  // must never mistake "some of the waits" for "all of the waits". Unlike that
  // field it keeps the entries it did collect, because the bound here is a
  // count rather than a size, and the first waits of a run holding hundreds are
  // still the answer to "what is this parked on" rather than a partial map
  // whose keys a caller might index by.
  bool pending_waits_truncated = 5;
}

// PendingWait is one signal wait a run is parked on right now, answered by the
// running workflow itself through the same query [RunProgress] is.
//
// Signal waits only. A run asleep on a timer is waiting for nothing anyone can
// do anything about and its deadline is already implied by the step it is on,
// while a run parked on a `wait_for_signal:` is waiting on a *person* - and
// "which gate, and may I open it" is the question that could not be answered
// before this existed. An operator holding a run id had no way to learn the
// signal name to send.
//
// # Everything here is non-secret by construction
//
// A step id, a path of step ids, a signal name and a deadline: all four are
// written in the specification by its author or computed from a timeout the
// author wrote, and none is derived from a task's inputs, a response body, or a
// resolved secret. That is the same discipline `v1.Phase` enforces with an
// unexported field, applied to a projection whose members happen to already be
// names rather than values. A payload a sender delivered is deliberately not
// here: that is the one thing about a wait that could carry anything.
message PendingWait {
  // StepId is the waiting step's own id.
  //
  // The waiting step, not [RunProgress.step_id]'s top-level one, and the
  // difference is what makes this useful: two gates open at once in two
  // parallel branches share a top-level step, so reporting that one would give
  // both entries the same name and neither an answer.
  string step_id = 1;

  // Path is the position of the waiting step from the top-level step inward,
  // outermost first, excluding the waiting step itself: a wait inside a loop
  // body reports the loop.
  //
  // Empty for a top-level wait, and empty inside concurrent work for the reason
  // [RunProgress.path] stops there - the run has no single position to describe
  // that wait's ancestry with. StepId and SignalName are exact in both cases,
  // which is what an operator needs to act.
  repeated string path = 2;

  // SignalName is the name a sender must deliver to release this wait. It is
  // the string `flow signal <run> <name>` takes.
  string signal_name = 3;

  // Deadline is when this wait lapses of its own accord, set only where the
  // author wrote a `timeout:`.
  //
  // Unset means the gate blocks until somebody acts, which is a different
  // situation and not a missing value: it is the spelling this schema
  // recommends for an approval, and a run parked on one will wait as long as
  // the run itself is allowed to live.
  optional google.protobuf.Timestamp deadline = 4;

  // Policed is true when the workflow's own `signals:` declares a policy for
  // SignalName, so a delivery is authorized against it before it reaches this
  // step.
  //
  // Reported because the two failure modes look identical from outside: a
  // signal sent to an unpoliced name that nobody is waiting for, and a signal
  // refused by a policy, both leave the run parked exactly as it was. Read from
  // the top-level workflow's declarations, which is the same set the server
  // records on the run and checks a delivery against - a called workflow's own
  // `signals:` is not what authorizes a delivery to this run, so it is not what
  // is reported here either.
  bool policed = 5;

  // Prompt is what this gate is asking for, evaluated from [Signal.prompt] at
  // the moment the wait parked. Empty where the author wrote none.
  //
  // Everything the message-level comment says about this projection being
  // non-secret by construction has to keep being true with a prompt in it, and
  // a prompt is the one member here that is *not* simply a name written in the
  // file - it is a value the file computed. That is exactly why [Signal.prompt]
  // refuses to reach a `sensitive:` input or a secret reference: the containment
  // argument is made at the field that produces the text, so this field carries
  // text that was already refused the chance to hold anything private. A prompt
  // that could not be produced safely arrives here as a refusal marker, never as
  // the value it would have surfaced.
  string prompt = 6;

  // PromptTruncated is true when Prompt is shorter than what the author's
  // expression produced, because it ran past [MaxWaitPromptBytes].
  //
  // A flag rather than an ellipsis somebody has to recognize, for
  // [RunProgress.pending_waits_truncated]'s reason turned on a single value: a
  // person deciding whether to approve something must be able to tell that they
  // are reading part of the question. Truncation is at a UTF-8 boundary, so what
  // is reported is always text rather than half a rune.
  bool prompt_truncated = 7;
}

// Diagnostic is one problem found in a Flowfile, positioned in its source.
//
// A schema type rather than a shape the CLI invents, because it already has three
// readers and they must agree: `flow validate --output json` hands it to whatever is
// driving the CLI, the language server converts it into an editor's own diagnostic,
// and the Validate RPC returns it unchanged. Three hand-written
// projections of one idea is how the editor and the command line come to disagree
// about what is wrong with a file.
//
// It is also what keeps `--output json` meaning one thing. On `get` and `list` that
// flag is documented as carrying the server's own schema, so a field is addressable by
// name; a `validate` that answered with an object the CLI made up would give one flag
// two meanings in one binary.
//
// # Positions are 1-based, and zero means unknown
//
// Zero rather than an omitted field, because a diagnostic with no position is a real
// answer — some problems are about a file rather than about a line in one — and a
// consumer that saw `line: 1` for those would send a reader to the wrong place with
// confidence.
message Diagnostic {
  // Line is the 1-based source line, or zero when the position is unknown.
  uint32 line = 1;

  // Column is the 1-based column within Line, counting characters rather than
  // bytes, or zero when only the line is known.
  uint32 column = 2;

  // Message states the problem and, where possible, what to do instead.
  string message = 3 [(buf.validate.field).required = true];

  // Step is the id of the step the problem was found in, when there is one.
  string step = 4;

  // Field names the input or property at fault, when there is one.
  string field = 5;

  // Kind names the step's kind key — the task's name, or `for_each`, `sleep` — when
  // the problem is with that key rather than with anything under it.
  //
  // Separate from Field because the two read differently and are fixed differently:
  // one sends a reader to a value they wrote under a task, the other to the word
  // naming the work itself.
  string kind = 6;

  // Value is the literal at fault *inside* Field, when the field holds a list and one
  // element of it is the problem.
  string value = 7;

  // Code names the diagnostic's class in a form that survives Message being
  // reworded — the same argument this message already makes for Line/Column
  // over parsing a squiggle out of prose, applied to *what* is wrong rather
  // than to *where*.
  //
  // A small, deliberately incomplete set: only the classes a program is
  // expected to actually branch on (an unknown task, an unresolved reference,
  // a type mismatch, a schema constraint violation, a placement the grammar
  // refuses, a retired spelling) get their own code today. Everything else is
  // "general" — an honest fallback rather than a code invented to look
  // complete. The full set, generated from the registry that assigns them so
  // it cannot drift, is docs/reference/diagnostics.md.
  string code = 8;

  // Edits are repairs a program may apply to the source without understanding
  // the diagnostic, each one complete on its own.
  //
  // Empty is the common and honest answer, and is what every diagnostic
  // answers unless the checker that raised it could name the exact source it
  // would replace and the exact text to put there. Most cannot: a missing
  // required input, a reference to a step that does not exist, a value the
  // schema refuses are all problems where only the author knows what was
  // meant, and an edit invented for one of them would be a rewriter guessing.
  // `flow fix` has corrupted valid files twice by guessing at scope (see
  // CLAUDE.md, "A rewriter has to know what the grammar binds"), and this
  // field carries the same hazard to every consumer at once, so a checker that
  // is not certain leaves it empty.
  //
  // More than one entry means the repairs are alternatives, offered for a
  // person or an agent to choose between. They are never applied together.
  repeated SuggestedEdit edits = 9;
}

// SourceRange is a region of a file's source text, in the units [Diagnostic]
// already positions itself in.
//
// The same coordinates rather than byte offsets, because a message carrying two
// coordinate systems asks every reader to know which one each field speaks, and
// the reader that guesses wrong edits the wrong text. Lines and columns are
// 1-based and columns count Unicode code points, exactly as [Diagnostic.line]
// and [Diagnostic.column] do; zero means unknown, for the same reason it does
// there.
//
// The end is exclusive, so a range over a four-character key on one line ends
// four columns past where it starts. An editor underlines that region and a
// program replacing it replaces exactly that much.
message SourceRange {
  // StartLine is the 1-based line the region begins on, or zero when unknown.
  uint32 start_line = 1;

  // StartColumn is the 1-based column the region begins at, counting
  // characters rather than bytes, or zero when only the line is known.
  uint32 start_column = 2;

  // EndLine is the 1-based line the region ends on, or zero when unknown.
  uint32 end_line = 3;

  // EndColumn is the 1-based column just past the region's last character, or
  // zero when only the line is known.
  uint32 end_column = 4;
}

// TextChange replaces the source a range covers with new text.
//
// One primitive rather than separate insert, delete, and replace forms: an
// empty range inserts, empty text deletes, and neither empty replaces, so a
// consumer implements one operation and gets all three.
message TextChange {
  // Range is the source this change replaces.
  //
  // Required, because a change with no range names no text, and a consumer
  // that defaulted it to the start of the file would write the change into
  // somebody's first line.
  SourceRange range = 1 [(buf.validate.field).required = true];

  // NewText is what the range's source becomes. Empty deletes it.
  string new_text = 2;
}

// SuggestedEdit is one repair for the diagnostic carrying it, complete and
// independently applyable.
//
// Complete means a consumer applies every change in it and stops: nothing else
// has to run afterwards for the problem this diagnostic names to be repaired.
// It is not a promise the file is then free of problems. A repair can surface
// one the mistake was masking, exactly as fixing a syntax error lets the type
// checker finally read the line: renaming a misspelled key exposes its value to
// checks that could not run while the key was unknown. What the edit does
// promise is that it introduces nothing: applied to source where the diagnostic
// holds, it never manufactures a problem the file did not already contain,
// which is what the guards on the offering site are for. Independently applyable
// means it stands alone rather than composing with a sibling, so two edits on
// one diagnostic are alternatives to choose between and never a sequence.
//
// Both properties are what let an agent apply one without reading the message.
// A partial edit would leave a file in a state nothing described, and edits
// that had to be applied in order would make correctness depend on a rule that
// is nowhere in the message.
message SuggestedEdit {
  // Title says what applying this does, imperatively and in a few words:
  // "rename to `message`". It is what an editor puts in a menu and what a log
  // records when an agent applies one.
  //
  // Required, because an unlabeled choice is not a choice, and these are
  // offered as alternatives.
  string title = 1 [(buf.validate.field).required = true];

  // Changes are the edits to make, all of them, in any order. They never
  // overlap.
  //
  // At least one, since a suggestion that changes nothing is a suggestion a
  // consumer would offer and then appear to fail at.
  repeated TextChange changes = 2 [(buf.validate.field).repeated = {min_items: 1}];
}

// DiagnosticReport is what one file's check produced.
//
// Per file rather than per invocation, because `flow validate a.yaml b.yaml` is two
// answers and a consumer wants to know which file each belongs to. It is also what
// makes the JSONL form useful: one report per line, one file per report.
//
// A file with no diagnostics still gets a report. "Checked and clean" and "not checked"
// are different facts, and a consumer that saw only failures could not tell them apart.
message DiagnosticReport {
  // File is the path as it was given on the command line, so a reader can find it
  // again without resolving anything.
  string file = 1 [(buf.validate.field).required = true];

  // Diagnostics is every problem found, in source order. Empty means the file is
  // valid.
  repeated Diagnostic diagnostics = 2;
}

// ValidationReport is what one check produced, across every file it was given.
//
// It exists because `json` and `jsonl` are different shapes rather than different
// spellings, and this CLI is consistent about which: `json` is one document per
// invocation, `jsonl` is one per line. Checking three files produces three
// [DiagnosticReport]s, which is three lines of `jsonl` and — without something to hold
// them — three documents where `json` promises one. A bare JSON array would do it and
// is not a proto message, so the thing that holds them is a message.
message ValidationReport {
  // Files is one report per file checked, in the order they were given, including the
  // files that were clean.
  repeated DiagnosticReport files = 1;
}

// FixChange is one edit `flow fix` made, or would make under `--check`.
//
// A schema type for the same reason [Diagnostic] is: `flow fix --output json`
// hands this to whatever is driving the CLI, and a hand-invented shape would give
// `--output json` two meanings on one binary.
message FixChange {
  // Line is the 1-based line the change was made at.
  uint32 line = 1;

  // Message says what changed, in the terms an author wrote the file in.
  string message = 2 [(buf.validate.field).required = true];
}

// FixReport is what `flow fix` (or `flow fix --check`) did to one file.
//
// Per file rather than per invocation, on the same reasoning as [DiagnosticReport]:
// `flow fix a.yaml b.yaml` touches two files and a consumer wants to know which
// report belongs to which. `Changed` answers "would git see a diff" on its own,
// because a file with nothing to change produces neither a change nor a refusal
// and would otherwise look indistinguishable from one that was never reached.
message FixReport {
  // File is the path as it was given on the command line, so a reader can find it
  // again without resolving anything.
  string file = 1 [(buf.validate.field).required = true];

  // Changed reports that the file was rewritten, or would be under `--check`.
  bool changed = 2;

  // Changes is every edit made, in source order. Empty when nothing changed.
  repeated FixChange changes = 3;

  // Refusals are the places the rewriter could not act on safely, positioned where
  // a position exists. A file with refusals is not finished whatever `Changed`
  // says, because the parts that were not refused may still have been rewritten.
  repeated Diagnostic refusals = 4;

  // Notes are places worth a human's eye that are not problems and do not affect
  // whether the file is finished — a comment mentioning a step that has moved, for
  // instance. Distinct from Refusals for the reason `flow fix` draws that line
  // itself: a caller must not fail a build on one of these.
  repeated Diagnostic notes = 5;
}

// FmtReport is what `flow fmt` (or `flow fmt --check`) did to one file.
//
// `flow fmt` is not comment- or position-preserving the way `flow fix` is — it
// reads a file into a workflow and renders that back out from nothing — so a
// refusal here is "this file did not parse (or could not be rendered back out)"
// rather than one shape among several, and rarely carries a position of its own
// beyond what the parser's own error already gives.
message FmtReport {
  // File is the path as it was given on the command line.
  string file = 1 [(buf.validate.field).required = true];

  // Changed reports that the file was reformatted, or would be under `--check`.
  bool changed = 2;

  // Refusals are the reasons the file was left untouched: it did not parse, or the
  // workflow it parsed into cannot be rendered back out. Positioned where the
  // parser could position it, unpositioned where the failure is only a message.
  repeated Diagnostic refusals = 3;
}

// FixReports is what `flow fix` produced, across every file it was given.
//
// The same reason [ValidationReport] exists beside [DiagnosticReport]: `json` is
// one document per invocation and `jsonl` is one per line, and fixing three files
// produces three [FixReport]s — which is three lines of `jsonl` and, without
// something to hold them, three documents where `json` promises one.
message FixReports {
  // Files is one report per file given, in the order they were given.
  repeated FixReport files = 1;
}

// FmtReports is what `flow fmt` produced, across every file it was given, on the
// same reasoning as [FixReports].
message FmtReports {
  // Files is one report per file given, in the order they were given.
  repeated FmtReport files = 1;
}

// TestCase is what one test in a `*.test.yaml` file produced.
//
// Per case rather than per file, on the same reasoning as [FixReport]: a test
// file usually holds more than one `tests:` entry, and a reader wants to know
// which one failed without re-deriving it from an index.
message TestCase {
  // Name is the test's own `name:`, so a report reads the same words the
  // author wrote.
  string name = 1 [(buf.validate.field).required = true];

  // Passed is true when every expectation in the case held.
  bool passed = 2;

  // Failures are the expectations that did not hold, positioned to the test
  // file where an expectation's own position is known — a diagnostic in the
  // same shape `flow validate` and `flow fix` already report, so a consumer of
  // `-o json` learns one schema for "something is wrong" across every verb.
  repeated Diagnostic failures = 3;

  // Error is set instead of Failures when the case could not run to a verdict
  // at all — the workflow it names failed to compile, a stub described a task
  // the registry does not have, or the run failed in a way the case did not
  // declare with `expect.failed` — as distinct from an expectation that ran
  // and did not hold.
  string error = 4;

  // Duration is how long the case took to run, in wall-clock time. Never a
  // reading of virtual time: it is what a person deciding whether the suite
  // is still fast wants to know, and virtual time inside the run answers a
  // different question.
  google.protobuf.Duration duration = 5;
}

// TestReport is what `flow test` produced for one `*.test.yaml` file.
//
// Per file rather than per invocation, on the same reasoning as
// [DiagnosticReport]: `flow test examples/` discovers more than one file and a
// consumer wants to know which report belongs to which.
message TestReport {
  // File is the path as it was given on the command line, so a reader can
  // find it again without resolving anything.
  string file = 1 [(buf.validate.field).required = true];

  // Cases is one result per `tests:` entry in the file, in the order they
  // were written. Empty when Refused is set — no case was ever reached.
  repeated TestCase cases = 2;

  // Refused reports that the file itself could not be run as a test file — it
  // did not parse, or named a workflow that could not be loaded — which is
  // reported once for the file rather than once per case.
  string refused = 3;
}

// TestReports is what `flow test` produced, across every file it discovered,
// on the same reasoning as [FixReports].
message TestReports {
  // Files is one report per test file discovered, in the order they were
  // found.
  repeated TestReport files = 1;
}

// RunState is the durable workflow state used by the Temporal Run entrypoint.
// It allows the workflow to continue-as-new while carrying only the minimal
// required subset of previously produced outputs for the remaining steps.
// WorkloadIdentity describes who a run acts as.
//
// A running workload has two identities at once, and both matter. It is a
// specific workload — this workflow, this run, this step — and it is acting on
// behalf of whoever asked for the work. Downstream systems need both to make an
// authorization decision: "the nightly-reconcile workflow" and "started by the
// deploy pipeline" answer different questions, and a system granting access
// usually cares about the pair.
//
// This is carried through the run so that every step knows what it is acting as,
// and so an assertion presented to an external system states something true
// rather than something assumed. It holds identity, never credentials: it is
// persisted in workflow history, which is durable and broadly readable, so
// nothing secret may appear here.
message WorkloadIdentity {
  // Subject identifies the caller that requested the run, as established by
  // authenticating their request. Empty when the run was started without
  // authentication, which is only possible in development.
  string subject = 1;

  // Issuer is the identity provider that vouched for the subject.
  string issuer = 2;

  // Claims carries additional non-secret claims from the caller's token that
  // authorization decisions may key on, such as a repository, environment, or
  // team. Only claims an operator has configured as relevant are copied here,
  // so this does not become a dumping ground for whole tokens.
  map<string, string> claims = 3;

  // Namespace is the tenant, and it is the boundary every authorization decision
  // about a run turns on: the caller's namespace is compared against the one
  // recorded on the run, and a mismatch is answered "no such run".
  //
  // Worth stating outright, because this field used to be described alongside
  // `deployment` as identifying "which Flowstate installation is running the
  // workload". That is what `deployment` is for. Reading the two as a pair
  // suggests both are labels for telling environments apart, and one of them
  // decides who may act on what.
  string namespace = 4;

  // Deployment identifies which Flowstate installation is running the workload,
  // so an assertion from a staging deployment is distinguishable from a
  // production one.
  //
  // Not the tenant, and not what run access turns on — that is `namespace`
  // above. But not decorative either: an outbound authorization policy sees it as
  // `workload.deployment` and may key on it, which is how a rule like
  // `target == "internal" && workload.deployment == "prod"` keeps a staging
  // installation from assuming a production role.
  //
  // So the two are load-bearing for different decisions. `namespace` decides who
  // may act on a run; `deployment` is one of the attributes a policy may use to
  // decide what a run may reach.
  string deployment = 5;
}

// Frame is one level of the execution position within a workflow.
//
// A workflow with nested control flow cannot record where it is with a single
// index: "the third item of the loop in the second branch" is a path, not a
// number. Frames are that path, outermost first, which is what allows a run to be
// suspended and resumed from inside a loop rather than only between top-level
// steps.
message Frame {
  // NextNode is the index of the next node to execute at this level.
  int32 next_node = 1 [(buf.validate.field).int32 = {gte: 0}];

  // NextIteration is the index of the next item to process, for a frame
  // standing inside a for_each.
  int32 next_iteration = 2 [(buf.validate.field).int32 = {gte: 0}];

  // Results holds the outputs of iterations already completed by a for_each or
  // loop at this level, so a resumed run still reports every iteration's
  // results and not only those from the run that finished the loop.
  //
  // For a `loop:`, this is carried forward across a Continue-As-New only when
  // something in the specification could still read it — see the doc on
  // `LoopResultsReferenced` and `LoopResumeResults` in pkg/flowstate/v1/loop.go.
  // A loop nothing reads starts each new segment's Results fresh rather than
  // inheriting every prior segment's, which is what keeps an indefinitely
  // running `loop:` + `wait_for_signal:` entity from carrying its whole
  // history forward forever. When that has happened at least once, the
  // finished loop's own reported `results` output is *omitted* rather than
  // showing only the last segment's iterations — an absent key rather than a
  // list that looks complete and is not. See docs/DSL.md's loop section for
  // the contract this states to an author, and #229.
  repeated Workflow.StepOutputs results = 3;

  // CallOutputs holds the step outputs a called workflow's own steps had
  // produced when a run suspended partway through it, for a frame standing
  // inside a call.
  //
  // A call is transparent to suspension (see the executor's suspend rule), so a
  // callee's steps may span a Continue-As-New exactly as a top-level sequential
  // loop's do. The callee runs in its own isolated scope, though — that is the
  // entire point of [CallScope] — so unlike a top-level segment, whose step
  // outputs live in RunState.outputs, a callee's step outputs exist nowhere
  // else. Without this they would vanish at the handover and the resumed
  // segment would fail on the callee's own later steps referencing its
  // earlier ones, on a specification that never changed.
  //
  // Absent for every frame that predates this field, which reads as an empty
  // callee scope — correct, because no run written before this field existed
  // could have been suspended inside a call; the capability did not exist yet.
  Workflow.StepOutputs call_outputs = 4;

  // CallVars holds the callee's own `vars:` block, evaluated once when the
  // call began, for a frame standing inside a call whose callee declares any.
  //
  // Computed once and carried rather than re-evaluated on each resumed
  // segment, for the identical reason a top-level run's own vars are: a
  // Continue-As-New may hand a later segment to a different interpreter
  // version under auto-upgrade (see docs/ARCHITECTURE.md's versioning
  // section), and a profile pins which functions exist rather than how
  // cel-go implements them. Re-evaluating inline would let the *same*
  // expression compute two different answers across one call, on a
  // specification that never changed — precisely the hazard
  // `engine.WorkflowVars` exists to remove at the top level. A callee's vars
  // get no weaker a guarantee merely for being nested.
  //
  // Absent for every frame that predates this field, or whose callee
  // declares no `vars:` at all — both read as "nothing bound", which is
  // correct in the first case for the reason call_outputs's is, and correct
  // in the second because there is nothing to evaluate.
  map<string, Value> call_vars = 5;

  // LoopState is the value a [Loop] was carrying when a run suspended between its
  // iterations, for a frame standing inside a loop.
  //
  // A `for_each` needs no equivalent, because its per-iteration binding is the item
  // at [NextIteration] of a list [ForEach.items] recomputes on resume — the list is
  // in the specification. A loop's carried value is not: it is computed by
  // [Loop.update] from the *previous* iteration's body outputs, which do not escape
  // the iteration and are gone once it ends. So the value itself has to travel, the
  // same way [call_outputs] carries a callee's own step outputs across the seam for
  // the same reason — the state exists nowhere in [RunState.outputs].
  //
  // A resolved value, never an expression: [Loop.update] is evaluated in workflow
  // code at the end of each iteration (invariant 4 permits it, as it does a loop's
  // `items:` and a step's `vars:`) and what is stored here is the result. So a
  // resumed segment binds the carried value directly and evaluates nothing to get
  // it — the same discipline [PendingUndo] follows, and for the same determinism
  // reason.
  //
  // Absent for every frame that predates this field, and for a loop that carries no
  // state at all — both read as "nothing carried", which is correct: a
  // retry-until loop binds no name, so there is nothing for a resumed segment to
  // rebind.
  //
  // Weighed by `CheckRunStateSize` along with the rest of [RunState] (invariant 9),
  // which is the bound a *finite* loop's state needs — it is one value, carried
  // across at most the loop's bounded iteration count. The unbounded entity loop
  // that would need a byte bound of its own is deferred; see [Loop].
  Value loop_state = 6;
}

message RunState {
  Workflow workflow = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Zero-based index of the next top-level step to execute.
  //
  // Superseded by frames, which can also describe a position inside nested
  // control flow. It is still honored when frames is empty, so a run started
  // before frames existed continues correctly.
  int32 next_step = 2;
  // Compact subset of outputs needed by subsequent steps.
  Workflow.StepOutputs outputs = 3;
  // Step budget for Continue-As-New. If 0 or unset, server/workflow defaults apply.
  int32 steps_budget = 4;
  // Execution position, outermost frame first. When empty, execution starts from
  // next_step at the top level.
  repeated Frame frames = 6;
  // Identity the run acts as, established when the run was requested and
  // preserved across Continue-As-New so later steps act as the same principal
  // the caller was authenticated as.
  WorkloadIdentity identity = 5;

  // PendingSignals are signals that arrived before the step waiting for them was
  // reached, drained from their channels before this run suspended.
  //
  // They must be carried, because a suspended run drops whatever is still
  // buffered on a channel it never read. A workload whose approval arrived while
  // it was on an earlier step would otherwise reach the gate with the approval
  // already lost, and wait forever — the worst failure available to a feature
  // whose whole promise is that waiting is reliable.
  repeated PendingSignal pending_signals = 7;

  // Vars are the workflow's `vars:` block, already evaluated.
  //
  // Carried rather than recomputed, so that "evaluated once at the start of the run"
  // means once for the whole run and not once per Continue-As-New segment. The
  // difference is not academic: invariant 10 has a continued run pick up whichever
  // interpreter version is current, so a segment that re-evaluated its vars could
  // compute a different answer from the one earlier steps saw — a value changing
  // under a workload halfway through, for no cause visible in the file.
  //
  // Storing it also makes the evaluation happen exactly once per run rather than once
  // per segment, which is the cheaper half of the same argument.
  map<string, Value> vars = 8 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
  }];

  // Inputs are the arguments the run was started with, already checked against
  // the workflow's declarations and with defaults filled in.
  //
  // Carried rather than re-derived, for the reason `vars` above is: the checking
  // and the defaulting happen once, at submit, and a later segment must see the
  // same values the first one did. Re-applying a default in a later segment would
  // mean a declaration edited between deploys could change an argument underneath
  // a run in flight, which is the class of thing invariant 10 exists to stop.
  //
  // Add-only and absent-tolerant, like everything else here. A run started before
  // this field existed reads back with it empty, which is exactly right — that run
  // has no arguments — so nothing has to distinguish "old writer" from "no
  // inputs", and no number is ever reused. Values only; see [RunRequest.inputs].
  map<string, Value> inputs = 9 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
    max_pairs: 64
  }];

  // Outputs are the run's declared outputs once computed.
  //
  // Empty until the run reaches the end of its steps, and empty forever for a
  // workflow that declares none. Absent on a run started before this field
  // existed, which reads as "no declared outputs" — the same answer that run
  // would give if asked, so an old state and a new reader agree without a
  // compatibility arm.
  RunOutputs run_outputs = 10;

  // PendingUndo are the compensations registered by steps that have already
  // succeeded, in the order they were registered.
  //
  // Carried because a saga is exactly the workload that outlives one segment: a
  // provisioning run that suspends after step two and fails at step three has to
  // undo work done by a segment that is no longer executing. Nothing else can know
  // about it — history is not replayed after a Continue-As-New, which is the whole
  // point of the seam.
  //
  // Append-only within a run, and consumed exactly once: a segment either finishes
  // the run, suspends (appending what it registered), or fails — and only the
  // failing segment runs these, after which the run ends. There is no path where a
  // segment compensates and then continues, which is what makes "a compensation
  // runs at most once" a property of the shape rather than a flag somebody checks.
  //
  // Absent on a run started before this field existed, which reads as "nothing to
  // undo" — the truth for such a run, since no specification it could be executing
  // had an `undo:` to register (invariant 10, with no compatibility arm needed).
  repeated PendingUndo pending_undo = 11;
}

// SignalRequest delivers a signal to a waiting run.
message SignalRequest {
  // WorkflowId identifies the run to signal.
  //
  // A caller may address only runs in a namespace their own authenticated
  // identity establishes. The namespace is never taken from this request: a
  // caller who could name their own tenant could name someone else's, and an id
  // is not a capability.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // RunId optionally pins the signal to one run of the workload. Unset addresses
  // whichever run is current, which is what a human approving a gate means: they
  // are approving the workload, and they neither know nor care how many times it
  // has been continued as new.
  string run_id = 2 [(buf.validate.field).string = {max_len: 256}];

  // Name is the signal being sent, matching what the waiting step declared.
  string name = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];

  // Payload becomes the waiting step's outputs, so `${approval.approved}`
  // resolves to what a sender put here.
  Node.Outputs payload = 4;
}

message SignalResponse {}

// SignalWithStartRequest delivers a signal to an entity, creating it first if it
// does not yet exist — atomically, through the SDK's SignalWithStartWorkflow,
// which closes the race an ordinary create-then-signal has: a caller who checks
// "does it exist" and then either Runs or Signals can always be beaten between the
// two calls, either by another creator or by the signal arriving before the run
// does.
//
// # Two authorization questions, decided separately, both fail-closed
//
// "May this sender signal entity key K" and "may this sender CREATE an entity
// under key K" are not the same question, and this handler never answers the
// second by reusing the first's rule. Delivering a signal is authorized by the
// signal policy the *target* already declared — [Workflow.signals], enforced the
// same way [FlowstateServer.Signal] enforces it, against the memo recorded when
// the entity was created. Creating one has nothing yet to declare a policy: there
// is no target, no memo, no `signals:` block recorded anywhere to check. So it is
// authorized the same way [FlowstateServer.Run] authorizes an ordinary run —
// every check `Run` performs on [workflow] and [inputs] runs here too, on the
// same fields, before either branch is taken — which is a strictly *stronger* bar
// than delivering a signal (a bare workflow id, a signal name, and a payload)
// asks for. An authenticated caller in their own namespace may always create,
// exactly as they may always Run; what [entity_key] changes is only the address
// the result is reachable at.
//
// [workflow] and [inputs] are read only on the branch that creates — see
// [SignalWithStartResponse.created]. When the entity already exists, Temporal
// never looks at them and this handler never lets a caller believe they changed
// anything about the run they signalled.
message SignalWithStartRequest {
  // EntityKey addresses the entity, composed with the caller's own namespace
  // exactly as [RunRequest.entity_key] is — see that field's doc comment for
  // the grammar and the unforgeability argument, which apply unchanged here.
  string entity_key = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[a-z0-9][a-z0-9-]*$"
    }
  ];

  // Workflow is the specification to start the entity from if it does not
  // already exist. Checked exactly as [RunRequest.workflow] is — the same
  // validation, the same signal-policy shape check, the same size bound —
  // and ignored entirely if the entity is already running.
  Workflow workflow = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Inputs seed the entity's arguments if it does not already exist. Checked
  // exactly as [RunRequest.inputs] is, and ignored if the entity is already
  // running — an existing entity's inputs were bound once, at its own
  // creation, and this call cannot rebind them.
  map<string, Value> inputs = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
      max_pairs: 64
    }
  ];

  // Name is the signal to deliver, matching what a waiting step declared —
  // the same field, the same grammar, as [SignalRequest.name].
  string name = 4 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];

  // Payload becomes the waiting step's outputs, exactly as [SignalRequest.payload].
  Node.Outputs payload = 5;
}

message SignalWithStartResponse {
  string workflow_id = 1;
  string run_id = 2;

  // Created is true when this call is what brought the entity into existence —
  // false means a signal was delivered to an entity that was already running.
  // A caller that needs to tell "I just created this" from "this already
  // existed" — to decide whether to wait for a different handler, say — has
  // no other way to learn it, since Temporal's own SignalWithStartWorkflow
  // answers the same shape (a run and a workflow execution) either way.
  bool created = 3;
}

// Stopping a run is two different asks, and the difference is not a detail of
// implementation — it decides whether the workload's cleanup happens.
//
// Cancel is cooperative. It asks the run to stop and the run gets to finish
// responding: a workload that has to release a lock, roll back a partial
// deployment, or tell someone it gave up still does that. The cost is that a run
// which is wedged — blocked on something that never returns — may not stop.
//
// Terminate is not cooperative. The execution stops where it is, no further step
// runs, and nothing the workload would have done on the way out is done. It is
// the answer when a run must stop now and when a run cannot be made to stop any
// other way, and it should be the second thing tried rather than the first.
//
// So: cancel by default, terminate when cancel will not do. Anything holding a
// resource it is responsible for releasing is a reason to prefer cancel, and
// terminating it is a decision to leak that resource on purpose.

// CancelRequest asks a run to stop, letting it clean up on the way out.
message CancelRequest {
  // WorkflowId identifies the run to cancel.
  //
  // A caller may address only runs in a namespace their own authenticated
  // identity establishes. The namespace is never taken from this request: a
  // caller who could name their own tenant could name someone else's, and an id
  // is not a capability.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // RunId optionally pins the request to one run of the workload. Unset
  // addresses whichever run is current, which is what someone stopping a
  // workload means: they neither know nor care how many times it has been
  // continued as new.
  string run_id = 2 [(buf.validate.field).string = {max_len: 256}];
}

message CancelResponse {}

// TerminateRequest stops a run immediately, without letting it clean up.
message TerminateRequest {
  // WorkflowId identifies the run to terminate.
  //
  // A caller may address only runs in a namespace their own authenticated
  // identity establishes. The namespace is never taken from this request: a
  // caller who could name their own tenant could name someone else's, and an id
  // is not a capability.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // RunId optionally pins the request to one run of the workload. Unset
  // addresses whichever run is current.
  string run_id = 2 [(buf.validate.field).string = {max_len: 256}];

  // Reason is recorded on the terminated execution, so whoever finds the run
  // later learns why it was stopped rather than only that it was.
  //
  // A terminated run leaves no trace of its own explaining itself — that is what
  // terminate means — so this is the only account of the decision there will be.
  string reason = 3 [(buf.validate.field).string = {max_len: 1024}];
}

message TerminateResponse {}

// ListRequest asks for the caller's runs.
message ListRequest {
  // PageSize bounds how many runs come back. Zero takes the server's default.
  //
  // This bounds the answer, not the work: the server filters by tenant itself
  // (see ListResponse.next_page_token), so a small page is not a promise of a
  // small scan.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // PageToken continues a previous List. Opaque: it encodes where the scan
  // stopped, and nothing else should be read from or written into it.
  string page_token = 2 [(buf.validate.field).string = {max_len: 4096}];

  // Filter keeps only the runs a CEL expression answers yes about.
  //
  // CEL because that is what everything else an author writes here is: the
  // expressions in a Flowfile, the rules in an egress or auth policy, the
  // condition on a step. A query language of its own would be a second grammar
  // to learn, a second parser to bound, and a second place for `status` to mean
  // something slightly different.
  //
  // The names it binds are a run's own: `workflow_id`, `run_id`, `status`,
  // `start_time`, `close_time`, `finished`. `status` is the short name —
  // `FAILED`, not `STATUS_FAILED` — and comparing it to a name no status has is
  // refused rather than silently matching nothing.
  //
  //     status == "FAILED"
  //     status == "RUNNING" && start_time < timestamp("2026-08-01T00:00:00Z")
  //     finished && close_time - start_time > duration("1h")
  //
  // `close_time` is null while a run is going — null rather than the epoch,
  // because a run that has not finished has no close time and a filter that
  // compared one against a date would otherwise report every running run as
  // having finished in 1970. Comparing null errors, which is why `finished`
  // exists: CEL's `&&` absorbs errors from the side it does not need, so the
  // guarded form above does what it looks like it does.
  //
  // # What this bounds, and what it does not
  //
  // A filter narrows the *answer*, never the work. The tenant a run belongs to
  // is a memo, which Temporal cannot query, so a listing is already a bounded
  // scan with a predicate applied to each result — and a filter that matches
  // little makes a page more likely to come back short with a token, not more
  // likely to scan further. The scan bounds are unchanged and unaffected by what
  // is written here.
  //
  // The evaluation itself is cost-bounded per run, well below the budget an
  // ordinary expression gets, because this one is evaluated once per execution
  // read and the two multiply.
  //
  // # Room this leaves
  //
  // When a deployment registers search attributes, the parts of a filter the
  // visibility store can answer become a query pushed down into it, and the rest
  // stays a predicate here. That changes what a listing costs and never what it
  // means: the same filter returns the same runs either way, which is what lets
  // an operator turn pushdown on without re-reading every saved query.
  string filter = 3 [(buf.validate.field).string = {max_len: 4096}];
}

// RunSummary describes one run in a listing.
//
// Deliberately not a run's outputs. A listing is about which workloads exist and
// what they are doing; reading what one produced is Get, which is one run and one
// authorization decision. A list that returned outputs would make "show me my
// runs" the cheapest way to read every workload's data at once.
message RunSummary {
  string workflow_id = 1;
  string run_id = 2;
  RunResponse.Status status = 3;

  // StartTime is when the workload began.
  google.protobuf.Timestamp start_time = 4;

  // CloseTime is when it finished, unset while it is still running.
  google.protobuf.Timestamp close_time = 5;

  // Name is the workflow's own declared name (Workflow.name), not Temporal's
  // WorkflowType — every run's WorkflowType is "Run", the one interpreter
  // workflow, so it cannot distinguish "nightly-etl" from "onboard-tenant".
  //
  // Populated from the run's memo, recorded unconditionally at submit —
  // never from a search attribute, and deliberately so: a deployment may
  // additionally project this into Temporal's visibility store for external
  // tooling, but `flow list --filter` never depends on that having
  // succeeded, or a filter with nothing wrong with it would silently return
  // nothing on a deployment where search-attribute registration failed.
  // Empty only for a run that predates this field entirely. Absence is not
  // an error — see server/list.go and runfilter.go, where a filter comparing
  // against `name` simply does not match a run that carries none.
  string name = 6;
}

// ListResponse returns a page of the caller's runs.
message ListResponse {
  repeated RunSummary runs = 1;

  // NextPageToken continues the listing, and is set whenever the scan stopped
  // with more to look at — including when this page came back short or empty.
  //
  // That case is real rather than theoretical. The tenant a run belongs to is
  // recorded as a memo, which Temporal cannot filter on, so the server reads a
  // bounded number of executions and keeps the ones that are the caller's. In a
  // namespace shared by several tenants a scan can therefore end having found
  // few matches, or none, while plenty remain. An empty page with a token set
  // means "keep asking", and only an empty token means the listing is done.
  string next_page_token = 2;
}

// WorkflowService is the service that provides operations for managing and running workflows.
service WorkflowService {
  rpc Run(RunRequest) returns (RunResponse) {}
  rpc Get(GetRequest) returns (GetResponse) {}

  // Signal delivers a signal to a run waiting for one, which is how a human
  // approval reaches a workload.
  //
  // This addresses a durable run. A local run is a process with nobody to signal
  // it once it has started, so `flow run local` answers its gates from flags
  // instead. What the two drivers share is the payload and everything downstream
  // of it — the same signal name, the same outputs, the same expressions reading
  // them — which is the part that has to match for a local run to tell an author
  // what production will do.
  rpc Signal(SignalRequest) returns (SignalResponse) {}

  // SignalWithStart delivers a signal to an entity, creating it first — from
  // [SignalWithStartRequest.workflow] and [SignalWithStartRequest.inputs] — if no
  // entity is running under [SignalWithStartRequest.entity_key] yet. See
  // [SignalWithStartRequest] for the two authorization questions this decides
  // separately and the race this closes that Run-then-Signal cannot.
  rpc SignalWithStart(SignalWithStartRequest) returns (SignalWithStartResponse) {}

  // List returns the runs belonging to the caller's tenant.
  //
  // The filtering is done here rather than by Temporal, and that follows from how
  // Run records a tenant: as a memo, because a memo needs no cluster-side
  // registration and a first run therefore needs nothing but `temporal server
  // start-dev`. Temporal cannot query a memo. A search attribute could be
  // queried, but it would make listing your own runs fail until an operator had
  // registered the attribute — a basic verb that does not work out of the box is
  // worse than one that scans.
  //
  // So the scan is bounded instead, and the bound is on how many executions the
  // server reads rather than on how many it returns: a caller asking for ten runs
  // in a namespace holding a hundred thousand must not be able to make the server
  // walk all of them. See ListResponse.next_page_token for what that means for a
  // caller — a short or empty page is not the end of the listing.
  rpc List(ListRequest) returns (ListResponse) {}

  // Cancel asks a run to stop and lets it clean up on the way out.
  rpc Cancel(CancelRequest) returns (CancelResponse) {}

  // Terminate stops a run immediately, running none of its cleanup. Prefer
  // Cancel; see CancelRequest for when this is the right answer anyway.
  rpc Terminate(TerminateRequest) returns (TerminateResponse) {}

  // Validate checks Flowfiles and returns their diagnostics, executing nothing.
  //
  // `flow validate` does this offline and must keep doing so: a validator that
  // needs a server is one that stops working on an aeroplane, and invariant 8
  // says a first run needs no infrastructure. This is not a replacement for that.
  // It is the same check for a caller who has no filesystem to point the command
  // at — a browser, a CI service, an agent writing a file it has not saved —
  // and it answers with the very same [ValidationReport] message the command
  // prints, from the very same code, so there is no second validator to disagree
  // with the first.
  //
  // Pure by construction, which is what makes it the useful one to hand an agent:
  // it reads nothing, writes nothing, and starts nothing, so it can be looped on
  // unattended in a way none of the verbs above can.
  //
  // Authenticated like everything else here, because checking a file is work
  // somebody's CPU does. Bounded like everything else that takes input somebody
  // else chose: see ValidateRequest.
  rpc Validate(ValidateRequest) returns (ValidateResponse) {}

  // Compile turns Flowfile source into the specification Run takes, executing
  // nothing.
  //
  // It exists because Validate alone left a caller one step short: an agent
  // could check a file and could submit a compiled specification, and nothing
  // on the wire connected the two — the compiler lived only in the CLI, so a
  // caller with no `flow` binary could author a correct file it had no way to
  // run. Same terms as Validate: the same compiler the CLI uses, pure, bounded
  // by the schema, authenticated like everything else.
  //
  // A file that does not compile answers with its diagnostics rather than an
  // RPC error, because "your file has a problem at line 12" is an answer, not a
  // failure to answer.
  rpc Compile(CompileRequest) returns (CompileResponse) {}

  // GetCatalog returns what this deployment can execute.
  //
  // The registry is the single source of truth for capability, and until this
  // existed the only way to ask it was to run `flow tasks` on a machine with the
  // same build — which is not the same question. A worker that loaded plugins can
  // run tasks this binary has never heard of, so "what tasks exist" is a property
  // of a deployment, and a caller writing a workflow for it needs the deployment's
  // answer rather than their laptop's.
  //
  // [TaskCatalog]'s own comment anticipated this RPC, and returning that message
  // unchanged is the point: an editor, an agent, a documentation generator and
  // `flow tasks --output json` all read one shape.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {}

  // The schedule verbs, on this service rather than one of their own.
  //
  // A separate `ScheduleService` was the obvious alternative and buys nothing
  // here. Everything that makes this service what it is applies to a schedule
  // unchanged: the same authenticated caller, the same tenant, the same Temporal
  // client selected by that tenant, the same protovalidate interceptor, the same
  // MCP tool surface derived from the descriptors. A second service would
  // duplicate all of it and add a second client for the CLI to hold, in exchange
  // for a name.
  //
  // The line that would justify splitting is a different *authority* — an
  // administrative surface answering to a different policy, or a service a
  // different process serves. Schedules are neither: creating one is the same
  // permission as starting a run, because a schedule is a run somebody arranged
  // in advance.
  //
  // All unary. A schedule is a small object read whole, and there is nothing here
  // a stream would serve: even Trigger returns nothing to follow, because the
  // cluster takes the action after answering.

  // CreateSchedule arranges for a workflow to run on a cadence.
  //
  // The act a `triggers:` block does not perform. A file may declare that it is
  // meant to run nightly, and that declaration does nothing until this is called
  // — because a file that starts running on its own when it merges is a surprise,
  // and one whose first firing is indistinguishable from somebody having meant
  // it.
  //
  // Everything that can be refused is refused here, where a person is present:
  // the specification is validated and size-checked exactly as `Run` does it, the
  // arguments are bound against the workflow's declarations through the very same
  // `BindRunInputs`, and the cadence must say when it fires. What fires at three
  // in the morning has already been checked.
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {}

  // ListSchedules returns the schedules belonging to the caller's tenant.
  //
  // A bounded scan filtered by the tenant recorded on each schedule, for the
  // reason `List` scans runs: the tenant is a memo, which Temporal cannot query,
  // and a memo is what keeps this working against `temporal server start-dev`
  // with nothing registered. Unlike runs there is no paging — see
  // [ListSchedulesRequest] for why, and for what the response says instead.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {}

  // DescribeSchedule reports one schedule: its cadence, its arguments, when it
  // next fires and what it has done lately.
  rpc DescribeSchedule(DescribeScheduleRequest) returns (DescribeScheduleResponse) {}

  // DeleteSchedule removes a schedule. Runs it already started are unaffected —
  // they are ordinary workloads, and stopping one is `Cancel`.
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse) {}

  // PauseSchedule stops a schedule firing without removing it, which is what an
  // incident wants: the arrangement is still there, still reviewable, and not
  // running.
  rpc PauseSchedule(PauseScheduleRequest) returns (PauseScheduleResponse) {}

  // ResumeSchedule lets a paused schedule fire again.
  rpc ResumeSchedule(ResumeScheduleRequest) returns (ResumeScheduleResponse) {}

  // TriggerSchedule fires a schedule now, without waiting for its cadence.
  //
  // The verb that makes a schedule testable. Creating one and waiting until
  // Tuesday to find out whether it works is not a development loop, and the
  // alternative — running the workflow by hand — proves the workflow rather than
  // the schedule: it does not exercise the arguments the schedule stored, the
  // tenant it records on the runs it starts, or the queue it puts them on.
  //
  // It fires even a paused schedule, which is Temporal's behavior and the useful
  // one: create paused, trigger once to see what happens, then resume.
  rpc TriggerSchedule(TriggerScheduleRequest) returns (TriggerScheduleResponse) {}
}

// SourceFile is one file's contents, with the name to report diagnostics against.
message SourceFile {
  // Name is what a diagnostic should call this file. It is a label, not a path
  // the server resolves — nothing here opens anything — so a caller with no
  // filesystem may say `<stdin>` or a request id and still get a readable report.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];

  // Source is the file's bytes.
  //
  // Bounded at the same megabyte the offline parser bounds a Flowfile at, and for
  // the same reason: this is input an outside party chooses, and the resource it
  // spends is memory in the parser. A caller sending more is refused by
  // protovalidate before anything reads it.
  bytes source = 2 [(buf.validate.field).bytes = {max_len: 1048576}];
}

// ValidateRequest is one or more files to check.
message ValidateRequest {
  // Files are the files to check, in the order the report should list them.
  //
  // Bounded by count as well as by size, because bounding one resource does not
  // bound another the peer controls the ratio to: a thousand megabyte files is a
  // gigabyte of parsing, and every one of them is individually within its bound.
  repeated SourceFile files = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
}

// ValidateResponse is what the check found.
message ValidateResponse {
  // Report is one entry per file, including the files that were clean.
  //
  // Wrapped rather than returned bare so the RPC can grow a second thing to say —
  // which version of the grammar answered, how long it took — without changing
  // the shape a caller already parses.
  ValidationReport report = 1;
}

// CompileRequest is one Flowfile to compile.
//
// One rather than many, unlike ValidateRequest: validation is a survey and its
// answer is a report, while compilation produces the artifact the next call
// submits, and a batch of artifacts would leave a caller matching outputs back
// to inputs by position.
message CompileRequest {
  SourceFile file = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// CompileResponse is the specification, or the reasons there is not one.
message CompileResponse {
  // Workflow is the compiled specification, set only when the file compiled
  // clean. It is exactly what RunRequest.workflow takes.
  Workflow workflow = 1;

  // Report carries the diagnostics for the file, present even when empty so
  // "compiled clean" is stated rather than inferred from absence.
  DiagnosticReport report = 2;
}

// GetCatalogRequest asks what this deployment can execute. It takes nothing
// today; a filter or a profile selector would go here.
message GetCatalogRequest {}

// GetCatalogResponse is the deployment's capability.
message GetCatalogResponse {
  TaskCatalog catalog = 1;
  PluginCatalog plugins = 2;
}

// Schedules are a control plane over Temporal's, and the messages below are
// deliberately thin.
//
// Temporal owns when a schedule fires, what it does about a firing that overlaps
// the last, and what it remembers about the ones already taken. What Flowstate
// owns is a *name within a tenant*, the specification and arguments a firing
// starts a run with, and the rule that one tenant cannot see or touch another's.
// Everything else these carry is a projection of what Temporal already answered.
//
// # A schedule is named, where a run is identified
//
// A run gets a generated id, because a run is an event: nobody chooses it in
// advance and nobody needs to say it twice. A schedule is the opposite — it is a
// standing thing an operator refers to across months, in a runbook and in a
// change request — so it carries a name somebody chose, defaulting to the
// workflow's own.
//
// The name is scoped to the caller's tenant, which is what makes it usable: two
// teams may both have a `nightly-report` and neither has to discover the other's
// existence to pick a name. The Temporal schedule id it maps to encodes the
// tenant, and the tenant is *also* recorded on the schedule as a memo and checked
// on every request — see server/schedules.go, which explains why both.

// ScheduleActionResult is one firing that happened.
message ScheduleActionResult {
  // ScheduleTime is the moment the firing was due, including any jitter.
  google.protobuf.Timestamp schedule_time = 1;

  // ActualTime is when the run was actually started.
  google.protobuf.Timestamp actual_time = 2;

  // WorkflowId is the run the firing started, which `flow get` takes.
  string workflow_id = 3;

  // RunId is the first execution of that workload. A run that continues as new
  // has later executions this does not name; see RunResponse for why a workflow
  // id is the durable handle and a run id is a position.
  string run_id = 4;
}

// ScheduleSummary describes one schedule in a listing.
//
// Deliberately not the whole description: a listing answers which schedules exist
// and whether they are live, and reading what one is configured to pass a run is
// DescribeSchedule — one schedule and one authorization decision, the same split
// [RunSummary] makes for runs.
message ScheduleSummary {
  // Name is what this tenant calls the schedule.
  string name = 1;

  // Paused is whether firings are currently suppressed.
  bool paused = 2;

  // Note is the human-readable message carried on the schedule, which is where
  // the reason for a pause is written — by whoever paused it, or by Temporal when
  // a failure paused it.
  string note = 3;

  // NextRunTime is when this would next fire, unset when it is paused or when
  // the cluster has no next time for it.
  google.protobuf.Timestamp next_run_time = 4;
}

// ScheduleDescription is one schedule in full.
message ScheduleDescription {
  // Name is what this tenant calls the schedule.
  string name = 1;

  // WorkflowName is the workflow a firing runs, read back out of the
  // specification the schedule carries.
  string workflow_name = 2;

  // Trigger is the cadence, as it was created — the same message a Flowfile's
  // `triggers.schedule` compiles to, so what comes back out reads like what went
  // in.
  //
  // Read back out of the specification the schedule stores, which is where the
  // author's own words survive. Temporal translates a cron expression into a
  // calendar spec when it stores one, so asking the cluster what the cadence is
  // answers `0 9 * * MON-FRI` as a set of calendar ranges — true, and not what
  // anybody wrote or would recognise.
  //
  // The two cannot disagree, because CreateSchedule is the only thing that writes
  // either and writes them from one value. What can diverge is a schedule edited
  // out from under Flowstate with the `temporal` CLI; that is visible there, and
  // `flow schedule describe` does not pretend to be the cluster's own view of its
  // own object.
  ScheduleTrigger trigger = 3;

  // Paused is whether firings are currently suppressed.
  bool paused = 4;

  // Note is the message carried on the schedule; see [ScheduleSummary.note].
  string note = 5;

  // NumActions is how many firings this schedule has taken, including manual
  // ones.
  int64 num_actions = 6;

  // NextRunTimes are the next few moments this is due to fire. Empty while
  // paused.
  repeated google.protobuf.Timestamp next_run_times = 7;

  // RecentRuns are the last few firings, oldest first.
  repeated ScheduleActionResult recent_runs = 8;

  // Inputs are the arguments every firing starts its run with, bound and
  // type-checked when the schedule was created.
  //
  // Reported because a schedule that has been running for a month is a thing
  // somebody eventually has to explain, and "what is it passing" is the first
  // question. Absent rather than empty when the stored specification cannot be
  // read back — a schedule created by a build whose message shape has since moved
  // is describable in every other respect, and failing the whole description over
  // one field would take away the answer along with the doubt.
  map<string, Value> inputs = 9;
}

// CreateScheduleRequest asks for a schedule that runs a workflow on a cadence.
message CreateScheduleRequest {
  // Workflow is the specification every firing runs, exactly as [RunRequest]
  // takes it — the same compiled artifact, validated and size-checked the same
  // way.
  //
  // The whole specification rather than a reference to one stored elsewhere,
  // because there is nowhere else: Flowstate has no workflow registry, and a
  // schedule that named a file would be a schedule that breaks when somebody
  // moves it. What fires a year from now is what was created, which is also what
  // makes a schedule reviewable.
  Workflow workflow = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Inputs are the arguments every firing starts its run with.
  //
  // Bound and type-checked *here*, once, while whoever is creating the schedule
  // is still present to be told (invariant 6). The alternative — checking at each
  // firing — puts the refusal at three in the morning in a worker's log, for a
  // mistake made at a keyboard weeks earlier, which is the failure this whole
  // repository's fail-closed rule is about.
  //
  // Same contract as [RunRequest.inputs] and through the same
  // `v1.BindRunInputs`: values and never expressions, no undeclared name, every
  // required input present, defaults filled in. What is stored is the bound map,
  // so a declaration edited later does not change what a schedule already created
  // passes.
  map<string, Value> inputs = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
      max_pairs: 64
    }
  ];

  // Name is what this tenant will call the schedule. Empty takes the workflow's
  // own name, which is the right default and usually the only name anybody wants.
  //
  // Given explicitly when one workflow wants two cadences — a report that runs
  // hourly for one region and nightly for another is one file and two schedules —
  // which is exactly when a generated id would be useless.
  string name = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^$|^[A-Za-z0-9-_]+$"
    }
  ];

  // Paused creates the schedule without letting it fire.
  //
  // A property of the act and not of the file, which is why it is here rather
  // than on [ScheduleTrigger]: the file says what the cadence is, and whether this
  // deployment is currently honouring it is the deployment's answer. It is also
  // what makes creating one safe to rehearse — create paused, describe it, and
  // resume when the next firing time is one somebody meant.
  bool paused = 4 [(google.api.field_behavior) = OPTIONAL];

  // Backfill is deliberately creation-only: it is an operator request, not a
  // perpetual property of the workload, which is why it is here and not in the
  // Flowfile's `triggers.schedule` block. At most 10 intervals spanning no more
  // than 31 days in total are accepted, and both bounds are enforced by
  // `v1.CheckScheduleBackfill` on every path that can create a schedule.
  repeated ScheduleBackfill backfill = 5 [(buf.validate.field).repeated = {max_items: 10}];
}

// CreateScheduleResponse confirms the schedule and describes what was created.
message CreateScheduleResponse {
  // Schedule is the created schedule as the cluster now holds it, so a caller
  // sees the next firing times without a second request — which is the one fact
  // that most often reveals a cadence meaning something other than what was
  // intended.
  ScheduleDescription schedule = 1;
}

// ListSchedulesRequest asks for the caller's schedules. It takes nothing today.
//
// # No paging, deliberately, and what that costs
//
// `List` pages runs because a namespace holds them by the hundred thousand and
// the tenant filter is a memo Temporal cannot query, so an unbounded listing is a
// denial of service waiting to be written. Schedules are not that: they are
// created one at a time by people, and a deployment with a thousand of them has a
// different problem.
//
// The scan is still bounded — see `maxScheduleScan` — and when the bound stops it
// the response says so rather than presenting a partial listing as the whole of
// it. That is a smaller promise than `List` makes, and it is stated instead of
// implied. A `page_token` is a field 1 and 2 away on either message the day a
// deployment needs it, with nothing existing to break.
message ListSchedulesRequest {}

// ListSchedulesResponse returns the caller's schedules.
message ListSchedulesResponse {
  // Schedules are the caller's, in whatever order the cluster returned them.
  repeated ScheduleSummary schedules = 1;

  // Truncated reports that the scan stopped at its bound with schedules still
  // unexamined, so this listing is not the whole of it.
  //
  // Said rather than hidden, on the same reasoning as [ListResponse.next_page_token]:
  // a caller concluding from a short answer that they have seen everything is the
  // failure worth preventing, and it is worse than an answer that admits its own
  // limit.
  bool truncated = 2;
}

// DescribeScheduleRequest asks about one of the caller's schedules by name.
message DescribeScheduleRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$"
    }
  ];
}

// DescribeScheduleResponse is the schedule in full.
message DescribeScheduleResponse {
  ScheduleDescription schedule = 1;
}

// DeleteScheduleRequest removes one of the caller's schedules.
message DeleteScheduleRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$"
    }
  ];
}

// DeleteScheduleResponse is empty: a deleted schedule has nothing to report.
message DeleteScheduleResponse {}

// PauseScheduleRequest stops a schedule firing without removing it.
message PauseScheduleRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$"
    }
  ];

  // Note is recorded on the schedule and shown by list and describe.
  //
  // Worth writing, because a paused schedule found by somebody else is a thing
  // with no explanation attached — the same reason [TerminateRequest] carries a
  // reason.
  string note = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string = {max_len: 256}
  ];
}

// PauseScheduleResponse is empty.
message PauseScheduleResponse {}

// ResumeScheduleRequest lets a paused schedule fire again.
message ResumeScheduleRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$"
    }
  ];

  // Note replaces the message on the schedule, which is usually where the reason
  // it was paused is still written.
  string note = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string = {max_len: 256}
  ];
}

// ResumeScheduleResponse is empty.
message ResumeScheduleResponse {}

// TriggerScheduleRequest fires a schedule now, without waiting for its cadence.
message TriggerScheduleRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$"
    }
  ];
}

// TriggerScheduleResponse is empty.
//
// Not the run it started, and that is Temporal's shape rather than a choice: a
// trigger is asynchronous — the cluster takes the action and the schedule's own
// history records it — so there is no execution to name by the time this returns.
// `DescribeSchedule` reports it as a recent run once it has been taken, which is
// what the CLI points at.
message TriggerScheduleResponse {}

// MutationResult is the answer a mutation gives to a program.
//
// Every mutation on this service answers with an empty message today:
// `CancelResponse`, `TerminateResponse`, `SignalResponse`, and the four
// schedule mutations. A caller that changed something therefore has nothing to
// read back and has to ask the server a second time to learn what it just did,
// which is a round trip for facts the calling process already held. This
// message is the envelope that closes that gap, and it is deliberately one
// shape across every mutation verb rather than one per verb: a caller writes a
// single expression, and a verb added later is already covered by it.
//
// It belongs in the schema because it travels. A document a script indexes by
// name is a contract with everything downstream, and a contract this project
// keeps is one the schema describes: the field names come from here, protojson
// renders it, and `buf breaking` guards it exactly as it guards every message a
// caller reads off an RPC.
//
// What may appear here is bounded by what the process performing the mutation
// knows for certain, which is what it asked and that the server accepted the
// asking. Nothing is inferred about the resulting state of a run or a schedule,
// because inventing "the run is now cancelled" out of an empty response is the
// one claim these surfaces have always refused to make. As those responses gain
// fields of their own (picatz/flowstate#374), this becomes the smaller half of
// an answer rather than the whole of it.
message MutationResult {
  // Verb is the act that produced this result, spelled the way a caller asked
  // for it and without the binary name: "cancel", "terminate", "signal",
  // "schedule pause".
  //
  // Carried so that a log of these documents, or a pipeline handling several,
  // says what each one was. Read out of its invocation, a result is otherwise
  // an identifier and a word with no verb attached to either.
  string verb = 1;

  // WorkflowId names the workload acted on, and is empty on the schedule verbs.
  string workflow_id = 2;

  // RunId is the attempt the request was pinned to, and is empty when the
  // caller pinned none.
  //
  // Empty is the usual case and means the request addressed whichever run of
  // the workload is current. This is the run id that was sent rather than the
  // one the server resolved, which is the point of reporting it: a caller can
  // tell a request that named an attempt from one that took the current attempt
  // without knowing which attempt that turned out to be.
  string run_id = 3;

  // ScheduleName names the schedule acted on, and is empty on the run verbs.
  //
  // A name rather than an id, because that is what the schema calls it
  // ([ScheduleDescription.name]) and a schedule has no other identity. Spelling
  // it "schedule_id" here would invent a second word for one concept.
  string schedule_name = 4;

  // SignalName is the signal that was sent, and is empty on every other verb.
  //
  // Part of what was done rather than only of what was addressed: two signals
  // to one run are two different acts, and a result naming neither leaves a
  // reader unable to tell them apart afterwards.
  string signal_name = 5;

  // Result is how far the act got, which is the distinction these verbs turn on
  // and the one that decides whether a caller may build on the answer.
  //
  // Three words, and the differences between them are load bearing.
  //
  // "applied" is an act that is true once the server has answered: terminating
  // a run, and deleting, pausing or resuming a schedule. The new state is in
  // effect at that point, so a caller may act on it directly.
  //
  // "requested" is an act the server has accepted and has not yet performed.
  // Cancellation is cooperative, so the run has been told and is still finishing
  // its response; a triggered schedule fires after the answer, which is also why
  // there is no run id to report alongside it. A caller that needs the outcome
  // has to go and read it.
  //
  // "delivered" belongs to the signal verb, and it is neither of the other two
  // on purpose. The server has taken the signal, either into the gate that was
  // waiting or into the bounded pending set for a gate the run has not reached
  // yet, and that is the whole of what anything on this side can claim. A signal
  // still pending when the run continues as new is dropped once the carry limit
  // is full, so a workflow that never observes it is a possible ending of a
  // delivery that succeeded. "applied" would promise that the workflow acted on
  // it, which no surface here is in a position to know.
  //
  // A string rather than an enum, because this is the calling process reporting
  // how far its own request got rather than a state the server models, and the
  // vocabulary grows as those empty responses gain the fields that would let an
  // answer be more precise. An enum here would freeze a set that is still
  // learning its own distinctions, and would rename every value a caller reads
  // today.
  string result = 6;
}
