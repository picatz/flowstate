syntax = "proto3";

package flowstate.v1;

import "buf/validate/validate.proto";
import "google/api/expr/v1alpha1/syntax.proto";
import "google/api/expr/v1alpha1/value.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "flowstatev1";

// Workflows in Flowstate is a collection of steps that can be executed in a
// specific order. Each step within a workflow can have inputs and outputs,
// and can be a task that performs some action. The workflow can be run and the
// outputs of each step are collected in a structured way that allows for subsequent
// steps to access the outputs of previous steps.
message Workflow {
  // StepOutputs is a map of step IDs to their outputs. Each step's outputs are
  // represented as a map of named values, allowing for structured outputs that
  // can be referenced by subsequent steps in the workflow.
  //
  // This is used to collect the outputs of each step in the workflow, which can
  // then be used as inputs to other steps or returned as the final result of the
  // workflow run.
  message StepOutputs {
    map<string, Node.Outputs> step_values = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).map = {
        keys: {string: {min_len: 1}}
      }
    ];
  }

  // Workflow is identified by a unique name.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$" // Alphanumeric, dashes, and underscores.
    }
  ];

  // Workflows can have an optional description that provides additional context or
  // information about the workflow itself that may be useful for users or developers.
  optional string description = 2 [(buf.validate.field).string = {max_len: 256}];

  // Steps are the individual tasks or operations that make up the workflow.
  // Each step is represented by a Node, which can be a task or another type of
  // operation. The steps are executed in the order they are defined in the workflow.
  // Each step can have its own inputs and outputs, allowing for complex workflows
  // that can perform a variety of operations.
  repeated Node steps = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];

  // Field 4 was `map<string, Value> inputs`, meant as initial data for a workflow.
  //
  // Nothing ever wrote it and nothing ever read it. No Flowfile key compiled to it,
  // no RPC carried a value for it, and no evaluation bound a name from it — the
  // parser answers `inputs:` at this level with "unknown key", listing the keys that
  // do exist. It was a shape held open for a feature, and the feature it is now
  // wanted for is not this one: Phase 2's parameters are typed and declared, not a
  // bare map, and they belong in a message that can say so.
  //
  // Reserved by *name* as well as by number, which is the part that matters here.
  // There is no custom data converter, so Temporal's default composite converter
  // reaches ProtoJSON before Proto and every specification in a workflow's history
  // is stored with field *names*. A future `inputs` of a different shape would
  // therefore be read out of an old history by name and silently mean something
  // else — which the number alone does not prevent.
  //
  // The same fact has a cost, and it is worth stating once here because it applies
  // to every deletion in this file rather than to this one. Temporal's ProtoJSON
  // converter is built with `protojson.UnmarshalOptions{}` — `DiscardUnknown` is
  // false — so a history whose stored specification carries a deleted field does
  // not decode at all:
  //
  //   unable to decode: proto: (line 1:68): unknown field "inputs"
  //
  // Measured, not assumed. A run in flight when the field goes away therefore fails
  // rather than ignoring it, and the failure is at the worker rather than at
  // submission.
  //
  // Accepted here on the same terms as the two deletions already in this file —
  // `Task.description` below, and the three retired tasks. Nothing in this
  // repository ever set `inputs`, no release has ever been tagged, and a schema
  // change that a run cannot survive is what an *edition* boundary is for. What
  // would not be acceptable is doing it quietly: a deletion that costs an in-flight
  // run has to be a decision somebody made, which is why it is written down.
  reserved 4;
  reserved "inputs";

  // Labels are key-value pairs that can be used to organize and categorize workflows.
  map<string, string> labels = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
    }
  ];

  // Profile names the vocabulary every expression in this workflow was compiled
  // against — which CEL extension libraries are in scope.
  //
  // Set by the compiler, not written by an author. There is deliberately no
  // `profile:` key: an author choosing a vocabulary per file is how a file came to
  // have two of them, which is what one profile removes.
  //
  // Recorded rather than resolved at execution because a run has to keep meaning
  // what it meant. A future build that adds a library must not change how an
  // expression already stored in `RunState` evaluates — invariant 10 — and
  // "whatever this worker has" is a set that changes underfoot. A profile name has
  // frozen membership, so a worker resolves the name rather than asking what it
  // ships with, and refuses a name it does not know.
  //
  // A different axis from `edition:`, and the distinction is load-bearing. An
  // edition is a property of a *file*: read when it compiles, gone afterwards, and
  // retiring one affects nothing already executing. A profile is a property of a
  // *run*, and travels.
  //
  // Empty means a spec compiled before this field existed, which resolves to the
  // first profile — a compatibility arm rather than a guess, since nothing has been
  // released and such a spec can only have come from a build whose one vocabulary
  // was that profile's.
  string profile = 6 [(google.api.field_behavior) = OPTIONAL];

  // Vars are named expressions evaluated once at the start of the run, visible to
  // every step as `vars.<name>`.
  //
  // They exist because the alternative is repetition: a value derived once and used
  // in six places is written six times today, and the six copies drift. A `cel` step
  // can compute one, but then it is a step — it occupies the step budget, appears in
  // the run's outputs, and has to be ordered before everything that reads it.
  //
  // # Rooted, not bare
  //
  // `vars.<name>` rather than `<name>`, which is the same decision `steps.<id>` made
  // and for the same reason: rooting makes a collision between a var and a step id
  // *unrepresentable* rather than something a validation rule has to forbid. What
  // stays bare is only what is bound where the expression is written — a `for_each`
  // iterator, `now` inside `wait_until:`, the names a task resolves against its own
  // scope. Those are bare bindings; see [Scope.vars].
  //
  // # Two sites, and only this one is rooted
  //
  // `vars:` is also accepted on a step, where it means something deliberately
  // different: a step's vars are *bare* within that step (`${modified}`), because
  // they are author-chosen and lexically local — the same standing as a loop
  // binding. Only the workflow-level ones are ambient, so only these are rooted.
  // See [Scope.vars] for where a step's land.
  //
  // # Shadowing is refused, not resolved
  //
  // A bare name must be unique against every bare name in scope: a step var may not
  // collide with an enclosing loop binding, a loop binding may not collide with an
  // enclosing step var, and neither may be `now`. `flow validate` reports the
  // collision at the inner declaration. Silent shadowing is how `${body}` comes to
  // mean two things eleven lines apart.
  //
  // Nothing needs to be refused *here*, at the workflow level, because these are
  // rooted: `vars.region` cannot collide with anything, which is the whole reason
  // the ambient half of the namespace is rooted at all.
  map<string, Value> vars = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
      max_pairs: 64
    }
  ];
}

// Node represents a step in the workflow. Each node can be a task or another type of operation.
// Nodes can have outputs that are structured as named values, allowing for complex workflows
// where the outputs of one node can be used as inputs to another node.
message Node {
  // Outputs are the results produced by the node. Each output is a named value that can be
  // referenced by subsequent nodes in the workflow. This allows for structured outputs that
  // can be used to pass data between nodes.
  message Outputs {
    map<string, Value> named_values = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).map = {
        keys: {string: {min_len: 1}}
      }
    ];
  }

  // Each node has a unique identifier within the workflow. This ID is used to reference the
  // node in the workflow's step outputs and can be used to access the outputs of the
  // node after the workflow has been executed.
  string id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+$" // Alphanumeric, dashes, and underscores.
    }
  ];

  // A node must be a specific kind of operation.
  oneof kind {
    option (buf.validate.oneof).required = true;
    Task task = 2;
    ForEach for_each = 5;
    Parallel parallel = 6;
    Wait wait = 7;
  }

  // Condition determines whether the step runs.
  //
  // It is evaluated before the step is scheduled and must produce a boolean. A
  // step whose condition is false is skipped and produces no outputs, so a later
  // step referencing it will not resolve — which is the honest outcome, since
  // the value genuinely does not exist.
  //
  // Unset means the step always runs.
  Value condition = 3;

  // Policy controls how the step is executed: how long it may take, whether and
  // how it is retried, and whether its failure ends the run.
  //
  // Unset means the engine's defaults apply.
  StepPolicy policy = 4;

  // Description is optional prose about what this step is for.
  //
  // It belongs to the step rather than to the task the step runs, which is where
  // it used to live. Once a step names its task directly, the value under `echo:`
  // is that task's inputs, so a `description` written there would be an input of
  // that name; and a `for_each` or a `sleep` is just as worth explaining as a
  // task is. The step is the thing an author is describing either way.
  optional string description = 8 [(buf.validate.field).string = {max_len: 256}];

  // Vars are names this step binds for itself, read *bare* inside it: `${modified}`.
  //
  // Bare rather than rooted, which is the opposite of [Workflow.vars] and deliberate.
  // The rule is not about which block a name came from but about where it is bound:
  // an author-chosen name bound lexically, close enough to read the binding and the
  // use together, stays bare — the same standing a `for_each` binding has. A name
  // that is simply in the air everywhere gets a root, because that is the only thing
  // that keeps it from colliding with what an author chose.
  //
  // Evaluated after the step's condition and before its inputs, in the step's own
  // scope: it may read `vars.<name>`, the outputs of steps already run, and any
  // binding it sits inside. So unlike a workflow var it *can* see the run.
  //
  // # Collisions are refused, not resolved
  //
  // Every name here is bare and so can collide with another bare name — an enclosing
  // loop's binding, a step var further out, `now`. That is refused at validation, at
  // the inner declaration, rather than resolved by a precedence rule. Silent
  // shadowing is how `${body}` comes to mean two things eleven lines apart, and a
  // precedence rule is a thing every reader has to know before they can read the
  // second one correctly.
  //
  // By the time a spec reaches the engine there is therefore nothing to decide, which
  // is why [Scope.vars] holds these and a loop's binding in one map.
  map<string, Value> vars = 9 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
    max_pairs: 64
  }];
}

// SecretRef names a secret without containing it.
//
// A workflow specification is persisted, replayed, and readable by anyone who can
// read workflow history, so it must never carry a credential. It carries this
// instead: enough to find the value at the moment it is needed, and nothing more.
//
// The scheme and name are separate fields rather than one joined string so that
// the schema itself rejects a malformed reference at the boundary, before any
// worker tries to resolve it.
//
// This message must never gain a field holding a value. Adding one would make
// every workflow that used it leak a credential into history, and the mistake
// would be invisible until someone read the history.
message SecretRef {
  // Scheme selects the provider that resolves the reference, such as "env",
  // "file", "vault", or "keychain".
  //
  // A scheme is how a secrets backend plugs in: a deployment registers providers
  // for the schemes it permits, and a reference to an unregistered scheme is
  // refused rather than guessed at. A deployment that permits no secrets at all
  // registers none, and every reference fails.
  string scheme = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
      pattern: "^[a-z0-9-]+$"
    }
  ];

  // Name locates the secret within that provider: an environment variable
  // suffix, a path under a mounted directory, a vault path. Its meaning belongs
  // to the provider, including how it expresses versions.
  //
  // The pattern here cannot express everything that matters — control characters
  // are also rejected, in code, because a reference reaching a log or history
  // must not be able to forge lines in it.
  string name = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
}

// Wait suspends a workload until time passes, a condition holds, or a signal
// arrives.
//
// This is the primitive a CI system fundamentally cannot copy. A run that waits
// a week for a human approval and survives every worker restart in between is
// not a long-running process — the process may not exist for most of that week.
// The wait is durable state on the execution substrate, so a worker that is
// redeployed, crashes, or moves machines resumes exactly where it was.
//
// It is a node kind rather than a task, because waiting schedules no activity
// and touches nothing outside the workflow: no worker executes it, no
// credentials are needed, and nothing can fail except the wait itself. Making it
// a task would put an evaluator and an activity round trip behind something that
// is a timer.
message Wait {
  // What is being waited for.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // Duration waits for time to pass, as `sleep: 30s`.
    //
    // It is a durable timer, so the workload is not holding a worker or a thread
    // while it elapses. A week is as reasonable as a second.
    google.protobuf.Duration duration = 1;

    // Until waits for a *moment*, as `wait_until: <expr>`.
    //
    // The expression is evaluated once, against the outputs of steps that have
    // already run, and must produce a time; a boolean is refused rather than
    // polled. Inside it `now` names the moment the wait is evaluated — taken from
    // the driver's clock, so it replays to the same instant — and the duration
    // units make a relative deadline readable: `${now + days(3)}`.
    //
    // It is a moment and not a condition because a condition here could only ever
    // spell "wait forever". A blocked workload runs no step, so nothing it can
    // see changes while it waits: a condition over step outputs is either already
    // true or never going to be. Waiting on something outside the workload is
    // what a signal is for.
    //
    // A moment already past releases the wait immediately, which is what lets a
    // workload resumed after an outage reach an open window and catch up instead
    // of failing for being late.
    Value until = 2;

    // Signal waits for something outside the workload to say it may proceed,
    // which is what makes a human approval gate expressible.
    Signal signal = 3;
  }

  // Timeout bounds how long the wait may last, for a wait that might otherwise
  // never end.
  //
  // It is meaningful for `until` and `signal`, and meaningless for `duration`,
  // where the duration is already the bound. A wait that times out is not a
  // failure: it produces its outputs with `timed_out` true, so an author decides
  // what a lapsed approval means with an ordinary `if:` rather than having to
  // treat a normal outcome as an error.
  //
  // Unset means the wait may last as long as the run does. That is a deliberate
  // choice for an approval gate that genuinely should block until someone acts,
  // and a mistake everywhere else.
  google.protobuf.Duration timeout = 4;
}

// Signal names something a workload waits to be told.
//
// The payload a signal carries becomes the waiting step's outputs, which is what
// makes a gate compose with everything else: `${approval.approved}` resolves the
// way any other step reference does, so it works in an `if:`, in a task input,
// and in a later expression, with no special form for signals.
message Signal {
  // Name is what a sender addresses. It is part of the workload's contract with
  // whatever approves it, so it is written by the author rather than generated.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];
}

// PendingSignal is a signal that arrived before the step waiting for it was
// reached, carried across Continue-As-New.
//
// It exists because Temporal delivers a signal to the run that is current when it
// arrives, and a run that suspends drops anything still buffered on a channel it
// has not read. Without carrying them, approving a gate before the run reaches it
// — which is ordinary behavior, not misuse — would silently lose the approval and
// leave the run waiting forever.
message PendingSignal {
  // Name is the signal that arrived.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Payload is what it carried, which becomes the waiting step's outputs.
  Node.Outputs payload = 2;
}

// Scope is what an expression is evaluated against.
//
// It holds the outputs of steps that have already run, plus any variables bound
// by enclosing control flow, such as a loop's current item.
//
// This is part of the schema rather than an internal Go type because it crosses
// the wire: a task that evaluates its own expressions — the cel task's `expr`, the
// http task's `outputs` — does so on a worker, so the scope has to travel with it.
// Without that, a loop body could not use its own iterator in those inputs.
//
// Variables are Values, the same representation step outputs use, so anything a
// step can produce can also be bound as a variable.
message Scope {
  // Outputs holds the outputs of steps that have already run.
  Workflow.StepOutputs outputs = 1;

  // Profile is the workflow's language profile, carried here because this is what
  // reaches the worker that evaluates a task's own expressions.
  //
  // Without it that worker would evaluate against whatever profile its own build
  // calls current, which is the same run computing against two vocabularies — the
  // failure one profile exists to remove, reintroduced at the point where the work
  // actually happens.
  string profile = 3;

  // Vars holds the names bound *where an expression is written*, resolved bare: a
  // `for_each` binding, a step's own `vars:`, `now` inside a wait.
  //
  // The name is a historical one and is kept deliberately. This field has carried
  // bare bindings since before there was a rooted namespace, and an activity
  // scheduled before an upgrade holds that shape in history — a retry after the
  // upgrade replays the same payload. Redefining the field would make a new worker
  // read an old loop's `item` as an ambient var and leave the bare name unbound, so
  // the rooted namespace went to [Scope.ambient_vars] instead and this one did not
  // move. A field that crosses a version boundary means what it has always meant.
  //
  // Because every name here is bare they can collide, and that is refused at
  // validation rather than resolved: a step var that shadows an enclosing loop
  // binding, or either shadowing `now`, is reported at the inner declaration. By the
  // time a spec reaches the engine there is nothing left to decide.
  map<string, Value> vars = 2 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
  }];

  // AmbientVars holds the rooted `vars.<name>` namespace, which is the workflow's
  // declared vars.
  //
  // Only the workflow level declares into here. A step's `vars:` are bare and land in
  // [Scope.vars] instead, because they are author-chosen and lexically local rather
  // than ambient — so there is exactly one source for this map and no shadowing to
  // resolve within it.
  //
  // A new field rather than a new meaning for an old one: see [Scope.vars].
  map<string, Value> ambient_vars = 4 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
  }];
}

// ForEach runs a body of steps once per item of a list.
//
// This is how a workload expresses "do this to each of these" without the author
// unrolling it by hand, which they cannot do anyway when the list is computed at
// run time.
//
// The body sees the current item under the iterator's name, and body steps can
// reference each other within an iteration. Body step outputs do not escape the
// iteration; the loop as a whole reports every iteration's outputs through its own
// `results` output, so that what a later step sees does not depend on which
// iteration happened to run last.
message ForEach {
  // Items is an expression producing the list to iterate. An empty list runs the
  // body zero times, which is a normal outcome rather than an error.
  Value items = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Iterator names the variable bound to the current item inside the body.
  // Defaults to "item". It must not collide with a step id, since both are
  // resolved from the same namespace.
  string iterator = 2 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  }];

  // Body is the steps to run per item.
  repeated Node body = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];

  // MaxParallel bounds how many iterations run concurrently. Zero or one runs
  // them one at a time, which is the safe default: concurrency is worth
  // requesting explicitly, because it changes both the load placed on whatever
  // the body touches and the order in which side effects happen.
  int32 max_parallel = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

// Parallel runs several branches of steps concurrently and waits for all of them.
//
// Branches are for work that is independent by construction — checking three
// services, publishing to two destinations — where doing it sequentially wastes
// time for no benefit. Steps within a branch still run in order.
//
// Branches must not depend on each other's outputs. There is no ordering between
// them, so such a dependency would be a race; each branch sees the outputs that
// existed before the parallel node began, plus its own.
message Parallel {
  message Branch {
    repeated Node steps = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
      }
    ];
  }

  repeated Branch branches = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    }
  ];
}

// StepPolicy controls the execution of a single step.
//
// These settings exist because one policy cannot fit every step. Reading a
// configuration file and provisioning a cluster differ by orders of magnitude in
// how long they take and how safe they are to repeat, and a workload engine that
// applies the same timeout and the same retry count to both is wrong for at least
// one of them.
message StepPolicy {
  // Timeout bounds a single attempt at the step. A step exceeding it fails that
  // attempt, which may then be retried according to Retry.
  google.protobuf.Duration timeout = 1 [(buf.validate.field).duration = {gt: {}}];

  // Retry describes how a failed attempt is retried. Only failures that could
  // plausibly succeed on another attempt are retried; a step that failed because
  // its inputs are invalid is not retried regardless of this setting.
  RetryPolicy retry = 2;

  // ContinueOnError lets the run proceed when this step fails.
  //
  // The step records its failure instead of ending the run, which is what makes
  // best-effort work expressible: a notification that could not be delivered
  // should not abandon the workload that succeeded.
  bool continue_on_error = 3;
}

// RetryPolicy describes how a failed step attempt is retried.
message RetryPolicy {
  // MaxAttempts bounds total attempts, including the first. Zero uses the
  // engine's default. One disables retrying, which is the right choice for an
  // operation that is not safe to repeat.
  int32 max_attempts = 1 [(buf.validate.field).int32 = {gte: 0}];

  // InitialInterval is the delay before the second attempt.
  google.protobuf.Duration initial_interval = 2 [(buf.validate.field).duration = {gt: {}}];

  // BackoffCoefficient multiplies the delay after each attempt. Values below one
  // are rejected, since a shrinking delay defeats the purpose of backing off.
  double backoff_coefficient = 3 [(buf.validate.field).double = {gte: 1.0}];

  // MaxInterval caps the delay between attempts, so exponential growth does not
  // produce an unbounded wait.
  google.protobuf.Duration max_interval = 4 [(buf.validate.field).duration = {gt: {}}];
}

// Value represents a value that can be used in expressions or as inputs/outputs in tasks.
// It can be a primitive type (like string, int, float, or bool), a structured type
// (like a struct or list), an expression (ParsedExpr), or an error. The Value type is used
// to encapsulate different kinds of data that can be used within the workflow.
message Value {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_STRING = 1;
    TYPE_INT = 2;
    TYPE_FLOAT = 3;
    TYPE_BOOL = 4;
    TYPE_STRUCT = 5;
    TYPE_LIST = 6;
    TYPE_EXPR = 7;
    TYPE_ERROR = 8;
  }

  message Error {
    enum Code {
      CODE_UNSPECIFIED = 0;
      CODE_INVALID_ARGUMENT = 1;
      CODE_NOT_FOUND = 2;
      CODE_PERMISSION_DENIED = 3;
      CODE_UNAUTHENTICATED = 4;
      CODE_INTERNAL = 5;
      CODE_UNAVAILABLE = 6;
    }
    string message = 1 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED
    ];
    Code code = 2 [
      (buf.validate.field).required = true,
      (google.api.field_behavior) = REQUIRED,
      (buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }
    ];
  }

  oneof kind {
    option (buf.validate.oneof).required = true;
    google.api.expr.v1alpha1.ParsedExpr expr = 1;
    google.api.expr.v1alpha1.Value literal = 2;
    Error error = 3;

    // A reference to a secret, resolved only where the value is needed.
    //
    // This kind is inert everywhere except the activity that uses it. The
    // compiler produces it, the control plane transports it, and workflow-side
    // evaluation passes it through untouched — it is never resolved into a value
    // and never copied into step outputs, because workflow history is durable and
    // broadly readable. Only the worker executing the task resolves it, and the
    // value exists solely for that call.
    SecretRef secret_ref = 4;
    // TODO(kent): we're using "value" to represent a "literal" value, which isn't quite the same.
    // So, this is probably worth revisiting. The "value" allows for more complex types, like a
    // struct or list, while the "literal" is more of a primitive value like a string, int, or bool.
    //
    // https://github.com/googleapis/googleapis/blob/34b323e7ee72888dd9337cce8b24233ae078f23b/google/api/expr/v1beta1/expr.proto#L230-L241C9
    // https://github.com/googleapis/googleapis/blob/34b323e7ee72888dd9337cce8b24233ae078f23b/google/api/expr/v1beta1/value.proto#L29-L72
    //
    // google.api.expr.v1alpha1.Literal literal = 2;
  }
}

// Task represents a specific operation that can be performed within a workflow as a node step.
// TaskCatalog is what this build can execute, described so that something other
// than a person can read it.
//
// The task registry is the single source of truth for capability — the engine
// dispatches from it, the validator checks against it, the editor completes from
// it — and until this existed the only way out of the process was a table meant
// for a terminal. An agent driving the CLI as a tool, a generator producing
// documentation, or an editor that is not this project's language server all had
// to parse columns, which is not a contract.
//
// It is a schema type rather than a shape invented in the CLI because it
// describes the system, which is what this file is for: a field added to it
// appears in every consumer without any of them changing, and it is already
// versioned and wire-stable — which is what let GetCatalog return it unchanged
// the day that RPC arrived.
message TaskCatalog {
  // Tasks is every task this build can run, sorted by name.
  repeated TaskDescription tasks = 1;

  // CelLibraries are the CEL extension libraries every expression in a workflow
  // reaches. Not opt-in: a workflow speaks one dialect, so this is the vocabulary
  // of `if:`, `items:`, `wait_until:`, a task input and a `cel` step alike.
  repeated string cel_libraries = 2;

  // DurationUnits are the duration constructors available to *every* expression
  // — `days(3)`, `minutes(30)` — rather than only where a library is enabled.
  // Listed separately for that reason: somebody reading cel_libraries to find out
  // what an expression can say would otherwise conclude these are unavailable.
  repeated string duration_units = 3;

  // NowIdentifier is the name bound to the evaluation moment inside a
  // `wait_until` expression, and nowhere else. It is the one identifier whose
  // availability depends on position, so a reader cannot infer it.
  string now_identifier = 4;

  // ValueRoots are the names an expression reaches a value through: `vars` for a
  // value the file names, `steps` for what a step produced.
  //
  // Here for the same reason NowIdentifier is — a reader cannot infer it from the
  // task list — and the retirement edition made that sharper rather than softer. A
  // consumer reading this catalog now sees two tasks, one of which produces nothing
  // at all, and could reasonably conclude the language has almost no way to compute
  // anything. It has one: an expression, bound under `vars:` at the workflow or on a
  // step, read back through these roots.
  //
  // Roots rather than prose because this message is the machine-readable half. What
  // the roots *mean* is `flow tasks` output and docs/DSL.md; what an agent needs in
  // order to write a reference that resolves is the words themselves.
  repeated string value_roots = 5;

  // CelFunctions is every name the profile's libraries add, sorted by library and
  // then by name.
  //
  // cel_libraries above says which libraries are switched on and nothing about what
  // is in any of them, which is the difference between a fact and an answer: a
  // reader who wants to sort a list learns that `lists` is enabled and still has to
  // go and find cel-go's documentation to discover `sortBy`. That was survivable
  // while the answer was "everything cel-go has"; it stopped being survivable when a
  // profile became a *membership*, because a subset nobody can enumerate is a subset
  // nobody can write against.
  //
  // Both fields, rather than replacing one with the other. A library name is what
  // groups these and what docs/DSL.md and the profile definition talk in, so a
  // consumer that only wants to know the shape of the dialect should not have to
  // derive it from ninety names.
  repeated CELFunction cel_functions = 6;
}

// CELFunction is one name an expression may call.
message CELFunction {
  // Name is written as it is called: `math.abs`, `upperAscii`.
  //
  // With one qualification, for a macro. cel-go identifies a macro by the name after
  // the dot, so `math.greatest(1, 2)` is reported as `greatest` and
  // `[3,1,2].sortBy(v, v)` as `sortBy` — a receiver style whose receiver is a
  // namespace in the first case and a value in the second, which its API does not
  // distinguish. So for a macro this is the name and not the whole call form, and a
  // consumer must not render it as one.
  string name = 1;

  // Library is the profile library that declares it.
  //
  // One library per name even where two declare it: this build's `regex` entry pulls
  // in cel-go's optional types, so an undeduplicated listing repeats all thirteen of
  // `optional` beneath it. A profile is one membership rather than a set of
  // switches, so which library a name arrived through is a fact about wiring, and
  // printing it twice reads as two functions.
  string library = 2;

  // Macro says the parser expands this rather than the evaluator calling it.
  //
  // Visible to an author in one place, which is why it is carried rather than
  // levelled away: a macro is settled when the file compiles, so its meaning is
  // frozen into the compiled workflow, where a function is looked up by whichever
  // worker evaluates the run.
  bool macro = 3;

  // Example is a complete expression calling this, set only where `name` is not
  // enough to construct one — which is exactly the macros.
  //
  // A function's name *is* its call form: `upperAscii` is written `x.upperAscii()`
  // or `regex.replace(a, b, c)` as the name says. A macro's is not, and cel-go's
  // parser API is why: `Macro` exposes `Function`, `ArgCount`, `IsReceiverStyle`
  // and `MacroKey`, and none of them names the *receiver*. So `greatest` is
  // reported for something written `math.greatest(1, 2)` and `sortBy` for
  // something written `[3,1,2].sortBy(v, v)` — a namespace in one case and a value
  // in the other, indistinguishable from the outside.
  //
  // Which means this cannot be derived, and a consumer told "do not render `name`
  // as a call" and given nothing else has been handed a catalogue of things it
  // cannot use. It is a written table, kept honest the way this repo keeps the
  // things that cannot be derived: a test asks the environment for its macros and
  // fails on any that has no example, and every example is *evaluated* rather than
  // inspected, so an entry that stops working stops passing.
  //
  // Deriving it was tried and rejected rather than skipped. A library's macros can
  // be paired with the internal `@` names it declares — `math.@max` alongside
  // `greatest` gives `math` — and that is right for `math` and `bindings` and
  // silently wrong for `comprehensions`, which declares `cel.@mapInsert` while
  // `transformList` is written on a value. A derivation that is wrong for one
  // library in five is worse than a table somebody has to keep, because nothing
  // about it says which one.
  string example = 4;
}

// TaskDescription is one task's name and shape.
message TaskDescription {
  string name = 1;

  // Summary is a single line, the same one `flow tasks` prints.
  string summary = 2;

  repeated TaskField inputs = 3;
  repeated TaskField outputs = 4;
}

// PluginCatalog is what a deployment's plugins add to this build, described so
// that something other than a person can read it.
//
// The same argument as [TaskCatalog], applied one process boundary out. A plugin
// is code the engine does not ship, so "which tasks can this worker run" stops
// being a property of the binary and becomes a property of a deployment — and a
// question nobody can ask from outside is one every operator answers by reading
// logs.
//
// A plugin's task is described by [TaskDescription], the same message a built-in
// one is. That is not a convenience: a plugin ships protobuf descriptors for its
// inputs and outputs, so there is genuinely nothing left over to say about it,
// and giving it a parallel message would have been a second definition of the
// same thing. Where the two differ is *provenance*, which is the field this
// message adds and the reason it exists — a reviewer needs to know that a step
// leaves the engine's code.
//
// Wire-stable, on the same terms as [TaskCatalog], and for the same reason: a
// worker-introspection RPC that wants to return one should not have to invent a
// shape the CLI already prints.
message PluginCatalog {
  // Plugins is every plugin the worker brought up, sorted by name.
  repeated PluginDescription plugins = 1;

  // SearchPath is the directories the worker was configured to discover plugins
  // in, in precedence order.
  //
  // Carried because an empty plugin list has two meanings that matter to tell
  // apart — nothing installed, or nowhere to look — and only one of them is a
  // configuration mistake.
  repeated string search_path = 2;
}

// PluginDescription is one plugin's identity and what it advertises.
message PluginDescription {
  // Name is the segment after `flowstate-plugin-` in the executable's name, and
  // is how discovery establishes it. It is not self-reported.
  string name = 1;

  // Version is what the plugin says it is. Informational: compatibility is
  // decided by the protocol version, not by this.
  string version = 2;

  // Description is the plugin's own one-line summary.
  string description = 3;

  // Path is the executable this worker launched, which is the fact an operator
  // wants when two directories on the search path hold the same name.
  string path = 4;

  // SecretSchemes are the secret reference schemes this plugin resolves.
  repeated string secret_schemes = 5;

  // Tasks are the tasks this plugin provides, described exactly as a built-in
  // task is.
  repeated TaskDescription tasks = 6;
}

// TaskField is one input or output, described in the DSL's vocabulary.
message TaskField {
  string name = 1;

  // Type is what an author would call it — `string`, `list[string]`,
  // `map[string, string]`, or `any` where the shape is whatever an expression
  // produced. Deliberately not the Protobuf type name, which is accurate about
  // the schema and useless about the file being written.
  string type = 2;

  // Required reports whether the task cannot run without this input. Never set on
  // an output, where the question does not arise.
  bool required = 3;

  // Deferred reports that the task evaluates this input's expression itself,
  // against a scope the workflow does not have.
  //
  // It changes what may legally be written here, which is why it is a field
  // rather than prose: `http`'s `outputs` may name `status_code` because the task
  // evaluates it after the response arrives, and an ordinary input may not,
  // because the engine resolves it before the step is even scheduled.
  bool deferred = 4;
}

message Task {
  // Log is a task that emits a message for a person to read.
  //
  // It exists because `echo` was doing this job under a name that describes the
  // wrong thing: echo *returns* a value, and the two uses that survived `vars:` —
  // hello-world scaffolding and "this branch ran" markers — were never about the
  // return. They were about someone seeing it. Naming the capability after what it
  // is for is what lets the surfaces that show it (a `flow run` transcript, the
  // watch view, the run record) treat it as a message rather than as a value that
  // happens to be printed.
  //
  // # It has no outputs, deliberately
  //
  // A log line is an effect on a reader, not a value for a later step. Offering
  // `result` would make `${steps.announce.result}` legal, which is the `vars:` use
  // case sneaking back in through the one task that has no business carrying data —
  // and it would give a step two reasons to exist, so the file could no longer say
  // which one was meant. A capability that emits nothing is how this language says
  // "this produces nothing you can read".
  message Log {
    message Inputs {
      // Message is the line a person reads. It is the whole point, so it is the
      // only required input.
      string message = 1 [
        (buf.validate.field).required = true,
        (google.api.field_behavior) = REQUIRED
      ];

      // Level says how much it matters, and defaults to LEVEL_INFO.
      //
      // An enum rather than a free string, because a sink has to map it onto
      // something — a terminal colour, a severity field, a filter — and a set that
      // an author can extend by typo is a set nothing downstream can switch on.
      Level level = 2 [(buf.validate.field).enum = {defined_only: true}];

      // Fields carry structure for a sink that has somewhere to put it, and are
      // ignored by one that does not.
      //
      // String-valued rather than Value-valued, and that is a real limit rather
      // than an oversight: every sink this can reach — a terminal line, a logging
      // backend's attributes, a run record — renders to text in the end, and a
      // nested value would render differently at each of them. Compose the string
      // in the expression, where the author can see what it will say.
      //
      // Bounded because a workflow chooses both the count and the size, and a log
      // line is written to durable history.
      map<string, string> fields = 3 [(buf.validate.field).map = {
        max_pairs: 32
        keys: {
          string: {
            min_len: 1
            max_len: 64
          }
        }
        values: {
          string: {max_len: 1024}
        }
      }];
    }

    // Level is how much a message matters.
    //
    // Three, and no more without a reason: `debug` is a *deployment* concern rather
    // than an authoring one — a workflow author cannot know what a given operator
    // wants filtered — and `fatal` is a claim about control flow that a task has no
    // way to honour, since emitting a line does not stop the run.
    enum Level {
      // Unspecified reads as LEVEL_INFO, so a `log:` that says nothing about level
      // is the ordinary case rather than an error.
      LEVEL_UNSPECIFIED = 0;
      LEVEL_INFO = 1;
      LEVEL_WARN = 2;
      LEVEL_ERROR = 3;
    }

    // Outputs is empty and stays empty.
    //
    // Present rather than absent because every task's shape is described from a
    // descriptor — `flow tasks` and the language server both read one — and a task
    // with no message at all would have to be a special case in each of them. An
    // empty message says "nothing" in the same vocabulary everything else uses.
    message Outputs {}
  }

  // Echo, Printf and CEL were tasks here, and are retired at edition v2026.2.
  //
  // Each of them existed to produce a *value*, from a time when a step was the
  // only thing that could hold one. `vars:` is that thing now, at the workflow, at
  // the step and inside a loop body, so all three had become a step whose only job
  // was to name an expression — with a run record entry, a retry policy and a
  // history event to pay for it. `echo` additionally meant two unrelated things
  // depending on whether anyone read its `result`; the half that was about being
  // seen is `Log`, above.
  //
  // Deleted rather than left registered-but-refused, because a build executes one
  // grammar. A spec still carrying one of these names is refused by the registry
  // at validation, which is a diagnostic naming the file, rather than by a
  // descriptor that exists and dispatches to nothing.
  //
  // The names are not reserved, because these were nested messages rather than
  // fields: nothing addresses them by number, and a future `Task.CEL` would be a
  // new type under a reused name in a schema no worker replays a retired task
  // from. What is reserved is the meaning of a *number*, which is why the fields
  // inside them are gone with them.
  //
  // `flow fix` rewrites all three — see flowfile/fixretire.go, which moves a read
  // value into `vars:` and refuses where the choice is the author's.

  // HTTP is a task that performs an HTTP request to a specified URL with optional method, headers, and body.
  // It returns the HTTP response status code, headers, and body as outputs.
  //
  // This is obviously useful, but also dangerous since it's just SSRF (Server-Side Request Forgery) in disguise.
  message HTTP {
    message Inputs {
      string url = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uri = true,
        (google.api.field_behavior) = REQUIRED
      ];
      optional string method = 2 [(buf.validate.field).string = {
        min_len: 3
        max_len: 6
        pattern: '^(?i)(GET|POST|PUT|PATCH|DELETE)$'
      }];
      map<string, string> headers = 3;
      optional string body = 4;
      // Optional outputs shaping: when provided, the HTTP task will return only
      // the named outputs defined by this map instead of the default outputs.
      // Values are evaluated as CEL expressions (or used as literals) with the
      // following variables available:
      //   - status_code (int)
      //   - body (string)
      //   - headers (map<string,string>)
      //   - json (the parsed body, when `parse_json` asked for it)
      // This enables payload minimization by selecting just the fields needed.
      map<string, Value> outputs = 5;

      // Query parameters, escaped and appended to the URL.
      //
      // Building a query string by hand is where escaping bugs live, and they are
      // the kind that work until a value contains an ampersand.
      //
      // A secret reference here is refused rather than resolved: query strings are
      // written to access logs, kept in browser history, and forwarded in Referer
      // headers by anything that follows a redirect. The diagnostic says to use a
      // header instead, because the author's intent is clear and only the placement
      // is wrong.
      map<string, Value> query = 6;

      // A structured request body, serialized as JSON with a matching Content-Type.
      //
      // The common case, and until now the most laborious: sending an object meant
      // building the JSON by hand in a CEL expression and remembering the header.
      // Mutually exclusive with `body` and `form` — three ways to say what to send
      // is a request whose meaning depends on field order.
      Value json = 7;

      // A form body, url-encoded with a matching Content-Type. Mutually exclusive
      // with `body` and `json`.
      map<string, Value> form = 8;

      // Which responses count as success, as a CEL expression over the same
      // variables `outputs` sees.
      //
      // The default is unchanged and needs no expression: 2xx succeeds, 4xx fails
      // permanently, 5xx is retried. This is for the cases that default cannot
      // express — a 404 that means "not there yet, and that is fine", or an API
      // that answers 200 with an error in the body:
      //
      //   expect: ${status_code == 200 || status_code == 404}
      //   expect: ${status_code == 200 && !json.error}
      //
      // One expression rather than a status list plus a predicate, because a list
      // is the expression `status_code in [200, 404]` and two spellings of one idea
      // is two things to keep in agreement.
      Value expect = 9;

      // Parse the response body as JSON into the `json` output.
      //
      // Off by default, and deliberately not inferred from Content-Type: parsing an
      // untrusted body is work an attacker chooses, so it happens when an author
      // asked for it. A body that is not JSON is an error naming the offset, not a
      // silently empty value.
      optional bool parse_json = 10;

      // Retry a non-idempotent request whose outcome is unknown.
      //
      // A POST that reached the server and then failed before answering may have
      // taken effect, so by default it is not retried: doing the operation twice is
      // worse than surfacing a failure that might have resolved on its own. Set
      // this when the endpoint is idempotency-keyed and a retry is therefore safe.
      //
      // It does not affect a request that never connected, which is retried for any
      // method because it cannot have taken effect.
      optional bool retry_on_unknown_outcome = 11;
    }
    message Outputs {
      int32 status_code = 1 [(buf.validate.field).int32 = {
        gte: 100
        lte: 599
      }];
      map<string, string> headers = 2;
      // Response body, returned by default so a step can be referenced as
      // ${steps.<id>.body}. Large responses are better trimmed with the `outputs`
      // input above, which keeps workflow payloads small.
      string body = 3;

      // The response body parsed as JSON, present when `parse_json` asked for it,
      // so ${steps.<id>.json.items[0].id} works without a second step to parse it.
      //
      // Deliberately a single value rather than a repeated one, and it should stay
      // that way. A streaming response is not a unary response with more elements —
      // it is a different interaction shape with a different execution model, since
      // a long-lived stream cannot live inside one activity at all. When streaming
      // arrives it gets its own field, which costs nothing because adding a field is
      // additive. Widening this one to repeated would break every workflow that
      // reads it, and would make every author write [0] forever to accommodate a
      // shape their request does not have.
      //
      // Carried as a CEL value rather than google.protobuf.Value because that is
      // already how this schema represents a literal, so the conversions an
      // expression needs to read it exist rather than being a third value type to
      // translate between.
      //
      // A JSON number arrives as a double, so `{"id":7}` reads as 7.0 rather than
      // 7. That is what encoding/json produces for an untyped number and what the
      // `json_parse` CEL function already does, and one rule that surprises is
      // better than two that disagree. It matters when comparing: write
      // `${call.json.id == 7}` and CEL will compare numerically, but do not expect
      // `string(call.json.id)` to read as "7".
      google.api.expr.v1alpha1.Value json = 4;
    }
  }

  // Tasks have specific names that identify the type of task being performed,
  // such as "log" or "http". The name is used to determine which task
  // implementation to execute when the workflow is run.
  //
  // # A dot means a plugin, and its absence means the engine
  //
  // A built-in task is one bare word. A plugin's task is two, joined by a dot —
  // `slack.post` is the `post` task of the plugin discovered as
  // `flowstate-plugin-slack` — and the dot is provenance rather than decoration:
  // it tells a reviewer that this line leaves the engine's code and enters code
  // somebody installed, at the step, where that fact is needed. It also makes
  // collision unrepresentable in both directions. A plugin task cannot shadow a
  // built-in because a plugin's tasks all carry a dot and no built-in does; two
  // plugins cannot fight over one name because each one's tasks are prefixed
  // with a name discovery established from the binary, not self-reported.
  //
  // At most one dot, by the pattern below. The first segment is a plugin name
  // (`^[a-z0-9][a-z0-9-]*$`, from the executable's own name) and the second a
  // task name (`^[a-z][a-z0-9_]*$`, from its manifest); the pattern here is the
  // permissive union rather than that concatenation, because this field also
  // spells built-in names with their historical uppercase-and-dash latitude, and
  // the registry enforces the sharper per-segment rules at registration.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9-_]+(\\.[A-Za-z0-9-_]+)?$"
    }
  ];

  // Field 2 held a description of the task. Prose about a step belongs to the
  // step — `Node.description` — because a step names its task directly now, so the
  // value under `echo:` is that task's inputs and a `description` written there
  // would be an input of that name. A `for_each` or a `sleep` is as worth
  // explaining as a task is, and only the step can carry that.
  //
  // Reserved rather than reused: a number that meant something else in a spec some
  // worker may still be replaying must never come back with a new meaning.
  reserved 2;
  reserved "description";

  // Inputs are the parameters that the task requires to perform its operation.
  map<string, Value> inputs = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      keys: {string: {min_len: 1}}
    }
  ];
}

// RunRequest is the request message for running a workflow.
message RunRequest {
  Workflow workflow = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// RunResponse is the response message for a workflow run.
message RunResponse {
  message Error {
    string message = 1 [(buf.validate.field).required = true];
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RUNNING = 1;
    STATUS_COMPLETED = 2;
    STATUS_FAILED = 3;
    STATUS_CANCELED = 4;
    STATUS_TERMINATED = 5;
    STATUS_TIMED_OUT = 6;
  }
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string run_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  Status status = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  oneof kind {
    option (buf.validate.oneof).required = true;
    Error error = 4;
    Workflow.StepOutputs outputs = 5;
  }
}

// GetRequest is the request message for getting a workflow run.
message GetRequest {
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  optional string run_id = 2 [(buf.validate.field).string.uuid = true];
}

// GetResponse is the response message for getting a workflow run.
message GetResponse {
  string workflow_id = 1;
  string run_id = 2;
  RunResponse.Status status = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  oneof kind {
    option (buf.validate.oneof).required = true;
    RunResponse.Error error = 4;
    Workflow.StepOutputs outputs = 5;
  }

  // StartTime is when the workload began, and CloseTime when it finished — unset
  // while it is still running, so "has not finished" and "finished at the epoch"
  // stay distinct.
  //
  // Same two fields a listing reports, with the same names and the same meaning,
  // because a listing already answered them and a Get did not: `flow list` could
  // tell you a run had been going for an hour and `flow get <id>` on the same run
  // could only tell you it was running. One verb knowing less about a run than the
  // verb that enumerates it is the wrong way round — Get is the one a person
  // reaches for when they care about a *particular* run.
  //
  // Both come off the same DescribeWorkflowExecution response the status does, so
  // this costs nothing but the field.
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp close_time = 7;

  // Progress is where a running run has got to. Unset for any other status, since a
  // finished run's position is its outputs.
  //
  // Unset does not mean "at the beginning". It also means no worker answered, or
  // that the run is on an interpreter built before this existed — facts about the
  // deployment rather than about the workload. A reader that rendered an unanswered
  // query as "step 1 of 5" would be inventing one.
  RunProgress progress = 8;
}

// RunProgress is where a run has got to, answered by the running workflow itself.
//
// Not derivable from outside. A listing and a Describe both know a run is RUNNING and
// neither knows what it is running, because the position lives in the interpreter's
// own stack rather than in anything the service records. So it comes from a Temporal
// query, which is the one way to ask a workflow a question without changing it: a
// query runs against the live state, writes no history event, and cannot make the run
// do anything.
message RunProgress {
  // StepId is the top-level step the run is on.
  //
  // Top-level always, which is a floor rather than a limitation. A run inside a
  // parallel block or a concurrent loop is on several steps at once and has no single
  // position — the same reason the engine refuses to suspend there — so the answer
  // that is always true is the outermost one.
  string step_id = 1;

  // Path is the position from that step inward, where there is one: the loop and the
  // body step within it, or the branch. Empty where the run is on a top-level step,
  // and it stops at the boundary of concurrent work for the reason above.
  repeated string path = 2;

  // CompletedSteps is how many steps have finished in this segment of the run.
  //
  // Per segment rather than per run, and the distinction has to survive contact with
  // whoever renders it: a run that continued as new starts a new count, because the
  // budget it is measured against is per segment too. It is progress against a
  // suspend, not against the workload.
  int32 completed_steps = 3;
}

// Diagnostic is one problem found in a Flowfile, positioned in its source.
//
// A schema type rather than a shape the CLI invents, because it already has three
// readers and they must agree: `flow validate --output json` hands it to whatever is
// driving the CLI, the language server converts it into an editor's own diagnostic,
// and the Validate RPC returns it unchanged. Three hand-written
// projections of one idea is how the editor and the command line come to disagree
// about what is wrong with a file.
//
// It is also what keeps `--output json` meaning one thing. On `get` and `list` that
// flag is documented as carrying the server's own schema, so a field is addressable by
// name; a `validate` that answered with an object the CLI made up would give one flag
// two meanings in one binary.
//
// # Positions are 1-based, and zero means unknown
//
// Zero rather than an omitted field, because a diagnostic with no position is a real
// answer — some problems are about a file rather than about a line in one — and a
// consumer that saw `line: 1` for those would send a reader to the wrong place with
// confidence.
message Diagnostic {
  // Line is the 1-based source line, or zero when the position is unknown.
  uint32 line = 1;

  // Column is the 1-based column within Line, counting characters rather than
  // bytes, or zero when only the line is known.
  uint32 column = 2;

  // Message states the problem and, where possible, what to do instead.
  string message = 3 [(buf.validate.field).required = true];

  // Step is the id of the step the problem was found in, when there is one.
  string step = 4;

  // Field names the input or property at fault, when there is one.
  string field = 5;

  // Kind names the step's kind key — the task's name, or `for_each`, `sleep` — when
  // the problem is with that key rather than with anything under it.
  //
  // Separate from Field because the two read differently and are fixed differently:
  // one sends a reader to a value they wrote under a task, the other to the word
  // naming the work itself.
  string kind = 6;

  // Value is the literal at fault *inside* Field, when the field holds a list and one
  // element of it is the problem.
  string value = 7;
}

// DiagnosticReport is what one file's check produced.
//
// Per file rather than per invocation, because `flow validate a.yaml b.yaml` is two
// answers and a consumer wants to know which file each belongs to. It is also what
// makes the JSONL form useful: one report per line, one file per report.
//
// A file with no diagnostics still gets a report. "Checked and clean" and "not checked"
// are different facts, and a consumer that saw only failures could not tell them apart.
message DiagnosticReport {
  // File is the path as it was given on the command line, so a reader can find it
  // again without resolving anything.
  string file = 1 [(buf.validate.field).required = true];

  // Diagnostics is every problem found, in source order. Empty means the file is
  // valid.
  repeated Diagnostic diagnostics = 2;
}

// ValidationReport is what one check produced, across every file it was given.
//
// It exists because `json` and `jsonl` are different shapes rather than different
// spellings, and this CLI is consistent about which: `json` is one document per
// invocation, `jsonl` is one per line. Checking three files produces three
// [DiagnosticReport]s, which is three lines of `jsonl` and — without something to hold
// them — three documents where `json` promises one. A bare JSON array would do it and
// is not a proto message, so the thing that holds them is a message.
message ValidationReport {
  // Files is one report per file checked, in the order they were given, including the
  // files that were clean.
  repeated DiagnosticReport files = 1;
}

// RunState is the durable workflow state used by the Temporal Run entrypoint.
// It allows the workflow to continue-as-new while carrying only the minimal
// required subset of previously produced outputs for the remaining steps.
// WorkloadIdentity describes who a run acts as.
//
// A running workload has two identities at once, and both matter. It is a
// specific workload — this workflow, this run, this step — and it is acting on
// behalf of whoever asked for the work. Downstream systems need both to make an
// authorization decision: "the nightly-reconcile workflow" and "started by the
// deploy pipeline" answer different questions, and a system granting access
// usually cares about the pair.
//
// This is carried through the run so that every step knows what it is acting as,
// and so an assertion presented to an external system states something true
// rather than something assumed. It holds identity, never credentials: it is
// persisted in workflow history, which is durable and broadly readable, so
// nothing secret may appear here.
message WorkloadIdentity {
  // Subject identifies the caller that requested the run, as established by
  // authenticating their request. Empty when the run was started without
  // authentication, which is only possible in development.
  string subject = 1;

  // Issuer is the identity provider that vouched for the subject.
  string issuer = 2;

  // Claims carries additional non-secret claims from the caller's token that
  // authorization decisions may key on, such as a repository, environment, or
  // team. Only claims an operator has configured as relevant are copied here,
  // so this does not become a dumping ground for whole tokens.
  map<string, string> claims = 3;

  // Namespace is the tenant, and it is the boundary every authorization decision
  // about a run turns on: the caller's namespace is compared against the one
  // recorded on the run, and a mismatch is answered "no such run".
  //
  // Worth stating outright, because this field used to be described alongside
  // `deployment` as identifying "which Flowstate installation is running the
  // workload". That is what `deployment` is for. Reading the two as a pair
  // suggests both are labels for telling environments apart, and one of them
  // decides who may act on what.
  string namespace = 4;

  // Deployment identifies which Flowstate installation is running the workload,
  // so an assertion from a staging deployment is distinguishable from a
  // production one.
  //
  // Not the tenant, and not what run access turns on — that is `namespace`
  // above. But not decorative either: an outbound authorization policy sees it as
  // `workload.deployment` and may key on it, which is how a rule like
  // `target == "internal" && workload.deployment == "prod"` keeps a staging
  // installation from assuming a production role.
  //
  // So the two are load-bearing for different decisions. `namespace` decides who
  // may act on a run; `deployment` is one of the attributes a policy may use to
  // decide what a run may reach.
  string deployment = 5;
}

// Frame is one level of the execution position within a workflow.
//
// A workflow with nested control flow cannot record where it is with a single
// index: "the third item of the loop in the second branch" is a path, not a
// number. Frames are that path, outermost first, which is what allows a run to be
// suspended and resumed from inside a loop rather than only between top-level
// steps.
message Frame {
  // NextNode is the index of the next node to execute at this level.
  int32 next_node = 1 [(buf.validate.field).int32 = {gte: 0}];

  // NextIteration is the index of the next item to process, for a frame
  // standing inside a for_each.
  int32 next_iteration = 2 [(buf.validate.field).int32 = {gte: 0}];

  // Results holds the outputs of iterations already completed by a for_each at
  // this level, so a resumed run still reports every iteration's results and not
  // only those from the run that finished the loop.
  repeated Workflow.StepOutputs results = 3;
}

message RunState {
  Workflow workflow = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Zero-based index of the next top-level step to execute.
  //
  // Superseded by frames, which can also describe a position inside nested
  // control flow. It is still honored when frames is empty, so a run started
  // before frames existed continues correctly.
  int32 next_step = 2;
  // Compact subset of outputs needed by subsequent steps.
  Workflow.StepOutputs outputs = 3;
  // Step budget for Continue-As-New. If 0 or unset, server/workflow defaults apply.
  int32 steps_budget = 4;
  // Execution position, outermost frame first. When empty, execution starts from
  // next_step at the top level.
  repeated Frame frames = 6;
  // Identity the run acts as, established when the run was requested and
  // preserved across Continue-As-New so later steps act as the same principal
  // the caller was authenticated as.
  WorkloadIdentity identity = 5;

  // PendingSignals are signals that arrived before the step waiting for them was
  // reached, drained from their channels before this run suspended.
  //
  // They must be carried, because a suspended run drops whatever is still
  // buffered on a channel it never read. A workload whose approval arrived while
  // it was on an earlier step would otherwise reach the gate with the approval
  // already lost, and wait forever — the worst failure available to a feature
  // whose whole promise is that waiting is reliable.
  repeated PendingSignal pending_signals = 7;

  // Vars are the workflow's `vars:` block, already evaluated.
  //
  // Carried rather than recomputed, so that "evaluated once at the start of the run"
  // means once for the whole run and not once per Continue-As-New segment. The
  // difference is not academic: invariant 10 has a continued run pick up whichever
  // interpreter version is current, so a segment that re-evaluated its vars could
  // compute a different answer from the one earlier steps saw — a value changing
  // under a workload halfway through, for no cause visible in the file.
  //
  // Storing it also makes the evaluation happen exactly once per run rather than once
  // per segment, which is the cheaper half of the same argument.
  map<string, Value> vars = 8 [(buf.validate.field).map = {
    keys: {string: {min_len: 1}}
  }];
}

// SignalRequest delivers a signal to a waiting run.
message SignalRequest {
  // WorkflowId identifies the run to signal.
  //
  // A caller may address only runs in a namespace their own authenticated
  // identity establishes. The namespace is never taken from this request: a
  // caller who could name their own tenant could name someone else's, and an id
  // is not a capability.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // RunId optionally pins the signal to one run of the workload. Unset addresses
  // whichever run is current, which is what a human approving a gate means: they
  // are approving the workload, and they neither know nor care how many times it
  // has been continued as new.
  string run_id = 2 [(buf.validate.field).string = {max_len: 256}];

  // Name is the signal being sent, matching what the waiting step declared.
  string name = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9-_]*$"
    }
  ];

  // Payload becomes the waiting step's outputs, so `${approval.approved}`
  // resolves to what a sender put here.
  Node.Outputs payload = 4;
}

message SignalResponse {}

// Stopping a run is two different asks, and the difference is not a detail of
// implementation — it decides whether the workload's cleanup happens.
//
// Cancel is cooperative. It asks the run to stop and the run gets to finish
// responding: a workload that has to release a lock, roll back a partial
// deployment, or tell someone it gave up still does that. The cost is that a run
// which is wedged — blocked on something that never returns — may not stop.
//
// Terminate is not cooperative. The execution stops where it is, no further step
// runs, and nothing the workload would have done on the way out is done. It is
// the answer when a run must stop now and when a run cannot be made to stop any
// other way, and it should be the second thing tried rather than the first.
//
// So: cancel by default, terminate when cancel will not do. Anything holding a
// resource it is responsible for releasing is a reason to prefer cancel, and
// terminating it is a decision to leak that resource on purpose.

// CancelRequest asks a run to stop, letting it clean up on the way out.
message CancelRequest {
  // WorkflowId identifies the run to cancel.
  //
  // A caller may address only runs in a namespace their own authenticated
  // identity establishes. The namespace is never taken from this request: a
  // caller who could name their own tenant could name someone else's, and an id
  // is not a capability.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // RunId optionally pins the request to one run of the workload. Unset
  // addresses whichever run is current, which is what someone stopping a
  // workload means: they neither know nor care how many times it has been
  // continued as new.
  string run_id = 2 [(buf.validate.field).string = {max_len: 256}];
}

message CancelResponse {}

// TerminateRequest stops a run immediately, without letting it clean up.
message TerminateRequest {
  // WorkflowId identifies the run to terminate.
  //
  // A caller may address only runs in a namespace their own authenticated
  // identity establishes. The namespace is never taken from this request: a
  // caller who could name their own tenant could name someone else's, and an id
  // is not a capability.
  string workflow_id = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // RunId optionally pins the request to one run of the workload. Unset
  // addresses whichever run is current.
  string run_id = 2 [(buf.validate.field).string = {max_len: 256}];

  // Reason is recorded on the terminated execution, so whoever finds the run
  // later learns why it was stopped rather than only that it was.
  //
  // A terminated run leaves no trace of its own explaining itself — that is what
  // terminate means — so this is the only account of the decision there will be.
  string reason = 3 [(buf.validate.field).string = {max_len: 1024}];
}

message TerminateResponse {}

// ListRequest asks for the caller's runs.
message ListRequest {
  // PageSize bounds how many runs come back. Zero takes the server's default.
  //
  // This bounds the answer, not the work: the server filters by tenant itself
  // (see ListResponse.next_page_token), so a small page is not a promise of a
  // small scan.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // PageToken continues a previous List. Opaque: it encodes where the scan
  // stopped, and nothing else should be read from or written into it.
  string page_token = 2 [(buf.validate.field).string = {max_len: 4096}];
}

// RunSummary describes one run in a listing.
//
// Deliberately not a run's outputs. A listing is about which workloads exist and
// what they are doing; reading what one produced is Get, which is one run and one
// authorization decision. A list that returned outputs would make "show me my
// runs" the cheapest way to read every workload's data at once.
message RunSummary {
  string workflow_id = 1;
  string run_id = 2;
  RunResponse.Status status = 3;

  // StartTime is when the workload began.
  google.protobuf.Timestamp start_time = 4;

  // CloseTime is when it finished, unset while it is still running.
  google.protobuf.Timestamp close_time = 5;
}

// ListResponse returns a page of the caller's runs.
message ListResponse {
  repeated RunSummary runs = 1;

  // NextPageToken continues the listing, and is set whenever the scan stopped
  // with more to look at — including when this page came back short or empty.
  //
  // That case is real rather than theoretical. The tenant a run belongs to is
  // recorded as a memo, which Temporal cannot filter on, so the server reads a
  // bounded number of executions and keeps the ones that are the caller's. In a
  // namespace shared by several tenants a scan can therefore end having found
  // few matches, or none, while plenty remain. An empty page with a token set
  // means "keep asking", and only an empty token means the listing is done.
  string next_page_token = 2;
}

// WorkflowService is the service that provides operations for managing and running workflows.
service WorkflowService {
  rpc Run(RunRequest) returns (RunResponse) {}
  rpc Get(GetRequest) returns (GetResponse) {}

  // Signal delivers a signal to a run waiting for one, which is how a human
  // approval reaches a workload.
  //
  // This addresses a durable run. A local run is a process with nobody to signal
  // it once it has started, so `flow run local` answers its gates from flags
  // instead. What the two drivers share is the payload and everything downstream
  // of it — the same signal name, the same outputs, the same expressions reading
  // them — which is the part that has to match for a local run to tell an author
  // what production will do.
  rpc Signal(SignalRequest) returns (SignalResponse) {}

  // List returns the runs belonging to the caller's tenant.
  //
  // The filtering is done here rather than by Temporal, and that follows from how
  // Run records a tenant: as a memo, because a memo needs no cluster-side
  // registration and a first run therefore needs nothing but `temporal server
  // start-dev`. Temporal cannot query a memo. A search attribute could be
  // queried, but it would make listing your own runs fail until an operator had
  // registered the attribute — a basic verb that does not work out of the box is
  // worse than one that scans.
  //
  // So the scan is bounded instead, and the bound is on how many executions the
  // server reads rather than on how many it returns: a caller asking for ten runs
  // in a namespace holding a hundred thousand must not be able to make the server
  // walk all of them. See ListResponse.next_page_token for what that means for a
  // caller — a short or empty page is not the end of the listing.
  rpc List(ListRequest) returns (ListResponse) {}

  // Cancel asks a run to stop and lets it clean up on the way out.
  rpc Cancel(CancelRequest) returns (CancelResponse) {}

  // Terminate stops a run immediately, running none of its cleanup. Prefer
  // Cancel; see CancelRequest for when this is the right answer anyway.
  rpc Terminate(TerminateRequest) returns (TerminateResponse) {}

  // Validate checks Flowfiles and returns their diagnostics, executing nothing.
  //
  // `flow validate` does this offline and must keep doing so: a validator that
  // needs a server is one that stops working on an aeroplane, and invariant 8
  // says a first run needs no infrastructure. This is not a replacement for that.
  // It is the same check for a caller who has no filesystem to point the command
  // at — a browser, a CI service, an agent writing a file it has not saved —
  // and it answers with the very same [ValidationReport] message the command
  // prints, from the very same code, so there is no second validator to disagree
  // with the first.
  //
  // Pure by construction, which is what makes it the useful one to hand an agent:
  // it reads nothing, writes nothing, and starts nothing, so it can be looped on
  // unattended in a way none of the verbs above can.
  //
  // Authenticated like everything else here, because checking a file is work
  // somebody's CPU does. Bounded like everything else that takes input somebody
  // else chose: see ValidateRequest.
  rpc Validate(ValidateRequest) returns (ValidateResponse) {}

  // Compile turns Flowfile source into the specification Run takes, executing
  // nothing.
  //
  // It exists because Validate alone left a caller one step short: an agent
  // could check a file and could submit a compiled specification, and nothing
  // on the wire connected the two — the compiler lived only in the CLI, so a
  // caller with no `flow` binary could author a correct file it had no way to
  // run. Same terms as Validate: the same compiler the CLI uses, pure, bounded
  // by the schema, authenticated like everything else.
  //
  // A file that does not compile answers with its diagnostics rather than an
  // RPC error, because "your file has a problem at line 12" is an answer, not a
  // failure to answer.
  rpc Compile(CompileRequest) returns (CompileResponse) {}

  // GetCatalog returns what this deployment can execute.
  //
  // The registry is the single source of truth for capability, and until this
  // existed the only way to ask it was to run `flow tasks` on a machine with the
  // same build — which is not the same question. A worker that loaded plugins can
  // run tasks this binary has never heard of, so "what tasks exist" is a property
  // of a deployment, and a caller writing a workflow for it needs the deployment's
  // answer rather than their laptop's.
  //
  // [TaskCatalog]'s own comment anticipated this RPC, and returning that message
  // unchanged is the point: an editor, an agent, a documentation generator and
  // `flow tasks --output json` all read one shape.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {}
}

// SourceFile is one file's contents, with the name to report diagnostics against.
message SourceFile {
  // Name is what a diagnostic should call this file. It is a label, not a path
  // the server resolves — nothing here opens anything — so a caller with no
  // filesystem may say `<stdin>` or a request id and still get a readable report.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];

  // Source is the file's bytes.
  //
  // Bounded at the same megabyte the offline parser bounds a Flowfile at, and for
  // the same reason: this is input an outside party chooses, and the resource it
  // spends is memory in the parser. A caller sending more is refused by
  // protovalidate before anything reads it.
  bytes source = 2 [(buf.validate.field).bytes = {max_len: 1048576}];
}

// ValidateRequest is one or more files to check.
message ValidateRequest {
  // Files are the files to check, in the order the report should list them.
  //
  // Bounded by count as well as by size, because bounding one resource does not
  // bound another the peer controls the ratio to: a thousand megabyte files is a
  // gigabyte of parsing, and every one of them is individually within its bound.
  repeated SourceFile files = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
}

// ValidateResponse is what the check found.
message ValidateResponse {
  // Report is one entry per file, including the files that were clean.
  //
  // Wrapped rather than returned bare so the RPC can grow a second thing to say —
  // which version of the grammar answered, how long it took — without changing
  // the shape a caller already parses.
  ValidationReport report = 1;
}

// CompileRequest is one Flowfile to compile.
//
// One rather than many, unlike ValidateRequest: validation is a survey and its
// answer is a report, while compilation produces the artifact the next call
// submits, and a batch of artifacts would leave a caller matching outputs back
// to inputs by position.
message CompileRequest {
  SourceFile file = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// CompileResponse is the specification, or the reasons there is not one.
message CompileResponse {
  // Workflow is the compiled specification, set only when the file compiled
  // clean. It is exactly what RunRequest.workflow takes.
  Workflow workflow = 1;

  // Report carries the diagnostics for the file, present even when empty so
  // "compiled clean" is stated rather than inferred from absence.
  DiagnosticReport report = 2;
}

// GetCatalogRequest asks what this deployment can execute. It takes nothing
// today; a filter or a profile selector would go here.
message GetCatalogRequest {}

// GetCatalogResponse is the deployment's capability.
message GetCatalogResponse {
  TaskCatalog catalog = 1;
}
