syntax = "proto3";

package flowstate.plugin.v1;

import "buf/validate/validate.proto";
import "flowstate/v1/identity.proto";
import "flowstate/v1/run.proto";
import "flowstate/v1/task.proto";
import "flowstate/v1/value.proto";
import "flowstate/v1/workflow.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";

option go_package = "flowstatepluginv1";

// Flowstate plugins are separate processes that extend the engine, speaking the
// services defined in this file over Connect RPC.
//
// # Why processes
//
// A plugin is someone else's code running inside a worker that holds credentials
// and reaches internal networks. Loading it in-process would mean a panic takes
// the worker down, a dependency conflicts with the engine's own, and a bug reads
// any memory the worker can. A separate process makes those the operating
// system's problem, which is where isolation actually exists. The cost is a
// serialization boundary, and that cost buys the isolation.
//
// # Why Connect RPC and Protobuf
//
// The protocol is a schema, not a Go interface. A plugin can therefore be written
// in any language with Connect or gRPC support, and the engine does not need to
// load, link, or trust anything to talk to it. Connect specifically because the
// rest of Flowstate speaks it, so there is one RPC stack to understand, and
// because it works over plain HTTP — which makes a plugin debuggable with curl
// against its socket.
//
// # Capabilities, not plugin types
//
// A plugin advertises capabilities rather than being of a kind. One binary may
// resolve secrets, provide tasks, and serve something added later. That matters
// because the useful integrations are not single-purpose: a plugin for a cloud
// provider naturally offers both its secrets manager and tasks that call its API,
// and forcing those into separate binaries would mean two processes, two
// handshakes, and two copies of the same credentials.
//
// The engine asks what a plugin can do, then uses only what it advertises and
// only what the deployment permits.

// Capability names a thing a plugin can do.
//
// Adding a capability is additive: an engine ignores capabilities it does not
// know, and a plugin ignores requests for capabilities it did not advertise, so
// an older plugin keeps working against a newer engine and vice versa.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;

  // Resolves secret references. See SecretService.
  CAPABILITY_SECRETS = 1;

  // Provides tasks that workflow steps can run. See TaskService.
  CAPABILITY_TASKS = 2;

  // Serves TaskService.ExecuteStream, meaningful only alongside
  // CAPABILITY_TASKS.
  //
  // This is what the host asks instead of finding out by calling: a plugin
  // that has not rebuilt against a version of the SDK new enough to answer
  // ExecuteStream leaves this capability off its manifest, and the host
  // dispatches every task on this plugin through the unary Execute it always
  // called before ExecuteStream existed — deciding once, at Describe, rather
  // than probing per call.
  //
  // Answering by dialing the RPC and reading the error would not work: an
  // unregistered route and a task's own application-level failure that
  // happens to classify as CodeUnimplemented are indistinguishable on the
  // wire (`connect.CodeUnimplemented` either way — see
  // asConnectError's pass-through of an author's own *connect.Error in
  // plugin/sdk/errors.go), and a task can legitimately return that code
  // after doing real work. A probe-then-fallback host would rerun such a
  // task's Fn a second time on the strength of an error the task deliberately
  // chose, which is corruption for a plugin whose task has side effects.
  // Declaring the capability up front removes the ambiguity entirely: the
  // host never attempts a call whose outcome it would have to reinterpret.
  CAPABILITY_TASK_PROGRESS = 3;
}

// PluginManifest is what a plugin says about itself.
message PluginManifest {
  // Name identifies the plugin. By convention it matches the binary's suffix, so
  // `flowstate-plugin-vault` names itself "vault".
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
      pattern: "^[a-z0-9][a-z0-9-]*$"
    }
  ];

  // Version is the plugin's own version, for operator diagnostics. It is not used
  // for compatibility decisions; protocol_version is.
  string version = 2 [(buf.validate.field).string = {max_len: 64}];

  // Description is one line about what the plugin does, shown by `flow plugins`.
  string description = 3 [(buf.validate.field).string = {max_len: 256}];

  // Capabilities are what this plugin can do. A plugin advertising none is
  // useless and is refused at startup rather than being kept alive.
  repeated Capability capabilities = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];

  // Schemes are the secret reference schemes this plugin resolves, meaningful
  // only with CAPABILITY_SECRETS. A deployment refuses a plugin claiming a scheme
  // another plugin already claims, since two answers for one scheme is a
  // configuration error rather than something to resolve by ordering.
  repeated string schemes = 5 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 32
        pattern: "^[a-z0-9-]+$"
      }
    }
  }];

  // Tasks are the task definitions this plugin provides, meaningful only with
  // CAPABILITY_TASKS.
  repeated TaskManifest tasks = 6 [(buf.validate.field).repeated = {max_items: 64}];
}

// TaskManifest describes a task a plugin provides, so the engine can validate a
// workflow that uses it before running anything.
//
// The descriptors are what make a plugin task indistinguishable from a built-in
// one to the rest of the system: validation, editor completion, and generated
// documentation all read the same shape whether the task ships with the engine or
// arrives from a plugin.
message TaskManifest {
  // Name is the task's own name, without the plugin's: `post`, not `slack.post`.
  //
  // A Flowfile spells the task qualified — `<plugin>.<task>:` — and the host adds
  // that prefix from the name discovery established for the binary. The pattern
  // below is what keeps the seam honest: a name cannot contain a dot, so a plugin
  // cannot smuggle a qualifier of its own choosing, and two plugins declaring the
  // same task name cannot collide because the segment that distinguishes them was
  // never theirs to write.
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];

  // Summary is one line, shown by `flow tasks` and in editor completion.
  string summary = 2 [(buf.validate.field).string = {max_len: 256}];

  // Inputs and outputs are serialized FileDescriptorProtos plus the full name of
  // the message within them, so the engine can validate inputs against the
  // plugin's own schema without compiling the plugin's code.
  bytes input_descriptor = 3;
  string input_message = 4 [(buf.validate.field).string = {max_len: 256}];
  bytes output_descriptor = 5;
  string output_message = 6 [(buf.validate.field).string = {max_len: 256}];

  // DeferredInputs are inputs whose expressions the task evaluates itself, in a
  // scope the workflow does not have. See TaskDef in the engine for why this must
  // be declared rather than inferred.
  repeated string deferred_inputs = 7 [(buf.validate.field).repeated = {max_items: 16}];

  // NeedsScope reports whether the task must receive prior step outputs and the
  // variables bound by enclosing control flow.
  bool needs_scope = 8;

  // ExpressionInputs are inputs that must be *written* as `${...}` rather than as
  // a literal.
  //
  // A different question from deferred_inputs above, which says who evaluates an
  // input. This says what one has to be, and a plugin had no way to say it: the
  // built-in http task declares the same thing about `expect`, because a schema
  // field typed `Value` is deliberately permissive — so `expect: {status: 200}`
  // compiled, validated, and failed on the first request.
  //
  // Checkable with no scope at all, which is what makes it declarable rather than
  // inferable: whether a value carries a fence is lexical, decided by the parser.
  // What it cannot check is the type — an expression returning the wrong thing is
  // still wrong, and that is not this field's problem.
  //
  // # Where it is enforced, and where it still is not
  //
  // The host maps this onto TaskDef.ExpressionInputs, and `flow worker` registers
  // a host's tasks into the registry every lookup reads — so inside a worker this
  // is enforced by the same code that enforces `http`'s `expect:`, because it is
  // the same code.
  //
  // Where it is still not enforced is a process that has not launched the plugin.
  // `flow validate` in a terminal and the language server in an editor build their
  // registry from the built-ins alone, so a plugin's task is `unknown task` there
  // while running correctly on the worker. That split is deliberate for now —
  // validating a file would otherwise mean executing plugin binaries on an
  // editor's keystroke path — and it is the reason `flow plugins` exists: it is
  // the surface that will launch them when you have asked it to.
  //
  // Recorded rather than assumed, because a field whose enforcement is assumed
  // rather than checked is how `expect:` got its own reputation.
  repeated string expression_inputs = 9 [(buf.validate.field).repeated = {max_items: 16}];

  // SecretInputs names the inputs this task accepts a host secret reference
  // through — a Flowfile writes `${secret('vault:prod/api#token')}`, and this
  // is what tells the host it may resolve one into this input rather than
  // refusing it.
  //
  // # Why the host resolves rather than the plugin
  //
  // A plugin can already resolve references under a scheme *it* provides — see
  // SecretService. That is a different direction: a plugin task consuming a
  // secret the *host* manages, such as one the workflow author addresses with
  // the engine's own `vault:` or `env:` provider. Letting the plugin ask the
  // host to resolve an arbitrary reference would make every plugin a confused
  // deputy, fanning the engine's providers, tenancy scoping, and audit out to
  // every plugin process rather than keeping them in the one place a
  // deployment configures and reviews them.
  //
  // So the host resolves a reference named here before the request crosses
  // into the plugin process at all, exactly where and how it resolves one for
  // a built-in task's own secret input: inside the activity, under the
  // caller's authenticated identity and namespace, through the deployment's
  // configured providers. The plugin receives a value, never a reference and
  // never provider access — which is what keeps a plugin from fishing for a
  // secret a Flowfile never routed to it.
  //
  // # This guarantee is scoped to a local transport
  //
  // Handing the plugin a resolved value rather than a reference is safe today
  // because "the plugin" means a process on the same machine, reached over a
  // filesystem socket only this worker can open — there is exactly one policy
  // enforcement point between the secret store and the value's only reader.
  // A remote plugin endpoint (tracked as issue #151) breaks that: resolving
  // here and sending the value over a network hands a credential to a third
  // party's process, which is disclosure rather than execution. Extending the
  // transport to a remote endpoint must NOT reuse this resolve-then-send path
  // without a per-endpoint secret-release policy — deny by default — deciding
  // first whether that endpoint may receive the value at all; no such policy
  // exists yet, and until it does a remote transport must refuse every
  // secret_inputs reference rather than resolve one. See the same note at the
  // host's choke point, [resolvePluginSecretInputs] in plugin/task.go, which is
  // where a future remote-transport change would have to pass.
  //
  // # Fail closed, both directions
  //
  // A reference in an input not named here is refused — as a task error,
  // since (like expression_inputs above) a process that has not launched the
  // plugin cannot check this at `flow validate` time. And an input named here
  // that still holds an unresolved reference when the request would otherwise
  // cross into the plugin is refused rather than forwarded: the plugin
  // process must never see a [flowstate.v1.SecretRef], only the value.
  repeated string secret_inputs = 10 [(buf.validate.field).repeated = {max_items: 16}];

  // ShapesOutputs declares that this task evaluates an `outputs:` input as a
  // *replacement* for the outputs it declares above — the contract the built-in
  // http task has, and the one a wait's `outputs:` has.
  //
  // Declared rather than inferred from the name, and that is the whole of why
  // this field exists. The exemption used to key on the presence of an input
  // called `outputs`, in the validator and mirrored in the language server, so
  // a plugin declaring an ordinary input by that name had three authoring
  // surfaces agree that its declared outputs were replaced while plugin
  // execution returned exactly those declared outputs. Three surfaces agreeing
  // with each other and disagreeing with execution is the worst arrangement,
  // because nothing flags it.
  //
  // A plugin sets this only if its executor genuinely implements shaping:
  // reading the input's mapping of name to expression, evaluating each against
  // whatever scope the task provides, and returning those names as the step's
  // outputs. Absent by default, which is the fail-closed direction: a task that
  // does not say it shapes gets ordinary diagnostics against the outputs it
  // declared, and an author who writes `outputs:` at one is told it is an
  // unknown input rather than being quietly stood down from.
  bool shapes_outputs = 11;
}

// PluginService is the capability handshake every plugin must implement.
service PluginService {
  // Describe reports what the plugin is and can do. The engine calls it once,
  // immediately after connecting, and refuses a plugin whose manifest does not
  // validate.
  rpc Describe(DescribeRequest) returns (DescribeResponse) {}

  // Health reports whether the plugin is able to serve. The engine polls it to
  // decide whether to restart a plugin that has stopped answering, and a plugin
  // that cannot reach its own backend should report unhealthy rather than failing
  // every request — the distinction tells an operator whether to look at the
  // plugin or at what it depends on.
  rpc Health(HealthRequest) returns (HealthResponse) {}
}

message DescribeRequest {
  // HostVersion tells the plugin what it is talking to, so a plugin can refuse an
  // engine it knows it cannot serve.
  string host_version = 1 [(buf.validate.field).string = {max_len: 64}];
}

message DescribeResponse {
  PluginManifest manifest = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

message HealthRequest {}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;

    // Serving means requests will be attempted.
    STATUS_SERVING = 1;

    // NotServing means the plugin is running but cannot serve — typically because
    // something it depends on is unreachable. The engine reports this to the
    // operator rather than restarting, since restarting will not fix a
    // dependency.
    STATUS_NOT_SERVING = 2;
  }

  Status status = 1;

  // Message explains a non-serving status, for the operator. It must not contain
  // credential material: this is logged.
  string message = 2 [(buf.validate.field).string = {max_len: 1024}];
}

// SecretService resolves secret references, for a plugin advertising
// CAPABILITY_SECRETS.
//
// The value crosses the process boundary in a response and exists in the engine
// only inside the activity that asked for it. It is never returned as a step
// output and never enters workflow history.
service SecretService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse) {}
}

message ResolveRequest {
  // Ref is the secret to resolve. Its scheme is one the plugin advertised.
  flowstate.v1.SecretRef ref = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Namespace is the tenant the requesting workload belongs to, established from
  // the authenticated caller rather than declared by the workload. A plugin
  // serving several tenants must scope resolution by it; ignoring it would let one
  // tenant read another's secrets.
  string namespace = 2 [(buf.validate.field).string = {max_len: 256}];

  // Identity is who the requesting workload acts as, so a plugin can apply its own
  // authorization in addition to the engine's. It carries no credentials.
  flowstate.v1.WorkloadIdentity identity = 3;
}

message ResolveResponse {
  // Value is the resolved secret. A plugin must not log it, and must not include
  // it in an error message.
  bytes value = 1;

  // ExpiresIn, when set, is how long the value remains valid, letting the engine
  // cache it no longer than the plugin considers safe. Unset means the engine
  // applies its own default.
  google.protobuf.Duration expires_in = 2;
}

// TaskService executes tasks, for a plugin advertising CAPABILITY_TASKS.
service TaskService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse) {}

  // ExecuteStream is Execute, plus the phases a plugin passes through while it
  // runs: the host reads a stream of zero or more TaskProgress messages
  // followed by exactly one terminal ExecuteResponse, rather than waiting on
  // one response for the call's whole duration.
  //
  // The host calls this only for a plugin that advertised
  // CAPABILITY_TASK_PROGRESS, and calls Execute, unary, for one that did not
  // — see that capability's own doc comment for why the choice is made once,
  // from the manifest, rather than discovered by dialing this RPC and reading
  // whatever error comes back.
  //
  // # Why a second RPC rather than changing Execute
  //
  // Adding an RPC is additive — a plugin that never advertises
  // CAPABILITY_TASK_PROGRESS is simply never asked, so it need not implement
  // this at all. Changing Execute itself to stream would be the opposite:
  // every plugin that only implements the old shape — in this repository's
  // own three other plugin modules or in any language a third party wrote
  // one in — would stop answering the call the engine makes to run its tasks
  // at all. That is the same "a break here is every plugin in the wild"
  // reasoning CLAUDE.md already gives for `buf breaking`, applied to a
  // change that check cannot see: it lints message and field compatibility,
  // not whether an RPC's streaming type changed.
  //
  // Best-effort, like the progress report it exists to carry: a plugin that
  // never calls ReportProgress sends only the terminal message, which reads
  // to the host exactly as it always has — one fixed phase for the call's
  // whole duration.
  rpc ExecuteStream(ExecuteStreamRequest) returns (stream ExecuteStreamResponse) {}
}

// ExecuteStreamRequest is ExecuteRequest, under the name buf's lint rules
// require of a distinct RPC's request type. The fields are identical and mean
// the same thing; see ExecuteRequest for what each one is.
message ExecuteStreamRequest {
  flowstate.v1.Task task = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  flowstate.v1.Scope scope = 2;
  flowstate.v1.WorkloadIdentity identity = 3;
  string namespace = 4 [(buf.validate.field).string = {max_len: 256}];
}

// ExecuteStreamResponse is one message of an ExecuteStream call.
//
// A call answers with zero or more progress messages, then exactly one
// response message, then the stream ends. A stream that ends without ever
// sending a response is a protocol violation, not a call with an empty
// result — see [Plugin.taskFunc]'s handling in plugin/task.go.
message ExecuteStreamResponse {
  oneof message {
    // Progress is a phase the plugin has reached, sent best-effort at any
    // point before the terminal response.
    TaskProgress progress = 1;

    // Response is the terminal message, and always comes last: the identical
    // shape a unary Execute call answers with.
    ExecuteResponse response = 2;
  }
}

// TaskProgress is a plugin's own report of what phase it has reached while a
// task is running, forwarded to the host's existing progress reporter — the
// one behind flowstate.v1.ReportProgress inside the worker process
// (pkg/flowstate/v1/progress.go), which `flow watch` and the durable driver's
// activity heartbeat already read.
//
// It carries only a phase from the closed vocabulary below, never free text:
// this is the plugin-protocol half of the same discipline
// flowstate.v1.Phase's own doc comment describes for why that Go type has no
// constructor. The value crosses into the worker process, and from there into
// an activity heartbeat that Temporal writes into workflow history — durable
// and broadly readable, which is exactly where nothing derived from a task's
// own inputs may go.
message TaskProgress {
  TaskPhase phase = 1;
}

// TaskPhase mirrors flowstate.v1.Phase's closed vocabulary
// (pkg/flowstate/v1/progress.go), one member per package-level Phase value
// defined there. Adding a member here is the same deliberate, reviewed
// change adding one there is — see that file's own doc comment for why the
// vocabulary is closed — and the two must keep naming the same set, because
// the mapping between them the host applies in plugin/task.go is total only
// as long as they do.
//
// TASK_PHASE_UNSPECIFIED is never sent by a well-behaved plugin, and is
// dropped rather than forwarded if it arrives: an unset phase is not a phase
// report, and forwarding one would tell an operator a task said something it
// did not.
enum TaskPhase {
  TASK_PHASE_UNSPECIFIED = 0;
  TASK_PHASE_REQUESTING = 1;
  TASK_PHASE_READING_RESPONSE = 2;
  TASK_PHASE_CALLING_PLUGIN = 3;
}

message ExecuteRequest {
  // Task is the step's task, with its inputs already resolved unless the manifest
  // declared them deferred.
  flowstate.v1.Task task = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Scope is what the task's own expressions evaluate against, sent only when the
  // manifest declared needs_scope.
  flowstate.v1.Scope scope = 2;

  // Identity is who the workload acts as, and namespace the tenant it belongs to,
  // so a plugin task can authorize what it does on the workload's behalf.
  flowstate.v1.WorkloadIdentity identity = 3;
  string namespace = 4 [(buf.validate.field).string = {max_len: 256}];
}

message ExecuteResponse {
  // Outputs are the task's results, matching the manifest's output message.
  flowstate.v1.Node.Outputs outputs = 1;

  // Retryable reports whether a failure could succeed on another attempt. It is
  // meaningful only when the RPC itself fails with an application error, and
  // exists because only the plugin knows whether its backend failure was
  // transient. The engine defaults to not retrying, so a plugin that says nothing
  // gets the safe answer.
  bool retryable = 2;

  // UnknownOutcome reports that whether the operation took effect is unknown —
  // the request may have reached the backend and failed only to answer, so
  // retrying could perform it a second time. Meaningful only alongside
  // retryable = false, and only when the RPC failed: it is the plugin's own
  // version of the http task's own "sent, then lost the response" case, which
  // the engine reports as permanent for the same reason — an unknown outcome
  // is not a failure another attempt could clear up, it is an operation that
  // may already have happened, and the author is the one who gets to decide
  // what to do about it.
  bool unknown_outcome = 3;

  // RetryAfter says how long to wait before another attempt, when retryable is
  // true and the plugin's own backend named a preferred delay — a 429 or a 503
  // carrying one, the same reason the http task honors a `Retry-After` header
  // rather than guessing. Unset lets the engine apply its own backoff.
  google.protobuf.Duration retry_after = 4;
}
