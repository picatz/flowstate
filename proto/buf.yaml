version: v1
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
breaking:
  # Nothing suppressed, which is the only state this file should ever be found in
  # for longer than one commit.
  #
  # The previous commit deleted `Task.description` and moved the plugin protocol
  # to its own package, and carried a scoped `ignore_only` to let those two land.
  # It is removed here rather than later because a suppression measures a distance
  # from one commit, and the moment that commit is on main the distance is zero —
  # the check now compares against a schema that already has both changes, so the
  # block suppresses nothing and only stands ready to hide the *next* break.
  #
  # That is the failure mode worth naming: a stale suppression does not announce
  # itself. It reads as a considered exception, it keeps passing, and the break it
  # eventually swallows belongs to whoever comes next.
  use:
    - FILE
    - WIRE
lint:
  # STANDARD is what DEFAULT was renamed to. Same rules, current spelling.
  use:
    - STANDARD

  # Nothing suppressed. The two rules that used to be — RPC_REQUEST_STANDARD_NAME
  # and RPC_RESPONSE_STANDARD_NAME, for the plugin protocol's six request and
  # response messages — were suppressed because `DescribeRequest` would have been
  # ambiguous in a package shared with the workflow service, sitting next to
  # `RunRequest` and `SignalRequest`. The plugin protocol has its own package now,
  # so the names the rule asks for are the right ones and the suppression is gone
  # with the reason for it.
