version: v1
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
breaking:
  use:
    - FILE
    - WIRE

  # Two deliberate breaks, spent together in the commit that is about them.
  #
  # `flowstate/v1/plugin.proto` moved to `flowstate/plugin/v1/plugin.proto`, and
  # `Task.description` was deleted in favour of `Node.description`. Both are FILE
  # breaks against the previous commit and neither is a WIRE break: the plugin
  # protocol's field numbers are untouched by a package rename, and a reserved
  # field number is exactly the encoding promise a removal has to keep.
  #
  # This block is scoped to the files involved so the rest of the schema is still
  # checked, and it comes out in the immediate follow-up — a suppression that
  # outlives the commit it was written for is how the next break lands unnoticed.
  #
  # The old plugin path is listed as well as the new one, and it is the entry that
  # actually does the work: a move reads to `buf breaking` as a deletion, and the
  # deletion is reported against the path that no longer exists. Suppressing only
  # the destination silences nothing.
  ignore_only:
    FILE:
      - flowstate/v1/flowstate.proto
      - flowstate/v1/plugin.proto
      - flowstate/plugin/v1/plugin.proto
lint:
  # STANDARD is what DEFAULT was renamed to. Same rules, current spelling.
  use:
    - STANDARD

  # Nothing suppressed. The two rules that used to be — RPC_REQUEST_STANDARD_NAME
  # and RPC_RESPONSE_STANDARD_NAME, for the plugin protocol's six request and
  # response messages — were suppressed because `DescribeRequest` would have been
  # ambiguous in a package shared with the workflow service, sitting next to
  # `RunRequest` and `SignalRequest`. The plugin protocol has its own package now,
  # so the names the rule asks for are the right ones and the suppression is gone
  # with the reason for it.
