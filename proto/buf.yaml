version: v1
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
breaking:
  use:
    - FILE
    - WIRE

  # Scoped, and due to be removed by the commit after this one lands on main.
  #
  # This commit deletes `Workflow.inputs` — field 4, a map nothing ever wrote and
  # nothing ever read — and reserves its number and its name. `buf breaking`
  # compares against `origin/main`, where the field still exists, so the check
  # cannot pass until main has the deletion.
  #
  # A suppression measures a distance from one commit. The moment this one is on
  # main that distance is zero: the check compares against a schema that already
  # has the change, and the block suppresses nothing. What it still does is stand
  # ready to hide the *next* break in the same file — which is a quiet failure,
  # because a stale suppression reads as a considered exception, keeps passing, and
  # the break it eventually swallows belongs to whoever comes next.
  #
  # This is the fourth deliberate use of the pattern, and each of the previous
  # three was removed by the very next commit. That is what keeps it a pattern
  # rather than an excuse.
  # Two rules rather than one, because a map field is two things. `map<string,
  # Value> inputs` compiles to a field *and* to a synthesized nested message,
  # `Workflow.InputsEntry`, holding its key and value — so deleting the field also
  # deletes a message, and the second break is reported against the file's first
  # line rather than the field's.
  #
  # `reserved` cannot cover that half. It reserves field numbers and field names,
  # and the entry message is neither; nothing recreates it unless a future field is
  # also a map called `inputs`, which `reserved "inputs"` already prevents.
  ignore_only:
    FIELD_NO_DELETE:
      - flowstate/v1/flowstate.proto
    MESSAGE_NO_DELETE:
      - flowstate/v1/flowstate.proto

lint:
  # STANDARD is what DEFAULT was renamed to. Same rules, current spelling.
  use:
    - STANDARD

  # Nothing suppressed. The two rules that used to be — RPC_REQUEST_STANDARD_NAME
  # and RPC_RESPONSE_STANDARD_NAME, for the plugin protocol's six request and
  # response messages — were suppressed because `DescribeRequest` would have been
  # ambiguous in a package shared with the workflow service, sitting next to
  # `RunRequest` and `SignalRequest`. The plugin protocol has its own package now,
  # so the names the rule asks for are the right ones and the suppression is gone
  # with the reason for it.
