version: v1
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
breaking:
  # Scoped for exactly one commit, and removed by the next one. See the note below
  # about why a suppression that outlives its commit is worse than no check.
  #
  # This commit deletes `Task.Echo`, `Task.Printf` and `Task.CEL`, the three tasks
  # retired at edition v2026.2. All three produced a value from a time when a step
  # was the only thing that could hold one; `vars:` is that thing now, so they had
  # become a step whose only job was to name an expression.
  #
  # A deletion is the honest shape of a retirement. Keeping the descriptors so the
  # check stays quiet would leave three tasks the schema still describes, the
  # language server still completes, and nothing can run — which is the state this
  # repo calls scaffolding.
  ignore_only:
    FILE:
      - flowstate/v1/flowstate.proto
    WIRE:
      - flowstate/v1/flowstate.proto

  # Otherwise nothing suppressed, which is the only state this file should be found
  # in for longer than one commit.
  #
  # The previous commit deleted `Task.CEL.Inputs.libs`, and carried a scoped
  # `ignore_only` so it could land. It is removed here because a breaking
  # suppression measures a distance from one commit: the moment that commit is on
  # main the distance is zero, the check compares against a schema that already has
  # the change, and the block suppresses nothing. What it still does is stand ready
  # to hide the *next* break in that file.
  #
  # That is a quiet failure. A stale suppression reads as a considered exception,
  # keeps passing, and the break it eventually swallows belongs to whoever comes
  # next. This is the second time the pattern has been used deliberately — see the
  # commit that removed the last one, also one commit after it landed.
  use:
    - FILE
    - WIRE

lint:
  # STANDARD is what DEFAULT was renamed to. Same rules, current spelling.
  use:
    - STANDARD

  # Nothing suppressed. The two rules that used to be — RPC_REQUEST_STANDARD_NAME
  # and RPC_RESPONSE_STANDARD_NAME, for the plugin protocol's six request and
  # response messages — were suppressed because `DescribeRequest` would have been
  # ambiguous in a package shared with the workflow service, sitting next to
  # `RunRequest` and `SignalRequest`. The plugin protocol has its own package now,
  # so the names the rule asks for are the right ones and the suppression is gone
  # with the reason for it.
