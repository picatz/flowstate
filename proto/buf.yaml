version: v1
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
breaking:
  # Nothing suppressed, which is the only state this file should be found in for
  # longer than one commit.
  #
  # The commit before this one deleted `Workflow.inputs` — field 4, a map nothing
  # ever wrote and nothing ever read — and carried a scoped `ignore_only` so it
  # could land. Two rules rather than one, because a map field is two things: it
  # compiles to a field *and* to a synthesized `Workflow.InputsEntry` holding its
  # key and value, so deleting it also deleted a message.
  #
  # Removed here because a breaking suppression measures a distance from one
  # commit. The moment that commit is on main the distance is zero, the check
  # compares against a schema that already has the change, and the block suppresses
  # nothing. What it still does is stand ready to hide the *next* break in that
  # file.
  #
  # That is a quiet failure. A stale suppression reads as a considered exception,
  # keeps passing, and the break it eventually swallows belongs to whoever comes
  # next. This is the fourth time the pattern has been used deliberately, and each
  # time the removal has been the very next commit — which is what keeps it a
  # pattern rather than an excuse.
  use:
    - FILE
    - WIRE

lint:
  # STANDARD is what DEFAULT was renamed to. Same rules, current spelling.
  use:
    - STANDARD

  # Nothing suppressed. The two rules that used to be — RPC_REQUEST_STANDARD_NAME
  # and RPC_RESPONSE_STANDARD_NAME, for the plugin protocol's six request and
  # response messages — were suppressed because `DescribeRequest` would have been
  # ambiguous in a package shared with the workflow service, sitting next to
  # `RunRequest` and `SignalRequest`. The plugin protocol has its own package now,
  # so the names the rule asks for are the right ones and the suppression is gone
  # with the reason for it.
