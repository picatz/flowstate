syntax = "proto3";

package github.v1;

option go_package = "github.com/picatz/flowstate/plugins/github/gen/github/v1;githubv1";

import "flowstate/v1/flowstate.proto";

// This plugin's own task schema. Everything here is intentionally named
// after GitHub's own vocabulary - a pull request, an issue comment - rather
// than a portable term, because this build proves one forge operation
// end to end rather than a portable forge vocabulary. See the plugin's
// README, "Naming: why github.* and not forge.*," for the schema change
// that would be needed before these could honestly be forge.* instead.

// PullRequestGetInputs asks for one pull request's current state.
message PullRequestGetInputs {
  // Owner and Repo name the repository, e.g. "octocat" and "hello-world".
  string owner = 1;
  string repo = 2;

  // Number is the pull request number.
  int64 number = 3;

  // Token authenticates the request. Unset means an unauthenticated request,
  // which GitHub permits for a public repository at a much lower rate limit.
  // A literal string here is refused - see auth.go.
  flowstate.v1.Value token = 4;

  // BaseUrl overrides the API base for GitHub Enterprise Server, e.g.
  // "https://github.example.com/api/v3". Unset means github.com.
  string base_url = 5;
}

// PullRequestGetOutputs is what GitHub answered.
message PullRequestGetOutputs {
  string title = 1;
  string body = 2;
  string state = 3; // "open", "closed"
  bool merged = 4;
  string mergeable_state = 5; // GitHub's own enum, passed through as text: "clean", "dirty", "blocked", "unknown", ...
  string head_ref = 6;
  string head_sha = 7;
  string base_ref = 8;
  string html_url = 9;
}

// IssueCommentInputs posts a comment on an issue or a pull request - the same
// endpoint on GitHub's API, since a pull request is an issue with extra
// fields there.
message IssueCommentInputs {
  string owner = 1;
  string repo = 2;

  // Number is the issue or pull request number.
  int64 number = 3;

  // Body is the comment's Markdown text.
  string body = 4;

  flowstate.v1.Value token = 5;
  string base_url = 6;
}

// IssueCommentOutputs is the comment GitHub created.
message IssueCommentOutputs {
  int64 comment_id = 1;
  string html_url = 2;
  string created_at = 3; // RFC 3339
}

// The read/audit tier below - pull_request_list, pull_request_files,
// issue_get, issue_list - is this plugin's counterpart to plugins/git's own
// git.log/git.read_file: genuinely stateless reads, composable as ordinary
// Flowfile steps, added once the schema and error-classification discipline
// above had already proven out on one operation end to end. See the
// plugin's README, "Read/audit tier," for which candidates were rejected
// and why.

// PullRequestListInputs asks for a bounded page of a repository's pull
// requests, filtered by state and (optionally) branch - the "what is in
// flight" read/audit primitive github.pull_request_get's single-record read
// has no way to answer on its own.
message PullRequestListInputs {
  string owner = 1;
  string repo = 2;

  // State filters by state: "open" (the default when unset), "closed", or
  // "all".
  string state = 3;

  // Base filters to pull requests targeting this branch.
  string base = 4;

  // Head filters to pull requests from this branch, in GitHub's own
  // "<owner>:<branch>" format (see pull_request_list.go).
  string head = 5;

  // MaxResults bounds how many pull requests are returned. Zero means this
  // task's own default (see defaultMaxResults); anything over the ceiling
  // (maxMaxResults) is refused rather than silently clamped - see
  // clampMaxResults's own doc comment for why.
  int32 max_results = 6;

  // Token authenticates the request. Unset means an unauthenticated
  // request, which GitHub permits for a public repository at a much lower
  // rate limit. A literal string here is refused.
  flowstate.v1.Value token = 7;

  // BaseUrl overrides the API base for GitHub Enterprise Server.
  string base_url = 8;

  // Sort orders the result: "created" (the default when unset), "updated",
  // "popularity", or "long-running" - GitHub's own four values for this
  // endpoint's sort parameter. Anything else is refused as InvalidInput;
  // this is not a passthrough string.
  string sort = 9;

  // Direction orders the result ascending or descending: "asc" or "desc".
  // Unset means this task's own explicit default, "desc" - GitHub's own
  // default for this endpoint when sort is "created" or unset - the same
  // "name the default explicitly" reasoning IssueListInputs.direction's
  // own doc comment documents.
  //
  // Sort "created" with direction "asc" is also the one ordering this task
  // will resume with Cursor - see Cursor's own doc comment for why.
  string direction = 10;

  // Cursor resumes a prior, truncated call - fed back exactly as
  // PullRequestListOutputs.next_cursor returned it. Opaque to a workflow:
  // nothing about its contents is meant to be parsed or reasoned about
  // beyond "pass it back as cursor." See PullRequestListOutputs.next_cursor
  // and plugins/github/cursor.go for the full encoding.
  //
  // GitHub's pull-request listing is page-number pagination over a list
  // that mutates between calls - a pull request opened or closed while a
  // caller is still paging shifts every later page's contents by one,
  // unlike git.log's own cursor, which resumes an immutable commit DAG.
  // This task cannot make the list stop mutating, but it can make new
  // entries land only at the far end of the walk rather than in the middle
  // of it: sorted by "created" ascending, a newly opened pull request is
  // always the newest, so it is always appended after wherever a resumed
  // walk currently stands, never inserted before it. That is why Cursor is
  // only ever produced (and only ever accepted back) when Sort is
  // "created" and Direction is "asc" - see requireStableOrder in
  // pull_request_list.go. Any other sort/direction still lists pull
  // requests exactly as before; it just never grows a next_cursor a caller
  // could resume from.
  //
  // Even under that stable order, a pull request CLOSED (or otherwise
  // removed from the matching set - e.g. a state filter that no longer
  // matches it) between two calls can still shift a later page's contents
  // backward by one, which this task's page-plus-skip position has no way
  // to detect: unlike an insertion, a removal can cause a miss. Ordering by
  // created-ascending closes the insertion direction of this problem, not
  // the removal direction - state this precisely to a caller rather than
  // implying either "resumes exactly like git.log" or "resumes with no
  // guarantee at all."
  //
  // Untrusted input the moment it comes back from outside this task, so it
  // is bound and validated narrowly - see validateCursor (validate.go) and
  // decodePageCursor (cursor.go). A cursor issued under different filters
  // (a different state, base, head, sort, direction, or max_results) is
  // refused outright rather than silently walking the wrong sequence - see
  // cursor.go's own doc comment, "why a fingerprint."
  //
  // This task has no separate "starting page" input for Cursor to conflict
  // with the way git.log's own Cursor is mutually exclusive with Ref -
  // there is nothing else here that names a position to resume from.
  string cursor = 11;
}

// PullRequestSummary is one entry PullRequestListOutputs returns -
// deliberately lighter than PullRequestGetOutputs (no body): a listing
// answers "what is in flight," not "what does each one say," and a body
// per entry would make a page's size a function of how much text every
// author wrote rather than of how many pull requests exist.
message PullRequestSummary {
  int64 number = 1;
  string title = 2;
  string state = 3; // "open", "closed"
  bool draft = 4;
  string head_ref = 5;
  string head_sha = 6;
  string base_ref = 7;
  string html_url = 8;
  string created_at = 9; // RFC 3339
  string updated_at = 10; // RFC 3339
}

// PullRequestListOutputs is a bounded page of matching pull requests.
message PullRequestListOutputs {
  repeated PullRequestSummary pull_requests = 1;

  // Truncated reports whether more pull requests matched than this call
  // returned - by max_results, or by the request budget this task spends
  // paginating GitHub's own API (see maxListRequests) - so a workflow can
  // tell "this is all of it" from "this is as much as this call reached."
  bool truncated = 2;

  // NextCursor is the resume position for the next page, populated exactly
  // when Truncated is true, PullRequests is non-empty, AND this call's own
  // Sort/Direction were "created"/"asc" - see PullRequestListInputs.cursor
  // for why that ordering is what makes a resume trustworthy. Empty
  // whenever Truncated is false (nothing left to resume) or the ordering
  // was not the stable one (there is genuinely more, but no position this
  // task will vouch for resuming into - a caller in that position sets
  // sort: created and direction: asc to make a truncated result
  // resumable, the same "narrow the walk" remedy git.log's own
  // NextCursor's doc comment gives for its own narrower empty cases).
  string next_cursor = 3;
}

// PullRequestFilesInputs asks which files one pull request touches - the
// review-triage primitive: which paths changed, and how much, without
// reading any diff content. See pull_request_files.go's own doc comment for
// why file content is out of scope here.
message PullRequestFilesInputs {
  string owner = 1;
  string repo = 2;

  // Number is the pull request number.
  int64 number = 3;

  // MaxResults bounds how many files are returned - see
  // PullRequestListInputs.max_results's own doc comment; the same default
  // and ceiling apply here.
  int32 max_results = 4;

  flowstate.v1.Value token = 5;
  string base_url = 6;

  // Cursor resumes a prior, truncated call - fed back exactly as
  // PullRequestFilesOutputs.next_cursor returned it. See
  // PullRequestListInputs.cursor's own doc comment for the general shape
  // this shares (page-plus-skip, filter-fingerprinted, opaque).
  //
  // Unlike PullRequestListInputs.cursor, this input carries NO ordering
  // requirement, because none is available: GitHub's own ListFiles
  // endpoint takes no sort parameter this task could ask it to hold
  // stable. Its documented order is the order files appear in the pull
  // request's diff, which is exactly as mutable as the diff itself - a
  // commit pushed to the pull request between two calls can add, remove,
  // or reorder files, and this task has no lever to stop that. So this
  // cursor's contract is honestly weaker than PullRequestListInputs.cursor's:
  // it resumes NEAR where a truncated call stopped, by page and
  // within-page position, but a file added or removed between calls may be
  // missed or (less likely, since a removal shifts positions backward, not
  // forward) returned twice. Acceptable for the triage read this task is -
  // "which files changed, roughly" - never claimed as exactly-once. Use
  // this task's own repeated calls close together in time to keep the risk
  // small, and re-fetch the whole listing (cursor unset) rather than trust
  // a stale cursor across a pull request known to have moved.
  string cursor = 7;
}

// PullRequestFile is one file GitHub reports as touched by a pull request.
message PullRequestFile {
  string filename = 1;
  string status = 2; // "added", "removed", "modified", "renamed", "copied", "changed", "unchanged"
  int32 additions = 3;
  int32 deletions = 4;
  int32 changes = 5;

  // PreviousFilename is set only when status is "renamed".
  string previous_filename = 6;
}

// PullRequestFilesOutputs is a bounded page of the files a pull request
// touches.
message PullRequestFilesOutputs {
  repeated PullRequestFile files = 1;

  // Truncated reports whether the pull request touched more files than
  // this call returned - see PullRequestListOutputs.truncated's own doc
  // comment; the same reasoning applies here.
  bool truncated = 2;

  // NextCursor is the resume position for the next page, populated exactly
  // when Truncated is true and Files is non-empty - unconditionally,
  // unlike PullRequestListOutputs.next_cursor, since this endpoint has no
  // stable-ordering condition to gate on. See PullRequestFilesInputs.cursor
  // for the weaker guarantee this carries: resumes NEAR where this call
  // stopped, not exactly-once against a pull request whose files changed
  // between calls.
  string next_cursor = 3;
}

// IssueGetInputs asks for one issue's current state - the single-record
// read/audit-tier counterpart to github.pull_request_get, for a workflow
// that already has a number (from a webhook, a wait_for_signal payload, or
// a previous github.issue_list call) and needs the full record, body
// included, unlike a listing.
message IssueGetInputs {
  string owner = 1;
  string repo = 2;

  // Number is the issue (or pull request - see IssueGetOutputs.is_pull_request)
  // number.
  int64 number = 3;

  flowstate.v1.Value token = 4;
  string base_url = 5;
}

// IssueGetOutputs is what GitHub answered.
message IssueGetOutputs {
  string title = 1;
  string body = 2;
  string state = 3; // "open", "closed"
  string state_reason = 4; // "completed", "not_planned", "reopened", or empty
  repeated string labels = 5;
  int32 comments = 6;
  string html_url = 7;
  string created_at = 8; // RFC 3339
  string updated_at = 9; // RFC 3339

  // ClosedAt is RFC 3339, empty while the issue is still open.
  string closed_at = 10;

  // IsPullRequest reports whether this "issue" number is actually a pull
  // request - GitHub's own issues API answers both through this same
  // endpoint (an issue comment's own doc comment gives the same reasoning:
  // a pull request is an issue with extra fields there), so a workflow
  // that only meant to ask about an issue is not silently handed a pull
  // request's state without being told.
  bool is_pull_request = 11;
}

// IssueListInputs asks for a bounded page of a repository's issues - the
// audit/triage primitive: what needs attention, filtered by state and
// label.
message IssueListInputs {
  string owner = 1;
  string repo = 2;

  // State filters by state: "open" (the default when unset), "closed", or
  // "all".
  string state = 3;

  // Labels filters to issues carrying every label named - an AND, matching
  // GitHub's own List endpoint semantics for a comma-joined labels
  // parameter.
  repeated string labels = 4;

  // Since, RFC 3339, limits results to issues updated at or after this
  // time.
  string since = 5;

  // MaxResults bounds how many issues are returned - see
  // PullRequestListInputs.max_results's own doc comment; the same default
  // and ceiling apply here.
  int32 max_results = 6;

  flowstate.v1.Value token = 7;
  string base_url = 8;

  // Sort orders the result: "created" (the default when unset), "updated",
  // or "comments" - GitHub's own three values for this endpoint's sort
  // parameter. Anything else is refused as InvalidInput; this is not a
  // passthrough string.
  string sort = 9;

  // Direction orders the result ascending or descending: "asc" or "desc".
  // Unset means this task's own explicit default, "desc" - GitHub's own
  // default for this endpoint, named here rather than left to whatever
  // GitHub does unasked, the same reasoning IssueListInputs.state's default
  // documents. Element zero of Issues is therefore the newest match when
  // direction is (or defaults to) "desc", and the oldest when it is "asc" -
  // ask for "asc" to answer "what is the oldest open issue."
  string direction = 10;

  // Cursor resumes a prior, truncated call - fed back exactly as
  // IssueListOutputs.next_cursor returned it. See
  // PullRequestListInputs.cursor's own doc comment for the full argument
  // this shares essentially unchanged: page-plus-skip pagination over a
  // list GitHub, not this task, controls, requiring Sort "created" and
  // Direction "asc" before this task will ever produce or accept one - so
  // a newly filed issue always appends past wherever a resumed walk
  // currently stands rather than shifting it - and still unable to detect
  // an issue removed from the matching set between calls (closed under a
  // state filter that excludes it, or deleted outright), which can shift a
  // later page backward and cause a miss even under that stable order.
  //
  // As with pull_request_list, there is no separate "starting page" input
  // here for Cursor to conflict with.
  string cursor = 11;
}

// IssueSummary is one entry IssueListOutputs returns - see
// PullRequestSummary's own doc comment for why this excludes body.
message IssueSummary {
  int64 number = 1;
  string title = 2;
  string state = 3; // "open", "closed"
  repeated string labels = 4;
  string html_url = 5;
  string created_at = 6; // RFC 3339
  string updated_at = 7; // RFC 3339

  // IsPullRequest - see IssueGetOutputs.is_pull_request's own doc comment.
  bool is_pull_request = 8;
}

// IssueListOutputs is a bounded page of matching issues.
message IssueListOutputs {
  repeated IssueSummary issues = 1;

  // NextCursor is the resume position for the next page, populated exactly
  // when Truncated is true, Issues is non-empty, AND this call's own
  // Sort/Direction were "created"/"asc" - see IssueListInputs.cursor and
  // PullRequestListOutputs.next_cursor's own doc comment for the full
  // reasoning, which applies here unchanged.
  string next_cursor = 3;

  // Truncated - see PullRequestListOutputs.truncated's own doc comment; the
  // same reasoning applies here.
  bool truncated = 2;
}
