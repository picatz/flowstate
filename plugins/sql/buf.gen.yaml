# managed mode's only job here is telling buf what flowstate/v1/flowstate.proto's
# go_package is, so it can resolve the import our own sql.proto makes - this
# plugin never generates code for that file. Everything about our own package
# is already spelled out by sql.proto's own go_package option. Copied from
# plugins/codex/buf.gen.yaml, which explains the same choice at more length.
version: v1
managed:
  enabled: true
  override:
    GO_PACKAGE:
      flowstate/v1/flowstate.proto: github.com/picatz/flowstate/pkg/flowstate/v1;flowstatev1
# Generated with the locally installed protoc-gen-go rather than a remote
# plugin, so regenerating needs no network - the same choice plugins/git,
# plugins/vcs, and plugins/codex make.
#
# # Regenerating
#
# buf refuses a workspace directory that reaches outside the directory it was
# invoked against, and this plugin's proto genuinely needs the root
# repository's proto/flowstate/v1/flowstate.proto beside its own. The only
# way to put both in one buf workspace is to run buf from a directory that
# contains both, which means the repository root, which means borrowing its
# buf.work.yaml for the duration of one command:
#
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
#
#   # from the repository root, with protoc-gen-go on $PATH:
#   printf 'version: v1\ndirectories:\n  - proto\n  - plugins/sql/proto\n' > buf.work.yaml
#   go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate \
#     --template plugins/sql/buf.gen.yaml --path plugins/sql/proto/sql -o plugins/sql
#   git checkout -- buf.work.yaml
plugins:
  - plugin: go
    out: gen
    opt:
      - paths=source_relative
# Regeneration note: protoc-gen-go must be installed and on $PATH first:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
