version: v1
managed:
  enabled: true
  override:
    GO_PACKAGE:
      flowstate/v1/value.proto: github.com/picatz/flowstate/pkg/flowstate/v1;flowstatev1
# Generated with the locally installed protoc-gen-go rather than a remote
# plugin, so regenerating needs no network.
#
# # Regenerating
#
#   GOBIN=$PWD/tools go install google.golang.org/protobuf/cmd/protoc-gen-go
#
#   # from the repository root, with protoc-gen-go on $PATH:
#   go tool -modfile=tools/external/go.mod buf generate \
#     --config '{"version":"v2","modules":[{"path":"proto"},{"path":"plugins/jose/proto"}],"deps":["buf.build/bufbuild/protovalidate","buf.build/googleapis/googleapis"]}' \
#     --template plugins/jose/buf.gen.yaml --path plugins/jose/proto/jose -o plugins/jose
plugins:
  - plugin: go
    out: gen
    opt:
      - paths=source_relative
