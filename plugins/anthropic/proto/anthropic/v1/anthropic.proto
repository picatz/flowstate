syntax = "proto3";

package anthropic.v1;

option go_package = "github.com/picatz/flowstate/plugins/anthropic/gen/anthropic/v1;anthropicv1";

import "flowstate/v1/decision.proto";
import "flowstate/v1/schema.proto";
import "flowstate/v1/value.proto";

// DecideInputs is this plugin's one task: put a named set of typed questions
// to a Claude model about some evidence, and get back one typed answer per
// question.
//
// The questions and answers are the provider-neutral shapes of
// flowstate/v1/decision.proto, so a Flowfile that routes on an answer reads the
// same under any provider plugin. Everything specific to Anthropic - the model,
// the output budget, whether to ask for a self-reported confidence - is a field
// here and never crosses into the neutral schema.
//
// # How a question set becomes a request
//
// The Messages API has no decisions endpoint. This plugin sends one request
// whose only tool takes one property per question, and forces the model to call
// it with tool_choice, so the answer comes back as the tool's JSON input rather
// than as prose to be parsed. A choice question is an enum of its options, a
// predicate is a boolean, and a score is an enum of its levels in order.
//
// # Calibration
//
// Claude exposes no token probabilities. The only confidence it can give is its
// own description of how sure it is, so an answer carries
// CALIBRATION_SELF_REPORTED when, and only when, the model supplied a
// confidence in its tool input, and CALIBRATION_NONE otherwise. No probability
// or distribution is ever computed or filled in.
message DecideInputs {
  // ApiKey is an Anthropic API key. The task requires this entire input to be a
  // secret reference, which the host resolves worker-side before execution; a
  // literal is refused before it can enter durable history. The resolved value
  // is capped at 4 KiB, sent only as the x-api-key header, and never appears
  // in an error.
  flowstate.v1.Value api_key = 1 [(flowstate.v1.input).secret = SECRET_REQUIRED];

  // Model is the Anthropic model identifier the request names, required and
  // never defaulted here. It is passed through unchanged, so an alias or a
  // dated snapshot both work; the API refuses one it does not know.
  string model = 2;

  // Evidence is the text the questions are about, sent as the user message and
  // limited to 262,144 bytes. It is data to be judged, not instructions: the
  // system prompt tells the model so, but a model can still be influenced by
  // what it reads, which is why an answer is validated against the question
  // set rather than trusted.
  string evidence = 3;

  // QuestionSet is a flowstate.v1.QuestionSet written as a mapping: a
  // `questions` list whose entries each have a `name`, optional
  // `instructions`, and exactly one of `predicate: {}`, `choice: {options:
  // [...]}` or `score: {levels: [...]}`. It is validated against the schema's
  // rules before any request is made. Names are also limited to 64 characters
  // here, the longest property name the Messages API accepts in a tool schema.
  flowstate.v1.Value question_set = 4;

  // ReportConfidence asks the model to include a confidence between 0 and 1
  // with each answer. What comes back is the model's claim about itself and is
  // labelled CALIBRATION_SELF_REPORTED; it is not a measured probability. When
  // false the model is not asked, and every answer is CALIBRATION_NONE.
  bool report_confidence = 5;

  // MaxTokens bounds the model's reply, which is only the tool call. Zero means
  // 1,024; the ceiling is 8,192.
  int32 max_tokens = 6;
}

// DecideOutputs carries one answer per question, in the question set's order.
message DecideOutputs {
  // Answers has exactly one validated flowstate.v1.Answer for each question,
  // matched by name. A reply that is missing one, adds one, or carries a value
  // the question did not offer fails the task rather than returning a partial
  // result. Read a choice as `steps.<id>.answers[0].choice`; an absent
  // confidence reads as 0, so test `calibration` before trusting it.
  repeated flowstate.v1.Answer answers = 1;
}
