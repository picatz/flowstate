version: v1
# See plugins/vcs/buf.gen.yaml for the full argument; this file is that one
# with "vcs" spelled "git". managed mode's only job is telling buf what
# flowstate/v1/value.proto's go_package is, so it can resolve the import
# our own git.proto makes - this plugin never generates code for that file.
managed:
  enabled: true
  override:
    GO_PACKAGE:
      flowstate/v1/value.proto: github.com/picatz/flowstate/pkg/flowstate/v1;flowstatev1
# Generated with the locally installed protoc-gen-go, no network needed.
#
# # Regenerating
#
# buf refuses a workspace directory that reaches outside the directory it was
# invoked against, and this plugin's proto needs the root repository's
# proto/flowstate/v1/value.proto beside its own. Declare both as modules for
# the duration of one command with --config, from the repository root:
#
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
#
#   go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate \
#     --config '{"version":"v2","modules":[{"path":"proto"},{"path":"plugins/git/proto"}],"deps":["buf.build/bufbuild/protovalidate","buf.build/googleapis/googleapis"]}' \
#     --template plugins/git/buf.gen.yaml --path plugins/git/proto/git -o plugins/git
plugins:
  - plugin: go
    out: gen
    opt:
      - paths=source_relative
# protoc-gen-go must be installed and on $PATH first:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
