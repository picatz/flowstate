syntax = "proto3";

package git.v1;

option go_package = "github.com/picatz/flowstate/plugins/git/gen/git/v1;gitv1";

import "flowstate/v1/value.proto";

// This plugin's own task schema: the rich, unapologetically git-specific
// half of the factoring described in issue #149 - "git.*" here, the small
// portable core in "vcs.*" (this repository's sibling plugin, plugins/vcs).
// Nothing here pretends to be backend-agnostic: a sha is a content hash
// because that is what git has, a branch is `refs/heads/<name>`, and a patch
// is the unified-diff format git itself emits.
//
// See doc.go for why write operations - absent from plugins/vcs by design -
// exist here, and why they take the shape they do: one activity, one write,
// content in and content out, never a workspace handed between steps.

// LsRemoteInputs asks for the refs a remote currently advertises, without
// cloning anything - the same network round trip a clone's first step makes,
// stopped there.
message LsRemoteInputs {
  // Url is the repository to query, https:// only. See doc.go for why this
  // plugin does not yet accept ssh:// - a deliberate, reported gap, not an
  // oversight.
  string url = 1;

  // Prefix filters which refs are returned - "refs/heads/" for branches only,
  // "refs/tags/" for tags only. Empty returns every ref the remote
  // advertises.
  string prefix = 2;

  // Token is a secret reference for HTTPS authentication, resolved inside
  // this task and never logged. A literal string here is refused.
  flowstate.v1.Value token = 3;

  // Username is the HTTP Basic-auth username paired with token. Empty means
  // this task's own default, "x-access-token" - the literal every version
  // before this field existed always sent, so leaving this unset is
  // byte-identical in behavior to a file written before this field
  // existed. Most providers never look at this value (see the README,
  // "Choosing the username") - set it only for one that does, such as
  // Bitbucket Cloud, which wants either the real account username or the
  // literal "x-bitbucket-api-token-auth".
  string username = 4;
}

// RemoteRef is one ref a remote advertised, bound to its content: a workflow
// that reads `refs.name` alongside `refs.sha` is binding to what the ref
// pointed at when this task ran, not merely repeating a movable name a later
// force-push or branch reset could quietly change out from under it.
message RemoteRef {
  string name = 1;
  string sha = 2;
}

// LsRemoteOutputs is the bounded set of refs found.
message LsRemoteOutputs {
  repeated RemoteRef refs = 1;

  // Truncated reports whether the remote advertised more refs than the
  // bound this task enforces (see maxRemoteRefs).
  bool truncated = 2;
}

// CommitPushInputs describes one write: materialize a tree from base_ref,
// apply files and/or a patch to it, commit the result, and push it to
// branch - all inside the one activity invocation that runs this task. See
// doc.go, "One activity, one write," for the full argument.
message CommitPushInputs {
  // Url is the repository to write to, https:// only.
  string url = 1;

  // Branch is always explicit - never defaulted to the remote's HEAD, since
  // pushing somewhere the workflow did not name is exactly the foot-gun this
  // field's own requiredness exists to prevent. Written as a short branch
  // name (no "refs/heads/" prefix); this task always writes to
  // "refs/heads/<branch>".
  string branch = 2;

  // BaseRef is the remote commit this change was computed against - what
  // `vcs.diff`, a coding agent, or a previous step read before deciding what
  // to change. Required, for the same reason branch is: this task never
  // guesses a starting point. Accepts anything go-git's revision parser
  // does (a branch, a tag, or a commit sha).
  string base_ref = 3;

  // Message is the new commit's message.
  string message = 4;

  // Files is path -> new file content. A path already present in base_ref
  // is overwritten (its regular/executable mode is preserved; a path this
  // creates fresh is always mode Regular); a path not present is created.
  // Text content only in this version - see doc.go for the binary gap.
  // Every path is validated: no absolute path, no ".." segment, nothing
  // under ".git/", and nothing that would write through a symlink base_ref
  // already has at a leading path segment.
  //
  // A path may be named by files or by patch, never both: this task refuses
  // that as ambiguous rather than defining an order between them, since a
  // silent "whichever applies last wins" would hide one input quietly
  // overriding the other for the same path. There is no layering to reason
  // about - see doc.go, "files and patch do not layer," for why that is the
  // safer contract, not a missing feature.
  map<string, string> files = 5;

  // Patch is a unified diff (the same format vcs.diff produces and a coding
  // agent can emit), applied to base_ref's tree. Bounded in size (see
  // maxPatchBytes) and parsed and applied entirely in memory - see doc.go,
  // "Why go-git and go-gitdiff, not git apply," for why this needs a
  // second, small dependency go-git itself does not provide. A modification
  // patch that omits mode header lines (the ordinary case) preserves the
  // touched path's existing mode; deletions are validated against base_ref's
  // actual content, the same as every other fragment - a patch whose
  // context does not match, or that names a path base_ref does not have, is
  // refused rather than silently deleting whatever is there now.
  string patch = 6;

  // AuthorName and AuthorEmail name the commit's author and committer -
  // this task does not distinguish them. Both are required together, or
  // both left empty (in which case a placeholder identity is used).
  string author_name = 7;
  string author_email = 8;

  // Timestamp, RFC 3339, makes commit construction fully deterministic: the
  // same inputs given twice produce the identical sha, which is what turns a
  // retried push into arithmetic rather than a guess - see doc.go, "The
  // idempotency trick." Left empty, the activity's own wall clock is used,
  // and retry-safety falls back to comparing the would-be commit's parent,
  // tree, and message against what is already on the remote branch, rather
  // than comparing shas directly.
  string timestamp = 9;

  // Token is a secret reference for HTTPS authentication, resolved inside
  // this task and never logged, and never carried in url itself. A literal
  // string here is refused.
  flowstate.v1.Value token = 10;

  // Username is the HTTP Basic-auth username paired with token - see
  // LsRemoteInputs.username for the full doc comment; the same default
  // ("x-access-token") and the same reasoning apply here unchanged.
  string username = 11;
}

// Signature is a commit's author or committer line: who, and when.
message Signature {
  string name = 1;
  string email = 2;

  // When is RFC 3339, in the zone the commit recorded.
  string when = 3;
}

// Commit is one entry of a repository's history, read by git.log. Richer
// than plugins/vcs's own Commit (which has no committer or parent hashes),
// deliberately - see git.proto's own top comment: this plugin is the
// unapologetically git-specific half of the factoring issue #149 settled,
// and a committer line distinct from the author, and a commit's parents, are
// exactly the kind of git-object-model detail that belongs here rather than
// in the backend-agnostic core.
message Commit {
  // Sha is the commit's full hex object id.
  string sha = 1;

  // Author is read from the commit's author line - unverified, since anyone
  // with push access to the remote controls what it says.
  Signature author = 2;

  // Committer is read from the commit's committer line, distinct from
  // Author whenever the commit was authored by one person and applied
  // (rebased, cherry-picked, merged) by another.
  Signature committer = 3;

  // Message is the commit's full message, bounded per-entry (see
  // maxLogMessageBytes) and, across every entry LogOutputs returns, bounded
  // again in total (see maxTotalLogMessageBytes) - a commit message has no
  // natural size limit, and a repository this task reads is attacker-chosen
  // input, so both bounds exist independently: one entry cannot be
  // pathologically large, and many merely-large entries cannot sum to an
  // unbounded response either.
  string message = 4;

  // ParentHashes are this commit's parents' full hex object ids, in the
  // order the commit object itself records them - empty for a root commit,
  // more than one for a merge.
  repeated string parent_hashes = 5;
}

// LogInputs asks for a bounded slice of a repository's commit history -
// git.log's own audit primitive: who changed what, and what they said about
// it.
message LogInputs {
  // Url is the repository to read, https:// only.
  string url = 1;

  // Ref is the branch, tag, or commit-ish to start from - anything go-git's
  // own revision parser accepts. Empty means the remote's default branch
  // (its HEAD).
  string ref = 2;

  // MaxCommits bounds how many commits are returned. Zero means this task's
  // own default (see defaultMaxCommits); anything over the task's ceiling
  // (maxMaxCommits) is refused rather than silently clamped - a silently
  // clamped bound looks like a working request that quietly returns less
  // than it was asked for.
  int32 max_commits = 3;

  // Path, if set, limits results to commits that touched this path -
  // equivalent to `git log -- <path>`. This task only ever searches within
  // the shallow window it cloned (see doc.go's own note on this task, "A
  // path filter searches only the fetched window"): a commit older than
  // that window that touched path is not found, and is exactly what
  // Truncated in the output exists to report honestly rather than silently
  // under-answering.
  string path = 4;

  // Since, RFC 3339, limits results to commits authored at or after this
  // time - equivalent to `git log --since`.
  string since = 5;

  // Token is a secret reference for HTTPS authentication against a private
  // repository, resolved inside this task and never logged. A literal
  // string here is refused.
  flowstate.v1.Value token = 6;

  // Username is the HTTP Basic-auth username paired with token - see
  // LsRemoteInputs.username for the full doc comment and default.
  string username = 7;

  // Cursor resumes a prior, truncated call - fed back exactly as
  // LogOutputs.next_cursor returned it. Opaque to a workflow (nothing
  // about its contents is meant to be parsed or reasoned about beyond
  // "pass it back as cursor"), but not a single sha: it packs two
  // full-sha lists, "|"-separated - the walk's own FRONTIER (every
  // not-yet-explored commit a resumed walk still owes an answer for) and
  // EMITTED (every commit already returned across every earlier page of
  // this same walk). Every filter this call sets (path, since) applies to
  // the resumed walk exactly as it would to a fresh one.
  //
  // Both lists, not one sha, because a single "resume at the last commit's
  // parent" spelling is provably wrong the moment a page boundary lands on
  // or after a merge: a merge's history fans out into every parent, and
  // "parent[0] only" silently drops everything reachable solely through
  // parent[1] and beyond - a MISS, not a duplicate, and exactly the
  // direction a purely linear test fixture cannot expose. Frontier is what
  // lets every one of a merge's parents be explored on resumption; emitted
  // is what stops a RECONVERGING history (two branches sharing an ancestor
  // further back, the ordinary shape a merge base takes) from returning
  // that shared ancestor twice once it is reachable from more than one
  // still-pending frontier entry. See plugins/git/cursor.go for the full
  // argument and the exactly-once proof this pair of lists makes possible
  // against arbitrary graph shapes, not merely a linear chain.
  //
  // Cursor is untrusted input the moment it comes back from outside this
  // task (a caller composes it from a prior response, or an attacker
  // guesses at one) - so every element of both lists is required to be a
  // full, 40-character lowercase hex commit sha, and nothing else: not a
  // branch, not a tag, not "HEAD~5", not a short sha. A revision expression
  // is exactly the ambiguity ref already owns; accepting one here would let
  // a "cursor" quietly become a second ref field with different
  // validation, inviting the two to be confused with each other. The total
  // number of shas across both lists is bounded (see maxCursorEntries in
  // plugins/git/validate.go) - a cursor naming more than this task will
  // ever track is refused outright, the same as one shaped wrong in any
  // other way. Resuming re-validates everything a fresh call would - the
  // same url validation, the same egress policy - and re-fetches (see
  // plugins/git/log.go's own resumeCloneDepthSteps for why a resume may
  // clone more than once, at increasing depth, before giving up) rather
  // than trusting anything about what state a prior call left behind - a
  // cursor names a position in history, never a bypass around any check
  // the original query performs.
  //
  // Cursor and ref are mutually exclusive: a resumed call names cursor
  // alone, never both, since cursor already carries everything ref would
  // have named - this task refuses a call that sets both, rather than
  // silently choosing one.
  string cursor = 8;
}

// LogOutputs is a bounded slice of history.
message LogOutputs {
  // Commits are the entries found, most recent first, capped at max_commits
  // and at maxTotalLogMessageBytes, whichever this call's history hits
  // first.
  repeated Commit commits = 1;

  // ResolvedRef is the exact commit ref named, as a full sha - what a
  // relative ref like "main" or "HEAD~3" actually meant at the moment this
  // ran. Empty on a cursor-driven (resumed) call: once a walk has advanced
  // past its first page, there is no longer one single ref this call
  // resolved - see LogInputs.cursor's own doc comment for what a resumed
  // call tracks instead (a frontier, not a single position), and read the
  // first page's own ResolvedRef for the walk's origin if it matters to
  // the caller.
  string resolved_ref = 2;

  // Truncated reports whether more matching history existed beyond what was
  // returned - by max_commits, by the total message-byte budget, by the
  // shallow window this task cloned, or because resuming further would need
  // a cursor bigger than this task will ever track (see NextCursor) - so a
  // workflow can tell "this is all of it" from "this is as much as this
  // call reached."
  bool truncated = 3;

  // NextCursor is the resume position for the next page, populated exactly
  // when Truncated is true, Commits is non-empty, and this task can still
  // prove there is somewhere left to resume from and afford to encode it
  // (see LogInputs.cursor for what it packs, and cursor.go for the
  // "exactly once against a merge" argument this whole redesign exists
  // for). Empty whenever Truncated is false, since there is nothing left
  // to resume.
  //
  // Also empty in two narrower cases, both still honestly reported as
  // Truncated: true because there genuinely was more this call could not
  // finish describing, just not with a resumable position attached -
  //
  //   - the shallow-boundary case (see Truncated's own doc comment): this
  //     call reached its own fetch window's edge before finding even one
  //     matching commit, so there is no position to hand back at all. A
  //     caller in that position has to widen the window itself (name an
  //     explicit ref, or raise max_commits) rather than page past it.
  //   - the cursor-size ceiling (maxCursorEntries, plugins/git/validate.go):
  //     more history remains, but encoding everywhere left to resume from
  //     would need more commits than this task will ever track in one
  //     cursor. A caller in this position has to narrow the walk (path,
  //     since) so fewer pages are needed to reach the same history, or
  //     accept this page as the practical end of what this call can walk.
  //
  // NextCursor is real commit shas, not a token this task invents from
  // nothing - fed back as LogInputs.cursor, it resumes the identical walk
  // (same repository, same filters) exactly where this call stopped,
  // dropping nothing and repeating nothing. It is still opaque to a
  // workflow in every other sense: nothing about its shape or contents is
  // meant to be parsed or reasoned about beyond "pass it back as cursor."
  string next_cursor = 4;
}

// ReadFileInputs asks for one file's content at one ref - the audit
// counterpart to LogInputs: git.log finds which commit last touched a path
// and who did it; git.read_file reads what is there now (or at any other
// ref).
message ReadFileInputs {
  // Url is the repository to read, https:// only.
  string url = 1;

  // Ref is the branch, tag, or commit-ish to read path at. Empty means the
  // remote's default branch (its HEAD).
  string ref = 2;

  // Path is the file's path within the tree at ref - relative, never
  // absolute, never containing a ".." segment or a ".git" path segment (see
  // validateTreePath, shared with git.commit_push's own path checks).
  // Refused outright rather than sanitised when it does not meet that
  // shape.
  string path = 3;

  // Token is a secret reference for HTTPS authentication. See
  // LogInputs.token.
  flowstate.v1.Value token = 4;

  // Username is the HTTP Basic-auth username paired with token - see
  // LsRemoteInputs.username.
  string username = 5;
}

// ReadFileOutputs is one file's content at one ref.
message ReadFileOutputs {
  // Content is the file's raw bytes, bounded (see maxReadFileBytes) and
  // never truncated: a file over the bound is refused with a diagnostic
  // naming its actual size, because a truncated file that looks whole is
  // worse than a refusal a workflow author can act on.
  bytes content = 1;

  // Size is the file's actual size in bytes, from the blob's own object
  // header - reported even though Content never truncates, so a workflow
  // can log or reason about a file's size without decoding Content itself.
  int64 size = 2;

  // Mode is the tree entry's git mode, in git's own zero-padded octal
  // format ("0100644" regular, "0100755" executable, "0120000" symlink) -
  // see plumbing/filemode.FileMode.String.
  string mode = 3;

  // Binary reports whether this task's own heuristic (a NUL byte within the
  // first bytesToSniffForBinary bytes, the same heuristic git itself uses)
  // judged the content binary - advisory, not authoritative: a file with no
  // NUL in that window is reported as text even if it is not, and Content
  // always carries the file's real bytes either way.
  bool binary = 4;
}

// CommitPushOutputs is the result of one write.
message CommitPushOutputs {
  // Sha is the commit this invocation created (or, when landed_previously is
  // true, the commit an earlier attempt already created) - the content a
  // later step should bind to, rather than re-reading `branch` and trusting
  // it has not moved again since.
  string sha = 1;

  // LandedPreviously is true when this invocation made no new push because
  // the intended change was already present - either as a commit the remote
  // branch already carried (the exact same sha, when Timestamp made the
  // commit deterministic, or a different sha with the same parent, tree,
  // and message otherwise - see doc.go, "The idempotency trick"), or
  // because the tree this call would have produced already matches
  // base_ref's own tree (see doc.go, "Content-level idempotency," and
  // Changed below) - the case a movable base_ref (a branch name, most
  // commonly) reaches after an earlier attempt's push went unacknowledged:
  // base_ref itself resolves past that attempt's own commit, so nothing
  // about resolving it again reveals that anything happened, and the
  // signal has to come from the tree instead.
  bool landed_previously = 2;

  // Changed reports whether this call's inputs, applied to base_ref,
  // actually produce a tree different from base_ref's own - false for both
  // a retry that a movable base_ref silently absorbed and an ordinary
  // no-op call whose files/patch describe content base_ref already has.
  // Both are the same well-defined case: nothing to commit, so nothing was
  // pushed, and sha is base_ref's own resolved commit rather than a newly
  // created one. True whenever a real change did land, whether by this call
  // or (landed_previously) an earlier one.
  bool changed = 3;
}
