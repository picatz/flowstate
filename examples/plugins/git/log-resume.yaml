edition: v2026.2
name: git-log-resume
description: Reads a repository's commit history in two bounded pages using git.log's cursor input - the resume shape issue #216 asks every bounded list task to grow. Runs with no arguments.

# git.log truncates rather than serializing an unbounded response (see
# plugins/git/README.md, "Operational scale"), and reports that honestly as
# `truncated: true`. Before `next_cursor` existed, that boolean was a dead
# end: a caller who received page one of a longer history had no way to ask
# for page two. This file demonstrates the fix - `next_cursor` in, `cursor`
# out - for exactly one resume:
#
#   page one:  git.log(max_commits: 3)              -> truncated: true, next_cursor: <sha>
#   page two:  git.log(max_commits: 3, cursor: <sha>) -> continues one commit past page one
#
# `cursor` resumes at the PARENT of the sha it names, never the sha itself -
# see plugins/git/proto/git/v1/git.proto, LogInputs.cursor, for the exact
# contract: page one's last commit and page two's first commit are adjacent,
# distinct commits, never the same one twice.
#
# What this file deliberately does NOT show: walking to exhaustion. Doing
# that for real means looping - fetching page after page until
# `truncated: false` - and Flowstate's own workflow language has no loop
# primitive yet (issue #157 is still design-only; issue #216 names this gap
# explicitly as "layer 2," the harder half of the fix this file's layer-1
# half unblocks). Two fixed steps, page one then page two, is what today's
# language can express; a workflow that pages an unbounded history to
# completion needs #157 first. The exhaustive-walk test that proves cursor
# semantics are actually correct - every commit reached, exactly once,
# across as many pages as it takes - lives in Go instead, at
# TestGitLogCursorPagesReachEveryCommitExactlyOnce
# (plugins/git/log_test.go), which is free to loop because it is not
# written in the DSL.

vars:
  repo: https://github.com/octocat/Hello-World.git

steps:
  - id: page_one
    git.log:
      url: ${vars.repo}
      max_commits: 2
      # No ref, no cursor: this is a fresh walk from the remote's default
      # branch.

  - id: page_two
    git.log:
      url: ${vars.repo}
      max_commits: 2
      cursor: ${steps.page_one.next_cursor}
      # Empty when page_one was not truncated (this task always populates
      # next_cursor empty in that case - see LogOutputs.next_cursor's own
      # doc comment) - git.log then treats an empty cursor exactly like an
      # ordinary fresh call with no ref, which the "not truncated" case
      # having nothing left to resume makes the right fallback rather than
      # an error.

  - id: announce
    log:
      message: "${'page one: %d commits (truncated=%s); page two: %d commits (truncated=%s), resumed at %s'.format([steps.page_one.commits.size(), string(steps.page_one.truncated), steps.page_two.commits.size(), string(steps.page_two.truncated), steps.page_one.next_cursor])}"

outputs:
  page_one_shas:
    value: ${steps.page_one.commits.map(c, c.sha)}
    description: the first page's commits, most recent first

  page_two_shas:
    value: ${steps.page_two.commits.map(c, c.sha)}
    description: the second page's commits - continuing immediately after page_one's last entry, never repeating it

  resumed_from:
    value: ${steps.page_one.next_cursor}
    description: the cursor page_two was resumed from - page_one's own oldest reached sha, empty if page_one was not truncated
