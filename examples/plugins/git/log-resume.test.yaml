edition: v2026.4

# Proves page two is called with the cursor page one returned, and that the
# commits on the two pages are distinct, with no network and without the git
# plugin installed. The page_two stub only matches the exact cursor, so a
# workflow that dropped or rewrote it would match nothing.
tests:
  - name: resumes page two from the cursor page one returned
    workflow: ./log-resume.yaml
    stubs:
      - step: page_one
        returns:
          commits:
            - sha: aaa1
              message: second commit
              parent_hashes: [aaa0]
              author: {name: Ada Lovelace, email: ada@example.com, when: "2026-03-04T12:00:00Z"}
              committer: {name: Ada Lovelace, email: ada@example.com, when: "2026-03-04T12:00:00Z"}
            - sha: aaa0
              message: first commit
              parent_hashes: []
              author: {name: Ada Lovelace, email: ada@example.com, when: "2026-03-03T12:00:00Z"}
              committer: {name: Ada Lovelace, email: ada@example.com, when: "2026-03-03T12:00:00Z"}
          truncated: true
          next_cursor: cursor-after-aaa0
      - task: git.log
        where: "inputs.cursor == 'cursor-after-aaa0'"
        returns:
          commits:
            - sha: aab9
              message: zeroth commit
              parent_hashes: []
              author: {name: Ada Lovelace, email: ada@example.com, when: "2026-03-02T12:00:00Z"}
              committer: {name: Ada Lovelace, email: ada@example.com, when: "2026-03-02T12:00:00Z"}
          truncated: false
      - step: announce
        returns: {}
    expect:
      ran: [page_one, page_two, announce]
      outputs:
        page_one_shas: [aaa1, aaa0]
        page_two_shas: [aab9]
        resumed_from: cursor-after-aaa0
