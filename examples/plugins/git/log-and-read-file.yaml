edition: v2026.3
name: git-log-and-read-file
description: Audits one file in a public repository - who last changed it, what every commit that touched it said, and what it contained at that exact commit - using the "git" plugin's read tier (git.log, git.read_file). Runs with no arguments.

# git.log and git.read_file are this plugin's read/audit tier - the
# exploratory half of what git.* provides, alongside git.ls_remote (refs, no
# clone) and the one write task, git.commit_push. Both clone the repository
# themselves, inside the one activity that runs the step, and return
# content - commit metadata, a file's bytes - never a path into a workspace a
# later step could read. See plugins/git/doc.go, "why there is no vcs.clone"
# in the sibling plugins/vcs (the same reasoning applies here), for the
# argument; it is a security decision, not a missing feature.
#
# This file is the audit shape a security engineer (or an agent doing the
# same job) actually reaches for: git.log answers "who touched this path,
# and what did they say about it" without ever writing to the repository;
# git.read_file answers "what did it contain at that commit." Together they
# are the read-only half of the review a human would otherwise do with `git
# log -- <path>` followed by `git show <sha>:<path>` - except this plugin
# fetches only the window each call actually needs (see
# plugins/git/validate.go, readFileCloneDepth and fetchDepthForMaxCommits),
# never a full clone, which is what makes both tasks safe to point at a
# repository whose full history is too large to ever clone completely.
#
# git.read_file's ref here is not left unset: it is bound to the exact sha
# git.log just found, which is the audit chain this file exists to
# demonstrate - "what did the commit that last touched this path actually
# leave behind," not merely "what is there today," which a later,
# unrelated change to the same path could have already overwritten. Binding
# to that historical sha rather than the tip is exactly why git.read_file
# deepens its own clone beyond readFileCloneDepth (1) whenever a caller
# names a ref at all (see read_file.go's own doc comment on doReadFile) -
# without that, this chain would fail the moment the sha sat behind more
# than a single fetched commit.

vars:
  repo: https://github.com/octocat/Hello-World.git
  path: README

steps:
  - id: history
    git.log:
      url: ${vars.repo}
      path: ${vars.path}
      max_commits: 5
      # No ref: means "the remote's default branch" - the same default
      # git.ls_remote's own examples leave unnamed. No token: this
      # repository is public; see ls-remote-private.yaml for the one field
      # that changes against a private one, unchanged for this task too.

  # The commit git.log named, bound once. Six reads of `commits[0]` - the
  # ref below, three fields in the log line, and two outputs - are six places
  # a later edit could pick a different element by accident, so the element
  # gets a name (docs/STYLE.md R5, `flow lint`).
  - id: last_commit
    value: ${steps.history.commits[0]}

  - id: content
    git.read_file:
      url: ${vars.repo}
      path: ${vars.path}
      ref: ${steps.last_commit.value.sha}
      # ref bound to git.log's own most-recent-touching commit - the audit
      # chain: read exactly what that commit left behind, not whatever the
      # default branch's tip happens to hold by the time this step runs.

  - id: announce
    log:
      message: "${'%s at %s - last touched by %s in %s (\"%s\"), %d bytes there'.format([vars.path, vars.repo, steps.last_commit.value.author.name, steps.last_commit.value.sha, steps.last_commit.value.message, steps.content.size])}"

outputs:
  last_editor:
    value: ${steps.last_commit.value.author.name}
    description: who git.log says touched this path most recently - the author line, unverified, since anyone with push access controls what it says

  last_touch_sha:
    value: ${steps.last_commit.value.sha}
    description: the commit this task binds to, rather than a branch name a later force-push could move

  history_size:
    value: ${steps.history.commits.size()}
    description: how many of this path's commits git.log found, capped at max_commits (see LogOutputs.truncated for whether more exist)

  current_content:
    value: ${steps.content.content}
    description: the file's exact bytes at last_touch_sha, read by git.read_file bound to the commit git.log itself found - not necessarily the default branch's tip today

  current_is_binary:
    value: ${steps.content.binary}
    description: git.read_file's own NUL-byte heuristic - false here, since README is plain text
