edition: v2026.2
name: git-ls-remote-private
description: Reads a private repository's branch refs using the "git" plugin's git.ls_remote task - the exact same task as workflow.yaml, with one more field filled in. Requires inputs; never runs by accident.

# This is workflow.yaml's own step, unchanged, against a repository this
# plugin cannot read without a credential - proof that "public" and
# "private" are not two tasks, or two schemas, or two code paths in this
# plugin: they are the same git.ls_remote call, and the only thing that
# tells them apart is whether `token:` is set. A workflow author moving a
# read from a public mirror to a private fork changes one field, not one
# task for another.
#
# Written with required `inputs:` rather than a hard-coded url, the same
# reason commit-push.yaml is: examples/README.md's rule is that an example
# runs with no arguments unless its subject *is* a required input, and this
# one's subject is a credential a public example cannot assume every reader
# has. See commit-push.yaml and plugins/git/README.md, "Authentication," for
# the secret's shape - this task's token input takes exactly the same kind
# of reference, ${secret('git:name')}, that commit-push.yaml's does.

inputs:
  url:
    type: string
    required: true
    description: "the private repository to read, e.g. https://github.com/your-org/your-private-repo.git"

steps:
  - id: refs
    git.ls_remote:
      url: ${inputs.url}
      prefix: "refs/heads/"
      # A secret reference, resolved inside the task, never a literal - the
      # only line that differs from workflow.yaml's own call to this same
      # task. See plugins/git/README.md, "Authentication," for what
      # GIT_SECRET_<NAME> this resolves to, and "Which git server?" for why
      # the same shape (an HTTPS Basic-auth password) works unchanged across
      # every provider this plugin has been asked to work with.
      token: ${secret('git:token')}

outputs:
  branch_count:
    value: ${steps.refs.refs.size()}
    description: how many branch refs this private repository currently advertises - reachable at all only because token authenticated the request
