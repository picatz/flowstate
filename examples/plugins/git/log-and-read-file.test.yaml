edition: v2026.4

# Proves the file is read at the commit git.log found, not at a branch a later push
# could move, in CI with no network and without the git plugin installed. The
# read_file stub selects its call by the sha the log stub returned first, so a
# workflow that read at HEAD or at the branch name would match nothing.
tests:
  - name: reads the file at the exact commit that last touched it
    workflow: ./log-and-read-file.yaml
    stubs:
      - task: git.log
        where: "inputs.path == 'README' && inputs.max_commits == 5"
        returns:
          commits:
            - sha: 7fd1a60b01f91b314f59955a4e4d4e80aaaaaaaa
              message: Edit README
              parent_hashes: [b1946ac92492d2347c6235b4d2611184bbbbbbbb]
              author: {name: The Octocat, email: octocat@github.com, when: "2012-03-06T15:06:50Z"}
              committer: {name: The Octocat, email: octocat@github.com, when: "2012-03-06T15:06:50Z"}
            - sha: b1946ac92492d2347c6235b4d2611184bbbbbbbb
              message: Initial commit
              parent_hashes: []
              author: {name: Mona Lisa, email: mona@github.com, when: "2011-01-26T19:01:12Z"}
              committer: {name: Mona Lisa, email: mona@github.com, when: "2011-01-26T19:01:12Z"}
          truncated: false
      - task: git.read_file
        where: "inputs.ref == '7fd1a60b01f91b314f59955a4e4d4e80aaaaaaaa' && inputs.path == 'README'"
        returns:
          content: "Hello World!\n"
          size: 13
          mode: "100644"
          binary: false
      - step: announce
        returns: {}
    expect:
      ran: [history, last_commit, content, announce]
      outputs:
        last_editor: The Octocat
        last_touch_sha: 7fd1a60b01f91b314f59955a4e4d4e80aaaaaaaa
        history_size: 2
        current_content: "Hello World!\n"
        current_is_binary: false
