edition: v2026.3
name: git-ls-remote
description: Reads a public repository's branch refs using the "git" plugin's git.ls_remote task - the one read task this example runs by default, with no credential and no clone.

# git.ls_remote is one of two tasks the "git" plugin provides; the other,
# git.commit_push, writes a commit and needs a credential and real inputs -
# see commit-push.yaml and the README before running that half.
#
# The dot in "git.ls_remote" is what marks this as a plugin task rather than
# a built-in: no built-in task has one. The engine has never compiled
# git.v1.LsRemoteInputs; it learns the shape from descriptors this plugin
# ships in its manifest at launch. See plugins/git for the source and
# plugins/git/README.md for what git.commit_push does and why it lives in a
# separate file.
#
# This file is the public half of a pair with ls-remote-private.yaml, in the
# same directory: same task, same inputs, the only difference is one field.
# Reading a private repository is never a different task or a richer
# schema - it is this exact call with `token:` filled in.
vars:
  repo: https://github.com/octocat/Hello-World.git
steps:
  - id: refs
    git.ls_remote:
      prefix: refs/heads/
      # No token: this repository is public, so its refs are readable
      # unauthenticated - the only thing that changes for a private one is
      # this one field. See ls-remote-private.yaml for the identical call
      # with `token:` filled in, and commit-push.yaml for the one task in
      # this plugin where a token is not optional at all: writing always
      # needs a credential, because no forge accepts an anonymous push.
      url: ${vars.repo}

  # The ref this file goes on to name, bound once rather than indexed at each
  # of the three places that read a field off it (docs/STYLE.md R5,
  # `flow lint`).
  - id: first_branch
    value: ${steps.refs.refs[0]}
  - id: announce
    log:
      message: ${"%s - %d branch refs found, including %s at %s".format([vars.repo, steps.refs.refs.size(), steps.first_branch.value.name, steps.first_branch.value.sha])}
outputs:
  branch_count:
    value: ${steps.refs.refs.size()}
    description: how many branch refs this repository currently advertises
  first_branch_sha:
    value: ${steps.first_branch.value.sha}
    description: the content this task binds to, rather than a name a later force-push could move
