edition: v2026.3
name: slack-approval-notification
description: Posts an approval request to Slack, waits durably for the separately verified Flowstate signal, then keeps the recorded outcome in the same Slack thread.
inputs:
  channel:
    type: string
    required: true
    description: stable Slack conversation ID, not a channel name
    example: C123APPROVAL
  request_message_key:
    type: string
    required: true
    description: UUID chosen once for this approval request and reused unchanged only for the same logical message
    example: 018f0e6c-7b42-7cc1-8a31-65c0f8758f4a
    must: this.matches(r'^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
  outcome_message_key:
    type: string
    required: true
    description: distinct UUID chosen once for this approval outcome notification
    example: 018f0e6c-80aa-7550-972a-7bc69716cc3b
    must: this.matches(r'^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
  change:
    type: string
    required: true
    description: bounded human-readable change being approved
    example: deploy api v1.4.2 to production
    must: size(this) > 0 && size(this) <= 1000
  expected_approver:
    type: string
    required: true
    description: attested subject allowed to answer the Flowstate signal
    example: sre-lead@example.com
signals:
  change-approved:
    allow:
      - subject: ${"https://issuer.example.com#" + inputs.expected_approver}
        claims:
          team: release-managers
    distinct_from_starter: true
steps:
  - id: notify
    slack.post:
      channel: ${inputs.channel}
      message_key: ${inputs.request_message_key}
      text: '${"Approval required: %s. Use Flowstate signal change-approved; Slack interactions are not an authorization channel.".format([inputs.change])}'
      # The whole credential input is a secret reference. The host resolves it
      # under the run's namespace; literals are refused before durable history.
      token: ${secret('env:SLACK_BOT_TOKEN')}
  - id: approval
    wait_for_signal:
      name: change-approved
      prompt: ${"Approve %s?".format([inputs.change])}
      timeout: 24h
      outputs:
        approved: ${payload.?approved.orValue(false)}
        timed_out: ${timed_out}
  - id: approval_decision
    value: '${steps.approval.approved ? "approved" : "refused"}'
  - id: outcome
    value: '${steps.approval.timed_out ? "timed_out" : steps.approval_decision.value}'
  - id: outcome_text
    value: '${{"timed_out": "Approval timed out.", "approved": "Approval granted.", "refused": "Approval refused."}[steps.outcome.value]}'
  - id: report
    slack.post:
      channel: ${steps.notify.channel}
      message_key: ${inputs.outcome_message_key}
      text: ${steps.outcome_text.value}
      thread_ts: ${steps.notify.ts}
      token: ${secret('env:SLACK_BOT_TOKEN')}
outputs:
  approved:
    value: ${steps.approval.approved && !steps.approval.timed_out}
    description: true only after the server admitted an attested, authorized signal
  request_message_ts:
    value: ${steps.notify.ts}
    description: Slack timestamp anchoring the approval notification thread
