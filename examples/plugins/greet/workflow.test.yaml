edition: v2026.3

# Proves the workflow sends the plugin's task what its README describes, in CI
# with no plugin binary: the token travels as a secret the worker resolves before
# the call, and the stubbed call is selected on the name and greeting the workflow
# chose. The plugin itself is exercised for real by the tests beside it.
tests:
  - name: greets the named person with the configured greeting
    workflow: ./workflow.yaml
    secrets:
      env:GREET_TOKEN: not-a-real-token
    stubs:
      - task: example.greet
        where: "inputs.name == 'world' && inputs.greeting == 'Hello'"
        returns:
          message: Hello, world!
          length: 13
          authenticated: true
      - step: announce
        returns: {}
    expect:
      ran: [hello, announce]
