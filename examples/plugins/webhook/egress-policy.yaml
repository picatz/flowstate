# The operator's half of `sender.yaml`: the one receiver this deployment may
# deliver to, and a rule that a signed delivery (a credential, as far as policy
# is concerned) goes nowhere else. Pass it to the worker with
# `--egress-policy`; the plugin obeys it on its own connection, and a
# destination it denies is never dialed.
egress:
  schemes: [https]
  allow:
    - host == "flowstate.peer.example.com" && port == 443
  deny:
    - credentials && host != "flowstate.peer.example.com"
  allow_ports: [443]
  max_response_bytes: 64KiB
  min_tls_version: "1.2"
