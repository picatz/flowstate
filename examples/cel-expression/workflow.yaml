name: cel-demo
steps:
  - id: greet
    echo:
      message: hello
  - id: modify
    cel:
      expr: "regex.replace(vars.greeting.upperAscii(), 'HELLO', 'HI')"
      vars:
        greeting: ${steps.greet.result}


  # One dialect: this condition reaches the same string functions the `cel` step
  # above does, with nothing declaring them. It used to be `no such overload` —
  # a condition was evaluated without extension libraries while a `cel` step beside
  # it could name its own, and a condition has no key to name anything with.
  - id: shout
    if: ${steps.modify.result.startsWith('HI')}
    echo:
      message: ${steps.modify.result.lowerAscii()}
