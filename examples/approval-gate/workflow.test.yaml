# `flow test` checks a scripted signal's optional `sender:` against this
# workflow's `signals:` policy through the same `v1.SignalPolicyCheck`
# `FlowstateServer.Signal` calls (#207 slice 2) — the seam that makes it safe
# for `deploy`'s own `if:` to trust `signals:` for authorization rather than
# restate it: a scripted signal with no `sender:`, or one that does not
# satisfy the policy, is refused before it ever reaches the waiting step,
# exactly as a durable one would be. That is what makes the first case below
# possible at all — this file's own history is the reason it did not use to
# exist: before local delivery enforced policy, no case here could reach
# `deploy`, because a scripted signal always looked unattested and the old
# `if:` gated on attestation directly. Now the gate is `signals:`'s job, and
# `flow test` enforces it the same way production does.
edition: v2026.2
tests:
  - name: "a sender satisfying signals: deploys"
    workflow: ./workflow.yaml
    inputs:
      version: v1.4.2
      environment: production
      expected_approver: sre-lead@example.com
    signals:
      - name: deploy-approved
        payload:
          approved: true
        sender:
          subject: sre-lead@example.com
          issuer: https://issuer.example.com
          claims:
            team: release-managers
    stubs:
      - task: log
        returns: {}
    expect:
      ran: [request, settle, approval, deploy]
      skipped: [rejected, expired]
      outputs:
        decision: deployed
        approver_subject: sre-lead@example.com

  - name: "an approved payload from a sender signals: refuses never reaches the gate"
    workflow: ./workflow.yaml
    inputs:
      version: v1.4.2
      environment: production
      expected_approver: sre-lead@example.com
    signals:
      - name: deploy-approved
        payload:
          approved: true
        sender:
          # Satisfies the claim, but not the narrowed subject this run
          # named — signals: refuses it before it is ever delivered, so
          # the wait simply times out, the same as nobody answering at all.
          subject: someone-else@example.com
          issuer: https://issuer.example.com
          claims:
            team: release-managers
    stubs:
      - task: log
        returns: {}
    expect:
      ran: [request, settle, approval, expired]
      skipped: [deploy, rejected]
      outputs:
        decision: expired
        approver_subject: ""

  - name: an approved payload is still refused without an attested sender
    workflow: ./workflow.yaml
    inputs:
      version: v1.4.2
      environment: production
      expected_approver: sre-lead@example.com
    signals:
      - name: deploy-approved
        payload:
          approved: true
    stubs:
      - task: log
        returns: {}
    expect:
      ran: [request, settle, approval, expired]
      skipped: [deploy, rejected]
      outputs:
        decision: expired
        approver_subject: ""

  - name: an explicit rejection is honored
    workflow: ./workflow.yaml
    inputs:
      version: v1.4.2
      environment: production
      expected_approver: sre-lead@example.com
    signals:
      - name: deploy-approved
        payload:
          approved: false
        sender:
          subject: sre-lead@example.com
          issuer: https://issuer.example.com
          claims:
            team: release-managers
    stubs:
      - task: log
        returns: {}
    expect:
      ran: [request, settle, approval, rejected]
      skipped: [deploy, expired]
      outputs:
        decision: rejected
        approver_subject: ""

  - name: nobody answers, and the gate lapses at its own timeout
    workflow: ./workflow.yaml
    inputs:
      version: v1.4.2
      environment: production
      expected_approver: sre-lead@example.com
    stubs:
      - task: log
        returns: {}
    expect:
      ran: [request, settle, approval, expired]
      skipped: [deploy, rejected]
      outputs:
        decision: expired
        approver_subject: ""

  - name: a version that is not semver is refused before the first step runs
    workflow: ./workflow.yaml
    inputs:
      version: latest
      environment: production
      expected_approver: sre-lead@example.com
    stubs:
      - task: log
        returns: {}
    expect:
      failed: true
      error_contains: 'must satisfy'

  - name: an environment outside the known set is refused before the first step runs
    workflow: ./workflow.yaml
    inputs:
      version: v1.4.2
      environment: prod-typo
      expected_approver: sre-lead@example.com
    stubs:
      - task: log
        returns: {}
    expect:
      failed: true
      error_contains: 'must satisfy'
