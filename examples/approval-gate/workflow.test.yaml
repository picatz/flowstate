# `flow test` checks a scripted signal's optional `sender:` against this
# workflow's `signals:` policy through the same `v1.SignalPolicyCheck`
# `FlowstateServer.Signal` calls (#207 slice 2) — the seam that makes it safe
# for `deploy`'s own `if:` to trust `signals:` for authorization rather than
# restate it: a scripted signal with no `sender:`, or one that does not
# satisfy the policy, is refused before it ever reaches the waiting step,
# exactly as a durable one would be. That is what makes the first case below
# possible at all — this file's own history is the reason it did not use to
# exist: before local delivery enforced policy, no case here could reach
# `deploy`, because a scripted signal always looked unattested and the old
# `if:` gated on attestation directly. Now the gate is `signals:`'s job, and
# `flow test` enforces it the same way production does.
#
# A case says who its run *starts* as with `starter:` (#344 slice 3), the way
# `flow run local --as-subject` says it on the command line, and that is what
# makes the last clause of this workflow's policy testable at all:
# `distinct_from_starter: true` compares the scripted `sender:` against it, so
# the separation of duties this gate promises is exercised in both directions
# below - the approver this run named is admitted, and that same approver is
# refused the moment they are also the person who asked for the deploy. Every
# other case here names no `starter:` and so runs as nobody, which is what
# every case did before the field existed: nobody is distinct from everybody,
# so the clause has nothing to refuse.
#
# What `starter:` does not do is make the run look attested. It reaches the
# signal policy and nothing else: `run.identity.subject` still reads empty and
# `run.local` still reads true, exactly as they do under `flow run local`, so
# the `request` step's own log line here still names "an unattested caller".
# The scripted `sender:` is the same kind of assertion - it stands in for an
# approver, and the gate's `sender.local` output reads true to say so, which
# is why `deploy`'s `if:` may never gate on attestation itself.
edition: v2026.3
defaults:
  # Every case ships the same build to the same environment and expects the
  # same approver; only two failure cases override a single field. Stated once
  # here, overridden per case where it differs.
  inputs:
    version: v1.4.2
    environment: production
    expected_approver: sre-lead@example.com
  # The approver most cases name. A case that names its own `sender:` overrides
  # this (explicit beats inherited); the "without an attested sender" case opts
  # out with an explicit empty `sender: {}`, which is refused exactly as an
  # omitted one was before defaults existed.
  sender:
    subject: sre-lead@example.com
    issuer: https://issuer.example.com
    claims:
      team: release-managers
  stubs:
    - task: log
      returns: {}
tests:
  - name: "a sender satisfying signals: deploys"
    workflow: ./workflow.yaml
    signals:
      - name: deploy-approved
        payload:
          approved: true
    expect:
      ran: [request, settle, approval, deploy]
      others: skipped
      outputs:
        decision: deployed
        approver_subject: sre-lead@example.com

  # The pair `distinct_from_starter: true` exists for, and the reason this
  # file needs a `starter:` to state it: the two cases differ in exactly one
  # value - who started the run - and nothing else. The approver, the claim,
  # the payload and the inputs are identical.
  - name: a distinct starter admits the approver this run named
    workflow: ./workflow.yaml
    starter:
      subject: release-requester@example.com
      issuer: https://issuer.example.com
    signals:
      - name: deploy-approved
        payload:
          approved: true
    expect:
      ran: [request, settle, approval, deploy]
      others: skipped
      outputs:
        decision: deployed
        approver_subject: sre-lead@example.com

  # Refused for being the run's own starter, not for anything about the
  # payload: the sender satisfies the rule's `subject:` and its `claims:`
  # exactly, which is the point - `distinct_from_starter:` is the one clause a
  # correctly-claimed, correctly-named approver still cannot get past. The
  # signal never reaches the step, so the gate lapses at its own timeout and
  # the run reports `expired`, the same answer nobody answering at all
  # produces. That is what production does too: `FlowstateServer.Signal`
  # refuses with PermissionDenied and the workflow is never told anything was
  # sent.
  - name: the starter cannot approve their own deploy
    workflow: ./workflow.yaml
    starter:
      subject: sre-lead@example.com
      issuer: https://issuer.example.com
    signals:
      - name: deploy-approved
        payload:
          approved: true
    expect:
      ran: [request, settle, approval, expired]
      others: skipped
      outputs:
        decision: expired
        approver_subject: ""

  # The same starter, refused for a different reason and from the other side:
  # an approver who is distinct from the starter but is not the one this run
  # named. Distinctness is a clause of the policy, never the whole of it.
  - name: a distinct approver the run did not name is still refused
    workflow: ./workflow.yaml
    starter:
      subject: release-requester@example.com
      issuer: https://issuer.example.com
    signals:
      - name: deploy-approved
        payload:
          approved: true
        sender:
          subject: someone-else@example.com
          issuer: https://issuer.example.com
          claims:
            team: release-managers
    expect:
      ran: [request, settle, approval, expired]
      others: skipped
      outputs:
        decision: expired
        approver_subject: ""

  - name: "an approved payload from a sender signals: refuses never reaches the gate"
    workflow: ./workflow.yaml
    signals:
      - name: deploy-approved
        payload:
          approved: true
        sender:
          # Satisfies the claim, but not the narrowed subject this run
          # named — signals: refuses it before it is ever delivered, so
          # the wait simply times out, the same as nobody answering at all.
          subject: someone-else@example.com
          issuer: https://issuer.example.com
          claims:
            team: release-managers
    expect:
      ran: [request, settle, approval, expired]
      others: skipped
      outputs:
        decision: expired
        approver_subject: ""

  - name: an approved payload is still refused without an attested sender
    workflow: ./workflow.yaml
    signals:
      - name: deploy-approved
        payload:
          approved: true
        # Explicitly no sender: this case is the refusal of an unattested
        # delivery, so it opts out of the inherited default rather than omitting
        # `sender:` and inheriting it.
        sender: {}
    expect:
      ran: [request, settle, approval, expired]
      others: skipped
      outputs:
        decision: expired
        approver_subject: ""

  # The negated branch, which used to be a hand-expanded De Morgan copy of
  # `deploy`'s own `if:` and is now `${steps.approval.outcome == "rejected"}`, an
  # !steps.approval.approved}` — two names this file's gate decides once. The
  # assertion that matters is the pair: the branch that ran and the `decision`
  # output move together, because both read the same recorded output rather
  # than each re-deriving the predicate.
  - name: an explicit rejection is honored
    workflow: ./workflow.yaml
    signals:
      - name: deploy-approved
        payload:
          approved: false
    expect:
      ran: [request, settle, approval, rejected]
      others: skipped
      outputs:
        decision: rejected
        approver_subject: ""

  - name: nobody answers, and the gate lapses at its own timeout
    workflow: ./workflow.yaml
    expect:
      ran: [request, settle, approval, expired]
      others: skipped
      outputs:
        decision: expired
        approver_subject: ""

  - name: a version that is not semver is refused before the first step runs
    workflow: ./workflow.yaml
    inputs: {version: latest}   # overrides only version; the rest come from defaults
    expect:
      failed: true
      error_contains: 'must satisfy'

  - name: an environment outside the known set is refused before the first step runs
    workflow: ./workflow.yaml
    inputs: {environment: prod-typo}   # overrides only environment
    expect:
      failed: true
      error_contains: 'must satisfy'

  # "answered" and "did not time out" are different questions, which is why the
  # gate's `outcome` has three states rather than two. A signal arrived here —
  # so the wait did not time out — carrying no `approved` field at all, which is
  # not a decision. It reports `expired`, exactly as `decision` always did, and
  # now the `expired` branch actually runs: before the gate was named, this
  # input produced an output naming a branch that had been skipped.
  - name: a signal carrying no decision is not a rejection
    workflow: ./workflow.yaml
    signals:
      - name: deploy-approved
        payload:
          note: looking into it
    expect:
      ran: [request, settle, approval, expired]
      others: skipped
      outputs:
        decision: expired
        approver_subject: ""
