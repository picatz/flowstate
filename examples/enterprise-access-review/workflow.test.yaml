# `flow test` now enforces a declared `signals:` policy against a scripted
# signal exactly the way `FlowstateServer.Signal` does (#207 slice 2), through
# the same `v1.SignalPolicyCheck` - so a scripted `attestation-recorded` with
# no `sender:` (or a `sender:` whose claims do not carry `role:
# compliance-reviewer`) is refused before it ever reaches the waiting step,
# not merely delivered-but-unattested the way it used to read. That means the
# gate times out here exactly as it would in production against nobody
# answering - `outcome: expired`, not the `unattested` value this file
# produced before local delivery enforced policy. What these cases prove is
# the shape that does not depend on a real sender: bounded fan-out completing
# (and tolerating one bad grant), and the review correctly refusing to call
# itself closed without one. A case exercising a genuinely attested sender
# would add `sender: {claims: {role: compliance-reviewer}}` to its `signals:`
# entry, the same way `examples/approval-gate/`'s own happy-path case does.
edition: v2026.2
tests:
  - name: evidence is gathered for every grant, but the review times out unattested without a real sender
    workflow: ./workflow.yaml
    inputs:
      access_grants:
        - grantee: alice@example.com
          resource: prod-database
          role: admin
        - grantee: bob@example.com
          resource: billing-console
          role: read-only
      expected_reviewer: compliance-lead@example.com
    signals:
      - name: attestation-recorded
        payload:
          attested: true
    stubs:
      - task: log
        returns: {}
      - task: http
        where: inputs.query.grantee == 'alice@example.com'
        returns:
          grantee: alice@example.com
          resource: prod-database
          role: admin
          last_used_days_ago: 5
      - task: http
        where: inputs.query.grantee == 'bob@example.com'
        returns:
          grantee: bob@example.com
          resource: billing-console
          role: read-only
          last_used_days_ago: 40
    expect:
      ran: [gather_evidence, attestation, unattested]
      skipped: [recorded]
      outputs:
        outcome: expired
        attested_by: ""
        reviewed_grants:
          - grantee: alice@example.com
            resource: prod-database
            role: admin
            last_used_days_ago: 5
          - grantee: bob@example.com
            resource: billing-console
            role: read-only
            last_used_days_ago: 40
        unreachable: []

  - name: a grant whose evidence lookup fails does not stop the rest of the review
    workflow: ./workflow.yaml
    inputs:
      access_grants:
        - grantee: alice@example.com
          resource: prod-database
          role: admin
        - grantee: carol@example.com
          resource: payroll-service
          role: contributor
      expected_reviewer: compliance-lead@example.com
    stubs:
      - task: log
        returns: {}
      - task: http
        where: inputs.query.grantee == 'alice@example.com'
        returns:
          grantee: alice@example.com
          resource: prod-database
          role: admin
          last_used_days_ago: 5
      - task: http
        where: inputs.query.grantee == 'carol@example.com'
        fails:
          kind: Upstream
          message: iam service unavailable
    expect:
      ran: [gather_evidence, attestation, unattested]
      skipped: [recorded]
      outputs:
        outcome: expired
        attested_by: ""
        reviewed_grants:
          - grantee: alice@example.com
            resource: prod-database
            role: admin
            last_used_days_ago: 5
        unreachable: [carol@example.com:payroll-service]

  - name: the same grantee's two grants are tracked separately, not cleared by each other
    workflow: ./workflow.yaml
    inputs:
      access_grants:
        - grantee: alice@example.com
          resource: prod-database
          role: admin
        - grantee: alice@example.com
          resource: billing-console
          role: read-only
      expected_reviewer: compliance-lead@example.com
    stubs:
      - task: log
        returns: {}
      - task: http
        where: inputs.query.grantee == 'alice@example.com' && inputs.query.resource == 'prod-database'
        returns:
          grantee: alice@example.com
          resource: prod-database
          role: admin
          last_used_days_ago: 5
      - task: http
        where: inputs.query.grantee == 'alice@example.com' && inputs.query.resource == 'billing-console'
        fails:
          kind: Upstream
          message: iam service unavailable
    expect:
      ran: [gather_evidence, attestation, unattested]
      skipped: [recorded]
      outputs:
        outcome: expired
        attested_by: ""
        reviewed_grants:
          - grantee: alice@example.com
            resource: prod-database
            role: admin
            last_used_days_ago: 5
        # The bug this case exists to catch: a match on grantee alone would
        # have cleared BOTH of alice's grants the moment the prod-database
        # lookup succeeded, reporting the review complete with the
        # billing-console failure silently dropped.
        unreachable: [alice@example.com:billing-console]

  - name: an empty grant list is refused before the first step runs
    workflow: ./workflow.yaml
    inputs:
      access_grants: []
      expected_reviewer: compliance-lead@example.com
    stubs:
      - task: log
        returns: {}
    expect:
      failed: true
      error_contains: "must have at least"
