# `responder-ack` and `remediation-authorized` both declare a `signals:`
# policy (claims: role), so a scripted delivery now needs a `sender:` naming
# a matching claim to be delivered at all — the same
# `v1.SignalPolicyCheck` `FlowstateServer.Signal` enforces (#207 slice 2).
# `responder-ack` below genuinely reaches `claimed`/`remediation_ack` this
# way. `remediation-authorized`'s own `authorized` step still cannot be
# reached from here, and that is the one honest limit that survives: its
# `if:` also checks `!run.local`, and a local run's own `run.local` is always
# true — see eval.go's own RunWithInputs doc comment — no `sender:` on the
# signal itself changes what the run says about *itself*. What these cases
# prove is the shape that does not depend on that: parallel evidence
# gathering finishing regardless of which page answers, escalation firing
# exactly when the first page lapses and not otherwise, an unclaimed incident
# never reaching a remediation gate it has no business reaching, and even a
# genuinely attested, correctly-claimed remediation signer still being
# refused by a run that cannot attest itself.
edition: v2026.2
tests:
  - name: a promptly claimed incident gathers evidence but cannot record a real authorization here
    workflow: ./workflow.yaml
    inputs:
      incident_id: inc-2026-0142
      service: checkout-api
      severity: sev2
    signals:
      - name: responder-ack
        payload:
          claimed: true
        sender:
          claims:
            role: on-call-responder
      - name: remediation-authorized
        payload:
          authorized: true
        sender:
          subject: incident-commander@example.com
          issuer: https://issuer.example.com
          claims:
            role: incident-commander
    stubs:
      - task: log
        returns: {}
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/logs'
        returns:
          summary: elevated 5xx rate since 14:02
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/metrics'
        returns:
          error_rate: 0.14
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/deploys'
        returns:
          deployed_version: v3.9.1
    expect:
      ran: [page, responder_ack, logs, metrics, recent_deploys, claimed, remediation_ack, refused]
      skipped: [escalate, escalated_ack, authorized]
      outputs:
        outcome: refused
        authorized_by: ""
        escalated: false

  - name: nobody claims the incident even after escalation
    workflow: ./workflow.yaml
    inputs:
      incident_id: inc-2026-0143
      service: checkout-api
      severity: sev1
    stubs:
      - task: log
        returns: {}
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/logs'
        returns:
          summary: no anomaly detected
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/metrics'
        returns:
          error_rate: 0.01
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/deploys'
        returns:
          deployed_version: v3.9.1
    expect:
      ran: [page, responder_ack, logs, metrics, recent_deploys, escalate, escalated_ack]
      skipped: [claimed, remediation_ack, authorized, refused]
      outputs:
        outcome: unclaimed
        authorized_by: ""
        escalated: true

  - name: the first page lapses but the escalation is claimed and evidence still finished
    workflow: ./workflow.yaml
    inputs:
      incident_id: inc-2026-0144
      service: checkout-api
      severity: sev2
    signals:
      - name: responder-ack
        at: 20m
        payload:
          claimed: true
        sender:
          claims:
            role: on-call-responder
    stubs:
      - task: log
        returns: {}
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/logs'
        returns:
          summary: elevated latency since 09:11
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/metrics'
        returns:
          error_rate: 0.06
      - task: http
        where: inputs.url == 'https://observability.internal.example.com/deploys'
        returns:
          deployed_version: v3.9.0
    expect:
      ran: [page, responder_ack, logs, metrics, recent_deploys, escalate, escalated_ack, claimed, remediation_ack]
      skipped: [authorized, refused]
      outputs:
        outcome: claimed_unremediated
        authorized_by: ""
        escalated: true

  - name: an unknown severity is refused before the first step runs
    workflow: ./workflow.yaml
    inputs:
      incident_id: inc-2026-0145
      service: checkout-api
      severity: sev4
    stubs:
      - task: log
        returns: {}
    expect:
      failed: true
      error_contains: "must satisfy"

# `authorized` is the attested-production branch, gated on `!run.local &&
# !steps.remediation_ack.sender.local` (the workflow's own comment notes flow
# test always produces an unattested sender). A local rehearsal is always local,
# so no case here can reach it; it is exercised only against a real server that
# authenticated a separate signer. Recorded so --coverage-required reads it as a
# decision rather than a gap.
coverage:
  allow_unreached:
    authorized: >-
      gated on !run.local && !sender.local; a flow test rehearsal is always
      local, so this attested-production branch is unreachable here by design
      and is exercised only against a real server.
