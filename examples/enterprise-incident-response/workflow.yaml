edition: v2026.2
name: enterprise-incident-response
description: >-
  Pages an on-call responder, gathers evidence from three systems at once
  while waiting, escalates if nobody answers in time, and records who
  actually authorized remediation - never the person who opened the
  incident.

# An incident runbook is not "a script with a sleep in it": it has to page
# someone, keep working while it waits, escalate on its own if the page goes
# unanswered, and end with an accountable decision rather than a chat log
# somebody has to reconstruct afterward. Four primitives, one runbook:
#
#   wait_for_signal + timeout
#                 - the page. `responder_ack` blocks until someone claims the
#                   incident or the deadline passes; unlike enterprise-fund-
#                   transfer's approval gate, being unanswered is not the end
#                   of the runbook - it is the reason `escalate` exists.
#
#   parallel:     - evidence gathering happens *while the page is out*, not
#                   after someone answers it. Logs, metrics, and recent
#                   deploys are independent lookups with nothing to say to
#                   each other, exactly the shape fan-out-and-parallel's own
#                   `checks:` step demonstrates - here it is not filler, it is
#                   the reason a responder who claims the incident already has
#                   something to look at instead of waiting on three more
#                   round trips.
#
#   escalation on timeout
#                 - `escalate` runs only when `responder_ack` lapses, and
#                   `remediation_ack` - the decision that actually matters -
#                   is gated on *either* path answering, so a runbook nobody
#                   claims within the first window does not stall the
#                   incident, it pages wider.
#
#   separation of duties
#                 - `run.identity` is who opened the incident (however this
#                   run was started - a monitoring system's own identity, an
#                   engineer running `flow run`). `steps.remediation_ack.sender`
#                   is who the server attests actually authorized remediation.
#                   `authorized` below refuses the case where they are the
#                   same identity, for the identical reason approval-gate
#                   refuses a deploy approving itself: an incident opener
#                   signing off on their own remediation is not independent
#                   review, it is a rubber stamp with an audit trail attached.
#
# Evidence gathering is `http` against simulated internal endpoints, the same
# choice enterprise-access-review makes and for the same reason - this file
# runs and its test passes without a plugin process. A production version
# would likely reach observability systems through the `http` task against
# real query APIs, exactly as written here, or through provider-specific
# tasks as they land.

inputs:
  incident_id:
    type: string
    required: true
    example: inc-2026-0142
    pattern: "^inc-[0-9-]+$"
    description: the incident this runbook is responding to

  service:
    type: string
    required: true
    example: checkout-api
    description: the service the incident was opened against

  severity:
    type: string
    required: true
    example: sev2
    must: 'this in ["sev1", "sev2", "sev3"]'
    description: initial severity, as declared when the incident was opened

# Two distinct gates, two distinct claims. Anyone on the paging rotation may
# acknowledge that they are looking at it; only someone with the narrower
# `incident-commander` claim may sign off that remediation actually happened
# and is safe to consider done - a real separation of on-call rotation from
# the authority to close an incident out.
signals:
  responder-ack:
    allow:
      - claims:
          role: on-call-responder
  remediation-authorized:
    allow:
      - claims:
          role: incident-commander

steps:
  - id: page
    log:
      level: warn
      message: >-
        ${"%s opened by %s: paging on-call for %s".format(
            [inputs.incident_id,
             run.identity.subject == "" ? "an unattested caller" : run.identity.subject,
             inputs.service])}

  # The page. Fifteen minutes is a real first-response window for a sev2; a
  # sev1 in production would page harder and wait less, which is a policy
  # decision this file leaves to its caller rather than hardcoding - see
  # `severity` above, which a real deployment would read here to pick the
  # timeout, left as a single fixed window in this example for clarity.
  - id: responder_ack
    wait_for_signal:
      name: responder-ack
      timeout: 15m

  # Evidence gathering runs concurrently with nothing waiting on it to start -
  # by the time anyone claims the incident, or by the time it escalates, this
  # has already run. Independent branches with nothing to say to each other,
  # joined before anything below depends on all three having finished.
  - id: evidence
    parallel:
      - steps:
          - id: logs
            continue_on_error: true
            timeout: 10s
            http:
              method: GET
              url: https://observability.internal.example.com/logs
              query:
                service: ${inputs.service}
              parse_json: true
              outputs: '${ {"summary": response.json.summary} }'
      - steps:
          - id: metrics
            continue_on_error: true
            timeout: 10s
            http:
              method: GET
              url: https://observability.internal.example.com/metrics
              query:
                service: ${inputs.service}
              parse_json: true
              outputs: '${ {"error_rate": response.json.error_rate} }'
      - steps:
          - id: recent_deploys
            continue_on_error: true
            timeout: 10s
            http:
              method: GET
              url: https://observability.internal.example.com/deploys
              query:
                service: ${inputs.service}
              parse_json: true
              outputs: '${ {"deployed_version": response.json.deployed_version} }'

  # Nobody claimed it in the first window - a real escalation, paged wider,
  # not a silent timeout somebody has to notice on a dashboard later.
  - id: escalate
    if: ${steps.responder_ack.timed_out}
    log:
      level: error
      message: >-
        ${"%s unacknowledged after 15m; escalating %s".format([inputs.incident_id, inputs.service])}

  # The wider page. Only reached on the escalation path, so an incident that
  # was claimed promptly never opens a second gate it does not need.
  - id: escalated_ack
    if: ${steps.responder_ack.timed_out}
    wait_for_signal:
      name: responder-ack
      timeout: 30m

  # Whether *someone* answered the page - not attestation, on purpose. This is
  # evidence for a human reading the run, not the remediation decision itself
  # (`remediation_ack` below), so it does not gate on `sender.local`/
  # `run.local` the way that step's own `authorized` has to: it shares
  # exactly one question with `remediation_ack`'s own `if:` - did somebody
  # answer in the first window or the escalation - and asks it the same way.
  - id: claimed
    if: >-
      ${(!steps.responder_ack.timed_out) || (steps.responder_ack.timed_out && !steps.escalated_ack.timed_out)}
    log:
      message: ${inputs.incident_id + " claimed"}

  # The decision that matters: authorized remediation, gated on the attested
  # signer being a real, separate identity from whoever opened the incident.
  - id: remediation_ack
    if: >-
      ${(!steps.responder_ack.timed_out) || (steps.responder_ack.timed_out && !steps.escalated_ack.timed_out)}
    wait_for_signal:
      name: remediation-authorized
      timeout: 1h

  - id: authorized
    if: >-
      ${((!steps.responder_ack.timed_out) || (steps.responder_ack.timed_out && !steps.escalated_ack.timed_out)) &&
        has(steps.remediation_ack.payload.authorized) && steps.remediation_ack.payload.authorized &&
        !steps.remediation_ack.sender.local && !run.local &&
        steps.remediation_ack.sender.identity.subject != "" &&
        !(steps.remediation_ack.sender.identity.subject == run.identity.subject &&
          steps.remediation_ack.sender.identity.issuer == run.identity.issuer)}
    log:
      message: >-
        ${"remediation for %s authorized by %s".format(
            [inputs.incident_id, steps.remediation_ack.sender.identity.subject])}

  # Anything that reached this gate and did not qualify as a real, separate
  # authorization - an explicit "no", an unattested sender (the case `flow
  # test` itself always produces, since it has no authenticated caller), or
  # the incident's own opener signing off on their own remediation. One
  # bucket rather than three, unlike approval-gate's own three-way split of
  # the identical shape - see docs/USE_CASES.md for that honest gap.
  - id: refused
    if: >-
      ${((!steps.responder_ack.timed_out) || (steps.responder_ack.timed_out && !steps.escalated_ack.timed_out)) &&
        !steps.remediation_ack.timed_out &&
        !(has(steps.remediation_ack.payload.authorized) && steps.remediation_ack.payload.authorized &&
          !steps.remediation_ack.sender.local && !run.local &&
          steps.remediation_ack.sender.identity.subject != "" &&
          !(steps.remediation_ack.sender.identity.subject == run.identity.subject &&
            steps.remediation_ack.sender.identity.issuer == run.identity.issuer))}
    log:
      level: warn
      message: >-
        ${"remediation for %s was not authorized by a real, separate signer".format([inputs.incident_id])}

outputs:
  outcome:
    value: >-
      ${(steps.responder_ack.timed_out && steps.escalated_ack.timed_out)
        ? "unclaimed"
        : (has(steps.remediation_ack.payload.authorized) && steps.remediation_ack.payload.authorized &&
            !steps.remediation_ack.sender.local && !run.local &&
            steps.remediation_ack.sender.identity.subject != "" &&
            !(steps.remediation_ack.sender.identity.subject == run.identity.subject &&
              steps.remediation_ack.sender.identity.issuer == run.identity.issuer))
          ? "remediated"
          : (steps.remediation_ack.timed_out
              ? "claimed_unremediated"
              : "refused")}
    description: how this incident's runbook ended

  authorized_by:
    value: >-
      ${(!(steps.responder_ack.timed_out && steps.escalated_ack.timed_out) &&
          has(steps.remediation_ack.payload.authorized) && steps.remediation_ack.payload.authorized &&
          !steps.remediation_ack.sender.local && !run.local &&
          steps.remediation_ack.sender.identity.subject != "" &&
          !(steps.remediation_ack.sender.identity.subject == run.identity.subject &&
            steps.remediation_ack.sender.identity.issuer == run.identity.issuer))
        ? steps.remediation_ack.sender.identity.subject
        : ""}
    description: >-
      who the server attests authorized remediation, empty unless it
      genuinely was authorized by someone other than whoever opened the
      incident

  escalated:
    value: ${steps.responder_ack.timed_out}
    description: whether the first page went unanswered and this runbook escalated
