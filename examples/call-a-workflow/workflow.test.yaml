# `flow test` runs a `call:` for real — the callee's own steps execute through
# the same local driver, in the same process, exactly as `flow run local` on
# this file already does — and stubs the TASKS inside it, which is what makes
# testing a composition different from testing either workflow alone (#155).
#
# `log` is the only task either file uses, so stubbing it here changes nothing
# observable — the point of this file is to demonstrate the reach, not to
# replace a task whose real behavior would otherwise make the test slow or
# unreliable. A workflow whose callee makes a real network request would stub
# that task exactly the same way: one `stubs:` entry, matched by task name,
# answered wherever the call reaches it.
edition: v2026.2
defaults:
  stubs:
    - task: log
      returns: {}
tests:
  - name: provisioning a tenant announces where it landed
    workflow: ./workflow.yaml
    stubs:
      # Answers every `log:` step this run reaches — three inside the callee
      # (one per region, plus its own "provisioning ..." line) and one in this
      # file — because `log` produces no outputs for any of them to differ on.
    expect:
      ran: [provision, announce]
      outputs:
        # The point of this file is reading a callee's outputs back — `outputs:
        # {}` here would assert nothing about the one value this example exists
        # to demonstrate reading.
        tenant_url: https://acme.internal.example.com
