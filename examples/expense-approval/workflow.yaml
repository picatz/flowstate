edition: v2026.3
name: expense-approval
description: >-
  An expense report waits for a manager's sign-off, and escalates to finance
  ops instead of sitting forever if the manager never answers.

# `approval-gate` shows one gate, answered or not. A real approval chain is
# rarely one person: a manager who does not respond in time is not the end of
# the request, it is the reason someone else gets asked. That is the shape
# here — two gates, the second reached only if the first lapses — and the
# whole thing survives however long it takes, across as many worker restarts
# as happen in between, because neither wait holds a process open. A cron job
# polling "has anyone approved this yet" would have to persist that question
# itself and re-derive who to ask next on every tick; here the engine already
# knows, because the wait *is* the state.
#
# Both timeouts below are seconds, not the days a real policy would use, so
# this is something to run rather than something to stare at. `employee:` and
# `amount:` are required — there is no sensible default for either, per the
# `inputs:` block below — so every invocation names the inputs.json beside
# this file, the same way `parameterized-deploy` names `service:`:
#
#   flow run local examples/expense-approval/workflow.yaml --input-file examples/expense-approval/inputs.json
#
# Nobody answers there, so both gates lapse and the report ends up denied —
# the fail-closed default for a request nobody ever acted on. Answer the first
# gate to see the ordinary path:
#
#   flow run local examples/expense-approval/workflow.yaml --input-file examples/expense-approval/inputs.json \
#     --signal manager-approved='{"approved": true}'
#
# Or let the manager gate lapse and answer the escalation instead, to see the
# path that only exists because of the timeout:
#
#   flow run local examples/expense-approval/workflow.yaml --input-file examples/expense-approval/inputs.json \
#     --signal finance-approved='{"approved": true}'
#
# `flow run local` accepts every `--signal` up front, so supplying an answer to
# a gate this run never reaches is harmless — the shape of a real deployment,
# where a manager and a finance approver could both be handed the means to
# answer before either wait starts.
#
# Notice neither `--signal` above says who is answering. That is deliberate: who
# approved a gate is `steps.<gate>.sender`, attested by the server from the
# authenticated caller that sent the signal — never something the payload gets to
# claim. This is also what makes separation of duties expressible, the property
# an expense policy actually needs: a rule like
# `steps.manager_review.sender.identity.subject != inputs.employee` would refuse
# letting someone approve their own report, and it is unwritable from a
# self-asserted payload field.

inputs:
  # No default: there is no sensible absent value for "who is asking", only a
  # plausible one to paste — which is what `example:` is for. `sensitive: true`
  # is display etiquette rather than containment (see the field's own doc
  # comment): this value is an ordinary part of the run's history like any
  # other input, and anyone with history access reads it in the clear. What
  # changes is that `flow get` and the TUI redact it by default.
  employee:
    type: string
    required: true
    example: jordan@example.com
    sensitive: true
    must: this.matches(r'^[^@]+@[^@]+$')
    description: who filed the expense report
  amount:
    type: float
    required: true
    example: 482.50
    sensitive: true
    must: this >= 0.0
    description: the amount being claimed, in USD

steps:
  - id: submit
    log:
      message: >-
        ${"%s filed an expense report for $%.2f".format([inputs.employee, inputs.amount])}

  # The first gate. Seconds here so the example finishes; the number a real
  # policy would write is hours, and nothing else about the file changes to
  # get there.
  - id: manager_review
    wait_for_signal:
      name: manager-approved
      timeout: 4s
      outputs:
        # What the manager said, shaped ONCE here on the step that produced it,
        # the way approval-gate shapes its gate. "manager approved" used to be
        # written five times below - in `reimburse`'s `if:` and its log line,
        # in `outcome`, in `approved_by`, and hand-negated in `deny`'s `if:` -
        # and nothing kept those copies in agreement except review. Every
        # reader now compares this recorded name.
        #
        # Four states, because "answered" is not one thing: a payload can carry
        # `approved: true`, `approved: false`, or neither, and a gate can lapse.
        # `no_decision` (answered without an `approved` field, not a timeout) is
        # kept distinct so it takes no branch, exactly as the raw predicates did.
        #
        # `payload.?approved` is an optional select, read the way approval-gate's
        # own gate is: present-and-true or present-and-false when the manager
        # actually sent the field, absent when they answered with something
        # else entirely. `.optMap` only ever sees an actual boolean; `.orValue`
        # supplies the case nothing was sent to decide.
        outcome: >-
          ${timed_out
            ? "expired"
            : payload.?approved.optMap(approved, approved ? "approved" : "rejected").orValue("no_decision")}
        # Re-exposed because `outputs:` replaces what the wait produced:
        # `escalate` and `finance_review` still branch on `timed_out`, and
        # `reimburse`'s log line and `approved_by` still name the sender.
        timed_out: ${timed_out}
        sender: ${sender}

  # The escalation is a real step, not a comment saying one should exist —
  # this is the difference between "escalates" and "eventually times out
  # silently". A person reading a log of this run sees a report that was
  # asked about twice, not a report that vanished.
  - id: escalate
    if: ${steps.manager_review.timed_out}
    log:
      level: warn
      message: >-
        ${"manager did not respond in time; escalating %s's report to finance ops".format([inputs.employee])}

  # The second gate only exists on the path where the first one lapsed — an
  # approved or explicitly rejected report has nothing left to escalate, and
  # `if:` is what keeps this step from running on that path at all.
  - id: finance_review
    if: ${steps.manager_review.timed_out}
    wait_for_signal:
      name: finance-approved
      timeout: 3s
      outputs:
        # The finance gate, shaped the same way as the manager gate above and
        # for the same reason: "finance approved" was re-derived in `reimburse`,
        # `outcome`, and hand-negated in `deny`. Only ever read on the path
        # where the manager gate lapsed, so a reader always guards it with
        # `steps.manager_review.outcome == "expired"` first, the same short
        # circuit the raw predicates used.
        outcome: >-
          ${timed_out
            ? "expired"
            : payload.?approved.optMap(approved, approved ? "approved" : "rejected").orValue("no_decision")}
        # Re-exposed for `reimburse`'s log line and `approved_by`.
        sender: ${sender}

  # The two gates named once, the same lesson approval-gate's own `decision`
  # applies: "which of the four endings this report reached" was computed
  # three times below - in `reimburse`'s `if:`, hand-negated across `deny`'s,
  # and re-derived a third time in each of the two `outputs:`. Every reader
  # now reads this one recorded value instead.
  #
  # Split into two `value:` steps rather than one three-deep ternary, per the
  # style charter's nesting-depth rule - and, since #674, without losing what
  # a decomposed discriminant used to cost silently: `switch:` below dispatches
  # on `steps.outcome.value`, and the exhaustiveness and impossible-case
  # diagnostics that gives it read straight through the `steps.escalation_outcome.value`
  # leaf to the step that produced it, so a misspelled case in `settle` is
  # still fatal even though the value it dispatches on is two steps away from
  # the ternary that computes it.
  #
  # `escalation_outcome` only runs, and is only read, on the path where the
  # manager gate expired - the same short circuit `finance_review` itself
  # uses, now stated once as an `if:` instead of folded into every read of
  # `steps.finance_review.outcome`.
  - id: escalation_outcome
    if: ${steps.manager_review.timed_out}
    value: >-
      ${steps.finance_review.outcome == "approved"  ? "approved_after_escalation"
        : steps.finance_review.outcome == "expired" ? "denied_no_response"
        : "denied"}

  - id: outcome
    value: >-
      ${steps.manager_review.outcome == "approved"  ? "approved_by_manager"
        : steps.manager_review.outcome == "expired" ? steps.escalation_outcome.value
        : "denied"}

  # One switch over the named outcome, rather than two `if:`-guarded steps
  # each re-testing the manager and finance gates by hand. Two explicit cases
  # for the two ways the report is approved - the log line differs by which
  # gate actually said yes - and a `default:` for the two ways it is not,
  # which `deny` below reports as one fact the same way it always has: the
  # money does not move, whichever of the reasons `outcome` names caused it.
  - id: settle
    switch:
      value: ${steps.outcome.value}
      cases:
        - case: approved_by_manager
          steps:
            - id: reimburse
              log:
                message: >-
                  ${"reimbursing %s $%.2f, approved by %s".format(
                      [inputs.employee, inputs.amount, steps.manager_review.sender.identity.subject])}
        - case: approved_after_escalation
          steps:
            - id: reimburse_escalated
              log:
                message: >-
                  ${"reimbursing %s $%.2f, approved by finance (%s) after the manager did not respond".format(
                      [inputs.employee, inputs.amount, steps.finance_review.sender.identity.subject])}
      default:
        steps:
          - id: deny
            log:
              level: warn
              message: ${"%s's expense report was not approved".format([inputs.employee])}

outputs:
  # Deliberately more detailed than "approved: bool" — a caller reading this
  # after the fact (a payroll job, an auditor) needs to know *which* gate
  # decided it, and "denied_no_response" is a materially different fact from
  # "denied" for anyone deciding whether to ask again.
  #
  # This can no longer disagree with the branch `settle` took, in the same
  # strong sense approval-gate's own `decision` output cannot: it reads
  # `steps.outcome.value` directly, the exact name `settle` dispatches on,
  # rather than re-deriving the four endings a second time.
  outcome:
    value: ${steps.outcome.value}
    description: which gate decided the report, or why neither did
  amount:
    value: ${inputs.amount}
    description: the amount this run decided about
  approved_by:
    value: >-
      ${steps.outcome.value == "approved_by_manager"
        ? steps.manager_review.sender.identity.subject
        : steps.outcome.value == "approved_after_escalation"
          ? steps.finance_review.sender.identity.subject
          : ""}
    description: >-
      who the server attested approved this, empty when nobody did — never a
      payload field, which is a claim rather than an attestation
