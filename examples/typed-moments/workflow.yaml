# `timestamp`, `duration` and `bytes` — the kinds CEL treats as primitives,
# declared as an input's `type:` like any other.
#
# Without them a deadline is a `string` and every expression that reads it wraps
# it in `timestamp(...)`, and a `must:` cannot say "after 2026" about text. A
# declared `timestamp` is bound once, at submit, as the timestamp an expression
# reads, so `inputs.opens + inputs.window` is time arithmetic and `must:` binds
# `this` to the same type.
#
# They travel as text, because that is what a command line, a JSON file and an
# MCP argument can carry: an RFC 3339 timestamp (`2026-03-01T09:00:00Z`), a
# duration written the way Go writes one (`90m`, `5400s`, `1h30m`), and standard
# padded base64 for bytes. Text that is not one is refused where the input is
# bound, without repeating what was sent.
#
# The kinds also work wherever a type is written: a field of a record
# (`types:`), the elements of a `list(timestamp)`, and an output's `type:`. A rule
# across a record's fields compares times, not text, and a typed output is
# reported in the run document as the same text a caller would submit.
#
#   flow run local examples/typed-moments/workflow.yaml \
#       --input opens=2026-03-01T09:00:00Z --input window=36h
edition: v2026.4
name: typed-moments
types:
  Booking:
    description: A reserved span of time.
    must: this.ends > this.starts
    fields:
      starts:
        type: timestamp
        required: true
      ends:
        type: timestamp
        required: true
inputs:
  booking:
    type: Booking
    default:
      starts: 2026-03-01T09:30:00Z
      ends: 2026-03-01T10:00:00Z
    description: a reservation inside the window
  reminders:
    type: list(timestamp)
    default:
      - 2026-03-01T08:00:00Z
    description: moments to remind at
  opens:
    type: timestamp
    default: 2026-03-01T09:00:00Z
    description: when the window opens
    must: this.getFullYear() >= 2026
  window:
    type: duration
    default: 2h
    description: how long it stays open
    must: this > duration("0s")
  seal:
    type: bytes
    default: aGk=
    description: a token that travels with the window, as base64
    must: size(this) > 0
steps:
  - id: closing
    value: ${inputs.opens + inputs.window}
  - id: announce
    log:
      message: ${"opens %s, closes %s, sealed with %d byte(s)".format([string(inputs.opens), string(steps.closing.value), size(inputs.seal)])}
outputs:
  closes:
    value: ${string(steps.closing.value)}
    type: string
    description: when the window closes, as an RFC 3339 timestamp
  closes_at:
    value: ${steps.closing.value}
    type: timestamp
    description: when the window closes, as the timestamp it is
  booked_for:
    value: ${inputs.booking.ends - inputs.booking.starts}
    type: duration
    description: how long the reservation lasts
  first_reminder:
    value: ${inputs.reminders[0]}
    type: timestamp
    description: the earliest reminder, as the timestamp it is
