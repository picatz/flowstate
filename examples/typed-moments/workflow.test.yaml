# The three kinds are bound as the values an expression reads, so the first case
# is time arithmetic over declared defaults, and the others are what each kind
# refuses: text that is not one, and a value its own `must:` rejects.
edition: v2026.4
defaults:
  workflow: ./workflow.yaml
  stubs:
    - task: log
      returns: {}
tests:
  - name: the defaults add a duration to a timestamp
    expect:
      ran: [closing, announce]
      outputs:
        closes: "2026-03-01T11:00:00Z"
        booked_for: 30m0s
        first_reminder: "2026-03-01T08:00:00Z"

  - name: supplied text is bound as a timestamp and a duration
    inputs:
      opens: "2026-06-30T23:00:00+02:00"
      window: 36h
    expect:
      ran: [closing, announce]
      outputs:
        closes: "2026-07-02T09:00:00Z"
        booked_for: 30m0s
        first_reminder: "2026-03-01T08:00:00Z"

  - name: text that is not a timestamp is refused
    inputs:
      opens: next tuesday
    expect:
      failed: true
      error_contains: 'input "opens" is declared timestamp but was given a value that is not an RFC 3339 timestamp'

  - name: a duration with no unit is refused
    inputs:
      window: "90"
    expect:
      failed: true
      error_contains: "is not a duration such as 90m or 5400s"

  - name: bytes that are not base64 are refused
    inputs:
      seal: "not base64!"
    expect:
      failed: true
      error_contains: "is not standard base64 text"

  - name: a timestamp the must rejects is refused with its own spelling
    inputs:
      opens: "2025-01-01T00:00:00Z"
    expect:
      failed: true
      error_contains: "got 2025-01-01T00:00:00Z"

  - name: a record field is bound as a timestamp, so the rule compares times
    inputs:
      booking:
        starts: "2026-03-01T10:00:00+02:00"
        ends: "2026-03-01T09:30:00Z"
    expect:
      ran: [closing, announce]
      outputs:
        closes: "2026-03-01T11:00:00Z"
        booked_for: 1h30m0s
        first_reminder: "2026-03-01T08:00:00Z"

  - name: a reservation that ends before it starts is refused by the type's rule
    inputs:
      booking:
        starts: "2026-03-01T10:00:00Z"
        ends: "2026-03-01T09:00:00Z"
    expect:
      failed: true
      error_contains: "the record Booking must satisfy `this.ends > this.starts`"

  - name: a record field that is not a timestamp is refused with its path
    inputs:
      booking:
        starts: soon
        ends: "2026-03-01T09:00:00Z"
    expect:
      failed: true
      error_contains: "is not an RFC 3339 timestamp such as 2026-01-01T00:00:00Z at .starts"

  - name: a list element that is not a timestamp is refused with its index
    inputs:
      reminders: ["2026-03-01T08:00:00Z", later]
    expect:
      failed: true
      error_contains: "at [1]"
