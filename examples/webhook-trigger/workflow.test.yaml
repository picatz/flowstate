# Replaying a stored delivery is what turns a trigger's argument mapping into a
# unit test rather than the one part of a workflow debuggable only in production.
#
# No network and nothing to run: `trigger:` points at a delivery on disk, and the
# `with:` expressions are evaluated by the same function a live receiver will call,
# against the same CEL cost limit, and bound through the same `BindRunInputs` a
# submit uses. So a mapping that reaches a field the payload does not carry fails
# here, in seconds, instead of at three in the morning.
#
# The verification outcome is *computed* where a case supplies the material, and
# declared where it does not. The first case binds the `verify:` key under
# `secrets:`, so the outcome comes from the same arithmetic the served receiver
# runs, over the fixture's exact `body` bytes — which is also the cost this
# example carries on purpose: editing testdata/stripe-charge.json means
# re-signing it with the fixture key, and the failure message says so. The
# signed timestamp is pinned to `flow test`'s own clock epoch (2020-01-01T00:00Z),
# so the fixture verifies identically forever. The third case is the reason the
# arithmetic is worth running offline: a captured delivery with an edited body
# still carries a genuine-looking signature, and only the arithmetic refuses it.
#
# The second case is the keyless rehearsal: with no keys bound,
# `signature: invalid` declares "this delivery did not verify" and asserts what
# Flowstate does about it — an unverifiable delivery is refused, never allowed on
# the grounds that it could not be checked. Binding the keys *and* declaring
# `signature:` is refused outright, because a declaration that could contradict
# the arithmetic is one fact written down twice.
edition: v2026.3
defaults:
  stubs:
    - task: log
      returns: {}
tests:
  - name: a stripe delivery verifies against the bound key and starts a run
    workflow: ./workflow.yaml
    secrets:
      "env:STRIPE_WEBHOOK_SECRET": whsec_example_fixture_key
    trigger:
      webhook: stripe
      payload: ./testdata/stripe-charge.json
    expect:
      # What the delivery mapped to, in both directions: an input this does not
      # name is reported too, so adding an input and forgetting this call site
      # fails here rather than passing quietly around the new one.
      inputs:
        order_id: ord_H1x9
        amount: 4200

      # The key the delivery is deduped by. Worth asserting rather than trusting:
      # an expression reaching the wrong header is wrong in the direction nothing
      # else notices — every delivery gets its own key, or every delivery gets the
      # same one, and both look like working software until a retry happens.
      idempotency_key: t=1577836800,v1=922efac97598f75c6c3e565e26a204ecd6b14d3af19d66a8c0d183aa081f1797

      # The run those inputs produced, asserted like any other case's.
      ran: [record]
      outputs:
        order: ord_H1x9
        amount: 4200

  - name: an unverifiable delivery is refused, and no run happens
    workflow: ./workflow.yaml
    trigger:
      webhook: stripe
      payload: ./testdata/stripe-charge.json
      signature: invalid
    expect:
      # Not `failed: true`: a refused delivery does not produce a failed run, it
      # produces no run. That is the point of deciding verification before
      # anything the delivery chose is evaluated.
      refused: true

  - name: a forged delivery fails the arithmetic and starts nothing
    workflow: ./workflow.yaml
    secrets:
      "env:STRIPE_WEBHOOK_SECRET": whsec_example_fixture_key
    trigger:
      webhook: stripe
      # The genuine fixture with its body edited and its signature left alone —
      # the capture-and-edit shape signature verification exists to refuse. No
      # `signature:` line anywhere: the refusal is computed, not declared.
      payload: ./testdata/stripe-charge-forged.json
    expect:
      refused: true
