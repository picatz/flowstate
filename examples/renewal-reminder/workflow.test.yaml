# The one idea this file pins is the inversion: a lapsed wait is the *working*
# branch and a delivered signal is the stop. So every case says both how many
# times the periodic work ran and what ended it — either number alone is
# satisfied by a loop that got the polarity backwards.
#
# A month-long `timeout:` is testable at all because `flow test` runs on a
# virtual clock ([v1.VirtualClock]): the run parks on its deadline, the
# scripted signals park on theirs, and time jumps to whichever is nearest. No
# case here waits a real second.
#
# Each reminder's stub matches on `sent`, the loop's own carried state, rather
# than on a literal message. That is the assertion that ties the work to the
# iteration it belongs to — `remind` renders the period number from `sent + 1`,
# so a stub demanding those two agree fails the day the carried counter and the
# thing it counts come apart. A `log` invocation matching no stub fails the
# case, so these also bound the work from above: no case below carries a
# catch-all `log` stub, and a reminder that went out when none was due has
# nothing to match.
#
# # `at:` names a period, so the cases below name theirs
#
# Every `at:` here is read against the same virtual clock the workflow's own
# `timeout:` is, so which period a signal lands in is arithmetic anyone can do
# from the file: the billing period is 720h, so 800h is the second period and
# 2000h is the third. A signal scripted past a period's deadline is not
# deliverable in that period — the wait lapses, sends its reminder, and goes
# round again — and it waits, queued, for whichever later period the clock
# reaches its moment in.
#
# This did not always hold, and the case named for the third period below is
# the one that would not have. Until #278 the local driver's timed wait handed
# its clock participation to a helper goroutine for the duration and took it
# back afterwards, and in that window a scripted signal was the clock's only
# participant — so the clock advanced straight to it and every `at:` past the
# first deadline collapsed onto the first lapse. `at: 721h` and `at: 3000h`
# produced the identical run. Two of the cases below now differ only in that
# number, which is the whole of the proof that it means something.
edition: v2026.3
tests:
  - name: a deadline lapses, the reminder goes out, and the renewal that follows stops the loop
    workflow: ./workflow.yaml
    signals:
      # 800h is eighty hours into the second billing period, so the first
      # period lapses and sends its reminder and the customer acts during the
      # second. The next case is this one with a bigger number and nothing
      # else changed.
      - name: subscription-changed
        at: 800h
        payload:
          decision: renewed
    stubs:
      - task: log
        where: inputs.message == "watching acme's subscription for a renewal decision"
        returns: {}
      # `sent` is the loop's carried state, in scope for this step because a
      # stub sees the scope its step was evaluated in. On the one iteration
      # that reaches `remind`, `sent` is still 0 and the reminder calls itself
      # number 1 — and there is no catch-all `log` stub, so a second reminder
      # would arrive here unmatched and fail the case rather than passing.
      - task: log
        where: "inputs.message == 'reminder %d for acme: the subscription renews soon'.format([sent + 1])"
        returns: {}
    expect:
      # Not `failed: true`. A lapsed wait is an ordinary branch here, exactly as
      # it is in `wait-timeout` — the difference is that this file loops back
      # round on it instead of carrying on past it.
      #
      # No `skipped:` entry either: `remind` lives in the loop body, so it never
      # appears in a top-level list however many times it ran. What proves the
      # closing iteration skipped it is the stub bound above.
      ran: [opened, reminders]
      outputs:
        # One reminder for one lapsed period, and the loop stopped on the
        # iteration it was answered — `update:` never runs on that one, which
        # is why this is 1 and not 2.
        reminders_sent: 1
        decision: renewed

  - name: two billing periods go by with their reminders before the customer renews in the third
    workflow: ./workflow.yaml
    # This is the shape the example exists for, and the one the file could not
    # express before #278: several reminder periods elapse, *then* the customer
    # acts. It differs from the case above in one number.
    signals:
      # 2000h is 560 hours into the third billing period (the deadlines are at
      # 720h and 1440h). Both of those lapse and send their reminders; the
      # third period's wait is the one this answers.
      - name: subscription-changed
        at: 2000h
        payload:
          decision: renewed
    stubs:
      - task: log
        where: inputs.message == "watching acme's subscription for a renewal decision"
        returns: {}
      # One stub for both reminders, and it has to hold for each: `sent` is 0
      # on the first and 1 on the second, so the messages differ and both must
      # agree with the counter their own iteration carried. There is no
      # catch-all `log` stub, so a third reminder — which is what a signal that
      # collapsed onto the wrong period would prevent, and what a loop that
      # reminded on its closing iteration would add — arrives here unmatched
      # and fails the case.
      - task: log
        where: "inputs.message == 'reminder %d for acme: the subscription renews soon'.format([sent + 1])"
        returns: {}
    expect:
      ran: [opened, reminders]
      outputs:
        # Two, exactly: not one (the whole of the old defect) and not three
        # (the closing iteration skips `remind` and never reaches `update:`).
        # Asserted as a number rather than a bound because the bound is the
        # point — a case that said "at least one" is satisfied by the run this
        # one exists to keep out.
        reminders_sent: 2
        decision: renewed

  - name: a customer who cancels before the first deadline is never reminded at all
    workflow: ./workflow.yaml
    signals:
      # No `at:`, so this is delivered at the epoch: the very first wait is
      # answered rather than lapsing, and the periodic work never happens once.
      - name: subscription-changed
        payload:
          decision: cancelled
    stubs:
      - task: log
        where: inputs.message == "watching acme's subscription for a renewal decision"
        returns: {}
      # Deliberately no reminder stub. This is the negative direction, and it
      # is the case that would catch the polarity being reversed: a `remind`
      # that fired on the iteration it was told to stop would arrive as a `log`
      # invocation matching nothing and fail here, rather than quietly chasing
      # a customer who has already cancelled.
    expect:
      ran: [opened, reminders]
      outputs:
        reminders_sent: 0
        decision: cancelled

  - name: nobody ever answers, so every period does the work and the budget runs out
    workflow: ./workflow.yaml
    # No `signals:` at all, which is what makes this the multi-period case: all
    # twelve deadlines lapse, each one sends its own reminder and goes round
    # again, and the loop then reaches `max_iterations:` with `until:` still
    # false.
    #
    # That is a failed run rather than a completed one, and the failure is the
    # point. A loop whose stop condition is "somebody acted" has no honest way
    # to finish on its own, so reporting eleven reminders and a green run would
    # mean a customer silently stopped being chased with nobody deciding they
    # should be.
    stubs:
      - task: log
        where: inputs.message == "watching acme's subscription for a renewal decision"
        returns: {}
      # One stub for all twelve reminders, and it has to hold for every one of
      # them: each invocation must agree with the `sent` its own iteration
      # carried. A loop that stopped advancing the counter, or that sent two
      # reminders in one period, produces a message this cannot match — and
      # with no catch-all stub, that is a failure.
      - task: log
        where: "inputs.message == 'reminder %d for acme: the subscription renews soon'.format([sent + 1])"
        returns: {}
    expect:
      failed: true
      error_contains: "ran its full budget of 12 iterations"
