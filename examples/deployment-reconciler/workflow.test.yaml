# A cluster, scripted. Every case here stubs `observed` with an answer keyed on
# `goal.passes` — the pass counter the loop carries — so the control plane can
# report one thing on the first pass and something else after this reconciler
# wrote to it. That keying is the whole trick, and it is available because a
# stub's `where:` is evaluated in the scope of the step it replaces, which
# inside a loop body includes the loop's own bare binding.
#
# What each case is actually holding this file to:
#
#   * that convergence is decided by what was *observed*, not by what a signal
#     said — the first case never sends a signal until it is time to retire;
#   * that a spec change mid-interval is picked up on the following pass, from
#     the observed side, and the written value is the new desired count;
#   * that a converged workload is not written to, which is the difference
#     between a reconciler and a cron job that POSTs every thirty seconds;
#   * that a `retired: true` buffered before the first pass ends the run with no
#     scale at all — the ordering fix (finding #1); and
#   * that an out-of-range or wrong-type replica count carried by a signal is
#     ignored rather than POSTed or allowed to crash the run (finding #4).
#
# The waits are 30s each and the whole file runs in milliseconds: `flow test`
# runs on a virtual clock, so the resync intervals cost nothing here and the
# signals below arrive at real offsets within them.
edition: v2026.3

# `log` answers with nothing, for every case: the opening line is for a person
# reading the run and no assertion here is about it.
defaults:
  stubs:
    - task: log
      returns: {}

tests:
  - name: drift nobody announced is found by the resync interval and corrected
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 5
    signals:
      # The only signal in this case, and it arrives after two resync intervals
      # have already lapsed — so the two passes that did the work were driven by
      # the clock and by the observation, with nothing having told this run
      # anything at all. That is the level-triggered claim, stated as a run.
      - name: spec-changed
        at: 70s
        payload:
          retired: true
    stubs:
      # Pass 0: two replicas where five are wanted. Nobody announced this — a
      # node was lost, or somebody scaled by hand.
      - step: observed
        where: goal.passes == 0
        returns:
          replicas: 2
      # Every later pass: the cluster now reports what this reconciler last
      # asked for. An expression rather than a literal, so it stays true when
      # the desired count changes in the case below.
      - step: observed
        returns:
          replicas: ${goal.desired}
      - step: converge
        returns:
          accepted: true
    expect:
      ran: [opened, reconcile, observations]
      outputs:
        # Two reconcile passes: correct the drift, then observe the correction.
        # The third pass consumed the retirement and reconciled nothing.
        passes: 2
        # Exactly one of them wrote. The second observed a converged workload
        # and did nothing, which is the steady state.
        passes_that_acted: 1
        final_desired_replicas: 5
        final_observed_replicas: 5

  - name: a spec change raises the desired count and the next pass converges on it
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 5
    signals:
      # Inside the first resync interval: this run is asleep on a 30s timer and
      # the announcement wakes it early. What the payload carries is the new
      # desired state — which the same pass still checks against the world
      # rather than acting on directly.
      - name: spec-changed
        at: 10s
        payload:
          desired_replicas: 7
      - name: spec-changed
        at: 45s
        payload:
          retired: true
    stubs:
      # Pass 0 observes the pre-change count of 5 while carrying the new desired
      # of 7, so it writes. Every later pass observes the 7 it asked for.
      - step: observed
        where: goal.passes == 0
        returns:
          replicas: 5
      - step: observed
        returns:
          replicas: ${goal.desired}
      - step: converge
        returns:
          accepted: true
    expect:
      ran: [opened, reconcile, observations]
      outputs:
        passes: 2
        # Only the pass that received the change and saw drift wrote.
        passes_that_acted: 1
        final_desired_replicas: 7
        final_observed_replicas: 7

  - name: a workload that already matches its spec is never written to
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 3
    signals:
      - name: spec-changed
        at: 40s
        payload:
          retired: true
    stubs:
      - step: observed
        returns:
          replicas: ${goal.desired}
      # Declared and deliberately never matched: a stub for a step that is
      # supposed to stay skipped is how this case says so. If `converge` ever
      # ran here, `passes_that_acted` below would say 1 — the stub is here so
      # that a run which did reach it fails on the assertion rather than on a
      # missing stub, which is a much less legible way to be told the same
      # thing.
      - step: converge
        returns:
          accepted: true
    expect:
      ran: [opened, reconcile, observations]
      skipped: [converge]
      outputs:
        passes: 1
        passes_that_acted: 0
        final_desired_replicas: 3
        final_observed_replicas: 3

  - name: a retirement buffered before the first pass ends the run with no scale
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 5
    # Delivered at the very start, so it is buffered and the first `pace`
    # consumes it before anything is observed. Against the old observe-first
    # ordering this workload (2 replicas, 5 desired) would have been scaled one
    # last time on its way out — finding #1. It must not be now: `observed`,
    # `drift`, and `converge` are all skipped, and the run ends having touched
    # nothing.
    signals:
      - name: spec-changed
        at: 0s
        payload:
          retired: true
    # No `observed` or `converge` stub on purpose: reaching either would be the
    # bug, and with no stub the case fails loudly ("no stub for ...") rather than
    # quietly — belt to the `skipped:` assertion's braces.
    expect:
      ran: [opened, reconcile, observations]
      skipped: [observed, drift, converge]
      outputs:
        passes: 0
        passes_that_acted: 0
        final_desired_replicas: 5
        # -1 is the sentinel for "retired before observing anything", which is
        # exactly what happened.
        final_observed_replicas: -1

  - name: an out-of-range replica count carried by a signal is ignored, not POSTed
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 5
    signals:
      # Zero is outside the (0, 100] range the input constraint enforces, and a
      # signal is an untrusted input the constraint never saw. Adopting it would
      # carry 0 into the next pass and POST a scale-to-zero; instead the current
      # count is kept and nothing drifts.
      - name: spec-changed
        at: 10s
        payload:
          desired_replicas: 0
      - name: spec-changed
        at: 20s
        payload:
          retired: true
    stubs:
      - step: observed
        returns:
          replicas: ${goal.desired}
      - step: converge
        returns:
          accepted: true
    expect:
      ran: [opened, reconcile, observations]
      skipped: [converge]
      outputs:
        passes: 1
        passes_that_acted: 0
        # Unchanged: the 0 was refused, so the reconciler is still responsible
        # for 5.
        final_desired_replicas: 5
        final_observed_replicas: 5

  - name: a wrong-type replica count carried by a signal is ignored without crashing
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 5
    signals:
      # A string where a number belongs. Comparing it with `> 0` would fail
      # expression evaluation and terminate the reconciler (finding #4); the
      # `type(...) == type(0)` guard short-circuits before the comparison, so the
      # value is ignored and the run carries on.
      - name: spec-changed
        at: 10s
        payload:
          desired_replicas: seven
      - name: spec-changed
        at: 20s
        payload:
          retired: true
    stubs:
      - step: observed
        returns:
          replicas: ${goal.desired}
      - step: converge
        returns:
          accepted: true
    expect:
      ran: [opened, reconcile, observations]
      skipped: [converge]
      outputs:
        passes: 1
        passes_that_acted: 0
        final_desired_replicas: 5
        final_observed_replicas: 5

  - name: a replica count outside the allowed range is refused before anything runs
    workflow: ./workflow.yaml
    inputs:
      target: checkout-api
      desired_replicas: 0
    expect:
      failed: true
      error_contains: "must satisfy"
