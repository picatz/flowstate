# A function is inlined where it is called, so what is worth testing is that the
# calls compute what the definitions say, in a step, an `if:` and an output.
edition: v2026.4
defaults:
  workflow: ./workflow.yaml
  stubs:
    - task: log
      returns: {}
tests:
  - name: a title becomes a path
    inputs:
      title: "  Hello World "
    expect:
      ran: [publish]
      skipped: [shorten]
      outputs:
        path: /posts/hello-world
        long: false

  - name: a function reads its own arguments, not the workflow's
    inputs:
      title: Hello World
      section: notes
    expect:
      outputs:
        path: /notes/hello-world
        long: false

  - name: a long title takes the branch the predicate guards
    inputs:
      title: A Rather Long Title For A Headline
    expect:
      ran: [publish, shorten]
      outputs:
        path: /posts/a-rather-long-title-for-a-headline
        long: true

  # A `must:` that calls a function refuses and admits as the plain predicate does.
  - name: a tag the function refuses is not admitted
    inputs:
      title: Hello World
      tag: Not A Word
    expect:
      failed: true
      error_contains: 'input "tag" must satisfy'

  - name: a record field is held to the same function
    inputs:
      title: Hello World
      author: {handle: Not-A-Handle}
    expect:
      failed: true
      error_contains: handle

  - name: a handle the function admits is accepted
    inputs:
      title: Hello World
      author: {handle: ada}
    expect:
      ran: [publish]
