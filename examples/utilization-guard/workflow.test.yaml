# `utilization` — the `value:` step — succeeds in both cases below: dividing
# 120 by 100 is not an error, it is just a number nobody wants reported. The
# refusal case's `expect:` says so precisely: `ran: [utilization]` and
# `failed: true` together, which is what distinguishes "the computation
# failed" from "the computation succeeded and its own output contract refused
# to report the answer" — the distinction this file exists to make.
edition: v2026.3
defaults:
  workflow: ./workflow.yaml
tests:
  - name: an ordinary reservation reports an ordinary percentage
    expect:
      ran: [utilization]
      outputs:
        utilization_pct: 82.0

  - name: full capacity is still a valid percentage, at the guard's own edge
    inputs:
      capacity: 100
      reserved: 100
    expect:
      ran: [utilization]
      outputs:
        utilization_pct: 100.0

  - name: more seats reserved than the flight has is refused as the malformed answer it is
    inputs:
      capacity: 100
      reserved: 120
    expect:
      # The step that computed the bad number is still in `ran:` — nothing
      # about evaluating `steps.utilization.value` failed. What failed is the
      # output contract, checked once that value existed.
      ran: [utilization]
      failed: true
      error_contains: "must satisfy `this >= 0.0 && this <= 100.0`; got 120"
