# The Flowfile this program embeds — see main.go, which compiles this file's
# bytes with pkg/flowstate/embed.Compile rather than reading it from a path on
# disk. It is a real workflow.yaml (rather than a Go string literal) so it is
# checked and kept in the current edition by the same `flow fix --check
# examples/` CI already runs against every other example.
edition: v2026.2
name: embedding-example

steps:
  # A custom Go task this program itself registers — see registerGreetTask in
  # main.go. Nothing here distinguishes it from a built-in task: the DSL has
  # no idea "greet" is not something this build shipped.
  - id: greeting
    greet:
      name: ${inputs.name}

  - id: announce
    log:
      message: ${steps.greeting.message}

inputs:
  name:
    type: string
    default: embedder

outputs:
  message:
    value: ${steps.greeting.message}
    description: the greeting the custom "greet" task built
