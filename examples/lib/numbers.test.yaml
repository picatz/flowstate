# Cases for numbers.yaml, a module: see ids.test.yaml for the shape.
edition: v2026.4
defaults:
  workflow: ./numbers.yaml
tests:
  - name: inRange includes both ends
    expect:
      check:
        - inRange(1, 1, 5)
        - inRange(5, 1, 5)
        - '!inRange(0, 1, 5)'
        - '!inRange(6, 1, 5)'

  - name: clamp raises, lowers and keeps
    expect:
      check:
        - clamp(40, 1, 5) == 5
        - clamp(-3, 1, 5) == 1
        - clamp(3, 1, 5) == 3

  - name: Port covers 1 to 65535
    expect:
      types:
        Port:
          admits: [1, 8080, 65535]
          refuses: [0, 65536, -1, "8080"]

  - name: Percent covers 0 to 100
    expect:
      types:
        Percent:
          admits: [0, 25, 100]
          refuses: [-1, 101]

  - name: Count needs at least one
    expect:
      types:
        Count:
          admits: [1, 3]
          refuses: [0, -2]
