# Text and expressions in one value.
#
# A value may mix ordinary text with `${...}` fences:
#
#   message: deploying ${inputs.version} to ${inputs.environment}
#
# Each fence holds one expression, each is converted with `string()`, and the
# result is one string. `flow fmt` rewrites such a value into the single
# expression it means, `${"deploying " + string(inputs.version) + " to " +
# string(inputs.environment)}`, and both spellings compile to the same
# specification. Every example is kept in `flow fmt` form, so the steps below
# show the rewritten spelling; write whichever reads better and let the
# formatter settle it.
#
# It is deliberately not a template language. There is no conditional, no loop
# and no filter in text; a fence holds an expression and nothing else. That is
# the line Helm and Jinja crossed, and staying on this side of it is what keeps
# a value readable as data at a glance.
edition: v2026.4
name: interpolation
inputs:
  version:
    type: string
    required: true
  environment:
    type: string
    required: true
vars:
  requester: an unattested caller
steps:
  # The shape the feature exists for, written as
  # `${vars.requester} requests deploying ${inputs.version} to ${inputs.environment}`.
  - id: announce
    log:
      message: ${string(vars.requester) + " requests deploying " + string(inputs.version) + " to " + string(inputs.environment)}

  # Every fence is rendered with CEL's own `string()`, so a number, a boolean
  # and a duration all read the way `string()` renders them: this logs
  # "attempt 2, forced false, budget 90s". `format()` remains the spelling for
  # width and precision.
  - id: kinds
    log:
      message: ${"attempt " + string(1 + 1) + ", forced " + string(false) + ", budget " + string(duration("90s"))}

  # A quoted or block scalar interpolates identically: the fence rule belongs
  # to the value, not to the quoting style it was written in.
  - id: summary
    log:
      message: ${"deploying " + string(inputs.version) + " to " + string(inputs.environment)}
  # `$${` is a literal `${`, for a file that wants to *show* the syntax.
  #
  # The escape works in a field read when the workflow is compiled as readily as
  # in one the engine evaluates — a `description:` is prose, and prose about this
  # feature has to be able to spell it. That is a round trip as much as a parse:
  # `flow fmt` writes the description back out, so the bytes it writes have to be
  # the escaped ones or the file it just formatted would no longer compile.
  - id: teach
    description: shows how $${...} is written when you mean the characters
    log:
      message: write $${inputs.version} to interpolate it

  # The boundary that keeps this additive: a value that is exactly one fence
  # keeps whatever type its expression produced, so this is the integer 7 and
  # not the text "7". Only a value mixing text with an expression becomes text.
  - id: attempts
    value: ${7}
  - id: report
    log:
      message: ${"budget " + string(steps.attempts.value) + " attempts"}
outputs:
  attempts:
    value: ${steps.attempts.value}
    description: the attempt budget, an integer because its value is exactly one fence
