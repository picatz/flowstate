# Steps can declare when they run and how they behave when they fail.
#
#   if:                 an expression deciding whether the step runs at all
#   timeout:            how long one attempt may take
#   retry:              how a failed attempt is retried
#   continue_on_error:  let the run proceed when this step fails
#
# Only failures that could plausibly succeed on another attempt are retried, so a
# step that failed because its inputs were invalid fails once regardless of retry.
edition: v2026.2
name: conditional-and-retry
steps:
  - id: check
    echo:
      message: ready

  # Runs only when the previous step said so.
  - id: deploy
    if: ${steps.check.result == 'ready'}
    timeout: 30s
    retry:
      attempts: 3
      interval: 1s
      backoff: 2.0
      max_interval: 10s
    echo:
      message: deploying

  # Skipped, because the condition is false. A skipped step produces no outputs,
  # so nothing later may reference it.
  - id: rollback
    if: ${steps.check.result == 'failed'}
    echo:
      message: rolling back

  # Best-effort: a failure here is recorded as ${steps.notify.error} and the run
  # continues, because a missed notification should not abandon work that
  # succeeded.
  - id: notify
    continue_on_error: true
    echo:
      message: notifying
