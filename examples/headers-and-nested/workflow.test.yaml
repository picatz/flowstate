# Two claims, one per direction of the round trip:
#
#   * `headers:` reaches the task as a map, both entries under the names written —
#     asserted in the stub's `where:`, which is where a header this workflow sends
#     is observable without a network;
#   * the parsed response is indexable twice — `steps.web.json.headers['X-From']`
#     must be the string inside the nested map, not the map, and not a missing-key
#     error.
#
# `response:` rather than `returns:` for the second one. `returns:` would hand the
# step a `json` already shaped, leaving `parse_json:` — the thing that makes
# `steps.web.json` exist — unexercised by a green case. `response:` supplies the
# raw status, headers and body the task is handed, and the task parses it here
# exactly as it would a live one.
#
# What no stub can assert is the round trip itself: that the header this file sent
# is the one the far side echoed. The stub supplies both sides, so the case proves
# the send and the selection, and the service proves the echo. The echoed values
# are deliberately not the sent ones for that reason — a selection that quietly
# read the request back would produce `Flowstate`, and fail here.
edition: v2026.3
tests:
  - name: both headers reach the task, and the parsed response indexes twice
    workflow: ./workflow.yaml
    stubs:
      - task: http
        where: >-
          inputs.url == 'https://httpbin.org/anything' &&
          inputs.parse_json &&
          inputs.headers['X-From'] == 'Flowstate' &&
          inputs.headers['X-Env'] == 'dev'
        response:
          status_code: 200
          body:
            headers:
              X-From: echoed-from
              X-Env: echoed-env
      - task: log
        where: inputs.message == 'the server saw X-From=echoed-from and X-Env=echoed-env'
        returns: {}
    expect:
      ran: [web, echoed]
