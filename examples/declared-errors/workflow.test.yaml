# `fail:` is how a workflow refuses on purpose, so the tests that matter assert
# the refusal: the run failed, and it failed with the sentence the author wrote.
# The happy path pins the opposite direction, that a funded transfer is not
# stopped by either guard.
edition: v2026.4
tests:
  - name: a funded transfer passes both guards
    workflow: ./workflow.yaml
    stubs:
      - task: log
        returns: {}
    expect:
      ran: [remaining, transfer]
      skipped: [reject_empty, reject_overdraft]

  - name: an overdraft raises InsufficientFunds
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 9000
    expect:
      failed: true
      error_contains: 'balance 5000 cannot cover 9000'

  - name: a non-positive amount raises AmountNotPositive
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 0
    expect:
      failed: true
      error_contains: 'amount must be positive, got 0'
