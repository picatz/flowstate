edition: v2026.2
name: webhook-routing
description: >-
  A webhook's event type is dispatched through one switch, with a default that
  means something: a value nobody enumerated is handled, recorded, and visible.

# The shape this example exists to show: one value, several handlers, written as
# one `switch:` instead of a stack of sibling `if:` steps repeating the same
# discriminant. Two things the `if:` spelling could not give:
#
#   - The cases are grouped, so `flow validate` can *check* them: a computed
#     `case:` is refused outright, a duplicate case is refused, and where the
#     value's domain is knowable a typo'd case gets "did you mean ...?" instead
#     of silently never matching.
#
#   - The run *records* the dispatch. `steps.on_event.value` is the value the
#     switch observed and `steps.on_event.case` is the case that took it, null
#     when none did — so when the provider starts sending an action this file
#     never learned, the transcript says so instead of nothing happening.
#
# The domain here is open — the provider can add an action type tomorrow, and no
# validator on this machine can know the set — which is exactly where `default:`
# earns its slot. Cases are matched in written order, first match wins, and
# there is no fallthrough. `case: [closed, merged]` is one membership check
# sharing one body, and `case: synchronize` with `steps: []` is written-down
# ignoring: a reviewer sees that the value was considered and deliberately does
# nothing, which silence could never say.
#
#   flow run local examples/webhook-routing/workflow.yaml --input-file examples/webhook-routing/inputs.json

inputs:
  action:
    type: string
    required: true
    example: opened
    description: the webhook event's action field, an open set the provider owns
  number:
    type: int
    required: true
    example: 101
    description: the issue or pull request number the event is about

steps:
  - id: on_event
    switch:
      value: ${inputs.action}
      cases:
        - case: opened
          steps:
            - id: triage
              log:
                message: >-
                  ${"triaging #%d".format([inputs.number])}
        # Two spellings of "this work is finished", one body: a list case is
        # flattened into a single membership check, and the record names the
        # member that matched rather than the list.
        - case: [closed, merged]
          steps:
            - id: archive
              log:
                message: >-
                  ${"archiving #%d".format([inputs.number])}
        # Written-down ignoring. The provider sends `synchronize` on every
        # push, and this workflow deliberately does nothing with it - which is
        # a decision a reviewer can see, distinct from an action nobody
        # thought about, which lands in `default:` below.
        - case: synchronize
          steps: []
      default:
        steps:
          - id: unhandled
            log:
              level: warn
              message: >-
                ${"unhandled action: %s".format([inputs.action])}

  # The record composes: a later step dispatches on what the switch observed,
  # because `value` and `case` are ordinary outputs under the step's id.
  - id: record
    log:
      message: >-
        ${steps.on_event.case == null
          ? "no handler enumerated %s".format([steps.on_event.value])
          : "handled as %s".format([steps.on_event.case])}

outputs:
  observed:
    value: ${steps.on_event.value}
    description: the action this run actually saw, whatever the provider sent
  handled:
    value: ${steps.on_event.case != null}
    description: whether any written case took it, false when the default ran
