# What this example exists to teach is a *classification*: every probe runs
# regardless of what any other one answers, and the outputs name which services
# were not reached rather than counting them. So the assertion is the outputs
# map, and the entry that carries the idea is `unhealthy_services` — a list of
# names derived from the *absence* of a name in `steps.checks.results`.
#
# Every case below matches on `service`, the name the `for_each` binds — a stub
# sees the scope its step was evaluated in, so an iteration is distinguishable
# even though the step's `outputs:` expression is one the http task evaluates
# itself ([v1.TaskDef.DeferredInputs]) and so never reaches a stub's `inputs`.
# That is what lets `checkout` and `payments` be told apart at all: they are
# probed at the identical url, so nothing in this workflow's task inputs
# separates them.
edition: v2026.3
tests:
  - name: two services down and one up are named individually, and the run still completes
    workflow: ./workflow.yaml
    stubs:
      # A failed probe never reaches the step's `outputs:` expression, so its
      # iteration result carries no name at all — that absence is exactly what
      # `unhealthy_services` is computed from.
      - task: http
        where: service.name in ['checkout', 'payments']
        fails:
          kind: Upstream
          message: service unavailable
      - task: http
        where: service.name == 'search'
        returns:
          name: '${service.name}'
      - task: log
        where: "inputs.message == 'probed 3 service(s): 1 healthy, 2 down'"
        returns: {}
    expect:
      # Not `failed: true`. Two probes failing is the case this workflow was
      # written for, and `continue_on_error:` on the iteration is what turns it
      # into an answer rather than an abandoned run.
      ran: [checks, summary]
      outputs:
        # Named, not counted — a pager needs to know which ones.
        unhealthy_services: [checkout, payments]
        healthy_count: 1
        page_required: true

  - name: every probe failing still finishes the run and names all three
    workflow: ./workflow.yaml
    stubs:
      - task: http
        fails:
          kind: Upstream
          message: service unavailable
      - task: log
        where: "inputs.message == 'probed 3 service(s): 0 healthy, 3 down'"
        returns: {}
    expect:
      ran: [checks, summary]
      outputs:
        unhealthy_services: [checkout, payments, search]
        healthy_count: 0
        page_required: true

  - name: with nothing down, nobody is paged
    workflow: ./workflow.yaml
    stubs:
      # Every probe healthy, including the one the file deliberately points at a
      # permanent 503 — the only way to reach the no-page branch without editing
      # workflow.yaml. One stub answers all three iterations, each with its own
      # name, which is what the real endpoint's own `outputs:` expression would
      # have produced.
      - task: http
        returns:
          name: '${service.name}'
      - task: log
        where: "inputs.message == 'probed 3 service(s): 3 healthy, 0 down'"
        returns: {}
    expect:
      ran: [checks, summary]
      outputs:
        # Nothing absent, so nothing to page about: `3 < 3` is false.
        unhealthy_services: []
        healthy_count: 3
        page_required: false

  - name: one service down is named alone, and it is the one the stub singled out
    workflow: ./workflow.yaml
    stubs:
      # The negative direction of the binding: this `where:` names `payments`
      # and must answer *only* that iteration, leaving the other two to the
      # stub below. If the binding were invisible — or matched every iteration
      # — all three would fail and `unhealthy_services` would name all three.
      - task: http
        where: service.name == 'payments'
        fails:
          kind: Upstream
          message: service unavailable
      - task: http
        returns:
          name: '${service.name}'
      - task: log
        where: "inputs.message == 'probed 3 service(s): 2 healthy, 1 down'"
        returns: {}
    expect:
      ran: [checks, summary]
      outputs:
        unhealthy_services: [payments]
        healthy_count: 2
        page_required: true
