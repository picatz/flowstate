edition: v2026.3
name: ops-healthcheck
description: >-
  Probes a list of services with bounded fan-out, tolerates the ones that are
  down, and answers with exactly what a pager or a status dashboard needs to
  read.

# A cron job that curls three endpoints and exits non-zero on the first
# failure tells you one thing is down and nothing about the other two — and
# if the box running it reboots mid-check, there is no run to look at
# afterwards, only whatever got written to a log before it disappeared. This
# checks every service regardless of what any one of them answers, and the run
# itself — not a side-effect of it — is the thing a dashboard or a pager reads.
#
# `checks` below is a `for_each` over `service_urls`, not `parallel:` branches
# unrolled by hand. `parallel:` is for branches that are genuinely different —
# see `fan-out-and-parallel`'s `check_config` and `check_quota`, which do
# unrelated work and could not be written any other way. These probes are the
# same operation repeated, the same shape `data-enrichment`'s per-record
# lookup is: the list grows, the step does not. A fourth service under
# `parallel:` would mean a fourth copied-and-tweaked branch here and a fourth
# place in `outputs:` below re-deriving the same classification; under
# `for_each` it is one entry in one list.
#
# Each iteration carries `continue_on_error: true`, same as before: a service
# being down is the reason this workflow exists, not a reason for it to fail.
# `search` is still pointed at a permanent 503, so there is always something to
# tolerate on every run, the same way `conditional-and-retry`'s `notify` step
# always fails on purpose.
#
#   flow run local examples/ops-healthcheck/workflow.yaml -o json | jq .runOutputs
#
# Durably, this is the shape behind a scheduled health check: `triggers:` (see
# `examples/scheduled-report`) fires this file on a cadence, and a firing that
# started before a worker fleet redeploy finishes on whatever worker picks it
# up afterwards, with the same answers it would have produced without the
# redeploy.

vars:
  # Just the names, read in `outputs:` below to say which services were even
  # asked about. `checks` needs the same list paired with a url, but a
  # `for_each`'s `items:` has to be a literal list in the file — not an
  # expression reading `vars:` — for the example corpus's own test harness to
  # find every request in it and point it away from the real network (see
  # `PointAtStandIn`'s doc comment on why an expression has nothing to
  # rewrite). So this is the one place in the file that costs the `for_each`
  # design a second edit: adding a fourth service means one entry here and one
  # entry in `checks.for_each.items` below — still two edits in one file,
  # against the five scattered edits (a whole branch, plus four re-derivations
  # in `outputs:`) the `parallel:` version needed.
  service_names: ${['checkout', 'payments', 'search']}

steps:
  - id: checks
    for_each:
      items:
        - name: checkout
          url: https://httpbin.org/status/200
        - name: payments
          url: https://httpbin.org/status/200
        - name: search
          url: https://httpbin.org/status/503
      as: service
      # All three probes at once. A real fleet would set this from how many
      # connections the services being probed can take, the same reason
      # `data-enrichment` bounds its own fan-out.
      max_parallel: 3
      steps:
        - id: probe
          description: probe one service in the list
          timeout: 10s
          continue_on_error: true
          http:
            method: GET
            url: ${service.url}
            # A probe that came back healthy carries its name forward so the
            # outputs below can say which one it was; a probe that failed
            # never reaches this expression at all — `expect`'s default rule
            # already rejected the response before `outputs:` is evaluated —
            # so a failed iteration's result carries no name, only whatever
            # `continue_on_error` recorded as its error. That absence is
            # exactly what `outputs:` below tests for.
            outputs:
              name: ${service.name}

  # How many services this run set out to probe. Stated once: the sentence
  # below names it twice and `page_required` a third time, and three copies of
  # one count are three chances to disagree about what was probed
  # (docs/STYLE.md R5, `flow lint`).
  - id: probed_count
    value: ${size(vars.service_names)}

  - id: summary
    log:
      message: >-
        ${"probed " + string(steps.probed_count.value) + " service(s): " +
          string(size(steps.checks.results.filter(r, has(r.probe.name)))) + " healthy, " +
          string(steps.probed_count.value - size(steps.checks.results.filter(r, has(r.probe.name)))) + " down"}

outputs:
  # Named rather than counted so a pager reads *what* to page about without
  # re-deriving it from a status code. A service's own name is missing from
  # `steps.checks.results` for exactly the iterations that failed — `service`
  # itself is not a step output, only what the body's steps produced is — so
  # "the names in `service_names` that are not among the names `checks`
  # reported" is the same set the old file spelled out by hand three times.
  unhealthy_services:
    value: >-
      ${vars.service_names.filter(n,
        !(n in steps.checks.results.filter(r, has(r.probe.name)).map(r, r.probe.name)))}
    description: services whose probe did not come back healthy
  healthy_count:
    value: ${size(steps.checks.results.filter(r, has(r.probe.name)))}
    description: how many services reported healthy
  page_required:
    value: >-
      ${size(steps.checks.results.filter(r, has(r.probe.name))) < steps.probed_count.value}
    description: whether an on-call human should be paged
