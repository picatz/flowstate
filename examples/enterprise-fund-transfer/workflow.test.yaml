# Seven cases. The first three are the shape money actually has to get
# right — a small transfer clearing on its own, a large one clearing once a
# genuinely qualifying `sender:` approves it (#207 slice 2: `flow test`
# checks a scripted `sender:` against `signals:` through the same
# `v1.SignalPolicyCheck` the server calls, so this reaches `debit` for real
# now, not merely "the shape that does not depend on a real sender"), and a
# settlement failure taking back what already moved. The rest are refusal
# paths: rejected, expired, an unattested/wrong-claim sender refused before
# the signal is ever delivered (so the gate simply times out, same as
# nobody answering), and a malformed payload. The starter's own self-approval
# being refused is exercised durably (engine/examples_durable_test.go,
# engine/run_identity_test.go) — `flow test` has no concept of "who ran this
# test" to compare a scripted sender against beyond the fixed empty identity
# [v1.NewPolicedLocalSignals] documents, and no realistic sender ever equals
# that.
edition: v2026.2

# Stated once for every case (issue #416). Both accounts and the threshold are
# the same transfer throughout; only the amount and the idempotency key change,
# so each case sets just those two. The treasury-approver `sender:` is the
# desk that approves above the threshold, inherited by every signal that does
# not name its own (the wrong-claim case below names its own and keeps it). The
# `log` stub answers `request`'s log line, which carries no assertion.
defaults:
  inputs:
    from_account_id: acct-treasury-001
    to_account_id: acct-supplier-042
    approval_threshold_cents: 1000000
  sender:
    subject: treasury-lead@example.com
    issuer: https://issuer.example.com
    claims:
      role: treasury-approver
  stubs:
    - task: log
      returns: {}
tests:
  - name: a transfer below the threshold clears without a gate
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 250000
      idempotency_key: transfer-2026-08-06-0001
    stubs:
      # Stubbed by step id, not by retyping the workflow's own urls into a
      # `where:` clause: the reference is the step, so an endpoint rename in
      # workflow.yaml cannot leave this test matching a url nothing calls.
      - step: debit
        returns:
          reference: dbt-1
      - step: credit
        returns:
          reference: crd-1
      - step: notify_settlement
        returns: {}
    expect:
      ran: [request, debit, credit, notify_settlement]
      others: skipped
      outputs:
        decision: transferred
        debit_reference: dbt-1

  - name: a settlement failure after both legs cleared undoes credit then debit
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 250000
      idempotency_key: transfer-2026-08-06-0002
    stubs:
      - step: debit
        returns:
          reference: dbt-2
      - step: credit
        returns:
          reference: crd-2
      - step: notify_settlement
        fails:
          kind: Upstream
          message: settlement service unavailable
      # The compensations, hit for real by the local driver once
      # notify_settlement fails. A compensation runs off the run level context
      # and carries no step id, so a step-form stub never answers it; it is
      # stubbed by task and `where:` on the reversing endpoint instead, the
      # genuine case `where:` remains for. Each account is in the body rather
      # than the path (see workflow.yaml's own `undo:` comment on `debit`).
      - task: http
        where: inputs.url == 'https://ledger.internal.example.com/debit' && inputs.json.account_id == 'acct-supplier-042'
        returns: {}
      - task: http
        where: inputs.url == 'https://ledger.internal.example.com/credit' && inputs.json.account_id == 'acct-treasury-001'
        returns: {}
    expect:
      failed: true
      error_contains: settlement service unavailable
      compensated: [credit, debit]

  - name: an explicit rejection above the threshold moves nothing
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 5000000
      idempotency_key: transfer-2026-08-06-0003
    signals:
      - name: transfer-approved
        payload:
          approved: false
    expect:
      ran: [request, approval, rejected]
      others: skipped
      outputs:
        decision: rejected
        debit_reference: ""

  - name: nobody answers, and the gate lapses at its own timeout
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 5000000
      idempotency_key: transfer-2026-08-06-0004
    expect:
      ran: [request, approval, expired]
      others: skipped
      outputs:
        decision: expired
        debit_reference: ""

  - name: a genuinely qualifying approver above the threshold clears the transfer
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 5000000
      idempotency_key: transfer-2026-08-06-0005
    signals:
      - name: transfer-approved
        payload:
          approved: true
    stubs:
      - step: debit
        returns:
          reference: dbt-5
      - step: credit
        returns:
          reference: crd-5
      - step: notify_settlement
        returns: {}
    expect:
      ran: [request, approval, debit, credit, notify_settlement]
      others: skipped
      outputs:
        decision: transferred
        debit_reference: dbt-5

  - name: a sender lacking the treasury-approver claim is refused before the signal is ever delivered
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 5000000
      idempotency_key: transfer-2026-08-06-0008
    signals:
      # Names its own sender rather than inheriting the desk's: explicit beats
      # inherited, which is the whole point of this case: a sender that does
      # not carry the treasury-approver claim.
      - name: transfer-approved
        payload:
          approved: true
        sender:
          subject: someone-else@example.com
          issuer: https://issuer.example.com
          claims:
            role: engineer
    expect:
      ran: [request, approval, expired]
      others: skipped
      outputs:
        decision: expired
        debit_reference: ""

  - name: a signal that answers with no approved field is refused, not read as a timeout
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 5000000
      idempotency_key: transfer-2026-08-06-0007
    signals:
      # A payload that arrived - `steps.approval.timed_out` reads false - but
      # carries nothing this file can act on. The bug this case exists to
      # catch: an earlier version of `decision` used `!has(payload.approved)`
      # as a stand-in for "nobody answered," which is also true here even
      # though somebody very much did.
      - name: transfer-approved
        payload:
          note: wrong shape entirely
    expect:
      ran: [request, approval, refused_malformed_payload]
      others: skipped
      outputs:
        decision: refused_malformed_payload
        debit_reference: ""

  - name: an amount below one cent is refused before the first step runs
    workflow: ./workflow.yaml
    inputs:
      amount_cents: 0
      idempotency_key: transfer-2026-08-06-0006
    expect:
      failed: true
      error_contains: "must satisfy"
