# The trust policy the walkthrough's `flow server` is started with.
#
# Two things are configured here and they are independent of each other, which is
# the point worth seeing in one file:
#
#   - `issuers:` decides who a caller is, and which Flowstate namespace they
#     belong to. `namespace_claim:` reads the tenant off a *verified* claim, so
#     the namespace is an assertion of the issuer rather than something a request
#     gets to choose. That is the same rule the task queue name follows below: a
#     tenant is derived from who authenticated, never from what was asked for.
#   - `tenancy:` maps each Flowstate namespace onto the Temporal namespace its
#     runs execute in, which is what isolates history and visibility.
#
# Note what is *not* here: no task queue names. The queue is composed from the
# prefix `flow server` and `flow worker` are each started with, plus the
# authenticated tenant — see the README for why one string cannot be forged into
# another tenant's queue.
#
# Every issuer names a namespace or a namespace claim, and that is enforced:
# `Policy.validateTenancy` refuses a file where one issuer determines a namespace
# and another does not, because callers admitted without one would share a
# namespace with tenants meant to be kept apart.
issuers:
  - name: github-actions
    issuer: https://token.actions.githubusercontent.com
    audiences: [flowstate]
    algorithms: [RS256]
    # The tenant, read off a claim the issuer signed. The value read must be
    # lowercase letters, digits, and dashes, at most 63 characters; an org
    # login outside that grammar (uppercase letters or an underscore, both
    # legal on GitHub) is refused at verification rather than admitted, and
    # "repository" (`<owner>/<name>`) can never satisfy it at all, since "/"
    # is always in the value. For those, use `namespace_map:` — see
    # github-actions-repos below — rather than loosening this grammar: it
    # also gates the file secret provider's per-tenant directory and the
    # signed assertion subject, so a looser check here is a looser check
    # everywhere.
    namespace_claim: repository_owner

  # The same issuer, read a different way: mapping the "repository" claim
  # explicitly rather than relying on the owner login already being a legal
  # namespace. This is the general answer, and the only one that works for a
  # claim like "repository" that can never satisfy the grammar raw. Every
  # value on the right is checked against the namespace grammar once, at
  # startup, and a repository this map does not name is refused rather than
  # admitted to any tenant — no wildcards, nothing implied, same as a
  # `require:` rule.
  #
  # This entry is ordered after github-actions above, so a caller whose owner
  # login already maps takes the simpler entry; only a repository that entry
  # cannot resolve reaches this one. Entries are tried in order, and a
  # namespace an admitting entry cannot map is a rejection, deliberately never
  # a reason to try the next entry — so a repository absent from *this* map is
  # refused outright, not passed further down the list.
  - name: github-actions-repos
    issuer: https://token.actions.githubusercontent.com
    audiences: [flowstate]
    algorithms: [RS256]
    namespace_claim: repository
    namespace_map:
      octo-org/octo-repo: octo-org
      Octo-Corp/internal-tools: octo-corp

  # A second platform, pinned to one tenant outright rather than reading a claim.
  # Both spellings are legal in one file; what is not legal is an issuer with
  # neither.
  - name: internal-ci
    issuer: https://ci.internal.example.com
    audiences: [flowstate]
    algorithms: [RS256]
    namespace: team-a

tenancy:
  temporal:
    team-a: temporal-team-a
    team-b: temporal-team-b

  # Deliberately absent: with no `default:`, a Flowstate namespace this file does
  # not map is *refused* rather than quietly landing in somebody else's Temporal
  # namespace. That is the fail-closed choice for a deployment whose whole reason
  # for mapping tenants apart is that they must not read each other's history —
  # see `Tenancy.Default`'s own doc comment for when to set it instead.
  #
  # default: temporal-shared
