# A callee, meant to be called - but also runnable on its own, the same
# property provision-database.yaml documents.
edition: v2026.3
name: provision-billing
inputs:
  tenant:
    type: string
    required: true
    description: which tenant this billing account belongs to
    example: acme
    must: this.matches(r'^[a-z][a-z0-9-]*$')
  plan:
    type: string
    required: true
    description: the plan this tenant is being onboarded onto
    example: growth
    must: this in ["starter", "growth", "enterprise"]
steps:
  # `undo:` on this callee's own task - see provision-database.yaml's comment
  # for why the id is `provision_billing` rather than a generic `provision`,
  # and the parent workflow's header for the composed shape this is part of.
  - id: provision_billing
    http:
      json:
        tenant: ${inputs.tenant}
        plan: ${inputs.plan}
      method: POST
      outputs:
        resource_id: ${response.json.resource_id}
      parse_json: true
      url: https://provisioning.internal.example.com/billing-accounts
    undo:
      http:
        json:
          resource_id: ${steps.provision_billing.resource_id}
        method: DELETE
        url: https://provisioning.internal.example.com/billing-accounts
outputs:
  resource_id:
    value: ${steps.provision_billing.resource_id}
    description: the provisioned billing account's id
