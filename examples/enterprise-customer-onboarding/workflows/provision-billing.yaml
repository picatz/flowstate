# A callee, meant to be called - but also runnable on its own, the same
# property provision-database.yaml documents.
edition: v2026.2
name: provision-billing

inputs:
  tenant:
    type: string
    required: true
    example: acme
    pattern: "^[a-z][a-z0-9-]*$"
    description: which tenant this billing account belongs to

  plan:
    type: string
    required: true
    example: growth
    must: 'this in ["starter", "growth", "enterprise"]'
    description: the plan this tenant is being onboarded onto

steps:
  # No `undo:` here - see provision-database.yaml's own comment and the
  # parent workflow's header comment for why.
  - id: provision
    http:
      method: POST
      url: https://provisioning.internal.example.com/billing-accounts
      json: '${ {"tenant": inputs.tenant, "plan": inputs.plan} }'
      parse_json: true
      outputs: '${ {"resource_id": response.json.resource_id} }'

outputs:
  resource_id:
    value: ${steps.provision.resource_id}
    description: the provisioned billing account's id, needed to deprovision it if a later step in the onboarding saga fails
