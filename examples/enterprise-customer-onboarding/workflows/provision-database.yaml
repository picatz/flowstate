# A callee, meant to be called - but also runnable on its own:
#   flow run local examples/enterprise-customer-onboarding/workflows/provision-database.yaml --input tenant=acme
# resolves its own `inputs:`/`outputs:` exactly as a call from the parent
# does, the same property call-a-workflow's own callee demonstrates.
edition: v2026.3
name: provision-database
inputs:
  tenant:
    type: string
    required: true
    description: which tenant this database belongs to
    example: acme
    must: this.matches(r'^[a-z][a-z0-9-]*$')
steps:
  # `undo:` on a callee's own task step - the shape docs/DSL.md's "Compensation
  # composes through a call" section landed with #225: this registration joins
  # the run-level undo stack exactly as a top-level step's would, and the
  # engine undoes it in reverse alongside whatever the caller registered
  # before and after this `call:`. The provisioner is a self-contained unit -
  # provision, and how to take itself back - independent of who calls it or
  # what else that caller is compensating.
  #
  # The step id is `provision_database`, not the generic `provision` this
  # directory's other callees might reach for: three sibling provisioners run
  # inside the same onboarding saga, and the run-level undo account names a
  # step by its own bare id, not qualified by which call reached it (see
  # `v1.PendingUndo`) - so a caller compensating more than one of them at once
  # needs each name to be unmistakable in its own failure summary, not just
  # unambiguous read next to its `outputs:`.
  - id: provision_database
    http:
      json:
        tenant: ${inputs.tenant}
      method: POST
      outputs:
        resource_id: ${response.json.resource_id}
      parse_json: true
      url: https://provisioning.internal.example.com/databases
    undo:
      # A literal URL with the resource id in the body, not spliced into the
      # path - see the parent workflow's own `undo:` comment and
      # enterprise-fund-transfer's `debit` step for the identical reasoning: a
      # URL built by concatenating a step's own output is not a literal
      # `PointAtStandIn` can rewrite.
      http:
        json:
          resource_id: ${steps.provision_database.resource_id}
        method: DELETE
        url: https://provisioning.internal.example.com/databases
outputs:
  resource_id:
    value: ${steps.provision_database.resource_id}
    description: the provisioned database's id
