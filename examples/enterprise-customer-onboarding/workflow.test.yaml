# `flow test` runs every `call:` for real, through the same local driver, the
# same property call-a-workflow's own test file documents - so a stub here
# answers the `http` task wherever the call reaches it, inside a callee or
# not, and control flow (including each provisioner's own `undo:`, registered
# from inside its callee - see docs/DSL.md's "Compensation composes through a
# call") runs unmodified.
edition: v2026.2
defaults:
  stubs:
    - task: log
      returns: {}
tests:
  - name: a tenant clears quota, is provisioned across three sub-workflows, and activates after its grace period
    workflow: ./workflow.yaml
    inputs:
      tenant: acme
      plan: growth
      activation_grace_hours: 1
    signals:
      - name: activation-confirmed
        payload:
          confirmed: true
        sender:
          claims:
            role: account-manager
    stubs:
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/quota'
        returns:
          available: true
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/databases'
        returns:
          resource_id: db-acme-1
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/billing-accounts'
        returns:
          resource_id: bill-acme-1
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/access-grants'
        returns:
          resource_id: access-acme-1
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/tenants/activate'
        returns: {}
    expect:
      ran:
        - check_quota
        - provision_database
        - provision_billing
        - provision_access
        - activation_window
        - activation_confirmation
        - activate
      skipped: [activation_deferred]
      outputs:
        activated: true
        tenant: acme
        database_id: db-acme-1
        billing_id: bill-acme-1
        access_id: access-acme-1

  - name: activation failing after all three provisioners succeeded undoes access, then billing, then the database, across each one's own call boundary
    workflow: ./workflow.yaml
    inputs:
      tenant: acme
      plan: growth
      activation_grace_hours: 1
    signals:
      - name: activation-confirmed
        payload:
          confirmed: true
        sender:
          claims:
            role: account-manager
    stubs:
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/quota'
        returns:
          available: true
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/databases' && has(inputs.json.tenant)
        returns:
          resource_id: db-acme-2
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/billing-accounts' && has(inputs.json.tenant)
        returns:
          resource_id: bill-acme-2
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/access-grants' && has(inputs.json.tenant)
        returns:
          resource_id: access-acme-2
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/tenants/activate'
        fails:
          kind: Upstream
          message: activation service unavailable
      # The compensations, hit for real once activate fails - each one the
      # same literal URL as its own provisioning call above, distinguished by
      # the resource id travelling in the body instead of the tenant (see
      # workflows/provision-database.yaml's own `undo:` comment). Each
      # provisioner's `undo:` registers from inside its own callee and still
      # undoes in the reverse of the order the three `call:` steps ran in -
      # access, then billing, then database - proving the compensation
      # actually crossed each `call:` boundary rather than merely compiling.
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/access-grants' && inputs.json.resource_id == 'access-acme-2'
        returns: {}
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/billing-accounts' && inputs.json.resource_id == 'bill-acme-2'
        returns: {}
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/databases' && inputs.json.resource_id == 'db-acme-2'
        returns: {}
    expect:
      failed: true
      # `compensated:` checks membership in any order — the field's own doc
      # says so — and the point of this case is the *order*: reverse of
      # registration, across three `call:` boundaries. The failure text
      # carries the engine's own ordered account directly after the cause,
      # so one string pins both what failed and access-then-billing-then-
      # database. Swap any two names and this case fails.
      error_contains: >-
        activation service unavailable; compensation ran in reverse order:
        undid "provision_access", undid "provision_billing", undid
        "provision_database"
      compensated: [provision_access, provision_billing, provision_database]

  - name: activation is deferred when the account manager never confirms go-live
    workflow: ./workflow.yaml
    inputs:
      tenant: acme
      plan: growth
      activation_grace_hours: 1
    stubs:
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/quota'
        returns:
          available: true
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/databases'
        returns:
          resource_id: db-acme-3
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/billing-accounts'
        returns:
          resource_id: bill-acme-3
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/access-grants'
        returns:
          resource_id: access-acme-3
    expect:
      ran:
        - check_quota
        - provision_database
        - provision_billing
        - provision_access
        - activation_window
        - activation_confirmation
        - activation_deferred
      skipped: [activate]
      outputs:
        activated: false
        tenant: acme
        database_id: db-acme-3
        billing_id: bill-acme-3
        access_id: access-acme-3

  - name: a tenant whose quota precondition fails is refused before any provisioning runs
    workflow: ./workflow.yaml
    inputs:
      tenant: acme
      plan: enterprise
      activation_grace_hours: 1
    stubs:
      # `fails:` stands in for the real `expect:` failure check-quota.yaml's
      # own `check` step would produce on an out-of-quota answer - see that
      # file's comment for why a stub cannot exercise `expect:` itself.
      - task: http
        where: inputs.url == 'https://provisioning.internal.example.com/quota'
        fails:
          kind: InvalidInput
          message: tenant has no quota remaining on the requested plan
    expect:
      failed: true
      error_contains: tenant has no quota remaining

  - name: an unknown plan is refused before the first step runs
    workflow: ./workflow.yaml
    inputs:
      tenant: acme
      plan: legacy
      activation_grace_hours: 1
    stubs:
      - task: http
        returns: {}
    expect:
      failed: true
      error_contains: "must satisfy"
