# The printf task formats a string from a format specifier and arguments.
# Arguments may be literals or references to earlier step outputs.
name: printf formatting
steps:
  - id: name
    task:
      name: echo
      inputs:
        message: flowstate

  - id: greeting
    task:
      name: printf
      inputs:
        format: "hello %s, you have %d step(s) left"
        args:
          - ${name.result}
          - 0
