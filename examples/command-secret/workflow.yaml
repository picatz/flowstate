edition: v2026.3
name: command-secret
steps:
  # command: is the escape hatch: whatever "aws kms decrypt", "sops -d", "age -d",
  # "aws secretsmanager get-secret-value", or "doppler run" would print becomes the
  # secret. The worker runs the configured command with "{{name}}" substituted for
  # the reference's name — literally, as one argument, with no shell involved — and
  # reads the value from its standard output.
  - id: health
    http:
      bearer: ${secret('command:github-token')}
      expect: ${response.status_code == 200}
      url: https://api.example.com/status/200
