# An egress policy for the http task, loaded with:
#
#   flow worker --allow-unversioned-interpreter --egress-policy examples/egress-policy.yaml
#   flow run local workflow.yaml --egress-policy examples/egress-policy.yaml
#
# A file replaces the default policy entirely, so what it does not loosen stays
# denied: loopback, private ranges, link-local, and the cloud metadata endpoints
# all remain refused unless a field here says otherwise, and
# FLOWSTATE_ALLOW_LOOPBACK_EGRESS is ignored while a file is in force.
#
# An empty file is the default policy. Every key below is optional; a misspelled
# one is a startup error rather than a silently dropped restriction.
egress:
  # Reachability is not permission to receive credentials. Requests containing
  # worker-resolved secrets or federation credentials are limited to these
  # hosts, and every redirect hop is checked again.
  credential_hosts: [partner-a.example.com]

  # Only https leaves this deployment. Naming http too is the default.
  schemes: [https]

  # Nothing reaches link-local space, over and above the categorical denial —
  # a deny here wins against every allowance, including allow_networks.
  deny_networks:
    - 169.254.0.0/16

  # Allow rules make the policy an allowlist: a request must match one. These
  # are CEL, the same language workflow expressions are written in, over url,
  # scheme, host, port, method, path, (connection-scoped) ip, and identity —
  # the workload identity of the run, with string fields subject, issuer, and
  # namespace and a claims map. On a shared worker, identity is what scopes
  # egress by tenant: it is the same identity secret-access and task-shape
  # rules read, so all three surfaces gate on one notion of who is running.
  allow:
    # Only team-a may reach the partner API. Another tenant on this worker does
    # not match this rule — and matches no other — so its request is denied,
    # the asymmetry the identity dimension exists to close. A run with no
    # attested identity presents an empty namespace and is denied here too.
    - identity.namespace == "team-a" && host == "partner-a.example.com"
    # GitHub's read API is reachable by every tenant.
    - host == "api.github.com" || host.endsWith(".githubusercontent.com")

  # Deny beats allow, and a rule that fails to evaluate denies the request.
  deny:
    - method != "GET" && method != "HEAD"

  # Anything not on 443 is refused before a connection is made.
  allow_ports: [443]

  # Bounds. Both exist by default; writing them down pins them, and neither can
  # be removed from a file — only raised. Sizes are written the way they are
  # said — 1MiB, 10MB — or as a bare count of bytes.
  max_redirects: 3
  max_response_bytes: 1MiB
  timeout: 30s

  # TLS 1.2 is the floor by default; a deployment that can say 1.3 should.
  min_tls_version: "1.3"
