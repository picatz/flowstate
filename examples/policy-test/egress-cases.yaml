# Cases for ../egress-policy.yaml, run with:
#
#   flow policy test examples/egress-policy.yaml examples/policy-test/egress-cases.yaml
#
# Written the way docs/STYLE.md asks a test to be: the refusals are the point.
# "team-a reaches its own partner" proves almost nothing; "team-b does not" and
# "an unattested run does not" prove the tenant boundary.
surface: egress
cases:
  - name: team-a reaches its partner API
    identity: {namespace: team-a}
    request: {url: "https://partner-a.example.com/v1/orders"}
    expect: allow

  - name: team-b is refused team-a's partner API
    identity: {namespace: team-b}
    request: {url: "https://partner-a.example.com/v1/orders"}
    expect: deny
    # No deny rule fires; team-b matches no allow rule at all.
    rule: allow rules

  - name: a run with no attested identity is refused team-a's partner API
    request: {url: "https://partner-a.example.com/v1/orders"}
    expect: deny
    rule: allow rules

  - name: every tenant reads GitHub
    identity: {namespace: team-b}
    request: {url: "https://api.github.com/repos/picatz/flowstate"}
    expect: allow

  - name: even team-a may not write to its partner
    identity: {namespace: team-a}
    request: {url: "https://partner-a.example.com/v1/orders", method: POST}
    expect: deny
    rule: 'method != "GET" && method != "HEAD"'

  - name: plain http is refused whoever asks
    identity: {namespace: team-a}
    request: {url: "http://partner-a.example.com/v1/orders"}
    expect: deny
    rule: scheme

  - name: a port other than 443 is refused
    identity: {namespace: team-a}
    request: {url: "https://partner-a.example.com:8443/v1/orders"}
    expect: deny
    rule: port

  # `ip` is the address the host is said to resolve to, which a hostname alone
  # cannot exercise without DNS. An address literal in the URL needs no `ip`,
  # but the allow rules refuse it first, so name an allowed host instead.
  - name: a hostname that resolves to the cloud metadata endpoint is refused
    identity: {namespace: team-a}
    request: {url: "https://api.github.com/", ip: "169.254.169.254"}
    expect: deny
    rule: address

  - name: a hostname that resolves to loopback is refused
    identity: {namespace: team-a}
    request: {url: "https://api.github.com/", ip: "127.0.0.1"}
    expect: deny
    rule: address
