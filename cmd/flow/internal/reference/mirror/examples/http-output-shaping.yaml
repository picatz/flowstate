# A step that shapes its own result.
#
# `outputs:` is not the http task's own idea — it is what a step of any kind writes
# to say what it produces, in place of the defaults. The http task is one of the two
# that has it; `wait_for_signal:` is the other, and shapes its result the same way
# from `payload`, `sender` and `timed_out` (see `examples/approval-gate`). What
# differs between them is only which names their expressions see, because that is
# the one thing that genuinely differs: each shapes *its own* result.
#
# By default the http task returns `status_code`, `body` and `headers` as this step's
# outputs, which later steps read as `${steps.web.status_code}`. The optional `outputs`
# input replaces those with exactly the values this step should return, keeping only
# what later steps need in the workflow's payloads. Replace and not extend, in both
# places: one key with one meaning, and a name the shaping dropped is a `flow validate`
# error rather than an empty value.
#
# Expressions in `outputs` are evaluated after the response arrives, and reach it
# through `response.*`: `${response.status_code}`, `${response.body}`. Rooted because
# those names are the *system's* rather than yours — the set can grow without capturing
# a name you were already using, and a loop binding called `body` around this step
# cannot be mistaken for the response. The json library is available for picking fields
# out of a JSON body.
#
# Note the two spellings are different things: `response.body` is this response, read
# here; `steps.web.body` is this step's output, read later.
edition: v2026.3
name: http-output-shaping
# `outputs` is evaluated where it is written, so the names in scope there are the
# ones in scope here: `response` for what came back, plus everything the file
# already had — the workflow's vars below, a step's own vars, and a loop's binding.
vars:
  source: catalog
steps:
  - id: web
    http:
      method: GET
      url: https://httpbin.org/json
      # One name per line, each value an ordinary expression position: ${...}
      # marks a CEL expression, as everywhere else in a Flowfile, and a bare
      # string would be a literal. This is the same shaping a `wait_for_signal:`
      # writes, spelled the same way — and because the names are written down,
      # `${steps.web.titel}` below is a diagnostic rather than an empty value.
      outputs:
        status: ${response.status_code}
        title: ${json_parse(response.body)["slideshow"]["title"]}
        source: ${vars.source}

  - id: report
    log:
      message: ${"got %d for %s from %s".format([steps.web.status, steps.web.title, steps.web.source])}
