edition: v2026.3
name: http-secret

steps:
  # `bearer:` is the input built to take a reference whole. The worker resolves it
  # inside the activity and sends `Authorization: Bearer <value>`.
  - id: health
    http:
      url: https://api.example.com/status/200
      bearer: ${secret('env:API_TOKEN')}
      expect: ${response.status_code == 200}

  # A reference can also sit inside `headers:`, for a destination that wants the
  # credential under a name of its own. The entry stays a reference through
  # compilation and through the activity payload; only the worker setting the
  # header resolves it.
  - id: health_with_header
    http:
      url: https://api.example.com/status/200
      headers:
        Accept: application/json
        X-Api-Key: ${secret('env:API_TOKEN')}
      expect: ${response.status_code == 200}
