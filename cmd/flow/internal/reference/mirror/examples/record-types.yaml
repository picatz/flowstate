# `types:` — a name for the shape of a value, declared once and used wherever a
# type is written.
#
# An input that is `type: struct` accepts any mapping, so a misspelled key or a
# missing one reaches the first step that reads it. A record is the closed
# version: the fields are named, a field marked `required:` must be there, a
# field the type does not declare is refused, and each field's value is checked
# against the type the field declares, all before the first step runs.
#
# A field is written exactly like an input (`type:`, `required:`, `values:`,
# `description:`), so there is nothing new to learn, and a record may name
# another record, or a list of one: `list(Line)`.
#
# A field also carries the length and item bounds an input does (`min_len:`,
# `max_len:`, `min_items:`, `max_items:`) and a `must:` over `this`, the field's value,
# checked by the same functions. A `must:` on the type is the rule across fields, with
# `this` the whole record. A field with a `default:` is filled in where a value leaves it
# out, so `inputs.order.status` is always there to read; a field marked `required:` has
# none. A field marked `sensitive:` makes every input and output typed by the record sensitive.
#
#   flow run local examples/record-types/workflow.yaml \
#       --input-file examples/record-types/inputs.json
edition: v2026.4
name: record-types
types:
  Line:
    description: One thing on an order.
    fields:
      sku:
        type: string
        required: true
        min_len: 2
      quantity:
        type: int
        required: true
        must: this > 0
  Order:
    description: What a customer bought.
    must: this.status != "paid" || size(this.lines) > 0
    fields:
      id:
        type: string
        required: true
      status:
        type: enum
        values:
          - open
          - paid
        default: open
      lines:
        type: list(Line)
        default: []
        max_items: 20
      note:
        type: string
inputs:
  order:
    type: Order
    required: true
    description: the order to fulfil
steps:
  - id: announce
    log:
      message: ${"fulfilling " + inputs.order.id}
outputs:
  receipt:
    value: ${inputs.order}
    type: Order
    description: the order as it was fulfilled
