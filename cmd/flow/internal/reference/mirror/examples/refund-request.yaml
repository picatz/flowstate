edition: v2026.4
name: refund-request
description: A customer asks for a refund. Small ones are paid straight away; large ones wait for a finance approver who is not the person who asked, and a failed payout is taken back.
types:
  Line:
    fields:
      sku:
        type: string
        required: true
      cents:
        type: int
        required: true
        must: this > 0
  Refund:
    description: What the customer is asking to have back.
    fields:
      order_id:
        type: string
        required: true
      lines:
        type: list(Line)
        required: true
        min_items: 1
      reason:
        type: enum
        values:
          - damaged
          - late
          - other
        required: true
      note:
        type: string
inputs:
  refund:
    type: Refund
    required: true
# Who may decide is the file's policy, not an input: a requester who chose their
# own approver would be choosing who checks them.
signals:
  refund-decision:
    allow: ${sender.identity.claims.team == "finance" && sender.identity.principal != run.identity.principal}
# The limit belongs to the workflow, not to whoever starts it: a caller who could
# raise it could pay any refund without a decision, and the `allow:` predicate
# cannot check a gate that never runs.
vars:
  auto_limit_cents: 5000
steps:
  - id: total
    value: ${inputs.refund.lines.map(l, l.cents).sum()}
  - id: review
    if: ${steps.total.value > vars.auto_limit_cents}
    wait_for_signal:
      name: refund-decision
      prompt: ${"Refund %d cents on order %s (%s)?".format([steps.total.value, inputs.refund.order_id, inputs.refund.reason])}
      timeout: 72h
      outputs:
        decider: ${sender.identity.subject}
        # A reply without `approved` is "undecided", never a silent no.
        outcome: '${payload.?approved.optMap(a, a ? "approved" : "declined").orValue("undecided")}'
  # Named once so the payout and the report read one fact. Under the limit the
  # review never ran, so the left side has to answer.
  - id: cleared
    value: ${steps.total.value <= vars.auto_limit_cents || steps.review.outcome == "approved"}
  - id: payout
    if: ${steps.cleared.value}
    http:
      url: https://payments.example.com/refunds
      method: POST
      headers:
        Idempotency-Key: ${inputs.refund.order_id + "-refund"}
      outputs:
        reference: ${response.json.reference}
      json:
        order_id: ${inputs.refund.order_id}
        cents: ${steps.total.value}
      parse_json: true
    undo:
      http:
        url: https://payments.example.com/refunds/void
        method: POST
        headers:
          Idempotency-Key: ${inputs.refund.order_id + "-void"}
        json:
          order_id: ${inputs.refund.order_id}
  - id: tell_customer
    if: ${steps.cleared.value}
    log:
      message: '${"refunded %d cents for %s%s".format([steps.total.value, inputs.refund.order_id, inputs.refund.?note.optMap(n, ": " + n).orValue("")])}'
outputs:
  paid:
    value: ${steps.cleared.value}
    type: bool
  total_cents:
    value: ${steps.total.value}
    type: int
