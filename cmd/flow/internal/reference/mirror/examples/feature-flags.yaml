edition: v2026.3
name: feature-flags
description: Reads a map of feature flags safely — a key that might not be there defaulted where it is read, and the whole map summarized by iterating its keys — rather than a task built to answer one question about one map.
# A map comprehension's iteration variable ranges over the map's *keys* — the
# same `filter`, `map`, `all` and `exists` a list uses, over a different
# domain. `flags.filter(k, flags[k])` reads as "every key whose value is
# true," which is what "which flags are on" means.
#
# `.?` is the other half: `flags.?beta_search` is a safe read of one named
# key, an optional that `orValue(false)` defaults rather than failing the
# expression when a caller's map does not carry that key at all — the same
# distinction examples/optional-dispatch makes for a signal's payload, here
# for a caller's input.
#
#   flow run local examples/feature-flags/workflow.yaml \
#     --input 'flags={"beta_search": true, "dark_mode": false}'
inputs:
  flags:
    type: struct
    required: true
    description: a mapping of flag name to whether it is on, an open set a caller owns
    example:
      beta_search: true
      dark_mode: false
steps:
  # Iterating the map's keys, keeping the ones whose value is true. Sorted so
  # the report reads the same way twice regardless of the order a JSON
  # object's keys arrived in.
  - id: enabled
    value: ${inputs.flags.filter(k, inputs.flags[k]).sort()}

  # A safe read of one specific key a caller may not have sent at all —
  # `beta_search` absent from `flags` is not the same as `beta_search: false`,
  # and `.?` is what keeps that visible up to the point `orValue` defaults it.
  - id: search_enabled
    value: ${inputs.flags.?beta_search.orValue(false)}
  - id: report
    log:
      message: '${"enabled: [%s], beta search: %s".format([steps.enabled.value.join(", "), string(steps.search_enabled.value)])}'
outputs:
  enabled_flags:
    value: ${steps.enabled.value}
    description: every key whose value is true, sorted
  search_enabled:
    value: ${steps.search_enabled.value}
    description: whether beta_search is on, false when the caller never sent it
