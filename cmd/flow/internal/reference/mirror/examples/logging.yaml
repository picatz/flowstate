edition: v2026.2
name: logging

# `log:` emits a message for a person to read.
#
# It is the one task whose purpose is to be *seen* rather than to produce a value, and
# it is named for that. Where the message goes depends on who is watching: `flow run
# local` renders it to your terminal, and on a worker it reaches the same logs
# everything else on that worker does, tagged with the run it came from.
vars:
  service: checkout
  version: v2026.7.3

steps:
  # The whole of it: a message. Everything else is optional.
  - id: announce
    log:
      message: ${'deploying ' + vars.service + ' ' + vars.version}

  # `level:` says how much it matters. Three choices — info, warn, error — written the
  # way you would say them rather than the way a protocol stores them. `flow validate`
  # names the three if you write a fourth.
  #
  # There is no `debug`: what an operator wants filtered is a property of a deployment,
  # not something a workflow author can know. And no `fatal`: emitting a line does not
  # stop a run, so a level claiming otherwise would be a lie the engine cannot honour.
  - id: canary
    log:
      level: warn
      message: canary is taking 10% of traffic; watch the error rate
      # `fields:` carry structure for a sink that has somewhere to put it, and are
      # ignored by one that does not. String-valued: everything this reaches renders to
      # text in the end, so compose the string here where you can see what it will say.
      fields:
        service: ${vars.service}
        version: ${vars.version}
        stage: canary

  - id: rollout
    for_each:
      items: [eu-west-1, us-east-1]
      as: region
      steps:
        - id: report
          log:
            message: ${'rolled out to ' + region}
            fields:
              region: ${region}

# A `log:` step has no outputs, and that is the design rather than an omission.
#
# `${steps.announce.result}` would make a log line a way of holding a value, which is
# what `vars:` is for — and it would give a step two reasons to exist, so nothing in
# the file could say which one was meant. A capability that emits nothing is how this
# language says "this produces nothing you can read".
#
# So to pass a value on, name it: `vars:` at the top of the file for something ambient,
# or on the step for something local. To publish one from a step, use the task that
# does the work.
