# A reconciler: the loop an operator framework exists to give you, as one file.
#
# The shape is wait, then observe, compare, act — and the part that makes it a
# reconciler rather than an event handler is *where the decision comes from*.
# Every pass reads the world's current state (`observed`) and compares it to the
# state this run is holding (`goal.desired`). Nothing branches on which event
# woke it up. That is what level-triggered means, and it is the property that
# makes a reconciler survivable: a notification that was never delivered, was
# delivered twice, or arrived while the process was down changes how *soon* the
# next pass happens and never what that pass decides.
#
# The wait at the *top* of the body is the whole scheduler, and its position is
# load-bearing rather than stylistic (see the retirement note below):
#
#   the deadline lapses    nothing told us anything for a resync interval, so
#                          reconcile anyway — this is the poll that catches drift
#                          nobody announced (a human scaling by hand, a node
#                          lost, a controller fighting us)
#   a signal arrives       something announced a change, so reconcile *now*
#                          rather than at the end of the interval
#
# Where the stop condition comes from, and why it is not the signal. Retirement
# is read from the control plane every pass (`observed.retired`), not from a
# `retired: true` payload — and that is the single most load-bearing decision in
# this file. A `wait_for_signal:` consumes exactly one queued delivery, oldest
# first, so a run suspended while a spec change *and* a retirement were both sent
# consumes the spec change and finds no retirement in it. A file that read
# retirement from the payload would then scale a workload whose retirement had
# already been declared — an edge-triggered mistake in the one place it does real
# damage. Asking the world instead makes the queue's order irrelevant: whatever
# woke a pass, the pass sees the workload as it actually is. The test file's
# "retired workload is never scaled, even drifted and with a spec change queued"
# case is exactly that scenario.
#
# The wait still comes first rather than last, for a smaller reason: a pass is a
# wake-up followed by a fresh reading, so nothing here ever acts on an
# observation taken before it went to sleep. The cost is that the very first pass
# waits up to one resync interval; a caller wanting an immediate first pass sends
# a `spec-changed` carrying the current desired count, which wakes it at once.
#
# `renewal-reminder` is the closest sibling in this corpus and the contrast is
# the point: there, the lapse *is* the work and the signal ends the run. Here
# both outcomes lead to the same reconcile, because a reconciler that did
# different work depending on how it woke would be edge-triggered — and an
# edge-triggered reconciler is correct exactly until the first missed edge.
#
# What this file does NOT have, and where it would go:
#
#   * an n-way `select:` (#166 shape 6). `pace` below waits for one signal or a
#     deadline, which is a two-way select spelled with the grammar that exists:
#     `timed_out` names which won. A third arm — a second signal, a cancellation
#     — is not expressible today, and that is the missing spelling #179's
#     reconciler sketch is waiting on, not the loop or the level-triggering.
#   * a `k8s.get` / `k8s.scale` task. The control plane here is reached over
#     `http:`, the same choice `enterprise-incident-response` makes: a plugin
#     task would read a little better and would make this file unrunnable
#     without a plugin process. The shape is unchanged either way, which is
#     itself worth knowing — a reconciler is not made of special verbs.
#
# The durability property this demonstrates: a run that is *asleep* between
# passes, holding the desired state and the pass count, answerable the whole
# time, and resuming exactly where it was after any worker restart. Nothing here
# holds a worker, a thread, or a connection while a resync interval elapses — a
# reconciler waiting out a thirty-second interval costs a durable timer, not a
# running process. What it is *not* is unbounded: `max_iterations` caps the total
# passes one run may make (see its own note), so a genuinely perpetual reconciler
# is one a retirement ends, or one an operator re-creates — the ceiling is
# the safety net that turns "retirement never came" into a named failure rather
# than an infinite loop.
#
#   flow test examples/deployment-reconciler/          # every path, virtual clock
#   flow run local examples/deployment-reconciler/workflow.yaml \
#     --input max_passes=1                             # one finite pass, no signal needed
#
# and durably, where the sleeping is real:
#
#   flow signal <run-id> spec-changed --payload '{"desired_replicas": 7}'
#
# (needs `flow server` and `flow worker`; see the main README's Quickstart)
edition: v2026.3
name: deployment-reconciler
description: Converges a workload toward a desired replica count, one level-triggered pass at a time, woken either by a spec change or by the resync interval lapsing — and asleep, durably, in between.
inputs:
  target:
    type: string
    default: checkout-api
    description: the workload this reconciler is responsible for
  desired_replicas:
    type: int
    default: 5
    description: the replica count to converge on at the start; a spec-changed signal carrying a valid new one replaces it for every later pass
    must: this > 0 && this <= 100
  max_passes:
    type: int
    default: 0
    # A bounded watch. Zero - the default - means "watch until the control plane
    # reports this workload retired", which is the reconciler's own semantics: a
    # converged workload is still worth watching, so only retirement ends it. A positive value ends the run after
    # that many reconcile passes instead, which is what a *scheduled* reconcile
    # wants (reconcile, report, exit) and what makes this file runnable to
    # completion with no signal at all - `flow run local` with no `--signal`
    # otherwise sits on the resync interval until `max_iterations` is spent. It
    # is what this example's own `inputs.json` sets, so the corpus harnesses run
    # a finite reconcile on both drivers rather than a run whose only path is
    # consuming a retirement.
    description: end the run after this many reconcile passes; 0 watches until the control plane reports the workload retired
    must: this >= 0 && this <= 1000
steps:
  - id: opened
    description: A step before the loop, so a run that suspends before its first deadline has something to have carried across the handover.
    log:
      message: ${"reconciling %s toward %d replica(s)".format([inputs.target, inputs.desired_replicas])}
  - id: reconcile
    description: One pass per iteration - wait for a tick or a change, then observe, compare, and converge unless the pass is a retirement.
    loop:
      # Two things travel between passes, so the carried state is a map: the
      # replica count this reconciler is currently responsible for, and how many
      # passes have run. `loop-accumulate` is the file that introduces the map
      # shape.
      as: goal
      init:
        desired: ${inputs.desired_replicas}
        passes: 0
      # The desired count carried forward is whatever this pass settled on:
      # `next_desired` below, which is the validated signal value on a pass that
      # received one and the unchanged current value on every other pass. A pass
      # that woke on the resync interval carries the same number forward — which
      # is exactly why the interval lapsing is not a no-op: the *observed* side
      # may have moved even when the desired side did not.
      update:
        desired: ${steps.next_desired.value}
        passes: ${goal.passes + 1}
      # What ends a reconciler is being told the workload is retired — or, for a
      # deliberately finite watch, spending the `max_passes` budget its caller
      # asked for. Converging is not a stopping condition either way: a workload
      # that matches its spec right now is the ordinary state of a healthy
      # system, and a reconciler that exited there would stop watching at the exact moment it
      # had nothing to complain about.
      # Retirement, or the pass budget being spent. `goal.passes` is the count of
      # passes *before* this one (`update:` increments after `until:` is
      # evaluated), so `+ 1` is what this pass makes — a `max_passes` of 1 stops
      # after one reconcile. The budget arm is skipped entirely when `max_passes`
      # is 0, which is the watch-until-retired default.
      until: ${steps.retiring.value || inputs.max_passes > 0 && goal.passes + 1 >= inputs.max_passes}
      # A ceiling on the total passes one run may make, and it is cumulative for
      # the life of the run rather than per Continue-As-New segment: the engine
      # carries the iteration index across every segment seam (engine's runLoop
      # resumes from the frame's NextIteration), so this is a lifetime bound, not
      # a per-segment one. A reconciler is normally ended by a retirement signal
      # long before it; the ceiling exists so that "retirement never arrived" is
      # a *named* failure (LoopExhausted) rather than a loop that runs forever.
      # A workload meant to be reconciled for months lives across runs an
      # operator re-creates, or raises this toward the schema's own maximum; it
      # is deliberately not framed as "one process for a year", because no single
      # run is that.
      max_iterations: 1000
      steps:
        # The wait, first — the scheduler, and the only place a retirement is
        # consumed. A durable timer with an interrupt on it: the resync interval
        # is the ceiling on how long this reconciler can be wrong without
        # noticing, and the signal is how a system that already knows says so
        # sooner. Thirty seconds is a demo's interval; a real one is minutes, and
        # the file reads identically at either.
        - id: pace
          wait_for_signal:
            name: spec-changed
            timeout: 30s

        # Which of the two woke us. It decides whether a *spec change* is on
        # offer, and nothing else — see `retiring` below for why it no longer
        # decides whether this workload is finished.
        - id: notified
          value: ${!steps.pace.timed_out}

        # The level, read every pass before anything is decided — including
        # whether this reconciler is finished. Unconditional because it is a
        # read: only writes need gating, and this read is what the gate is made
        # of.
        - id: observed
          timeout: 10s
          # A read, so it is safe to retry: nothing on the far side changes
          # because this ran twice, and a control plane having a bad second
          # should not end a reconciler. Note what this retry is *not* for -
          # see `expect:` below.
          retry:
            attempts: 3
            interval: 1s
            backoff: 2.0
            max_interval: 10s
          http:
            # An HTTP response is untyped until something says otherwise, and
            # every step below treats these two values as a number and a
            # boolean. A control plane answering `{"retired": "false"}` - a
            # string, from a flaky serializer or a proxy's error page - would
            # otherwise satisfy this step and then fail in `retiring`'s boolean
            # context or in the loop's `until:`, ending the reconciler with a
            # CEL type error several steps away from the thing that was wrong.
            # So the shape is checked at the boundary, in the same spirit as the
            # guards on the signal payload: this is the other untrusted input,
            # and it was left unchecked when retirement moved from the payload
            # to the world.
            #
            # JSON has one number type, so a replica count arrives as a double
            # even when it was written `2`; accepting either CEL numeric type is
            # what makes this a shape check rather than an accident of the
            # decoder. A stubbed run never evaluates `expect:` at all - a stub
            # replaces the task - so the first thing to catch an int-only check
            # here was the cross-driver harness running against the stand-in.
            #
            # `expect:` rather than a defaulting expression in `outputs:`,
            # deliberately. A wrong-typed reading is not a missing one: coercing
            # it would invent a `replicas` this reconciler then converges
            # toward, which is a wrong write rather than a refused read. A failed
            # expectation is permanent by design - the author has said what a
            # correct answer looks like, and repeating the request will not
            # change the endpoint's mind - so this fails the step by name and
            # does not spend the retries above on it.
            expect: |-
              ${response.status_code == 200 && has(response.json.replicas) && (type(response.json.replicas) == type(0) ||
              type(response.json.replicas) == type(0.0)) && has(response.json.retired) &&
              type(response.json.retired) == type(true)}
            method: GET
            outputs:
              replicas: ${response.json.replicas}
              retired: ${response.json.retired}
            parse_json: true
            query: '${{"name": inputs.target}}'
            url: https://control-plane.internal.example.com/workloads/status

        # Retirement is a fact about the workload, not about the event that woke
        # us — and reading it from the world rather than from a payload is the
        # whole point of this file, which an earlier version got wrong.
        #
        # A `wait_for_signal:` consumes exactly one delivery, oldest first
        # (engine's takePendingSignal walks the carried queue in arrival order;
        # the local driver reads one from its channel). So a run that was
        # suspended while a spec change *and* a retirement were both sent would
        # consume the spec change, see no retirement in that payload, and scale a
        # workload whose retirement had already been declared. Asking the control
        # plane instead makes the queue's order irrelevant: whatever woke this
        # pass, the pass sees the workload as it actually is.
        #
        # This is the level-triggered discipline applied to the stop condition,
        # and it is why a signal here only ever changes *when* a pass happens.
        - id: retiring
          value: ${steps.observed.retired}

        # The desired count this pass converges on. A spec change is the one
        # thing a signal legitimately carries, and it is still an untrusted
        # input: adopted only when it is an int in the same (0, 100] range the
        # input constraint enforces, and never on a retiring pass. Several queued
        # changes are applied oldest-first, one per pass, which converges — a
        # stale desired count for one interval is not a wrong mutation, it is a
        # slower correct one.
        - id: next_desired
          value: "${(steps.notified.value && !steps.retiring.value && has(steps.pace.payload.desired_replicas) &&\ntype(steps.pace.payload.desired_replicas) == type(0) && steps.pace.payload.desired_replicas > 0 &&\nsteps.pace.payload.desired_replicas <= 100) ? steps.pace.payload.desired_replicas : goal.desired}"

        # The comparison, named once, read by the step that acts and by the
        # output that counts.
        - id: drift
          value: ${steps.observed.replicas != steps.next_desired.value}

        # The act, and the only step here that changes anything. Gated on the
        # workload not being retired and on there being drift to correct: a
        # retired workload is never written to, and a converged one is not
        # written to on every resync.
        - id: converge
          if: ${!steps.retiring.value && steps.drift.value}
          timeout: 10s
          retry:
            attempts: 3
            interval: 1s
            backoff: 2.0
            max_interval: 10s
          http:
            json: '${{"name": inputs.target, "replicas": steps.next_desired.value}}'
            method: POST
            outputs:
              accepted: ${response.json.accepted}
            parse_json: true
            url: https://control-plane.internal.example.com/workloads/scale
  - id: observations
    value: ${steps.reconcile.results.map(p, p.observed.replicas)}

  # How many reconcile passes actually observed, named once for the two outputs
  # that ask.
  - id: pass_count
    value: ${steps.observations.value.size()}
outputs:
  passes:
    value: ${steps.pass_count.value}
    description: how many reconcile passes ran; every pass reads the control plane, including the one that finds the workload retired
  passes_that_acted:
    value: ${steps.reconcile.results.filter(p, has(p.converge)).size()}
    description: how many of those passes found drift and wrote to the control plane — the rest observed a converged workload and did nothing, which is the state a healthy reconciler spends most of its life in
  final_desired_replicas:
    value: ${steps.reconcile.state.desired}
    description: the replica count this reconciler was responsible for when it stopped, after every valid spec change it was told about
  final_observed_replicas:
    value: ${steps.observations.value[steps.pass_count.value - 1]}
    description: what the control plane last reported, which is the claim about the world rather than about this run's intent
