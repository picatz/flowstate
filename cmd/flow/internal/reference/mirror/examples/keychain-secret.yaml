edition: v2026.2
name: authenticated-health-check

steps:
  # A keychain: reference names an account within the configured service. The
  # worker resolves it inside the activity that needs it, by shelling out to the
  # macOS "security" tool with no shell involved — the account is one argument,
  # never something a shell reinterprets.
  - id: health
    http:
      url: https://api.example.com/status/200
      bearer: ${secret('keychain:github-token')}
      expect: ${response.status_code == 200}
