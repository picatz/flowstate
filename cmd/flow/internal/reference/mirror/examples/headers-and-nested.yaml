edition: v2026.3
name: headers-and-nested
vars:
  nested: '${{"outer": {"inner": "value"}}}'
steps:
  - id: web
    http:
      headers:
        X-From: Flowstate
        X-Env: dev
      method: GET
      url: https://httpbin.org/anything
  - id: report_status
    log:
      message: ${string(steps.web.status_code)}
  - id: pick
    log:
      message: ${vars.nested["outer"]["inner"]}
