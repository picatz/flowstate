# `continue_on_error:` and `retry:` can name failure kinds, so a step tolerates
# and retries the failures it expects and nothing else.
#
#   continue_on_error: [Kind, ...]   tolerate only these kinds; any other failure
#                                    ends the run. `true` still tolerates all.
#   retry: {only: [...]}             retry only these kinds
#
# A kind is a built-in kind (`Upstream`, `Timeout`, `RateLimited`,
# `PolicyDenied`, ...) or one the workflow declares under `errors:`. `only:`
# only narrows: a kind that is never retried (`PolicyDenied`, `InvalidInput`, any
# declared error) cannot be made retryable by naming it, and `flow validate`
# refuses the list that tries, because it would promise a retry that never
# happens. A misspelled kind is refused with the nearest real one.
edition: v2026.4
name: failure-kinds
steps:
  # Retry what is transient, but never hammer a rate limit: `RateLimited` is
  # retried by default, and `only:` names the kinds worth another attempt, which
  # leaves it out. Nothing listens on this port, so the call is refused:
  # `PolicyDenied` under the default egress policy, which denies loopback, or
  # `Upstream` once an operator allows it. The step tolerates both by name, and
  # nothing else.
  - id: notify
    retry:
      attempts: 3
      interval: 100ms
      only:
        - Upstream
        - Timeout
    continue_on_error:
      - PolicyDenied
      - Upstream
      - RateLimited
    http:
      url: http://localhost:1/hook
      method: POST

  # The same list on a step that tolerates less: a rate limit is neither retried
  # nor tolerated here, so it ends the run.
  - id: sync
    retry:
      attempts: 3
      interval: 100ms
      only:
        - Upstream
        - Timeout
    continue_on_error:
      - PolicyDenied
      - Upstream
    http:
      url: http://localhost:1/sync
      method: POST

  # Reached only because the failures above were tolerated kinds. Any other kind
  # of failure from either step would have ended the run instead.
  - id: carry_on
    log:
      message: notifications refused, continuing
      fields:
        kind: ${steps.notify.failure.kind}
