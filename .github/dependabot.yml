version: 2

# Without this file only Dependabot's security alerts run, and those open a pull
# request for the vulnerability rather than keeping anything current. The
# difference showed up the hard way: GO-2026-6061 landed against a pinned
# `google.golang.org/grpc`, and the first anyone knew of it was `vulncheck` going
# red on an unrelated pull request whose author then had to work out that the
# finding was not theirs. A scheduled bump would have arrived on its own branch,
# named the advisory, and been reviewable as what it is.
updates:
  # The module graph. Grouped, because a Go dependency bump is rarely interesting
  # on its own and twelve separate pull requests for one week's patch releases is
  # how people learn to merge them without reading.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Kept apart from everything else: these three move together, and a bump to
      # one that leaves the others behind is how a build breaks in a way that
      # looks like a code problem.
      temporal:
        patterns:
          - go.temporal.io/*
      # Patch and minor together — the ordinary background noise of a Go module
      # graph, which is safe to review as one thing.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # This one module fails the whole run, which is the reason it is worth a
      # dozen lines of explanation rather than a silent entry.
      #
      # `charmtone` is a nested module: it lives at
      # github.com/charmbracelet/x/exp/charmtone inside the
      # github.com/charmbracelet/x repository but publishes its own versions,
      # and we depend on it at a pseudo-version. Dependabot's Go updater
      # resolves it to the parent module instead, asks for
      # github.com/charmbracelet/x@v0.1.0, and reports that the version it
      # picked "does not contain package github.com/charmbracelet/x/exp/charmtone"
      # — which is true, and not a fact about this repository.
      #
      # An updater error is not scoped to the dependency that caused it. The
      # run aborts, so the grouped bump above never opens, and the scheduled
      # updates this file exists to produce stop arriving with nothing saying
      # so. That is the failure mode described at the top of this file, with
      # the alarm disabled instead of the alert missing.
      #
      # So the module is skipped and everything else keeps flowing. The cost is
      # real and worth naming: charmtone no longer gets bumped automatically,
      # so it needs updating by hand — `go get -u
      # github.com/charmbracelet/x/exp/charmtone` — until upstream tags it in a
      # way the updater can resolve, at which point this entry should go.
      - dependency-name: github.com/charmbracelet/x/exp/charmtone

  # The workflows themselves, which are code that runs with a token and is
  # currently referenced by moving tags. Keeping this here is what makes pinning
  # actions to commit SHAs maintainable rather than a thing that rots: Dependabot
  # updates a pinned SHA and says which release it corresponds to, whereas a
  # human doing it by hand stops after the first month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
