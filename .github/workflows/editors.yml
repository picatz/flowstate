name: Editors

# Does the editor setup in docs/EDITORS.md actually work?
#
# Setup instructions are the one kind of documentation that rots without anybody
# noticing. Nothing fails when they go stale — the person they fail for is a
# newcomer who never files a bug about it, and by the time somebody does, the
# instructions have been wrong for a year. So the Neovim configuration is not
# quoted into the document and hoped over: it is a file this job loads with `-u`,
# and the probe's first assertion is that the fenced block in docs/EDITORS.md is
# that same file byte for byte.
#
# What it proves is narrow and deliberate. `flow lsp` is exercised through a real
# editor's LSP client rather than a hand-rolled JSON-RPC script, because what is
# under test is the *configuration* — the filetype patterns, the `vim.lsp.config`
# entry, the `LspAttach` wiring. A script speaking the protocol directly would
# prove the server works and say nothing about the document.
#
# ── Why this is a separate workflow, and not a job in ci.yml ──────────────────
#
# This job installs a third-party editor, and the `vscode` job below installs
# npm packages to compile and test the VS Code extension in `editors/vscode/`
# (#585). Neither belongs anywhere near a Go build, and "separate job in the
# same workflow" is not enough separation on its own, because jobs in one
# workflow share the caches keyed by that workflow's own conventions. The
# isolation here is four things, each of which is a way the boundary could leak:
#
#   1. Its own workflow file, its own `permissions: contents: read`, and no job
#      here ever needs more. Nothing in this file can write to the repository,
#      publish a package, or touch a release.
#   2. `cache: false` on setup-go, and no setup-go at all in the `vscode` job.
#      The `neovim` job builds `flow` as a *test fixture*, not as a release
#      artifact, and it must not read or write the module and build caches
#      ci.yml's jobs use. A shared build cache is a channel: a compromised
#      dependency of an editor plugin that could write into it would be
#      writing into the inputs of the jobs that decide whether Go code merges.
#      The `vscode` job never runs `go build` at all — it has no reason to
#      touch a Go cache in the first place, which is a stronger guarantee than
#      an unused one. The cost of the `neovim` job's uncached module download
#      is one download per run, on a job that runs in about a minute. That is
#      the right trade for a boundary.
#   3. Its own toolchain pin, read from go.mod like everywhere else, so it cannot
#      be the job that quietly builds `flow` with something different — but read
#      independently rather than inherited from another job's setup. The
#      `vscode` job pins Node the same way: a fixed major version in this file,
#      not inherited from anything else.
#   4. Every download pinned by digest. The actions are pinned to commit SHAs for
#      the reason ci.yml gives at length, and the Neovim tarball is pinned to a
#      release *and* verified against a recorded SHA-256 before anything in it is
#      executed. `releases/latest/download/…` is convenient and is exactly the
#      thing this workflow exists to argue against: it makes what runs in our
#      repository, with our token, a decision somebody else takes tomorrow. The
#      `vscode` job's npm install is bounded the same way this repo bounds its
#      Go module graph: `npm ci` against a committed, exact-pinned lockfile
#      (`editors/vscode/package-lock.json`, `save-exact=true` in `.npmrc`)
#      rather than `npm install`, which would let a range resolve to whatever a
#      compromised patch release publishes today.
#
# Concretely, the boundary this buys: the `vscode` job must never run `go
# build`, `go test`, or anything else that touches the Go toolchain or its
# caches, and the Go jobs in ci.yml must never run `npm`. A postinstall script
# is arbitrary code execution on whatever runs `npm ci`; the only defense that
# survives it is that the runner it executes on can reach nothing worth having
# — no repository write, no Go cache, no other job's secrets.
#
# Consequently this workflow is not required to merge and does not gate Go code.
# A red run here means the *instructions* (or the extension) are wrong, which is
# worth fixing and is not worth blocking an unrelated engine change on.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # The document, the fixtures and the probe, plus the language server and
      # everything the server's answers are derived from — a task added to the
      # registry changes what completion offers, and the probe asserts on that.
      - 'docs/EDITORS.md'
      - 'tools/editorsmoke/**'
      - 'pkg/flowstate/v1/flowfile/**'
      - 'cmd/flow/**'
      - 'editors/vscode/**'
      - 'editors/tree-sitter-cel/**'
      - 'editors/nvim/**'
      - '.github/workflows/editors.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Neovim release the instructions are written against and verified on.
  # `vim.lsp.config` needs 0.11 or later; Ubuntu 24.04's apt package is 0.9.5,
  # which is why this is a tarball and not `apt-get install neovim`.
  NVIM_VERSION: v0.12.4
  NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
  # The tree-sitter CLI that generates and tests editors/tree-sitter-cel. The
  # release binary, verified against a recorded SHA-256 before it runs, and not
  # `npm install tree-sitter-cli`, whose postinstall script downloads the same
  # binary unverified. The digest is of tree-sitter-linux-x64.gz as published
  # for this tag.
  TREE_SITTER_VERSION: v0.27.0
  TREE_SITTER_SHA256: 20a1f39ec1c45f2211492dcb8881c802b643b554bb196869a29ac3778277fa77
  # The YAML parser the Flowfile injection queries run over, fetched by commit:
  # git checks the object hash, so the content is the content of this revision
  # (tree-sitter-grammars/tree-sitter-yaml, tag v0.7.2).
  YAML_PARSER_REV: 7708026449bed86239b1cd5bce6e3c34dbca6415

jobs:
  neovim:
    name: Neovim LSP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false, for the same reason ci.yml and deep.yml
      # give: checkout otherwise leaves the job's GITHUB_TOKEN in
      # .git/config for the rest of the job, and nothing here needs it after
      # checkout. See #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Deliberately uncached — see the isolation note at the top of this
          # file. This job must not share a build cache with the jobs that gate
          # Go code. Stricter than #577's fork-PR cache fix: this is never
          # cached at all, on every trigger, not only gated for a fork PR.
          cache: false

      - name: Report toolchain
        run: go version

      - name: Install Neovim
        run: |
          set -euo pipefail
          url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --output nvim.tar.gz "$url"
          # Verified before anything inside it is unpacked, let alone executed.
          echo "${NVIM_SHA256}  nvim.tar.gz" | sha256sum --check --strict
          tar -xzf nvim.tar.gz
          echo "${PWD}/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Report Neovim version
        run: nvim --version | head -n 1

      # `flow` is a test fixture here. It goes on PATH because that is what the
      # documented `cmd = { 'flow', 'lsp' }` resolves, so the smoke test exercises
      # the same lookup a reader's editor performs rather than an absolute path
      # only CI would ever use.
      - name: Build flow
        run: |
          set -euo pipefail
          go build -o "${PWD}/bin/flow" ./cmd/flow
          echo "${PWD}/bin" >> "$GITHUB_PATH"

      - name: Drive flow lsp through Neovim
        run: nvim --clean --headless -u tools/editorsmoke/init.lua -l tools/editorsmoke/probe.lua

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      # persist-credentials: false — see the same note on the neovim job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No `cache: npm`. setup-node's npm cache is keyed off this job's own
          # package-lock.json and would not reach ci.yml's Go jobs even if it
          # were enabled — but the isolation note at the top of this file is
          # "no shared cache with the Go jobs", stated as a property to hold
          # rather than a specific cache key to avoid, so this job carries no
          # cache of any kind. The lockfile is small and `npm ci` is fast.

      - name: Report toolchain
        run: node --version && npm --version

      # Fails rather than resolving when package.json and package-lock.json
      # disagree — see .npmrc's save-exact and the supply-chain section of
      # editors/vscode/README.md. Never `npm install` here.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Unit test
        run: npm test

  tree-sitter:
    name: Tree-sitter CEL grammar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/tree-sitter-cel
    steps:
      # persist-credentials: false — see the same note on the neovim job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tree-sitter CLI
        run: |
          set -euo pipefail
          url="https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_VERSION}/tree-sitter-linux-x64.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/tree-sitter.gz" "$url"
          echo "${TREE_SITTER_SHA256}  ${RUNNER_TEMP}/tree-sitter.gz" | sha256sum --check --strict
          gunzip --stdout "${RUNNER_TEMP}/tree-sitter.gz" > "${RUNNER_TEMP}/tree-sitter"
          chmod +x "${RUNNER_TEMP}/tree-sitter"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Report CLI version
        run: tree-sitter --version

      # The parser is generated from grammar.js and not checked in, like every
      # other derived artifact here.
      - name: Generate the parser
        run: tree-sitter generate

      - name: Test the corpus
        run: tree-sitter test

      # The highlight query must compile against the generated grammar; a
      # renamed node makes `tree-sitter query` fail rather than colour nothing.
      - name: Compile the highlight query
        run: tree-sitter query queries/highlights.scm test/highlight.cel > /dev/null

  neovim-treesitter:
    name: Neovim tree-sitter injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false — see the same note on the neovim job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Neovim
        run: |
          set -euo pipefail
          url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --output nvim.tar.gz "$url"
          echo "${NVIM_SHA256}  nvim.tar.gz" | sha256sum --check --strict
          tar -xzf nvim.tar.gz
          echo "${PWD}/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install the tree-sitter CLI
        run: |
          set -euo pipefail
          url="https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_VERSION}/tree-sitter-linux-x64.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/tree-sitter.gz" "$url"
          echo "${TREE_SITTER_SHA256}  ${RUNNER_TEMP}/tree-sitter.gz" | sha256sum --check --strict
          gunzip --stdout "${RUNNER_TEMP}/tree-sitter.gz" > "${RUNNER_TEMP}/tree-sitter"
          chmod +x "${RUNNER_TEMP}/tree-sitter"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      # Both parsers are compiled from source into a runtimepath directory, the
      # layout an editor's plugin manager produces.
      - name: Build the parsers
        run: |
          set -euo pipefail
          parsers="${RUNNER_TEMP}/parsers/parser"
          mkdir -p "$parsers" "${RUNNER_TEMP}/yaml"
          git -C "${RUNNER_TEMP}/yaml" init --quiet
          git -C "${RUNNER_TEMP}/yaml" fetch --quiet --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-yaml "${YAML_PARSER_REV}"
          git -C "${RUNNER_TEMP}/yaml" checkout --quiet FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/yaml" rev-parse HEAD)" = "${YAML_PARSER_REV}"
          cc -shared -fPIC -O1 -I"${RUNNER_TEMP}/yaml/src" -o "$parsers/yaml.so" \
            "${RUNNER_TEMP}/yaml/src/parser.c" "${RUNNER_TEMP}/yaml/src/scanner.c"
          (cd editors/tree-sitter-cel && tree-sitter generate)
          cc -shared -fPIC -O1 -Ieditors/tree-sitter-cel/src -o "$parsers/cel.so" editors/tree-sitter-cel/src/parser.c
          echo "TS_PARSERS=${RUNNER_TEMP}/parsers" >> "$GITHUB_ENV"

      - name: Check the injections in Neovim
        run: nvim --headless -u NONE -l editors/nvim/test/ts_test.lua
