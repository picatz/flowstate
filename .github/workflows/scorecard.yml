name: Scorecard

# OpenSSF Scorecard is what an evaluator reads first to summarise a
# repository's supply-chain posture, and without this workflow its answer for
# this repository was "unknown" rather than the score the tree already earns:
# every action pinned to a commit, read-only tokens, Dependabot with cooldowns,
# govulncheck, fuzzing, SBOMs and attestations (#1750). This runs the official
# action on main and weekly, publishes the result so the README badge is live,
# and uploads the SARIF so the findings appear under the repository's code
# scanning alerts beside CodeQL's.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, off the hour, so it does not contend with the deep tier.
    - cron: '37 6 * * 1'
  workflow_dispatch:

# Read-only by default; the one job that needs more says so itself.
permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    # Bounded like every other job here: the Scorecard API or the SARIF
    # upload stalling must not hold a runner until the platform default.
    timeout-minutes: 20
    permissions:
      # The action reads the repository, its branch protection and its
      # workflows; publishing to the Scorecard API signs the result with an
      # OIDC token, and the SARIF upload writes a code scanning alert.
      contents: read
      actions: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the badge and the public dashboard
          # reflect this tree rather than "unknown". It is only honoured on
          # the default branch, and the action refuses it on a fork.
          publish_results: true

      - name: Upload the SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: results.sarif
