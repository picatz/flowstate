name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go.mod pins a patched toolchain via its `toolchain` directive. Reading the
      # version from go.mod keeps CI on exactly what local builds use, so a
      # toolchain-level security fix cannot be present locally and missing here.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Report toolchain
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Separate from the test job so a newly disclosed vulnerability is reported
      # as its own failure rather than looking like a broken test. This checks
      # reachability, not mere presence, so it fails only when our code can
      # actually reach the vulnerable path.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
