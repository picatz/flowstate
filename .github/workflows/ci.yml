name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue. #489's lesson — four pull requests merged inside ninety
  # seconds broke main, because each one's CI proved only "this branch merged
  # with the main that existed when the run started" — was, until now,
  # implemented as a human waiting between merges. That is a mechanism made of
  # attention, and it costs a full six-minute main cycle per merge: twenty-five
  # merges in one evening is two and a half hours of somebody watching.
  #
  # A merge queue is the mechanism that lesson deserved. GitHub builds the
  # *prospective* merge — this pull request on top of everything ahead of it in
  # the queue — and runs the required checks against that, which is precisely
  # the artifact #489 says nothing was testing. It also batches, so N pull
  # requests cost roughly N/batch-size runs rather than N serialized cycles, and
  # a failure ejects the offending pull request instead of breaking main.
  #
  # Every merge_group run is a full run: see ciForceReason in tools/gate/ci.go.
  # The diff-scoping below is a pull-request-lane optimisation, and the queue is
  # the last gate before main, so main's protection never rests on the plan
  # being right.
  merge_group:

# Read-only by default, and every job inherits it. A workflow that needs to write
# something should say so on the job that needs it rather than here, so a token
# able to push is never one step away from a step that did not ask for one.
permissions:
  contents: read

# Pinned rather than @latest, so what CI runs is decided by a commit here instead
# of by whatever was published this morning. A toolchain that changes underneath
# an unrelated pull request turns someone else's release into your red build, and
# the person who has to work out why is never the person who caused it.
#
# The actions used in the jobs below are pinned the same way, and for a second
# reason as well. A tag is a mutable pointer that the action's own repository
# controls: `@v4` is whatever that repository decides `v4` means at the moment
# this workflow runs, and these steps run in our repository with our token.
# Pinning a commit makes the code that runs a decision recorded here rather than
# one taken elsewhere afterwards. The trailing comment names the release the SHA
# is, because forty hex characters tell a reviewer nothing on their own — and
# Dependabot's github-actions entry updates the SHA and that comment together,
# which is what keeps this current rather than merely frozen.
#
# govulncheck still reports newly disclosed vulnerabilities while pinned: the
# advisory database is fetched at run time, so only the analyser is fixed here.
# That is the split worth having — reproducible tool, current facts.
env:
  BUF_VERSION: v1.72.0
  GOVULNCHECK_VERSION: v1.6.0
  STATICCHECK_VERSION: 2026.2.1
  VHS_VERSION: v0.11.0
  TTYD_VERSION: 1.7.7
  TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55

# Only the newest commit on a branch is worth testing. Pushing three times in a
# minute otherwise runs three full matrices and the first two answer questions
# about code nobody has any more — the Temporal dev-server tests make those runs
# minutes of billed compute, not seconds.
#
# main is deliberately excluded from cancellation: its runs are the record of
# whether a commit was good when it landed, and cancelling one leaves a gap in
# that record rather than saving anything worth having. A merge group is
# excluded for a sharper reason: cancelling one does not save work, it strands
# the queue — the required checks for that group never report, and everything
# behind it waits on an answer that is never coming.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  # ── Which of the jobs below can this diff actually reach? ─────────────────
  #
  # A pull request changing one markdown file used to run appearance,
  # fuzz-smoke, proto, staticcheck and test. None of those can be affected by
  # that file, and around twenty-five such runs went through in a single
  # evening.
  #
  # The rule that decides it is not written here. `tools/gate` already computes
  # the changed files against the merge-base with origin/main, maps them to Go
  # packages, and expands to every package whose build *or tests* can see a
  # changed one — including the two cases a path filter cannot express at all:
  # a package reached only through the import graph, and a package that reads
  # examples/ off disk with no import anywhere (#589). `go run ./tools/gate -ci`
  # points that same computation at this file's jobs.
  #
  # Writing `paths:` filters here instead would be this repository's
  # most-repeated defect — one value written down twice — in its worst venue:
  # the copy in YAML cannot be unit tested, cannot see the import graph, and
  # drifts in silence. tools/gate/ci_test.go pins this file's job list against
  # the plan's, so the two cannot drift apart without a test failing.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.plan.outputs.test }}
      proto: ${{ steps.plan.outputs.proto }}
      vulncheck: ${{ steps.plan.outputs.vulncheck }}
      staticcheck: ${{ steps.plan.outputs.staticcheck }}
      fuzz_smoke: ${{ steps.plan.outputs.fuzz_smoke }}
      appearance: ${{ steps.plan.outputs.appearance }}
      # The same answers again as one JSON object, which is what the verdict
      # job reads. Deliberately the *same* object the `if:` expressions on the
      # jobs below are driven from: a verdict computed from a second source
      # could agree with a plan nobody ran.
      decisions: ${{ steps.plan.outputs.decisions }}
    steps:
      # fetch-depth: 0 rather than the shallow default, because a merge-base
      # does not exist in a one-commit history. It costs nothing here — the
      # pack is about five megabytes over three hundred-odd commits — and it is
      # the difference between asking "what did this branch change" and
      # guessing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # persist-credentials / cache: — see the test job below. #577.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # `+main:` forces the local ref, so a rerun on a branch whose base has
      # moved does not fail on a non-fast-forward. Unauthenticated because
      # persist-credentials: false left no token behind, which is fine for a
      # public repository and is exactly what the test job's own base fetch
      # already relies on.
      - name: Fetch the base branch the plan is computed against
        run: git fetch --no-tags origin +main:refs/remotes/origin/main

      # -ci prints one line per job saying it runs or why it does not, writes a
      # table to the run summary, and publishes the decisions as outputs. It
      # runs no checks and fails on no finding: a wrong answer here is a job
      # that did not run, and the verdict job is what turns that into red.
      #
      # The event name arrives through GITHUB_EVENT_NAME, which Actions sets.
      # Anything other than pull_request forces the full set — see
      # ciForceReason.
      - name: Which jobs can this diff reach
        id: plan
        run: go run ./tools/gate -ci

  test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    # A hung job otherwise runs to the six-hour default. The root suite, six
    # separately cached plugin modules, and ordering rehearsal are each bounded
    # below, but a dependency bump changes every cache key and legitimately puts
    # their cold paths in one run. Twenty-five minutes leaves that run headroom
    # without letting a stuck dev server or wedged test consume the default six
    # hours — the same reasoning the engine applies to a step's own timeout.
    timeout-minutes: 25
    steps:
      # persist-credentials: false everywhere in this workflow (and deep.yml,
      # and editors.yml): checkout otherwise leaves the job's GITHUB_TOKEN in
      # .git/config for the rest of the job, readable by anything that later
      # runs in this workspace. Nothing here needs git-authenticated network
      # access after checkout, so there is no reason for that token to sit
      # somewhere a compromised dependency could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.mod pins a patched toolchain via its `toolchain` directive. Reading the
      # version from go.mod keeps CI on exactly what local builds use, so a
      # toolchain-level security fix cannot be present locally and missing here.
      #
      # cache-dependency-path names the plugin modules' go.sum files as well as
      # the root one, because this job is the only one that builds them and
      # setup-go's default key is the root go.sum alone. Without them the five
      # plugin modules resolve and download their whole dependency graph on
      # every run — which is why "Test plugin modules" takes ten to twenty
      # minutes here against roughly one hundred seconds locally, on a job whose
      # whole budget is fifteen. A separate module is the point of a plugin; the
      # cost of that boundary is that its dependencies have to be cached
      # deliberately rather than by default.
      #
      # `cache:` below turns off *saving* to that cache for a fork PR's run,
      # while leaving restore alone. setup-go's default caching issues a cache
      # write token regardless of this job's `permissions:` block — cache
      # scoping is a property of the ref, not of what the workflow declares —
      # so contents: read does not touch it. Every job in this workflow runs
      # `go test`, `go vet`, or a `go run pkg@pinned-version` that builds
      # third-party code fresh, and a fork PR is the one context here where
      # that third-party code is untrusted. A poisoned entry a fork PR's run
      # planted would still need a same-repo run to *save* it before anything
      # trusted could restore it, so gating the save is what closes the gap; a
      # same-repo push or PR keeps a warm cache exactly as before, and a fork
      # PR pays full build cost instead of getting a write path into it. Same
      # fix on every setup-go step below. See #577.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            plugins/*/go.sum
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Report toolchain
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Cheap, and it stays cheap only while it is enforced. Two files had drifted
      # out of gofmt before this step existed, which nothing failed on and nobody
      # saw — formatting noise then rides along in the next real diff and makes it
      # harder to review than it needed to be.
      - name: Format
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd; run 'gofmt -w' on:"
            echo "$unformatted"
            exit 1
          fi

      # `make test`, not a second copy of the command, so the memory and time
      # bounds cannot drift between here and the loop a contributor runs
      # locally. CLAUDE.md's rule is that the Makefile *is* what CI runs.
      - name: Test
        run: make test

      # The plugins are separate Go modules, which is the point of them: a plugin
      # owns its dependencies so an operator decides whether to trust them, and
      # nothing a plugin needs reaches the engine's own go.mod.
      #
      # The cost of that boundary is that `./...` from the root does not cross it.
      # Every check above would stay green with a plugin that does not compile, so
      # the modules are walked explicitly. Found by looking rather than by a
      # failure, which is the only way this class is ever found — a module nobody
      # builds is not red, it is absent.
      - name: Test plugin modules
        run: make test-plugins

      # The module tests prove each plugin in isolation. This joins them to the
      # author-facing surface: build every binary, diff the descriptors and
      # security claims against the reviewed catalog, and validate every plugin
      # example without credentials or network access.
      - name: Validate plugin examples against the reviewed catalog
        run: make plugin-examples

      # A different schedule, not a longer one. The step above runs at the
      # runner's GOMAXPROCS, where the local harness's virtual clock reaches
      # only the interleavings parallelism happens to produce; GOMAXPROCS=1
      # reaches the ones it does not. Cheap enough to sit in this job rather
      # than earn one of its own — see the Makefile target for why it is
      # scoped to the package whose every claim is an ordering claim.
      - name: Ordering claims hold under a different schedule
        run: make test-ordering

      # The same mechanism as the proto job's generated-code check, on the four
      # reference documents that are derived rather than written: the task
      # reference from the registry, the CLI reference from the cobra tree, the
      # MCP tool list, and the env-var table. Those four are exactly the tables
      # the doc audit found had drifted, and they drift silently — a task gains a
      # field, a flag gains an env default, and the prose stays confidently wrong
      # until somebody follows it and fails.
      #
      # Here rather than in the proto job because what it pins is Go values, not
      # the schema: `flow docs generate` runs the binary, so a failure here is a
      # tree whose documentation disagrees with its own code.
      - name: Verify generated reference docs are current
        run: |
          go run ./cmd/flow docs generate
          git diff --exit-code -- docs/reference/ || {
            echo "::error::generated reference docs do not match the code; run 'make docs' and commit the result"
            exit 1
          }

      # `flow fix --check` is the command this exists to protect: examples are
      # already in the current edition, and a PR that leaves one behind should fail
      # here rather than at the next person's `flow fix .`. Not advisory — the
      # examples are clean today, so a failure here is a real regression.
      #
      # The whole directory, not `examples/*/workflow.yaml`: that single-level
      # glob matched 32 of the 54 `.yaml`/`.yml` files under examples/, so every
      # plugin example and both policy files were never checked — which is how
      # `examples/call-a-workflow/workflow.test.yaml` drifted for a released
      # edition before anyone noticed (#203). `flow fix` itself, not this glob,
      # is what keeps the walk from touching `egress-policy.yaml` or an
      # auth-policy.yaml: it selects a file by its own top-level shape
      # (`steps:` or `tests:`), so a policy file or an observability config
      # under examples/ is never even handed to the rewriter.
      - name: Examples are in the current edition
        run: go run ./cmd/flow fix --check examples/

      # Tier 4 of the style charter (docs/STYLE.md, Part II), over the corpus R8
      # holds to `shown ⊆ canonical`. Enforcing since #646's corpus slice: the
      # 21 findings the check landed with (#865, measured in Part III) are
      # resolved, so `--strict` makes a finding an exit code and there is no
      # `continue-on-error` to swallow it.
      #
      # That is the charter's own staging finished rather than a promotion of
      # the tier: `flow lint` still exits 0 on findings by default everywhere
      # else, and nothing here refuses a file. What is enforced is narrower and
      # is a repository property rather than a language one — *the shown corpus*
      # stays in the style the corpus is cited as an example of, so a new
      # example cannot land carrying a shape docs/STYLE.md tells readers not to
      # write.
      #
      # The half of R8 that is not this step needs no step here: the fenced
      # Flowfiles in README.md, docs/DSL.md, docs/ARCHITECTURE.md and
      # docs/STYLE.md are linted by TestShownWorkflowsAreLintClean in the test
      # run above, and they are clean.
      - name: Examples in the canonical style
        run: go run ./cmd/flow lint --strict examples/

      # `flow test` is the reachability gate for #155: at least one example's
      # own *.test.yaml runs here, so "a workflow can test itself" is a claim
      # this job checks rather than one the design doc merely makes.
      # examples/call-a-workflow is the one that matters most — it stubs the
      # tasks inside a *called* workflow, which is the composition #155 exists
      # to make trustworthy.
      #
      # --coverage-required opts the corpus into #420's branch coverage: a step
      # no case reaches fails here unless the file records why under
      # coverage.allow_unreached (the three enterprise gates on !run.local are
      # the only residuals, reachable only against a real server).
      - name: Example workflows pass their own tests, every branch reached or reasoned
        run: go run ./cmd/flow test --coverage-required examples/

      # `flow breaking` is `buf breaking` one level up: a workflow's declared
      # inputs and outputs are a contract, and composition vendors a callee at
      # compile time (#172), so an interface break strikes the callee author's
      # next compile rather than a running spec. This closes that gap where `buf
      # breaking` closes it for the proto, in the callee author's own CI. The
      # comparison is against origin/main, which the default checkout does not
      # fetch, so it is fetched explicitly here (the proto job takes fetch-depth:
      # 0 for the same reason). `+main:` matters on a rerun: checkout has already
      # created origin/main at the run's original commit, and main may have moved
      # since, so an unforced shallow fetch rejects the update as non-fast-forward
      # before the breaking check can run. A break fails the same way validate
      # does.
      - name: Fetch base branch for the breaking check
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
      - name: Example workflow contracts did not shrink against main
        run: go run ./cmd/flow breaking --against origin/main examples/

      # The observability lab is eight services of other people's software, so
      # standing it up here would make this repository's build depend on seven
      # registries and a Temporal cluster coming up in time. What is checked is
      # what is ours: that the compose file parses and resolves — a broken YAML
      # anchor, an unknown key, a service naming a volume that does not exist.
      # `config` is a client-side operation: no daemon, no pulls, under a second.
      # The full-stack smoke is a manual step, written out in the lab's README.
      - name: Observability lab compose file resolves
        run: docker compose -f examples/observability/docker-compose.yaml config -q

  # The schema is a public contract, not an internal detail: plugins are separate
  # processes that compile against these descriptors, so breaking it breaks every
  # plugin in the wild rather than producing a compile error someone can see. That
  # is why this is its own job — a schema failure is not a broken test.
  proto:
    needs: plan
    if: needs.plan.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false — see the test job above; same reason here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against the base branch, which has to be present.
          fetch-depth: 0
          persist-credentials: false

      # cache: — see the test job above; fork PRs restore but don't save. #577.
      #
      # cache-dependency-path names .github/cache-scope/proto beside go.sum so
      # this job's build cache has a key of its own. Six jobs asking for one
      # key means one of them saves and the other five are told the key is
      # taken, so `buf` was rebuilt from source most runs — fifty-two seconds
      # of the Lint step below. The file's contents are arbitrary; only their
      # difference from the other jobs' matters. See the README beside it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/cache-scope/proto
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Forty-three rules, all of them enforced everywhere.
      #
      # This step was absent because six pre-existing violations would have made it
      # red on arrival, and a red build everyone learns to ignore is worse than no
      # build. All six were one rule pair in one file — the plugin protocol's
      # request and response messages not being named after their methods — so the
      # pair was suppressed for that file and the other forty-one enforced, rather
      # than trading forty-one rules for six known violations.
      #
      # The protocol has its own package now, which is what made the names it asks
      # for the right ones, so both the violations and the suppression are gone.
      - name: Lint
        run: go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} lint

      # proto/buf.yaml has declared FILE and WIRE breaking rules from the start and
      # nothing ran them.
      - name: Check for breaking changes
        run: go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} breaking --against '.git#branch=origin/main'

      # Generated code is committed, so it can disagree with the schema it came
      # from. That disagreement is invisible locally — the build stays green using
      # the stale generated code — and shows up as a mystery when someone else
      # regenerates. Several people editing one schema at once makes this likely
      # rather than theoretical.
      #
      # Two artifacts, one pin. The second is the descriptor set the schema's
      # comments travel in: protoc strips SourceCodeInfo from what a .pb.go
      # embeds, so a runtime descriptor has shape and no prose, and `buf build`
      # is the command that keeps the comments. It is written here, beside the
      # generated code, so the same `git diff --exit-code` catches a set that
      # describes a schema which has since moved. --exclude-imports keeps it to
      # this repository's own schema rather than googleapis and protovalidate.
      #
      # The third is the same artifact for the example plugin's own schema,
      # which is what carries a plugin author's field comments to an editor
      # (#723). It is a separate buf module, so it needs its own build; it is
      # under the same pin, because a plugin's prose can go stale exactly the
      # way the engine's can.
      - name: Verify generated code is current
        run: |
          go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} generate
          go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} build --exclude-imports -o pkg/flowstate/v1/protodoc/flowstate.descriptorset.binpb
          go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} build --exclude-imports -o pkg/flowstate/v1/plugin/examples/flowstate-plugin-example/schema.descriptorset.binpb pkg/flowstate/v1/plugin/examples/flowstate-plugin-example/proto
          git diff --exit-code -- . || {
            echo "::error::generated code does not match the schema; run 'make check' (or 'buf generate' plus the 'buf build' line beside it) and commit the result"
            exit 1
          }

  vulncheck:
    needs: plan
    if: needs.plan.outputs.vulncheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials / cache: — see the test job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Separate from the test job so a newly disclosed vulnerability is reported
      # as its own failure rather than looking like a broken test. This checks
      # reachability, not mere presence, so it fails only when our code can
      # actually reach the vulnerable path.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # Required, as of the end of its 48h advisory window. It landed advisory because
  # the govulncheck lesson generalizes to any newly-added check — a check nobody
  # has run against this tree yet can go red on code nobody touched, and a red
  # build everyone learns to ignore is worse than no build. The window did what it
  # was for: the 22 findings it surfaced were read and settled on their merits —
  # dead code deleted, one duplicated helper removed, and the handful that were
  # the point of a test kept with a `//lint:ignore` saying why. The tree is at
  # zero, so from here a finding is something this diff introduced.
  staticcheck:
    needs: plan
    if: needs.plan.outputs.staticcheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials / cache: — see the test job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cache-dependency-path: a key of this job's own, so staticcheck's own
      # build is cached against itself rather than against whichever job won
      # the shared key that run. This is the job the contention cost most:
      # eighty-five seconds of the step below was building staticcheck from
      # source. See .github/cache-scope/README.md.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/cache-scope/staticcheck
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Same toolchain pin as govulncheck, and for the same reason: staticcheck's
      # own go.mod selects a toolchain older than go.mod's, so without the pin it
      # downgrades underneath itself and then fails type-checking the standard
      # library vendored into the newer toolchain's module cache — not a finding
      # about this tree at all.
      #
      # STATICCHECK_VERSION above moves with this pin rather than independently:
      # a release older than the toolchain cannot decode its export data, and
      # says so per standard-library package instead of reporting findings. See
      # CLAUDE.md.
      - name: Static analysis
        run: GOTOOLCHAIN=go1.27.0 go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} ./...

  # The real-issuer OIDC check used to live here as a job gated on the auth
  # package being affected. It moved to federation.yml (push to main only)
  # rather than staying a conditional PR job: `id-token: write` combined with a
  # checkout of the pull request's own head let PR-authored code request and
  # exfiltrate a live GitHub Actions OIDC token, and no `if:` condition closes
  # that — the job still has to check out attacker-controlled code to decide
  # whether to run the privileged step in the first place. Verifying the real
  # issuer only after code has reached the protected main branch removes the
  # untrusted-code precondition entirely rather than gating around it. See
  # federation.yml for the check itself and why it deliberately has no
  # pull_request trigger.
  #
  # This also means the `federation` name is no longer one of the jobs the
  # plan can select and `verdict` aggregates — removing it here, from `plan`'s
  # outputs above, and from `verdict`'s `needs:` below is the whole change;
  # verdict already needs nothing job-specific to reflect that, since it fails
  # unless every job the plan *did* select succeeded and every job it did not
  # select was skipped.

  # Bounded per CLAUDE.md's fuzz recipe: `-parallel 1` and a memory limit because a
  # fuzzer's purpose is to find the input that explodes, `-fuzztime 30s` per target
  # because that bounds time and not memory. Six targets now: the round-trip one
  # that existed first, the three the roadmap called for — CEL compile, MCP
  # tool-argument decode, plugin descriptor parsing — the marshal round trip added
  # with #513's escape, and FuzzWebhookEventBinding added for #799. The marshal round trip is
  # not a duplicate of the first: FuzzRoundTrip explores whole documents and
  # asserts the workflow survives, while this one varies one scalar in a fixed
  # document and asserts the two things that failed independently of proto
  # equality — that the bytes written still validate, which is `flow fmt`'s whole
  # promise, and that marshalling twice is a fixed point. FuzzWebhookEventBinding
  # is not a duplicate of FuzzMCPToolArguments either: that one decodes untrusted
  # JSON against a proto schema and stops; this one carries a decoded delivery all
  # the way through NewWebhookEvent and BindWebhookTriggerInputs into a CEL
  # activation and an evaluated idempotency key — the unauthenticated-network-input
  # path #799 found with zero fuzz reachability, the most attacker-reachable one in
  # the repo. Six times 30s measured at 280s total for five (docs/CI.md, PR #659,
  # 2026-08-15) — already most of the five-minute budget the comment this replaces
  # claimed was comfortable — so the sixth target moved this job to
  # `timeout-minutes: 6` rather than leaving a ~20s margin against a runner having
  # an ordinary slow day.
  #
  # Ten now: #403's audit found the coverage map had holes where this repository's
  # own history says bugs live, and four of them landed together. Two are the
  # rewriters' *properties* rather than their crash-freedom —
  # FuzzFixIdempotent and FuzzFormatIdempotent assert a fixed point, all-of-the-
  # document-or-none (#382), and preservation, which is the class where every
  # historical defect (both `flow fix` corruptions, #339, #381) produced bytes
  # rather than a panic and so was invisible to a crash oracle. FuzzCELEvaluate is
  # the runtime half of the CEL bound that FuzzCELCompile does not reach: the cost
  # budget is spent by the interpreter, and what it is spent on is decided as much
  # by the activation's data as by the expression's text. FuzzLSPDocumentEdits
  # drives an editor's incremental edits and position requests, and found a
  # backwards completion-edit range on its own seed corpus the first time it ran.
  # Four more targets at 30s each puts the same linear estimate near 470s, so the
  # job moves to `timeout-minutes: 10` on the identical reasoning: leave a real
  # margin rather than a slow runner's worth.
  #
  # Eleven since #403's item 3 landed the other half of the LSP surface:
  # FuzzLSPFrames takes the frame decoder and the read-loop dispatch upstream of
  # the recover that FuzzLSPDocumentEdits documents itself as looking through. It
  # costs 30s and no compile — it shares the lsp test binary with the target
  # already here — which puts the estimate near 500s, still inside this budget.
  # #403's item 4, FuzzSignalDeliveryDecode, is deliberately deep-only: its
  # package links the Temporal SDK, and this tier is where a link that long is
  # the thing being paid for rather than the fuzzing. Required
  # since 2026-08-09: its 48h advisory window (the same one staticcheck had)
  # closed on 2026-08-04 and the job has run green since, so a failure here is
  # now a finding to triage, never flake to wave through. A crasher the fuzzer
  # finds is a real defect with a corpus entry to commit, and a broken fuzz
  # harness is a broken check.
  fuzz-smoke:
    needs: plan
    if: needs.plan.outputs.fuzz_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials / cache: — see the test job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # No corpus is committed, so `-fuzz` always runs against the seed corpus in
      # source plus whatever it generates this run; a runner-local checkout means
      # generated corpus entries never persist between runs and never pollute a
      # commit.
      #
      # One step running `make fuzz-smoke` rather than one step per target, and
      # the target list read from tools/fuzztargets/targets.txt rather than
      # spelled here (#857). The same trade the `test` job already makes: a job
      # holding its own copy of a command list is a copy that drifts, and this
      # one had — the weekly deep tier ran four of the ten targets this job ran,
      # because each of the four places holding the list was kept by hand. The
      # per-step boundary that is lost was there so a hanging target did not hide
      # the others' output; the Makefile's loop prints `==> <target>` before each
      # one and every target's output still streams into this step's log, so the
      # hanging one is still the last one named.
      - name: Fuzz smoke (every target in the smoke tier)
        run: make fuzz-smoke

  # The appearance pins: charmbracelet/vhs records the CLI's styled surfaces in a
  # real terminal and the goldens under cmd/flow/internal/appearance/testdata say
  # what those surfaces look like. Nothing else in this workflow can see the
  # difference, because every other test reads output for substrings and the
  # thing at risk here is whitespace: a wrap point, a hanging indent, the blank
  # line before a NEXT block, the padding that makes a pill a pill.
  #
  # This is the job that makes #376's charter mechanical. Until now "beautiful in
  # form" was held by whoever reviewed the diff; from here a styled surface has a
  # recording, and drift fails a pin the way `flow docs generate` fails one.
  #
  # It needs three binaries and a browser, which is why it is a job of its own
  # rather than a step in `test`: the test skips where any of them is absent, so
  # a laptop running `go test ./...` is not asked for a video encoder. That skip
  # is also why `make check` does not run it — a check that reports green by not
  # running is worse than one that is honestly elsewhere.
  #
  # Advisory for the 48h window CLAUDE.md gives every newly added check, the same
  # window staticcheck, the fuzz smoke job and federation each had: a check
  # nobody has run against this tree can go red on code nobody touched, and a red
  # build people learn to ignore is worse than no build. That window lapsed on
  # 2026-08-12 and `continue-on-error` came off on 2026-08-31 (#1319), so a
  # failure here now fails `verdict`. A failure is a styled surface that changed
  # shape: read the diff, and if the new shape is the intended one, re-record
  # with `make appearance-update` and commit the goldens in the same change that
  # moved the surface.
  appearance:
    needs: plan
    if: needs.plan.outputs.appearance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials / cache: — see the test job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # vhs refuses to start without ffmpeg, even for a text recording, so this
      # is a hard dependency rather than one only the GIF path needs.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # ttyd is the terminal vhs drives. Upstream ships a static binary per
      # release; pinned by version for the same reason everything else here is,
      # and a checksum because this one is fetched from a release asset rather
      # than resolved by a package manager that verifies its own index.
      - name: Install ttyd
        run: |
          curl -fsSL -o /tmp/ttyd "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  /tmp/ttyd" | sha256sum -c -
          sudo install -m 0755 /tmp/ttyd /usr/local/bin/ttyd

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@${{ env.VHS_VERSION }}

      # vhs downloads a Chromium on first use, which is the slow part of this
      # job and happens exactly once: the test points every recording at one
      # cache directory, because each tape otherwise gets a fresh HOME and would
      # pay for its own download.
      - name: Record and compare
        run: GOMEMLIMIT=2GiB go test -timeout 900s -count=1 -run TestAppearance ./cmd/flow/internal/appearance/

  # ── The one check that decides ───────────────────────────────────────────
  #
  # This job and `plan` are the two required checks. None of the jobs above is
  # required, and that inversion is the whole safety argument, because GitHub's
  # semantics for a conditional required check fail in both directions:
  #
  #   * A required job skipped by an `if:` reports the conclusion `skipped`,
  #     and a required status check treats `skipped` as satisfied. A job that
  #     never looked at anything would report as a gate that passed. That is
  #     the worst failure a gate has, and it is the *default* behaviour.
  #   * A required check that never reports at all — the shape you get from a
  #     workflow-level `paths:` filter, because the whole workflow is skipped
  #     and produces no check runs — stays pending forever and blocks the
  #     merge with no way to clear it.
  #
  # So neither "make the conditional jobs required" nor "filter the workflow by
  # path" is available. What is available is a job that always runs, knows what
  # the plan selected, and can see what every other job actually did. That is
  # this one. `if: always()` means it reports on every run, including runs where
  # something above failed or was skipped, so the required check is never
  # missing; and it re-reads the plan rather than trusting a green tick, so a
  # skip can only ever be a decision the plan made in writing.
  #
  # Read the four cases below as the answer to "how is a skipped-but-required
  # check prevented from failing open": a job the plan selected must have
  # succeeded, a job the plan did not select must have been skipped, a job the
  # plan named that has no result at all is a failure, and a job in this file
  # the plan never heard of is a failure too. The last two are the drift cases,
  # and tools/gate/ci_test.go catches them before a push rather than after.
  #
  # No job here is advisory any more: `appearance` was the last to carry
  # `continue-on-error: true`, under which its `needs` result read `success`
  # even when it failed, and that came off on 2026-08-31 (#1319). Every result
  # this job reads is now the job's own.
  verdict:
    needs: [plan, test, proto, vulncheck, staticcheck, fuzz-smoke, appearance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: this job reads two JSON documents and compares them. Not
      # cloning the repository is one fewer thing that can go wrong in the job
      # whose whole purpose is to be the check that cannot be wrong.
      - name: Every job the plan selected ran and passed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN: ${{ needs.plan.outputs.decisions }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          if [ "${PLAN_RESULT}" != "success" ]; then
            echo "::error::the plan job did not succeed (result: ${PLAN_RESULT}), so nothing is established about this diff and this check fails rather than reporting a pass it cannot justify"
            exit 1
          fi
          if ! printf '%s' "${PLAN}" | jq -e 'type == "object" and (keys | length) > 0' >/dev/null; then
            echo "::error::the plan job succeeded but published no decisions; treating that as a failure rather than as an empty set of obligations"
            exit 1
          fi

          status=0

          # Direction one: every job the plan named must have the result the
          # plan implies. `true:success` and `false:skipped` are the only two
          # readings that mean the gate looked at what it was meant to.
          while read -r job want; do
            got=$(printf '%s' "${RESULTS}" | jq -r --arg j "$job" '.[$j].result // "absent"')
            case "${want}:${got}" in
              true:success)
                echo "ok       ${job}: ran and passed" ;;
              false:skipped)
                echo "ok       ${job}: skipped, and the plan says this diff cannot reach it" ;;
              true:*)
                echo "::error::${job} was selected by the plan for this diff but its result was '${got}'"
                status=1 ;;
              false:*)
                echo "::error::${job} produced a result ('${got}') although the plan did not select it; the plan and that job's if: condition disagree, which means one of them is not the rule"
                status=1 ;;
            esac
          done < <(printf '%s' "${PLAN}" | jq -r 'to_entries[] | "\(.key) \(.value)"')

          # Direction two: every job this workflow has must be one the plan
          # decided. A job added to ci.yml and not to ciDecisions would
          # otherwise run, or not run, with nothing here obliged to care.
          for job in $(printf '%s' "${RESULTS}" | jq -r 'keys[]'); do
            [ "${job}" = "plan" ] && continue
            if ! printf '%s' "${PLAN}" | jq -e --arg j "${job}" 'has($j)' >/dev/null; then
              echo "::error::job '${job}' exists in this workflow but the plan does not decide it; add it to ciDecisions in tools/gate/ci.go"
              status=1
            fi
          done

          exit "${status}"
