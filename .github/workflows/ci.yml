name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default, and every job inherits it. A workflow that needs to write
# something should say so on the job that needs it rather than here, so a token
# able to push is never one step away from a step that did not ask for one.
permissions:
  contents: read

# Pinned rather than @latest, so what CI runs is decided by a commit here instead
# of by whatever was published this morning. A toolchain that changes underneath
# an unrelated pull request turns someone else's release into your red build, and
# the person who has to work out why is never the person who caused it.
#
# The actions used in the jobs below are pinned the same way, and for a second
# reason as well. A tag is a mutable pointer that the action's own repository
# controls: `@v4` is whatever that repository decides `v4` means at the moment
# this workflow runs, and these steps run in our repository with our token.
# Pinning a commit makes the code that runs a decision recorded here rather than
# one taken elsewhere afterwards. The trailing comment names the release the SHA
# is, because forty hex characters tell a reviewer nothing on their own — and
# Dependabot's github-actions entry updates the SHA and that comment together,
# which is what keeps this current rather than merely frozen.
#
# govulncheck still reports newly disclosed vulnerabilities while pinned: the
# advisory database is fetched at run time, so only the analyser is fixed here.
# That is the split worth having — reproducible tool, current facts.
env:
  BUF_VERSION: v1.72.0
  GOVULNCHECK_VERSION: v1.6.0
  STATICCHECK_VERSION: 2026.1

# Only the newest commit on a branch is worth testing. Pushing three times in a
# minute otherwise runs three full matrices and the first two answer questions
# about code nobody has any more — the Temporal dev-server tests make those runs
# minutes of billed compute, not seconds.
#
# main is deliberately excluded from cancellation: its runs are the record of
# whether a commit was good when it landed, and cancelling one leaves a gap in
# that record rather than saving anything worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung job otherwise runs to the six-hour default. Nothing here takes more
    # than a few minutes, so this bounds a stuck dev server or a wedged test
    # rather than constraining honest work — the same reasoning the engine
    # applies to a step's own timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod pins a patched toolchain via its `toolchain` directive. Reading the
      # version from go.mod keeps CI on exactly what local builds use, so a
      # toolchain-level security fix cannot be present locally and missing here.
      #
      # cache-dependency-path names the plugin modules' go.sum files as well as
      # the root one, because this job is the only one that builds them and
      # setup-go's default key is the root go.sum alone. Without them the five
      # plugin modules resolve and download their whole dependency graph on
      # every run — which is why "Test plugin modules" takes ten to twenty
      # minutes here against roughly one hundred seconds locally, on a job whose
      # whole budget is fifteen. A separate module is the point of a plugin; the
      # cost of that boundary is that its dependencies have to be cached
      # deliberately rather than by default.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            plugins/*/go.sum

      - name: Report toolchain
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Cheap, and it stays cheap only while it is enforced. Two files had drifted
      # out of gofmt before this step existed, which nothing failed on and nobody
      # saw — formatting noise then rides along in the next real diff and makes it
      # harder to review than it needed to be.
      - name: Format
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd; run 'gofmt -w' on:"
            echo "$unformatted"
            exit 1
          fi

      # `make test`, not a second copy of the command, so the memory and time
      # bounds cannot drift between here and the loop a contributor runs
      # locally. CLAUDE.md's rule is that the Makefile *is* what CI runs.
      - name: Test
        run: make test

      # The plugins are separate Go modules, which is the point of them: a plugin
      # owns its dependencies so an operator decides whether to trust them, and
      # nothing a plugin needs reaches the engine's own go.mod.
      #
      # The cost of that boundary is that `./...` from the root does not cross it.
      # Every check above would stay green with a plugin that does not compile, so
      # the modules are walked explicitly. Found by looking rather than by a
      # failure, which is the only way this class is ever found — a module nobody
      # builds is not red, it is absent.
      - name: Test plugin modules
        run: make test-plugins

      # A different schedule, not a longer one. The step above runs at the
      # runner's GOMAXPROCS, where the local harness's virtual clock reaches
      # only the interleavings parallelism happens to produce; GOMAXPROCS=1
      # reaches the ones it does not. Cheap enough to sit in this job rather
      # than earn one of its own — see the Makefile target for why it is
      # scoped to the package whose every claim is an ordering claim.
      - name: Ordering claims hold under a different schedule
        run: make test-ordering

      # The same mechanism as the proto job's generated-code check, on the four
      # reference documents that are derived rather than written: the task
      # reference from the registry, the CLI reference from the cobra tree, the
      # MCP tool list, and the env-var table. Those four are exactly the tables
      # the doc audit found had drifted, and they drift silently — a task gains a
      # field, a flag gains an env default, and the prose stays confidently wrong
      # until somebody follows it and fails.
      #
      # Here rather than in the proto job because what it pins is Go values, not
      # the schema: `flow docs generate` runs the binary, so a failure here is a
      # tree whose documentation disagrees with its own code.
      - name: Verify generated reference docs are current
        run: |
          go run ./cmd/flow docs generate
          git diff --exit-code -- docs/reference/ || {
            echo "::error::generated reference docs do not match the code; run 'make docs' and commit the result"
            exit 1
          }

      # `flow fix --check` is the command this exists to protect: examples are
      # already in the current edition, and a PR that leaves one behind should fail
      # here rather than at the next person's `flow fix .`. Not advisory — the
      # examples are clean today, so a failure here is a real regression.
      #
      # The whole directory, not `examples/*/workflow.yaml`: that single-level
      # glob matched 32 of the 54 `.yaml`/`.yml` files under examples/, so every
      # plugin example and both policy files were never checked — which is how
      # `examples/call-a-workflow/workflow.test.yaml` drifted for a released
      # edition before anyone noticed (#203). `flow fix` itself, not this glob,
      # is what keeps the walk from touching `egress-policy.yaml` or an
      # auth-policy.yaml: it selects a file by its own top-level shape
      # (`steps:` or `tests:`), so a policy file or an observability config
      # under examples/ is never even handed to the rewriter.
      - name: Examples are in the current edition
        run: go run ./cmd/flow fix --check examples/

      # `flow test` is the reachability gate for #155: at least one example's
      # own *.test.yaml runs here, so "a workflow can test itself" is a claim
      # this job checks rather than one the design doc merely makes.
      # examples/call-a-workflow is the one that matters most — it stubs the
      # tasks inside a *called* workflow, which is the composition #155 exists
      # to make trustworthy.
      - name: Example workflows pass their own tests
        run: go run ./cmd/flow test examples/

      # The observability lab is eight services of other people's software, so
      # standing it up here would make this repository's build depend on seven
      # registries and a Temporal cluster coming up in time. What is checked is
      # what is ours: that the compose file parses and resolves — a broken YAML
      # anchor, an unknown key, a service naming a volume that does not exist.
      # `config` is a client-side operation: no daemon, no pulls, under a second.
      # The full-stack smoke is a manual step, written out in the lab's README.
      - name: Observability lab compose file resolves
        run: docker compose -f examples/observability/docker-compose.yaml config -q

  # The schema is a public contract, not an internal detail: plugins are separate
  # processes that compile against these descriptors, so breaking it breaks every
  # plugin in the wild rather than producing a compile error someone can see. That
  # is why this is its own job — a schema failure is not a broken test.
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against the base branch, which has to be present.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Forty-three rules, all of them enforced everywhere.
      #
      # This step was absent because six pre-existing violations would have made it
      # red on arrival, and a red build everyone learns to ignore is worse than no
      # build. All six were one rule pair in one file — the plugin protocol's
      # request and response messages not being named after their methods — so the
      # pair was suppressed for that file and the other forty-one enforced, rather
      # than trading forty-one rules for six known violations.
      #
      # The protocol has its own package now, which is what made the names it asks
      # for the right ones, so both the violations and the suppression are gone.
      - name: Lint
        run: go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} lint

      # proto/buf.yaml has declared FILE and WIRE breaking rules from the start and
      # nothing ran them.
      - name: Check for breaking changes
        run: go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} breaking --against '.git#branch=origin/main'

      # Generated code is committed, so it can disagree with the schema it came
      # from. That disagreement is invisible locally — the build stays green using
      # the stale generated code — and shows up as a mystery when someone else
      # regenerates. Several people editing one schema at once makes this likely
      # rather than theoretical.
      - name: Verify generated code is current
        run: |
          go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} generate
          git diff --exit-code -- . || {
            echo "::error::generated code does not match the schema; run 'buf generate' and commit the result"
            exit 1
          }

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Separate from the test job so a newly disclosed vulnerability is reported
      # as its own failure rather than looking like a broken test. This checks
      # reachability, not mere presence, so it fails only when our code can
      # actually reach the vulnerable path.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # Required, as of the end of its 48h advisory window. It landed advisory because
  # the govulncheck lesson generalizes to any newly-added check — a check nobody
  # has run against this tree yet can go red on code nobody touched, and a red
  # build everyone learns to ignore is worse than no build. The window did what it
  # was for: the 22 findings it surfaced were read and settled on their merits —
  # dead code deleted, one duplicated helper removed, and the handful that were
  # the point of a test kept with a `//lint:ignore` saying why. The tree is at
  # zero, so from here a finding is something this diff introduced.
  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Same toolchain pin as govulncheck, and for the same reason: staticcheck's
      # own go.mod selects a toolchain older than go.mod's, so without the pin it
      # downgrades underneath itself and then fails type-checking the standard
      # library vendored into the newer toolchain's module cache — not a finding
      # about this tree at all.
      - name: Static analysis
        run: GOTOOLCHAIN=go1.26.5 go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} ./...

  # The one job with a real identity provider on the other end. Everything in
  # pkg/flowstate/v1/auth verifies tokens from an in-process stand-in issuer,
  # which proves this repository's reading of the specification and cannot prove
  # that the provider people actually configure still serves what that reading
  # assumes. Here the runner mints a genuine OIDC token, discovery runs against
  # token.actions.githubusercontent.com, and the policy pins the repository
  # claim to whichever repository is running the job, so a fork proves the same
  # thing about itself rather than passing on a loose assertion.
  #
  # `id-token: write` is why this is a separate job rather than a step in the
  # test job: it is what makes the runner's token endpoint answer at all, and it
  # is granted to this job only. `contents: read` is restated because naming
  # permissions on a job replaces the top-level block for that job rather than
  # adding to it, and every other job keeps the read-only default untouched.
  #
  # Network to the issuer is a precondition, not an accident: this is the only
  # check here that talks to a third party at run time. The test skips, loudly
  # and with a sentence, anywhere the token endpoint is absent, so the same
  # command is honest on a laptop and on a fork without the permission.
  #
  # Advisory for the 48h window CLAUDE.md gives every newly added check, for the
  # same reason staticcheck and the fuzz smoke job had one: a check nobody has
  # run against this tree can go red on code nobody touched. When the window
  # closes, drop `continue-on-error` and let it be required. A failure here is
  # still a failure to read: either the provider changed, or this repository
  # cannot federate the identity it claims to.
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # -run so this job is the real-issuer check and nothing else; the offline
      # auth tests already run in the test job, and running them twice would
      # make a failure here ambiguous about which half broke.
      - name: Verify a real CI token against the real issuer
        # FLOWSTATE_REQUIRE_REAL_TOKEN turns the test's everywhere-else skip
        # into a failure here: this job exists to run the live check, so an
        # absent token endpoint means the grant or the variables regressed, and
        # a green skip would be the gate passing while verifying nothing.
        run: FLOWSTATE_REQUIRE_REAL_TOKEN=1 GOMEMLIMIT=1GiB go test -v -timeout 300s -run TestRealCIToken ./pkg/flowstate/v1/auth/

  # Bounded per CLAUDE.md's fuzz recipe: `-parallel 1` and a memory limit because a
  # fuzzer's purpose is to find the input that explodes, `-fuzztime 30s` per target
  # because that bounds time and not memory. Four targets now: the round-trip one
  # that existed first, plus the three the roadmap called for — CEL compile,
  # MCP tool-argument decode, plugin descriptor parsing — each its own step so one
  # hanging does not hide the others' output. Four times 30s is still comfortably
  # under this job's five-minute budget alongside checkout and setup. Advisory
  # until 2026-08-04 — the same 48h window staticcheck above has now finished — to
  # absorb flake in a job this new. But a crasher the fuzzer actually finds is a
  # real finding, not flake, and must be triaged rather than re-run away; `continue-on-error` here
  # covers infrastructure noise, not a standing invitation to ignore a found
  # corpus entry.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # No corpus is committed, so `-fuzz` always runs against the seed corpus in
      # source plus whatever it generates this run; a runner-local checkout means
      # generated corpus entries never persist between runs and never pollute a
      # commit.
      - name: Fuzz smoke (FuzzRoundTrip)
        run: GOMEMLIMIT=512MiB go test -timeout 120s -parallel 1 -run=XXX -fuzz FuzzRoundTrip -fuzztime 30s ./pkg/flowstate/v1/flowfile/

      - name: Fuzz smoke (FuzzCELCompile)
        run: GOMEMLIMIT=512MiB go test -timeout 120s -parallel 1 -run=XXX -fuzz FuzzCELCompile -fuzztime 30s ./pkg/flowstate/v1/flowfile/

      - name: Fuzz smoke (FuzzMCPToolArguments)
        run: GOMEMLIMIT=512MiB go test -timeout 120s -parallel 1 -run=XXX -fuzz FuzzMCPToolArguments -fuzztime 30s ./cmd/flow/

      - name: Fuzz smoke (FuzzMessageDescriptor)
        run: GOMEMLIMIT=512MiB go test -timeout 120s -parallel 1 -run=XXX -fuzz FuzzMessageDescriptor -fuzztime 30s ./pkg/flowstate/v1/plugin/
