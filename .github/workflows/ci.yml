name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default, and every job inherits it. A workflow that needs to write
# something should say so on the job that needs it rather than here, so a token
# able to push is never one step away from a step that did not ask for one.
permissions:
  contents: read

# Pinned rather than @latest, so what CI runs is decided by a commit here instead
# of by whatever was published this morning. A toolchain that changes underneath
# an unrelated pull request turns someone else's release into your red build, and
# the person who has to work out why is never the person who caused it.
#
# The actions used in the jobs below are pinned the same way, and for a second
# reason as well. A tag is a mutable pointer that the action's own repository
# controls: `@v4` is whatever that repository decides `v4` means at the moment
# this workflow runs, and these steps run in our repository with our token.
# Pinning a commit makes the code that runs a decision recorded here rather than
# one taken elsewhere afterwards. The trailing comment names the release the SHA
# is, because forty hex characters tell a reviewer nothing on their own — and
# Dependabot's github-actions entry updates the SHA and that comment together,
# which is what keeps this current rather than merely frozen.
#
# govulncheck still reports newly disclosed vulnerabilities while pinned: the
# advisory database is fetched at run time, so only the analyser is fixed here.
# That is the split worth having — reproducible tool, current facts.
env:
  BUF_VERSION: v1.72.0
  GOVULNCHECK_VERSION: v1.6.0

# Only the newest commit on a branch is worth testing. Pushing three times in a
# minute otherwise runs three full matrices and the first two answer questions
# about code nobody has any more — the Temporal dev-server tests make those runs
# minutes of billed compute, not seconds.
#
# main is deliberately excluded from cancellation: its runs are the record of
# whether a commit was good when it landed, and cancelling one leaves a gap in
# that record rather than saving anything worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung job otherwise runs to the six-hour default. Nothing here takes more
    # than a few minutes, so this bounds a stuck dev server or a wedged test
    # rather than constraining honest work — the same reasoning the engine
    # applies to a step's own timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # go.mod pins a patched toolchain via its `toolchain` directive. Reading the
      # version from go.mod keeps CI on exactly what local builds use, so a
      # toolchain-level security fix cannot be present locally and missing here.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Report toolchain
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Cheap, and it stays cheap only while it is enforced. Two files had drifted
      # out of gofmt before this step existed, which nothing failed on and nobody
      # saw — formatting noise then rides along in the next real diff and makes it
      # harder to review than it needed to be.
      - name: Format
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd; run 'gofmt -w' on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

  # The schema is a public contract, not an internal detail: plugins are separate
  # processes that compile against these descriptors, so breaking it breaks every
  # plugin in the wild rather than producing a compile error someone can see. That
  # is why this is its own job — a schema failure is not a broken test.
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # buf breaking compares against the base branch, which has to be present.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Forty-three rules, all of them enforced everywhere.
      #
      # This step was absent because six pre-existing violations would have made it
      # red on arrival, and a red build everyone learns to ignore is worse than no
      # build. All six were one rule pair in one file — the plugin protocol's
      # request and response messages not being named after their methods — so the
      # pair was suppressed for that file and the other forty-one enforced, rather
      # than trading forty-one rules for six known violations.
      #
      # The protocol has its own package now, which is what made the names it asks
      # for the right ones, so both the violations and the suppression are gone.
      - name: Lint
        run: go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} lint

      # proto/buf.yaml has declared FILE and WIRE breaking rules from the start and
      # nothing ran them.
      - name: Check for breaking changes
        run: go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} breaking --against '.git#branch=origin/main'

      # Generated code is committed, so it can disagree with the schema it came
      # from. That disagreement is invisible locally — the build stays green using
      # the stale generated code — and shows up as a mystery when someone else
      # regenerates. Several people editing one schema at once makes this likely
      # rather than theoretical.
      - name: Verify generated code is current
        run: |
          go run github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }} generate
          git diff --exit-code -- . || {
            echo "::error::generated code does not match the schema; run 'buf generate' and commit the result"
            exit 1
          }

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Separate from the test job so a newly disclosed vulnerability is reported
      # as its own failure rather than looking like a broken test. This checks
      # reachability, not mere presence, so it fails only when our code can
      # actually reach the vulnerable path.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
