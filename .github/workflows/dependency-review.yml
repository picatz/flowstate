name: Dependency review

# A pull request that adds a dependency with a known advisory, or one under a
# licence this MIT-licensed tree cannot carry, is refused here before it
# merges, which is the ordering .github/dependabot.yml's own header describes
# wanting after GO-2026-6061: vulncheck sees the merged tree, and by then the
# finding lands on somebody else's unrelated pull request (#1750). The action
# diffs the dependency graph of the pull request against its base, so it only
# ever speaks about what the pull request itself changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    # Bounded like every other job here: the dependency-graph API stalling
    # must not hold a runner until the platform's own multi-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The permissive family the MIT LICENSE composes with; the graph
          # already carries Apache-2.0 (Temporal), BSD (Go) and MPL-2.0
          # dependencies, so the list is what the tree has, not MIT alone.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, Unlicense, CC0-1.0
          # This repository, reached through the `replace github.com/picatz/flowstate => ../..`
          # every plugin module under plugins/ carries. The dependency graph
          # resolves that replacement to the literal path and reports it with no
          # license, because there is no package to look one up for — it is the
          # tree this workflow is running in, whose MIT LICENSE is a file away.
          # Only a pull request that *adds a plugin module* changes a manifest
          # holding it, which is why the refusal first appeared long after the
          # convention did (#95's ecosystem work). Named exactly rather than
          # loosening allow-licenses, so a genuinely unlicensed dependency is
          # still refused.
          #
          # The five below are dependencies this tree already carries in the
          # root module's own graph. They are refused here only because their
          # SPDX expression is *compound*, and allow-licenses matches a whole
          # expression rather than each term: `BSD-3-Clause AND
          # LicenseRef-scancode-google-patent-license-golang` is what a scanner
          # makes of the Go project's PATENTS file beside its BSD licence, and
          # `Apache-2.0 AND CC-BY-4.0 AND MIT` is the MCP SDK carrying its
          # specification's documentation licence beside its code's. Neither is
          # a licence this tree cannot carry; both are unexpressible in a list
          # of single identifiers. They appear now because a pull request that
          # adds a plugin module changes a manifest that requires them, and the
          # root manifest they already sit in is not part of that diff.
          allow-dependencies-licenses: >-
            pkg:golang/..%2F..,
            pkg:golang/../..,
            pkg:golang/github.com/modelcontextprotocol/go-sdk,
            pkg:golang/golang.org/x/exp,
            pkg:golang/golang.org/x/net,
            pkg:golang/golang.org/x/sync,
            pkg:golang/golang.org/x/sys
          # No comment on the pull request: posting one needs a token that
          # can write pull requests, and the check's own log and the
          # step summary already say what was refused and why.
          comment-summary-in-pr: never
