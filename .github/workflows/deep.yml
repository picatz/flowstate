# The weekly deep tier — #482 slice B, adopted at weekly cadence by the owner
# decision of 2026-08-12. The PR lane (ci.yml) stays exactly as required as it is
# today; nothing here gates a merge. This tier runs the checks whose signal
# accumulates with clock time rather than with any diff: fuzzing given minutes
# per target instead of the smoke's seconds, the ordering suite at five times the
# local count, soak runs of the heavyweight packages, the full example corpus on
# both drivers against a real Temporal dev server, and govulncheck on a schedule
# because advisories arrive by calendar, not by commit.
#
# A scheduled run fails with nobody watching, so every job files an issue on
# failure: labeled deep-tier, deduplicated by title against open issues before
# filing, carrying the corpus entry or log excerpt and a link to the run that
# produced it. Actions and tools are pinned by commit for the reasons ci.yml
# records at length.
name: Deep

on:
  schedule:
    # Saturday 08:00 UTC: off-peak for the weekday PR lane and for both US and
    # EU working hours, so a red deep run never queues behind (or ahead of)
    # anyone's iteration loop.
    - cron: '0 8 * * 6'
  workflow_dispatch:

# Read-only by default, exactly as in ci.yml. The jobs that file issues say so
# themselves — naming permissions on a job replaces this block for that job, so
# each of them restates contents: read alongside issues: write.
permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.6.0

# One deep run at a time: a manual dispatch during the scheduled run would only
# contend with it, and a deep run's record is worth keeping, so nothing is
# cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Every fuzz target in the repo, each given ten minutes instead of the smoke's
  # thirty seconds. Bounded per CLAUDE.md's fuzz recipe: -parallel 1 and a memory
  # limit because a fuzzer's purpose is to find the input that explodes, and the
  # targets run sequentially in one job so at most one fuzzer holds memory at a
  # time. -fuzztime bounds time, not memory; GOMEMLIMIT is the memory bound.
  #
  # "Every fuzz target in the repo" was a claim this job did not keep: it ran
  # four while the smoke tier ran ten, because the list was written down by hand
  # here and in three other places (#857). It is read from
  # tools/fuzztargets/targets.txt now — the one written source — so a new target
  # reaches this tier by existing, and tools/fuzztargets' test fails if a target
  # in the tree is missing from the file.
  #
  # timeout-minutes follows from the list, and has to be re-derived whenever the
  # list grows: fourteen targets at 10m each is 140 minutes of fuzzing, plus
  # checkout, module download and compiling six packages (~5m, the engine's test
  # binary being the slowest in the module to link) and the collect/report steps
  # (~1m), so ~146m with 165 leaving a real margin rather than a slow runner's
  # worth. #403's last two targets are what took it past the old 140, which was
  # exactly 14 x 10m of fuzzing and no margin at all. It costs nothing in wall
  # clock for the workflow, which runs its jobs in parallel and whose long pole
  # is the soak job's 250.
  #
  # A failing target does not stop the ones after it — the loop records each
  # target's outcome in fuzz-outcomes.txt, where a per-step `outcome` used to be
  # read from, and the gate step at the end turns any failure back into a red
  # job. A crasher is written to the package's testdata/fuzz/<target>/ directory,
  # and since the tracked corpus is committed, a crasher from this run is exactly
  # an untracked file there — which is what the collect and report steps key on.
  fuzz-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false, for the same reason ci.yml gives at
      # length: checkout otherwise leaves the job's GITHUB_TOKEN in
      # .git/config, readable for the rest of the job by anything that runs
      # in this workspace, and nothing here needs it after checkout.
      #
      # No `cache:` gating here, unlike ci.yml: this workflow only fires on
      # `schedule` and `workflow_dispatch` (see the `on:` block above), so a
      # fork PR never runs it and there is no untrusted-context save to gate.
      # See #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # One step over the list instead of one step per target. Everything a
      # per-target step used to provide is provided here: each target still
      # writes its own fuzz-<target>.log, still runs even if an earlier one
      # failed, and still reports its own outcome — `<target> success|failure`
      # in fuzz-outcomes.txt, which the reporting step below reads exactly where
      # it used to read steps.<id>.outcome. The log is grouped per target so the
      # run's output is still navigable by target name.
      - name: Fuzz deep (every target in the deep tier)
        id: fuzz
        run: |
          set -uo pipefail
          tools/fuzztargets/list.sh deep > fuzz-targets.txt
          : > fuzz-outcomes.txt
          failed=false
          while read -r target dir; do
            echo "::group::${target} (${dir})"
            if GOMEMLIMIT=512MiB go test -timeout 900s -parallel 1 -run=XXX -fuzz "$target" -fuzztime 10m "./$dir/" 2>&1 | tee "fuzz-${target}.log"; then
              printf '%s success\n' "$target" >> fuzz-outcomes.txt
            else
              printf '%s failure\n' "$target" >> fuzz-outcomes.txt
              failed=true
            fi
            echo "::endgroup::"
          done < fuzz-targets.txt
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          echo "outcomes:"
          cat fuzz-outcomes.txt

      # A crasher from this run is an untracked file under a testdata/fuzz/
      # directory (the committed seed corpus is tracked, so it never matches).
      # Staged into a scratch directory so the artifact carries only what this
      # run found.
      - name: Collect crashing inputs
        id: collect
        run: |
          set -euo pipefail
          new=$(git ls-files --others --exclude-standard | grep '/testdata/fuzz/' || true)
          if [ -z "$new" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no crashing inputs were written"
            exit 0
          fi
          while IFS= read -r f; do
            mkdir -p "$RUNNER_TEMP/crashers/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/crashers/$f"
          done <<< "$new"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Upload crashing inputs
        if: steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: ${{ runner.temp }}/crashers/
          retention-days: 90

      # One issue per crasher, and one per target that failed without writing a
      # crasher (a broken fuzz harness is a broken check). Deduplicated by title
      # against open deep-tier issues, so a crasher nobody has triaged yet is not
      # refiled every Saturday.
      - name: File issues for crashers
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          already_open() {
            gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$1"
          }
          crashers=$(git ls-files --others --exclude-standard | grep '/testdata/fuzz/' || true)
          for entry in $crashers; do
            target=$(basename "$(dirname "$entry")")
            pkgdir=${entry%%/testdata/fuzz/*}
            name=$(basename "$entry")
            title="deep-tier: ${target} found a crashing input"
            if already_open "$title"; then
              echo "an open issue already covers ${target}; not filing another"
              continue
            fi
            body=$(mktemp)
            {
              echo "The weekly deep tier's long-run fuzz job found an input that crashes \`${target}\`."
              echo
              echo "Produced by workflow run: ${RUN_URL} (the input is also attached there as the \`fuzz-crashers\` artifact)."
              echo
              echo "The bytes themselves are deliberately not inlined here: this repository is public, and SECURITY.md asks for crash inputs to be reported privately — which applies no less to a report this workflow writes about itself. The artifact above is an interim store and is readable by anyone who can read this public repository."
              echo
              echo "Reproduce: download the artifact, restore the entry to \`${entry}\`, then:"
              echo
              echo '```'
              echo "GOMEMLIMIT=512MiB go test -timeout 120s -parallel 1 -run '${target}/${name}' ./${pkgdir}/"
              echo '```'
              echo
              echo "Per CLAUDE.md, a crasher the fuzzer finds is a real defect with a corpus entry to triage, never flake to re-run away."
            } > "$body"
            gh issue create --title "$title" --label deep-tier --body-file "$body"
          done
          harness() {
            target=$1; outcome=$2; log=$3
            [ "$outcome" = failure ] || return 0
            if printf '%s\n' "$crashers" | grep -q "/${target}/"; then return 0; fi
            title="deep-tier: ${target} failed without writing a crasher"
            if already_open "$title"; then
              echo "an open issue already covers the ${target} harness failure; not filing another"
              return 0
            fi
            body=$(mktemp)
            {
              echo "The weekly deep tier's fuzz step for \`${target}\` failed, but no corpus entry was written. A broken fuzz harness is a broken check, so this is a defect in the harness or its bounds rather than a crasher to triage."
              echo
              echo "Produced by workflow run: ${RUN_URL}"
              echo
              echo "Log tail:"
              echo
              echo '```'
              tail -n 60 "$log"
              echo '```'
            } > "$body"
            gh issue create --title "$title" --label deep-tier --body-file "$body"
          }
          # One call per target that ran, from the outcomes the fuzz step
          # recorded — the same accounting the four hand-written calls did,
          # over however many targets the list holds.
          while read -r name outcome; do
            harness "$name" "$outcome" "fuzz-${name}.log"
          done < fuzz-outcomes.txt

      - name: A failed target fails the job
        if: steps.fuzz.outputs.failed == 'true'
        run: |
          echo "::error::at least one fuzz target failed; see the deep-tier issue(s) filed by this run and the fuzz-crashers artifact"
          exit 1

  # The ordering-claims tier at five times the local count, plus soak runs of the
  # three heavyweight packages. -cpu=1 on flowtest is the point, not a smaller
  # version of the others: GOMAXPROCS=1 interleaves only at yield points, which
  # reaches orderings a multi-core run reaches rarely or never, and a defect
  # there is a wrong answer rather than a crash the race detector would catch.
  # The -count=10 legs run the packages whose tests boot real Temporal dev
  # servers often enough for a rare flake to become a reproducible failure.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ordering claims at 5x local count
        id: soak-flowtest
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=1GiB go test -race -cpu=1 -count=100 -timeout 3600s ./pkg/flowstate/v1/flowtest/ 2>&1 | tee soak-flowtest.log

      - name: Soak pkg/flowstate/v1
        id: soak-core
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=2GiB go test -race -count=10 -timeout 3600s ./pkg/flowstate/v1/ 2>&1 | tee soak-core.log

      - name: Soak pkg/flowstate/v1/engine
        id: soak-engine
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=2GiB go test -race -count=10 -timeout 3600s ./pkg/flowstate/v1/engine/ 2>&1 | tee soak-engine.log

      - name: Soak pkg/flowstate/v1/server
        id: soak-server
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=2GiB go test -race -count=10 -timeout 3600s ./pkg/flowstate/v1/server/ 2>&1 | tee soak-server.log

      - name: File issues for failures
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLOWTEST_OUTCOME: ${{ steps.soak-flowtest.outcome }}
          CORE_OUTCOME: ${{ steps.soak-core.outcome }}
          ENGINE_OUTCOME: ${{ steps.soak-engine.outcome }}
          SERVER_OUTCOME: ${{ steps.soak-server.outcome }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          already_open() {
            gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$1"
          }
          file_failure() {
            title=$1; outcome=$2; log=$3; cmd=$4
            [ "$outcome" = failure ] || return 0
            if already_open "$title"; then
              echo "an open issue already covers '${title}'; not filing another"
              return 0
            fi
            fails=$(grep -E '^ *--- FAIL' "$log" | sort -u || true)
            body=$(mktemp)
            {
              echo "The weekly deep tier's soak job failed. The soak exists to turn a rare flake into a reproducible failure, so this is a real finding: a defect that only shows under repetition or under a single-CPU schedule."
              echo
              echo "Produced by workflow run: ${RUN_URL}"
              echo
              if [ -n "$fails" ]; then
                echo "Failing tests:"
                echo
                echo '```'
                echo "$fails"
                echo '```'
                echo
              fi
              echo "Log tail:"
              echo
              echo '```'
              tail -n 80 "$log"
              echo '```'
              echo
              echo "Reproduce:"
              echo
              echo '```'
              echo "$cmd"
              echo '```'
            } > "$body"
            gh issue create --title "$title" --label deep-tier --body-file "$body"
          }
          file_failure "deep-tier: soak failure in pkg/flowstate/v1/flowtest" "$FLOWTEST_OUTCOME" soak-flowtest.log "GOMEMLIMIT=1GiB go test -race -cpu=1 -count=100 -timeout 3600s ./pkg/flowstate/v1/flowtest/"
          file_failure "deep-tier: soak failure in pkg/flowstate/v1" "$CORE_OUTCOME" soak-core.log "GOMEMLIMIT=2GiB go test -race -count=10 -timeout 3600s ./pkg/flowstate/v1/"
          file_failure "deep-tier: soak failure in pkg/flowstate/v1/engine" "$ENGINE_OUTCOME" soak-engine.log "GOMEMLIMIT=2GiB go test -race -count=10 -timeout 3600s ./pkg/flowstate/v1/engine/"
          file_failure "deep-tier: soak failure in pkg/flowstate/v1/server" "$SERVER_OUTCOME" soak-server.log "GOMEMLIMIT=2GiB go test -race -count=10 -timeout 3600s ./pkg/flowstate/v1/server/"

      - name: A failed soak fails the job
        if: steps.soak-flowtest.outcome == 'failure' || steps.soak-core.outcome == 'failure' || steps.soak-engine.outcome == 'failure' || steps.soak-server.outcome == 'failure'
        run: |
          echo "::error::at least one soak leg failed; see the deep-tier issue(s) filed by this run"
          exit 1

  # The full example corpus, three ways: every example on the durable driver
  # against a real Temporal dev server (the tests boot it themselves, exactly as
  # ci.yml's test job runs them), every example on the local driver (both drivers
  # must agree, so running one without the other would miss exactly the
  # disagreements the corpus exists to catch), and every example's own test file
  # through flow test with branch coverage required. -count=1 so a cache restored
  # by setup-go can never answer for a run whose whole point is to execute.
  examples-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Every example runs durably against a real Temporal dev server
        id: durable
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=2GiB go test -race -count=1 -timeout 1800s -run TestEveryExampleRunsDurably ./pkg/flowstate/v1/engine/ 2>&1 | tee examples-durable.log

      - name: Every example runs on the local driver
        id: local
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=2GiB go test -race -count=1 -timeout 900s -run 'TestEveryOfflineExampleRuns|TestEveryNetworkedExampleRuns' ./pkg/flowstate/v1/ 2>&1 | tee examples-local.log

      - name: Every example passes its own tests, every branch reached or reasoned
        id: flowtest-cli
        continue-on-error: true
        run: |
          set -o pipefail
          go run ./cmd/flow test --coverage-required examples/ 2>&1 | tee examples-flowtest.log

      - name: File issues for failures
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DURABLE_OUTCOME: ${{ steps.durable.outcome }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          FLOWTEST_CLI_OUTCOME: ${{ steps.flowtest-cli.outcome }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          already_open() {
            gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$1"
          }
          file_failure() {
            title=$1; outcome=$2; log=$3; cmd=$4
            [ "$outcome" = failure ] || return 0
            if already_open "$title"; then
              echo "an open issue already covers '${title}'; not filing another"
              return 0
            fi
            fails=$(grep -E '^ *--- FAIL' "$log" | sort -u || true)
            body=$(mktemp)
            {
              echo "The weekly deep tier's examples matrix failed."
              echo
              echo "Produced by workflow run: ${RUN_URL}"
              echo
              if [ -n "$fails" ]; then
                echo "Failing tests:"
                echo
                echo '```'
                echo "$fails"
                echo '```'
                echo
              fi
              echo "Log tail:"
              echo
              echo '```'
              tail -n 80 "$log"
              echo '```'
              echo
              echo "Reproduce:"
              echo
              echo '```'
              echo "$cmd"
              echo '```'
            } > "$body"
            gh issue create --title "$title" --label deep-tier --body-file "$body"
          }
          file_failure "deep-tier: examples failure on the durable driver" "$DURABLE_OUTCOME" examples-durable.log "GOMEMLIMIT=2GiB go test -race -count=1 -timeout 1800s -run TestEveryExampleRunsDurably ./pkg/flowstate/v1/engine/"
          file_failure "deep-tier: examples failure on the local driver" "$LOCAL_OUTCOME" examples-local.log "GOMEMLIMIT=2GiB go test -race -count=1 -timeout 900s -run 'TestEveryOfflineExampleRuns|TestEveryNetworkedExampleRuns' ./pkg/flowstate/v1/"
          file_failure "deep-tier: examples failure in flow test --coverage-required" "$FLOWTEST_CLI_OUTCOME" examples-flowtest.log "go run ./cmd/flow test --coverage-required examples/"

      - name: A failed leg fails the job
        if: steps.durable.outcome == 'failure' || steps.local.outcome == 'failure' || steps.flowtest-cli.outcome == 'failure'
        run: |
          echo "::error::at least one examples leg failed; see the deep-tier issue(s) filed by this run"
          exit 1

  # The deterministic simulation tier at eighty times the PR lane's width, and
  # in a different part of the seed space every week (#477 slice 0).
  #
  # The PR lane already runs this package -- the property is ordinary Go tests in
  # pkg/flowstate/v1/dst, inside the existing test job -- at 24 schedules per
  # case, which is seconds and catches an order dependence a diff introduces. It
  # is not a search. This job is: a schedule explorer's signal accumulates with
  # how much of the space it has seen, which is clock time rather than any diff,
  # and that is exactly the cut this workflow exists to make.
  #
  # FLOWSTATE_DST_SEED0 moves the window by run number so consecutive weeks
  # explore different seeds rather than re-proving the same ones. That does not
  # cost reproducibility, which is the whole design of the tier: a divergence
  # prints the one seed that produced it, and FLOWSTATE_DST_SEED replays exactly
  # that schedule at any width, on any machine.
  #
  # Without -race deliberately. The local driver runs one goroutine here and the
  # schedule is a value rather than a thread interleaving, so the detector has
  # nothing to find and costs the run most of its width; the race-detected pass
  # over this same package is the PR lane's, every time.
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Schedule equivalence over 2000 schedules per case
        id: dst
        continue-on-error: true
        env:
          FLOWSTATE_DST_SCHEDULES: '2000'
        run: |
          set -o pipefail
          export FLOWSTATE_DST_SEED0=$(( 1 + GITHUB_RUN_NUMBER * 1000000 ))
          echo "exploring seeds from ${FLOWSTATE_DST_SEED0}"
          GOMEMLIMIT=2GiB go test -count=1 -v -timeout 3000s ./pkg/flowstate/v1/dst/ 2>&1 | tee dst.log

      - name: File an issue for a diverging schedule
        if: steps.dst.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          title="deep-tier: a schedule diverged in the deterministic simulation tier"
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already covers a diverging schedule; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "The weekly deep tier's schedule search found a seed whose observables differ from the written-order baseline's."
            echo
            echo "The execution model promises completion order is never observable (#418), so this is a real finding: either the engine leaks the schedule into something an author can see, or the case counts something as an observable that the model never promised. It is not flake -- the seed reproduces the interleaving exactly."
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            echo "Failing cases:"
            echo
            echo '```'
            grep -E '^ *--- FAIL' dst.log | sort -u || true
            echo '```'
            echo
            echo "The seed and the command that replays it are in the failure output:"
            echo
            echo '```'
            grep -A 4 'REPRODUCE THIS EXACT SCHEDULE' dst.log | head -n 40 || true
            echo '```'
            echo
            echo "Log tail:"
            echo
            echo '```'
            tail -n 80 dst.log
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      - name: A diverging schedule fails the job
        if: steps.dst.outcome == 'failure'
        run: |
          echo "::error::a schedule diverged from the written-order baseline; see the deep-tier issue filed by this run"
          exit 1

  # The schedule explorer pointed at the real corpus (#933). The simulation
  # job above searches four conformance sets; this one searches the 64 shipped
  # examples, which is precisely where the search has paid before -- pointing
  # it there is what surfaced the six false divergences #800 fixed, because
  # real workflows exercise transcript shapes the conformance sets do not.
  # The whole corpus runs in seconds at written order, so a hundred seeds is
  # minutes of a weekly job.
  #
  # Two honesty rules, stated here because a green sweep can lie two ways.
  # This explores only the orderings the LOCAL driver is free to choose -- a
  # `parallel:` block's branch order, and where an `async:` step's work lands
  # (the cut #477 draws; it is not a claim about Temporal's orderings) -- and
  # a file with no junction contributes written order however many seeds run.
  # So the corpus-wide scheduling-decision count is the job's self-check: a
  # sweep in which no file explored a single decision proved nothing, and the
  # job refuses that green rather than reporting it (the same rule `flow test`
  # applies per file when --seeds explores nothing).
  #
  # FLOWSTATE-style seed rotation, by run number, for the simulation job's
  # reason: consecutive weeks explore different windows, and reproducibility
  # is never the rotation's to lose -- a divergence prints the one seed and
  # the exact `flow test --seed N -- <file>` line that replays it.
  flowtest-seeded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: A hundred seeded schedules per case over the examples corpus
        id: seeded
        continue-on-error: true
        run: |
          set -o pipefail
          SEED0=$(( 1 + GITHUB_RUN_NUMBER * 1000000 ))
          echo "exploring seeds from ${SEED0}"
          go run ./cmd/flow test --seeds 100 --seed0 "${SEED0}" examples/ 2>&1 | tee flowtest-seeded.log

      - name: The sweep must have explored something
        id: explored
        continue-on-error: true
        if: steps.seeded.outcome == 'success'
        run: |
          # One file reporting a nonzero decision count is enough; the zero
          # case's own line always carries the "nothing was explored" suffix,
          # so a line without it is a file that reached a real junction.
          if grep -E 'scheduling decisions?' flowtest-seeded.log | grep -qv 'nothing was explored'; then
            echo "the sweep explored real scheduling decisions"
          else
            echo "::error::no file in examples/ explored a single scheduling decision; the sweep proved nothing"
            exit 1
          fi

      - name: File an issue for a diverging schedule
        if: steps.seeded.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          title="deep-tier: a seeded schedule diverged in the examples corpus"
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already covers a diverging examples schedule; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "The weekly seeded sweep over examples/ found a schedule whose observables differ from the written-order run's, or a case that failed under one."
            echo
            echo "This explores only the orderings the local driver is free to choose (a \`parallel:\` block's branch order, an \`async:\` step's placement), so it says a file's observables depend on one of those, or that the local engine does. It is not flake: the seed replays the interleaving exactly."
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            echo "The seed and the command that replays it:"
            echo
            echo '```'
            grep -B 1 -A 3 'REPLAY THIS EXACT SCHEDULE' flowtest-seeded.log | head -n 60 || true
            echo '```'
            echo
            echo "Log tail:"
            echo
            echo '```'
            tail -n 80 flowtest-seeded.log
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      - name: File an issue for a sweep that explored nothing
        if: steps.explored.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          title="deep-tier: the seeded examples sweep explored nothing"
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already covers an empty sweep; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "The weekly seeded sweep over examples/ ran to green without exploring a single scheduling decision, corpus-wide."
            echo
            echo "That green proves nothing: no case in any example reached a \`parallel:\` or \`async:\` junction, so every one of the hundred schedules was written order. Either the junction-bearing examples lost their junctions, or their tests stopped reaching them -- both worth knowing, which is why the job refuses this green rather than reporting it."
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            echo "Log tail:"
            echo
            echo '```'
            tail -n 40 flowtest-seeded.log
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      - name: A failed sweep fails the job
        if: steps.seeded.outcome == 'failure' || steps.explored.outcome == 'failure'
        run: |
          echo "::error::the seeded examples sweep failed; see the deep-tier issue filed by this run"
          exit 1

  # A leaked coroutine, which is invisible to every other tier: the race
  # detector proves two goroutines never corrupt shared state and says
  # nothing about one of them existing forever, and a workflow test's
  # assertions on the *result* pass whether or not everything it started got
  # joined. #492's `async:` runs a step's whole body on a Temporal coroutine
  # (workflow.Go in pkg/flowstate/v1/engine/async.go's startAsync) and joins
  # it with a channel receive on every exit a scope can take -- the newest
  # and least-settled concurrency in the tree, per #495.
  #
  # The "goroutineleak" runtime/pprof profile was experimental in Go 1.26 and
  # is generally available in the Go 1.27 toolchain this repository pins. Go
  # 1.27 deleted the goroutineleakprofile GOEXPERIMENT setting, so asking for
  # the old experiment is a toolchain error rather than enabling the profile.
  # TestAsyncCoroutinesDoNotLeak (pkg/flowstate/v1/engine) drives every
  # tests.AsyncCases scenario -- including the failing and
  # continue_on_error cases whose scope has to join on the way out -- against
  # the durable driver's TestWorkflowEnvironment, then asks the runtime
  # whether it can prove any goroutine will never run again. It skips rather
  # than fails when the profile is not registered, which is why this job's
  # own presence is what makes it run at all.
  goroutineleak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Goroutine leak check on the async coroutine drain
        id: leakcheck
        continue-on-error: true
        run: |
          set -o pipefail
          GOMEMLIMIT=1GiB go test -timeout 900s -run TestAsyncCoroutinesDoNotLeak -v ./pkg/flowstate/v1/engine/ 2>&1 | tee goroutineleak.log

      - name: File an issue for a leak or harness failure
        if: steps.leakcheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          if grep -qF 'a coroutine started by engine.startAsync was never joined' goroutineleak.log; then
            title="deep-tier: async coroutine leak detected"
            finding="The weekly deep tier's goroutine leak check found a coroutine started by \`engine.startAsync\` (pkg/flowstate/v1/engine/async.go) that the runtime can prove will never run again."
          else
            title="deep-tier: the goroutine leak harness failed"
            finding="The weekly deep tier's goroutine leak job failed without reporting a coroutine leak. This is a harness, toolchain, setup, timeout, or dependency failure; it is not evidence that the runtime found a leak."
          fi
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already covers '${title}'; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "$finding"
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            echo "Log tail:"
            echo
            echo '```'
            tail -n 120 goroutineleak.log
            echo '```'
            echo
            echo "Reproduce:"
            echo
            echo '```'
            echo "GOMEMLIMIT=1GiB go test -timeout 900s -run TestAsyncCoroutinesDoNotLeak -v ./pkg/flowstate/v1/engine/"
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      - name: A failed leak check fails the job
        if: steps.leakcheck.outcome == 'failure'
        run: |
          echo "::error::the goroutine leak check failed; its issue distinguishes a reported leak from a harness or toolchain failure"
          exit 1

  # The same scan the PR lane runs, on a clock instead of a diff: advisories
  # arrive by calendar, so a tree nobody touched can go red here. That is why a
  # failure files an issue that says so — per CLAUDE.md, a finding on an
  # untouched tree is almost certainly a newly published advisory reaching a
  # dependency, and the fix is a bump that belongs to everyone, not to whichever
  # file the scan happens to name.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vulnerability scan
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./... 2>&1 | tee govulncheck.log

      - name: Vulnerability scan (plugin modules)
        id: scan-plugins
        continue-on-error: true
        run: |
          set -o pipefail
          for module in plugins/*/; do
            [ -f "$module/go.mod" ] || continue
            echo "==> govulncheck $module"
            ( cd "$module" && GOTOOLCHAIN=go1.27.0 go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./... ) 2>&1 | tee -a govulncheck.log
          done

      - name: File an issue for findings
        if: steps.scan.outcome == 'failure' || steps.scan-plugins.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          title="deep-tier: govulncheck reports reachable vulnerabilities"
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already covers the govulncheck findings; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "The weekly deep tier's govulncheck scan went red."
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            echo "Per CLAUDE.md: govulncheck reports reachability against a database fetched when it runs, so a failure on this schedule is almost certainly a newly published advisory reaching a dependency of an untouched tree — an advisory that arrived by clock, not a bug introduced by any diff. Verify by running the scan against main; if main fails too, the fix is a dependency bump that belongs to everyone, and it should be reported that way even though the scan names specific files."
            echo
            echo "Findings:"
            echo
            echo '```'
            tail -n 120 govulncheck.log
            echo '```'
            echo
            echo "Reproduce locally (toolchain pinned to match go.mod, per CLAUDE.md):"
            echo
            echo '```'
            echo "GOTOOLCHAIN=go1.27.0 go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./..."
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      - name: Findings fail the job
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::govulncheck reported reachable vulnerabilities; see the deep-tier issue filed by this run"
          exit 1

  # What Go's `go fix` modernizers would change, reported weekly and applied
  # never — by this job, at least. #521's decision, in full: the wins are real
  # and small (the SplitSeq conversions avoid materializing a slice; the rest
  # is readability) and none of them fixes a defect, while the diff that
  # applies them all at once is eleven thousand mechanical lines, which is the
  # exact shape in which a real defect hides from review. This repository has
  # the local evidence for that — two `flow fix` corruptions landed inside
  # changes that looked mechanical, and #513's review found four
  # textual-search bugs in a change everyone would have called routine.
  #
  # So the modernizers are adopted a package at a time, when that package is
  # already open for another reason and the conversion rides in a diff someone
  # is reading closely. This job exists to keep us *aware* of what is
  # available without letting a tool commit on our behalf: it reports, files
  # one issue, and rewrites nothing.
  #
  # Two outcomes, deliberately split, because they are different events:
  #
  #   - **Findings never fail this job.** A modernizer count is advisory by
  #     construction and gating on one would be the sweep pressure #521
  #     rejects, arriving through CI instead of through a pull request.
  #   - **An operational failure does**, exactly as it does for every other
  #     job in this file. The tool refuses to print a report when any package
  #     failed to analyse (a partial report is short by an unknown amount and
  #     reads like a clean tree), so a red report step means the check itself
  #     is broken — a check that cannot run must not look like a check that
  #     ran and found little. It files its own issue saying so, on the same
  #     dedup convention, and then fails the job.
  #
  # Hence continue-on-error on the report step with the outcome branched
  # afterwards, rather than fail-fast: fail-fast would end the job red having
  # filed nothing, which is the one behaviour a job whose entire purpose is
  # to file a report must not have.
  #
  # Which `fix` this is, since the repository has two: Go's `go fix` rewrites
  # Go source. This repository's own `flow fix` rewrites Flowfiles. Nothing
  # here goes near a Flowfile.
  #
  # Unlike govulncheck this needs no version pin of its own — the modernizers
  # ship inside the toolchain, so the pin is go.mod's, which setup-go reads.
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # persist-credentials: false — see the fuzz-deep job above. #577.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The same target a person runs locally, so the weekly number and the
      # one somebody reproduces cannot drift apart. -s suppresses make's echo
      # of the command, because this output is filed verbatim into an issue.
      # The report is Markdown by construction; the tool exits non-zero only
      # when it could not produce a *complete* report — which is why the
      # outcome is branched below rather than allowed to end the job here.
      # continue-on-error, as on fuzz-deep's targets and vulncheck's scan.
      - name: Report available modernizations
        id: report
        continue-on-error: true
        run: |
          # Streams kept apart on purpose: modernize.md is filed verbatim
          # into an issue body, and stderr carries the go command's build
          # progress and download lines, which have no business in it. Both
          # are echoed so the run's log holds everything either issue quotes.
          # `|| status=$?` rather than a bare call: this workflow's steps run
          # under `bash -eo pipefail`, so an unguarded failure would exit the
          # step before either file was echoed or the status forwarded.
          status=0
          make -s modernize > modernize.md 2> modernize.err || status=$?
          cat modernize.md
          cat modernize.err >&2
          exit $status

      # One issue, deduplicated by whole-line title against the open deep-tier
      # issues exactly as every other job here does — so a second week's run
      # adds nothing while the first week's issue is still open, and the
      # numbers are re-read from the tree rather than from a stale body
      # whenever somebody closes it.
      - name: File the advisory issue
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if grep -q 'Nothing to report' modernize.md; then
            echo "the modernizers find no sites; not filing an issue"
            exit 0
          fi
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          title="deep-tier: Go modernizers (\`go fix\`) available — advisory, apply per package"
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already carries the modernizer report; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "Nothing failed. This is the weekly advisory from the deep tier's \`modernize\` job (#521): what Go's \`go fix\` modernizers would change in this repository, kept visible without letting a tool commit on anyone's behalf."
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            cat modernize.md
            echo
            echo "Reproduce locally:"
            echo
            echo '```'
            echo "make modernize                                    # the whole module"
            echo "make modernize PKGS=./pkg/flowstate/v1/engine/    # one package"
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      # The other outcome, and the reason the step above is not the only one:
      # a report that could not be produced is a broken check, and a broken
      # check that files nothing is indistinguishable from a week with little
      # to report. Same label, same whole-line dedup, distinct title so the
      # two can never suppress one another.
      - name: File an issue when the report itself failed
        if: steps.report.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deep-tier --color B60205 --description "Filed automatically by the weekly deep CI tier (deep.yml)" --force
          title="deep-tier: the modernizer report could not be produced"
          if gh issue list --state open --label deep-tier --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "an open issue already covers the failing modernizer report; not filing another"
            exit 0
          fi
          body=$(mktemp)
          {
            echo "The weekly deep tier's \`modernize\` job could not produce a report (#521). No modernizer count is available for this week: the tool refuses to print a partial one, because a single missing package leaves it well-formed, plausible and short by an unknown amount — which, for an advisory whose whole content is a count, reads exactly like a clean tree."
            echo
            echo "The usual cause is a package that does not load or type-check on \`main\`, which \`go fix -json\` reports on stderr while still writing diagnostics for everything else."
            echo
            echo "Produced by workflow run: ${RUN_URL}"
            echo
            echo "Output:"
            echo
            echo '```'
            tail -n 60 modernize.md || true
            tail -n 60 modernize.err || true
            echo '```'
            echo
            echo "Reproduce locally:"
            echo
            echo '```'
            echo "make modernize"
            echo '```'
          } > "$body"
          gh issue create --title "$title" --label deep-tier --body-file "$body"

      # Findings never fail this job; a report that could not be produced
      # does, on the same convention as vulncheck's and goroutineleak's final
      # steps — and only after the issue above has been filed.
      - name: A failed report fails the job
        if: steps.report.outcome == 'failure'
        run: |
          echo "::error::the modernizer report could not be produced; see the deep-tier issue filed by this run"
          exit 1
