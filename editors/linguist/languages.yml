# The entry a GitHub Linguist pull request would add to lib/linguist/languages.yml,
# kept here so it is reviewed, tested and kept in step with the editor configs.
# It is prepared, not submitted: Linguist asks for a name to be in wide use in
# the usage Linguist's CONTRIBUTING.md asks for (README.md has the numbers),
# which this repository is not near.
#
# Linguist assigns `language_id` itself (script/update-ids), so it is absent.
Flowfile:
  type: programming
  color: "#3d6de0"
  tm_scope: source.flowfile
  ace_mode: yaml
  codemirror_mode: yaml
  codemirror_mime_type: text/x-yaml
  filenames:
  - Flowfile
  extensions:
  - ".flow.yaml"
  - ".flow.yml"
