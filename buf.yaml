# The workspace: one module, proto/, and the lint and breaking policy for it.
# (v2 folds what buf.work.yaml and proto/buf.yaml used to say into this file,
# #2149; buf.lock beside it pins the deps.)
version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
breaking:
  use:
    - FILE
    - WIRE

  # Retiring the who-may-act rule lists (#326, part 2, PR 4). Each rule below is
  # scoped to the one file that breaks it, and the wire is untouched:
  #   - signal.proto: `SignalPolicy` field 1 (`allow`, the rule list), field 2
  #     (`distinct_from_starter`) and the `SignalPolicyRule` message are deleted,
  #     their numbers and names reserved; field 3 `allow_expr` is renamed `allow`
  #     at the same number, which changes the JSON name only.
  #   - trigger.proto: `ManualTrigger` field 3 (`allowed_principals`) is deleted
  #     and reserved; field 4 `allow_expr` is renamed `allow` at the same number.
  # Remove this block in the next commit on main, once this one is the baseline.
  #
  # Retiring `retry.except`, which spelled the complement of `only`: workflow.proto
  # `RetryPolicy` field 6 (`except`) is deleted, its number and name reserved.
  # Nothing else in that file moves. Remove its line below with the rest.
  ignore_only:
    MESSAGE_NO_DELETE:
      - proto/flowstate/v1/signal.proto
    FIELD_NO_DELETE:
      - proto/flowstate/v1/signal.proto
      - proto/flowstate/v1/trigger.proto
      - proto/flowstate/v1/workflow.proto
    FIELD_SAME_NAME:
      - proto/flowstate/v1/signal.proto
      - proto/flowstate/v1/trigger.proto
    FIELD_SAME_JSON_NAME:
      - proto/flowstate/v1/signal.proto
      - proto/flowstate/v1/trigger.proto

  # FILE and WIRE compare descriptors: names, numbers, types, cardinality, and
  # reservations. They do not prove that a runtime still gives a field the same
  # meaning. A semantic change needs a focused conformance case that distinguishes
  # the old and new behavior. If durable artifacts or deployed consumers must span
  # both meanings, make an explicit compatibility or version/edition decision;
  # passing this check is not that decision.

  # Nothing suppressed, which is the only state this file should be found in
  # for longer than one commit. That includes the rules v2 added to FILE and
  # WIRE (EXTENSION_NO_DELETE, FIELD_SAME_DEFAULT), which `buf config migrate`
  # would have excepted to keep v1's behavior: the schema passes them, so they
  # are enforced.
  #
  # The pattern, when a schema change genuinely has to break: add a scoped
  # `ignore_only` naming the one rule and the one file, explain in a comment
  # exactly which fields moved and why, land it, and remove it in the very next
  # commit. It has been used seven times and removed seven times. A suppression
  # measures a distance from one commit, and once that commit is on main the
  # distance is zero — what a stale block still does is stand ready to hide the
  # *next* break in the same file, which is a quiet failure, because it reads as
  # a considered exception, keeps passing, and the break it swallows belongs to
  # whoever comes next.

lint:
  use:
    - STANDARD

  # A `buf:lint:ignore` comment in a .proto is a suppression nobody reviews in
  # this file, so it is refused, as v1 refused it.
  disallow_comment_ignores: true

  # Nothing suppressed, including the rules v2 added to STANDARD
  # (FIELD_NOT_REQUIRED, PACKAGE_NO_IMPORT_CYCLE), which the schema passes. The
  # two rules that used to be — RPC_REQUEST_STANDARD_NAME and
  # RPC_RESPONSE_STANDARD_NAME, for the plugin protocol's six request and
  # response messages — were suppressed because `DescribeRequest` would have been
  # ambiguous in a package shared with the workflow service, sitting next to
  # `RunRequest` and `SignalRequest`. The plugin protocol has its own package now,
  # so the names the rule asks for are the right ones and the suppression is gone
  # with the reason for it.
