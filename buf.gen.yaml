version: v2
# Every plugin is built from this module's go.mod through a `tool` directive and
# run with `go tool`, so the generated code and the runtime libraries it calls
# are always the same versions, and generating needs no network beyond the
# module cache and never picks up a binary from PATH (#2149). Bumping
# google.golang.org/protobuf or connectrpc.com/connect in go.mod is therefore a
# regeneration, which the proto job's drift check requires be committed.
#
# Validation is NOT generated: the schema declares its rules with protovalidate
# (buf.validate options), which are enforced at runtime by buf.build/go/protovalidate
# reading the descriptors. See pkg/flowstate/v1/validate.go.
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/picatz/flowstate/pkg
# The schema module only. buf.yaml names proto/ as the workspace's one
# module, and naming it here too keeps a generate from the root scoped to it
# explicitly: the plugins/*/proto schemas have recipes of their own.
inputs:
  - directory: proto
plugins:
  # google.golang.org/protobuf
  - local: [go, tool, protoc-gen-go]
    out: ./pkg
    opt: paths=source_relative
  # connectrpc.com/connect
  - local: [go, tool, protoc-gen-connect-go]
    out: ./pkg
    opt: paths=source_relative
  # The schema's comments, as Go source (#2147). protoc-gen-go strips
  # SourceCodeInfo from what a .pb.go embeds, so this plugin writes each file's
  # leading comments into protodoc, where the MCP tool table, LSP hover and the
  # generated reference read them.
  #
  # strategy: all, because package= gathers every directory's files into one
  # package under flattened names, and only one invocation over all of them
  # can see two names collide (buf's default runs one per directory).
  - local: [go, tool, protoc-gen-flowstate-doc]
    strategy: all
    out: ./pkg/flowstate/v1/protodoc
    opt: package=github.com/picatz/flowstate/pkg/flowstate/v1/protodoc
  # The JSON the CLI and the RPC surface answer in, as TypeScript declarations,
  # for programs that read it (the Claude Code mod in editors/claude-code). Only
  # the named messages and what they reach are declared; add an entry point here
  # when a TypeScript consumer needs another answer.
  #
  # strategy: all, because the closure of an entry point can span files, and
  # buf's default invokes the plugin once per directory.
  - local: [go, tool, protoc-gen-flowstate-ts]
    strategy: all
    out: ./editors/claude-code/types
    opt:
      - file=flowstate.d.ts
      - message=flowstate.v1.DiagnosticReport
