version: v2
# The example plugin's schema is generated with plugins built from this
# repository's go.mod rather than remote ones, so that regenerating it needs no
# network and never picks up whichever protoc-gen-go happens to be on PATH:
# `go tool` builds exactly the version the `tool` directives pin. From
# the repository root:
#
#   E=pkg/flowstate/v1/plugin/examples/flowstate-plugin-example
#   go tool -modfile=tools/external/go.mod buf generate $E/proto --template $E/buf.gen.yaml -o $E --clean
#
# (`make check` and CI run the same thing.) --clean empties gen/ first, which
# holds nothing but this template's output, so a file whose .proto is gone
# does not survive regeneration.
plugins:
  - local: [go, tool, protoc-gen-go]
    out: ./gen
    opt: paths=source_relative
  # The comments written in example.proto, as Go source beside example.pb.go,
  # so they reach an editor's hover through this plugin's manifest (#723,
  # #2148). This is the whole of what a plugin author adds to get that.
  - local: [go, tool, protoc-gen-flowstate-doc]
    out: ./gen
    opt: paths=source_relative
