syntax = "proto3";

package example.v1;

option go_package = "github.com/picatz/flowstate/pkg/flowstate/v1/plugin/examples/flowstate-plugin-example/gen/example/v1;examplev1";

// The example plugin's own task schema.
//
// It is defined here, in the plugin's own module, rather than reusing one of the
// engine's messages, because that is the case a plugin author is actually in:
// their task has a shape the engine has never seen. The descriptors for these
// messages travel to the engine in the plugin's manifest, which is what lets it
// validate a workflow using this task, complete these field names in an editor,
// and document the task — without compiling anything of this plugin's.

// GreetInputs are the inputs to the greet task.
message GreetInputs {
  // Name is who to greet.
  string name = 1;

  // Greeting overrides the default "Hello".
  string greeting = 2;

  // Token is a credential the *host* manages — not this plugin's own
  // "example:" scheme, which SecretResolve below resolves, but a reference
  // under whatever scheme the deployment's worker is configured with, such as
  // `env:` or `vault:`.
  //
  // An ordinary string, deliberately: this plugin does not declare the field's
  // *type* as anything unusual for a secret to arrive in, because a Flowfile
  // input naming a host secret arrives here already resolved. The host names
  // this field in the "greet" task's manifest as one of SecretInputs, resolves
  // whatever `${secret(...)}` the workflow wrote before the request ever
  // reaches this process, and this plugin never sees a reference — see
  // sdk.Task.SecretInputs in this plugin's main.go, and TaskManifest's own
  // secret_inputs field, for why the host resolves rather than this plugin
  // asking it to.
  string token = 3;
}

// GreetOutputs are the results of the greet task.
message GreetOutputs {
  // Message is the assembled greeting.
  string message = 1;

  // Length is how long the message is, in bytes.
  int64 length = 2;

  // Authenticated reports whether a token was received, which is what this
  // example uses to prove the value arrived — deliberately never the token
  // itself. Echoing it here would make the point of routing it through
  // secret_inputs pointless: the value would sit in a step output, which is
  // durable workflow history.
  bool authenticated = 3;
}
